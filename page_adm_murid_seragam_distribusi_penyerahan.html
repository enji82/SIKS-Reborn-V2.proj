<script>
  (function() {
    var IS_ADMIN = false;
    var SERAGAMDIST_CACHE_DATA = [];
    var SERAGAM_PENERIMAAN_CACHE_DATA = [];
    var SERAGAMDIST_TABEL_INSTANCE = null;
    var availableYears = [];
    var userLogin = typeof getSesiUser === 'function' ? getSesiUser() : {};

    $(document).ready(function() {
      IS_ADMIN = checkUserRoleIsAdmin();
      loadYears();
    });

    function loadYears() {
      SultanUI.showLoading('#seragamdist_loadingState', 'Memuat daftar tahun...');
      google.script.run
        .withSuccessHandler(function(response) {
          var res = JSON.parse(response);
          if (res.success) {
            availableYears = res.data || [2026, 2025, 2024];
            renderFilterBar();
            loadDataFromServer();
          } else {
            Sultan.notif.gagal('Gagal memuat tahun: ' + res.message);
          }
        })
        .withFailureHandler(function(err) {
          Sultan.notif.gagal('Koneksi terputus: ' + err.message);
        })
        .seragam_getAvailableYears();
    }

    function renderFilterBar() {
      var filterTahunOpts = availableYears.map(function(y) { return `<option value="${y}">${y}</option>`; }).join('');
      
      var filtersConfig = [
        { id: "seragamdist_filterSekolah", placeholder: "- Memuat Unit Kerja... -", disabled: true, visible: IS_ADMIN },
        { id: "seragamdist_filterTahun", placeholder: "- Memuat Tahun... -", disabled: true },
        { id: "seragamdist_filterJenis", placeholder: "- Pilih Jenis Seragam -", disabled: false }
      ];

      var extraButtons = `
        <div class="divider-vertical d-none d-md-block mx-2"></div>
        <button type="button" id="seragamdist_btnSync" class="sultan-btn-refresh" title="Segarkan Data dari Server">
          <i class="fas fa-sync-alt"></i>
        </button>
        <button type="button" id="seragamdist_btnExcel" class="sultan-btn-excel ml-2" title="Ekspor Excel">
          <i class="fas fa-file-excel mr-1"></i> EKSPOR EXCEL
        </button>
      `;

      $('#seragamdist_filterBarArea').html(SultanUI.renderFilterBar(filtersConfig, extraButtons));
      $('#seragamdist_filterSekolah_container').addClass('sultan-filter-unit-width');

      // Populate static dropdown elements
      $('#seragamdist_filterTahun').html(filterTahunOpts).prop('disabled', false);
      $('#seragamdist_filterJenis').html(`
        <option value="SEMUA">- Semua Jenis Seragam -</option>
        <option value="Merah Putih">Merah Putih</option>
        <option value="Pramuka">Pramuka</option>
      `);

      // Bind Listeners
      $('#seragamdist_filterTahun').on('change', loadDataFromServer);
      $('#seragamdist_filterSekolah, #seragamdist_filterJenis').on('change', applyLocalFilter);
      $('#seragamdist_btnSync').on('click', loadDataFromServer);
      $('#seragamdist_btnExcel').on('click', exportToExcel);
    }

    function loadDataFromServer() {
      var tahun = $('#seragamdist_filterTahun').val() || availableYears[0] || "2026";
      var npsnQuery = IS_ADMIN ? "SEMUA" : (userLogin.npsn || userLogin.username || "");
      
      $('#seragamdist_tableState').hide();
      if ($('#seragamdist_loadingState').is(':hidden')) {
        SultanUI.showLoading('#seragamdist_loadingState', 'Memuat rincian distribusi...');
      }

      google.script.run
        .withSuccessHandler(function(responsePenyerahan) {
          var resPen = JSON.parse(responsePenyerahan);
          if (resPen.success) {
            SERAGAMDIST_CACHE_DATA = resPen.data || [];
            
            // Sequential load: load penerimaan data
            google.script.run
              .withSuccessHandler(function(responsePenerimaan) {
                SultanUI.hideLoading('#seragamdist_loadingState');
                var resPenerimaan = JSON.parse(responsePenerimaan);
                if (resPenerimaan.success) {
                  SERAGAM_PENERIMAAN_CACHE_DATA = resPenerimaan.data || [];
                  updateSekolahDropdown();
                  applyLocalFilter();
                  $('#seragamdist_tableState').show();
                } else {
                  Sultan.notif.gagal('Gagal memuat rincian penerimaan: ' + resPenerimaan.message);
                  $('#seragamdist_tableState').show();
                }
              })
              .withFailureHandler(function(err) {
                SultanUI.hideLoading('#seragamdist_loadingState');
                Sultan.notif.gagal('Koneksi terputus saat memuat penerimaan: ' + err.message);
                $('#seragamdist_tableState').show();
              })
              .seragam_getLaporan(tahun, npsnQuery);
          } else {
            SultanUI.hideLoading('#seragamdist_loadingState');
            Sultan.notif.gagal('Gagal memuat rincian penyerahan: ' + resPen.message);
            $('#seragamdist_tableState').show();
          }
        })
        .withFailureHandler(function(err) {
          SultanUI.hideLoading('#seragamdist_loadingState');
          Sultan.notif.gagal('Koneksi terputus: ' + err.message);
          $('#seragamdist_tableState').show();
        })
        .seragam_getLaporanPenyerahan(tahun, npsnQuery);
    }

    function updateSekolahDropdown() {
      if (!IS_ADMIN) return;
      
      var currentSelection = $('#seragamdist_filterSekolah').val() || "SEMUA";
      var uniqueSchools = {};
      SERAGAMDIST_CACHE_DATA.forEach(function(row) {
        if (row.npsn) {
          uniqueSchools[row.npsn] = row.nama_sekolah || row.npsn;
        }
      });

      var $dropdown = $('#seragamdist_filterSekolah');
      $dropdown.empty().append('<option value="SEMUA">- Semua Unit Kerja -</option>');
      
      Object.keys(uniqueSchools).sort(function(a, b) {
        return uniqueSchools[a].localeCompare(uniqueSchools[b]);
      }).forEach(function(npsn) {
        $dropdown.append(`<option value="${npsn}">${uniqueSchools[npsn]}</option>`);
      });

      $dropdown.prop('disabled', false);

      if (uniqueSchools[currentSelection] || currentSelection === "SEMUA") {
        $dropdown.val(currentSelection);
      } else {
        $dropdown.val("SEMUA");
      }
    }

    function applyLocalFilter() {
      var targetSekolah = IS_ADMIN ? $('#seragamdist_filterSekolah').val() : (userLogin.npsn || userLogin.username || "");
      var targetJenis = $('#seragamdist_filterJenis').val() || "SEMUA";
      
      var filtered = SERAGAMDIST_CACHE_DATA;

      // Filter by school
      if (targetSekolah && targetSekolah !== "SEMUA") {
        filtered = filtered.filter(function(row) {
          return String(row.npsn).trim() === String(targetSekolah).trim();
        });
      }

      // Filter by jenis seragam
      if (targetJenis && targetJenis !== "SEMUA") {
        filtered = filtered.filter(function(row) {
          return String(row.jenis_seragam || "").includes(targetJenis);
        });
      }

      renderTable(filtered);
    }

    function renderTable(data) {
      if ($.fn.DataTable.isDataTable('#seragamdist_tabelUtama')) {
        SERAGAMDIST_TABEL_INSTANCE = $('#seragamdist_tabelUtama').DataTable();
      } else {
        // Setup column definitions for 28 columns (0: Nama Sekolah, 1 to 27: data columns)
        var colDefs = [
          { targets: [0], className: "text-left align-middle text-nowrap col-sticky-left" }
        ];

        // All numerical cells from index 1 to 27 are center aligned
        for (var i = 1; i <= 27; i++) {
          colDefs.push({ targets: [i], width: "1%", className: "text-center align-middle font-weight-bold" });
        }

        SERAGAMDIST_TABEL_INSTANCE = SultanTable.init('#seragamdist_tabelUtama', {
          destroy: true,
          ordering: false,
          pageLength: 20, // 5 schools at 4 rows each
          autoWidth: false,
          deferRender: true,
          responsive: false,
          dom: "<'row mb-2'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>>" +
               "<'row'<'col-sm-12'<'table-responsive sultan-scroll'tr>>>" +
               "<'row mt-2'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>",
          columnDefs: colDefs,
          language: {
            url: "//cdn.datatables.net/plug-ins/1.10.25/i18n/Indonesian.json",
            emptyTable: "Belum ada data rincian distribusi seragam."
          },
          rowCallback: function(row, data, index) {
            var typeIdx = index % 4;
            $(row).removeClass('row-awal row-terima row-diserahkan row-selisih');
            if (typeIdx === 0) $(row).addClass('row-awal');
            else if (typeIdx === 1) $(row).addClass('row-terima');
            else if (typeIdx === 2) $(row).addClass('row-diserahkan');
            else if (typeIdx === 3) $(row).addClass('row-selisih');
          },
          footerCallback: function (row, data, start, end, display) {
            var api = this.api();
            
            var getInt = function (val) {
              if (typeof val === 'number') return val;
              if (typeof val === 'string') {
                var clean = val.replace(/<[^>]*>/g, '').trim();
                if (clean === '-' || !clean) return 0;
                return parseInt(clean.replace('+', '')) || 0;
              }
              return 0;
            };

            var totAwal = new Array(28).fill(0);
            var totDiterima = new Array(28).fill(0);
            var totDiserahkan = new Array(28).fill(0);
            var totBelum = new Array(28).fill(0);

            // Compute vertical totals from current page rows
            var rowsData = api.rows({ page: 'current' }).data().toArray();
            rowsData.forEach(function(r, idx) {
              var typeIdx = idx % 4; // 0=Awal, 1=Terima, 2=Diserahkan, 3=Belum
              for (var col = 1; col <= 27; col++) {
                var val = getInt(r[col]);
                if (typeIdx === 0) totAwal[col] += val;
                else if (typeIdx === 1) totDiterima[col] += val;
                else if (typeIdx === 2) totDiserahkan[col] += val;
                else if (typeIdx === 3) totBelum[col] += val;
              }
            });

            // Build 4-row footer HTML
            var footerHtml = '';
            
            footerHtml += '<tr class="tf-row-awal">';
            footerHtml += '<th class="col-sticky-left text-left font-weight-bold text-success">TOTAL DATA AWAL</th>';
            for (var col = 1; col <= 27; col++) {
              footerHtml += '<th>' + (totAwal[col] === 0 ? '-' : totAwal[col]) + '</th>';
            }
            footerHtml += '</tr>';

            footerHtml += '<tr class="tf-row-terima">';
            footerHtml += '<th class="col-sticky-left text-left font-weight-bold text-primary">TOTAL DITERIMA</th>';
            for (var col = 1; col <= 27; col++) {
              footerHtml += '<th>' + (totDiterima[col] === 0 ? '-' : totDiterima[col]) + '</th>';
            }
            footerHtml += '</tr>';

            footerHtml += '<tr class="tf-row-terima" style="background-color: rgba(0, 123, 255, 0.05);">';
            footerHtml += '<th class="col-sticky-left text-left font-weight-bold text-info">TOTAL DISERAHKAN</th>';
            for (var col = 1; col <= 27; col++) {
              footerHtml += '<th>' + (totDiserahkan[col] === 0 ? '-' : totDiserahkan[col]) + '</th>';
            }
            footerHtml += '</tr>';

            footerHtml += '<tr class="tf-row-selisih">';
            footerHtml += '<th class="col-sticky-left text-left font-weight-bold text-danger">TOTAL BELUM DISERAHKAN</th>';
            for (var col = 1; col <= 27; col++) {
              var val = totBelum[col];
              var formatted = val === 0 ? '-' : val;
              if (val > 0) {
                formatted = '<span class="text-danger font-weight-bold">' + val + '</span>';
              } else if (val < 0) {
                formatted = '<span class="text-success font-weight-bold">' + val + '</span>';
              }
              footerHtml += '<th>' + formatted + '</th>';
            }
            footerHtml += '</tr>';

            $('#seragamdist_tabelUtama tfoot').html(footerHtml);
          }
        });
      }
      var sizes = ["S", "M", "L", "XL", "2XL", "3XL", "4XL", "5XL"];
      var dtArray = [];
      
      // Group data by school (npsn) and uniform type (jenis)
      var grouped = {};
      data.forEach(function(row) {
        var detail = {};
        try { detail = row.detail_json ? JSON.parse(row.detail_json) : {}; } catch(e) {}
        
        var parts = String(row.jenis_seragam || "").split(', ');
        parts.forEach(function(jns) {
          jns = jns.trim();
          if (!detail[jns]) return;
          
          var key = String(row.npsn).trim() + "_" + jns;
          if (!grouped[key]) {
            grouped[key] = {
              npsn: row.npsn,
              nama_sekolah: row.nama_sekolah,
              jenis: jns,
              rows: []
            };
          }
          grouped[key].rows.push(row);
        });
      });

      Object.keys(grouped).forEach(function(key) {
        var group = grouped[key];
        var jns = group.jenis;

        // Find related Penerimaan & Penyerahan laporans for this group
        var relatedPenerimaan = SERAGAM_PENERIMAAN_CACHE_DATA.filter(function(r) {
          return String(r.npsn).trim() === String(group.npsn).trim() &&
                 String(r.jenis_seragam || "").indexOf(jns) >= 0;
        });

        // Find original Rekap target from L1 Penerimaan
        var L1Penerimaan = SERAGAM_PENERIMAAN_CACHE_DATA.find(function(r) {
          var rTahapNum = parseInt(String(r.tahap || 'Laporan 1').replace(/[^0-9]/g, '')) || 1;
          return String(r.npsn).trim() === String(group.npsn).trim() &&
                 String(r.jenis_seragam || "").indexOf(jns) >= 0 &&
                 rTahapNum === 1;
        });
        
        var L1Detail = {};
        if (L1Penerimaan) {
          try { L1Detail = L1Penerimaan.detail_json ? JSON.parse(L1Penerimaan.detail_json) : {}; } catch(e) {}
        }

        var fmt = function(v) { return v === 0 ? '-' : v; };
        var fmtS = function(v) {
          if (v === 0) return '-';
          var cls = v > 0 ? 'text-danger' : 'text-success';
          return `<span class="${cls} font-weight-bold">${v}</span>`;
        };

        // Construct cell values for four rows
        var rowAwal = [];
        var rowTerima = [];
        var rowDiserahkan = [];
        var rowBelum = [];

        sizes.forEach(function(ukr) {
          // Rekap Murid Asli (Data Awal)
          var L1SizeData = (L1Detail[jns] && L1Detail[jns][ukr]) ? L1Detail[jns][ukr] : {};
          var rekapAsliL = (L1Penerimaan && typeof L1SizeData.rekap_l !== 'undefined') ? (parseInt(L1SizeData.rekap_l) || 0) : 0;
          var rekapAsliP = (L1Penerimaan && typeof L1SizeData.rekap_p !== 'undefined') ? (parseInt(L1SizeData.rekap_p) || 0) : 0;
          var rJ = rekapAsliL + rekapAsliP;

          // Compute cumulative terima L/P from L1 up to current Laporan Penerimaan
          var tL = 0, tP = 0;
          relatedPenerimaan.forEach(function(r) {
            var rDetail = {};
            try { rDetail = r.detail_json ? JSON.parse(r.detail_json) : {}; } catch(e) {}
            var rSizeData = (rDetail[jns] && rDetail[jns][ukr]) ? rDetail[jns][ukr] : {};
            tL += parseInt(rSizeData.terima_l) || 0;
            tP += parseInt(rSizeData.terima_p) || 0;
          });
          var tJ = tL + tP;

          // Compute cumulative diserahkan L/P from L1 up to current Laporan Penyerahan
          var disL = 0, disP = 0;
          group.rows.forEach(function(r) {
            var rDetail = {};
            try { rDetail = r.detail_json ? JSON.parse(r.detail_json) : {}; } catch(e) {}
            var rSizeData = (rDetail[jns] && rDetail[jns][ukr]) ? rDetail[jns][ukr] : {};
            disL += parseInt(rSizeData.terima_l) || 0;
            disP += parseInt(rSizeData.terima_p) || 0;
          });
          var disJ = disL + disP;

          // Belum diserahkan = cumulative terima - cumulative diserahkan
          var bL = tL - disL;
          var bP = tP - disP;
          var bJ = tJ - disJ;

          rowAwal.push(fmt(rekapAsliL), fmt(rekapAsliP), fmt(rJ));
          rowTerima.push(fmt(tL), fmt(tP), fmt(tJ));
          rowDiserahkan.push(fmt(disL), fmt(disP), fmt(disJ));
          rowBelum.push(fmtS(bL), fmtS(bP), fmtS(bJ));
        });

        // Totals accumulators
        var tot_rL = 0, tot_rP = 0, tot_rJml = 0;
        var tot_tL = 0, tot_tP = 0, tot_tJml = 0;
        var tot_disL = 0, tot_disP = 0, tot_disJml = 0;
        var tot_bL = 0, tot_bP = 0, tot_bJml = 0;

        sizes.forEach(function(ukr) {
          var L1SizeData = (L1Detail[jns] && L1Detail[jns][ukr]) ? L1Detail[jns][ukr] : {};
          tot_rL += (L1Penerimaan && typeof L1SizeData.rekap_l !== 'undefined') ? (parseInt(L1SizeData.rekap_l) || 0) : 0;
          tot_rP += (L1Penerimaan && typeof L1SizeData.rekap_p !== 'undefined') ? (parseInt(L1SizeData.rekap_p) || 0) : 0;

          relatedPenerimaan.forEach(function(r) {
            var rDetail = {};
            try { rDetail = r.detail_json ? JSON.parse(r.detail_json) : {}; } catch(e) {}
            var rSizeData = (rDetail[jns] && rDetail[jns][ukr]) ? rDetail[jns][ukr] : {};
            tot_tL += parseInt(rSizeData.terima_l) || 0;
            tot_tP += parseInt(rSizeData.terima_p) || 0;
          });

          group.rows.forEach(function(r) {
            var rDetail = {};
            try { rDetail = r.detail_json ? JSON.parse(r.detail_json) : {}; } catch(e) {}
            var rSizeData = (rDetail[jns] && rDetail[jns][ukr]) ? rDetail[jns][ukr] : {};
            tot_disL += parseInt(rSizeData.terima_l) || 0;
            tot_disP += parseInt(rSizeData.terima_p) || 0;
          });
        });

        tot_rJml = tot_rL + tot_rP;
        tot_tJml = tot_tL + tot_tP;
        tot_disJml = tot_disL + tot_disP;
        tot_bL = tot_tL - tot_disL;
        tot_bP = tot_tP - tot_disP;
        tot_bJml = tot_tJml - tot_disJml;

        rowAwal.push(fmt(tot_rL), fmt(tot_rP), fmt(tot_rJml));
        rowTerima.push(fmt(tot_tL), fmt(tot_tP), fmt(tot_tJml));
        rowDiserahkan.push(fmt(tot_disL), fmt(tot_disP), fmt(tot_disJml));
        rowBelum.push(fmtS(tot_bL), fmtS(tot_bP), fmtS(tot_bJml));

        // Create 4 rows for dtArray
        var cellSekolah = `
          <div class="font-weight-bold text-brand-maroon text-left text-wrap" style="font-size: 13px; line-height: 1.2;">${group.nama_sekolah}</div>
          <div class="text-muted text-left small font-weight-normal">${group.npsn}</div>
        `;
        var cellDiterima = `
          <span class="d-none">${group.nama_sekolah} ${group.npsn}</span>
          <div class="text-right text-primary font-weight-bold pr-2" style="font-size: 11px; font-style: italic;">Diterima</div>
        `;
        var cellDiserahkan = `
          <span class="d-none">${group.nama_sekolah} ${group.npsn}</span>
          <div class="text-right text-info font-weight-bold pr-2" style="font-size: 11px; font-style: italic;">Diserahkan</div>
        `;
        var cellBelum = `
          <span class="d-none">${group.nama_sekolah} ${group.npsn}</span>
          <div class="text-right text-danger font-weight-bold pr-2" style="font-size: 11px; font-style: italic;">Belum</div>
        `;

        var rowDataAwal = [cellSekolah].concat(rowAwal);
        var rowDataTerima = [cellDiterima].concat(rowTerima);
        var rowDataDiserahkan = [cellDiserahkan].concat(rowDiserahkan);
        var rowDataBelum = [cellBelum].concat(rowBelum);

        dtArray.push(rowDataAwal, rowDataTerima, rowDataDiserahkan, rowDataBelum);
      });

      SERAGAMDIST_TABEL_INSTANCE.clear().rows.add(dtArray).draw(false);
    }

    function exportToExcel() {
      var jenisSeragam = ($('#seragamdist_filterJenis').val() || "SEMUA").toUpperCase();
      if (jenisSeragam === "SEMUA") {
        jenisSeragam = "MERAH PUTIH / PRAMUKA";
      }
      
      var indonesianMonths = [
        "JANUARI", "FEBRUARI", "MARET", "APRIL", "MEI", "JUNI",
        "JULI", "AGUSTUS", "SEPTEMBER", "OKTOBER", "NOVEMBER", "DESEMBER"
      ];
      var today = new Date();
      var formattedDate = today.getDate() + " " + indonesianMonths[today.getMonth()] + " " + today.getFullYear();
      
      var targetSekolah = IS_ADMIN ? $('#seragamdist_filterSekolah').val() : (userLogin.npsn || userLogin.username || "");
      var targetJenis = $('#seragamdist_filterJenis').val() || "SEMUA";
      
      var filtered = SERAGAMDIST_CACHE_DATA;

      if (targetSekolah && targetSekolah !== "SEMUA") {
        filtered = filtered.filter(function(row) {
          return String(row.npsn).trim() === String(targetSekolah).trim();
        });
      }

      if (targetJenis && targetJenis !== "SEMUA") {
        filtered = filtered.filter(function(row) {
          return String(row.jenis_seragam || "").includes(targetJenis);
        });
      }

      var table = document.getElementById("seragamdist_tabelUtama");
      var originalHead = table.querySelector("thead").innerHTML;
      
      var sizes = ["S", "M", "L", "XL", "2XL", "3XL", "4XL", "5XL"];
      var rowsToExport = [];

      // Group data by school (npsn) and uniform type (jenis)
      var grouped = {};
      filtered.forEach(function(row) {
        var detail = {};
        try { detail = row.detail_json ? JSON.parse(row.detail_json) : {}; } catch(e) {}
        
        var parts = String(row.jenis_seragam || "").split(', ');
        parts.forEach(function(jns) {
          jns = jns.trim();
          if (!detail[jns]) return;
          
          if (targetJenis !== "SEMUA" && jns !== targetJenis) return;

          var key = String(row.npsn).trim() + "_" + jns;
          if (!grouped[key]) {
            grouped[key] = {
              npsn: row.npsn,
              nama_sekolah: row.nama_sekolah,
              jenis: jns,
              rows: []
            };
          }
          grouped[key].rows.push(row);
        });
      });

      Object.keys(grouped).forEach(function(key) {
        var group = grouped[key];
        var jns = group.jenis;
        var namaSekolah = String(group.nama_sekolah || "").trim() + " (" + String(group.npsn).trim() + ")";

        // Find related Penerimaan & Penyerahan laporans for this group
        var relatedPenerimaan = SERAGAM_PENERIMAAN_CACHE_DATA.filter(function(r) {
          return String(r.npsn).trim() === String(group.npsn).trim() &&
                 String(r.jenis_seragam || "").indexOf(jns) >= 0;
        });

        // Find original Rekap target from L1 Penerimaan
        var L1Penerimaan = SERAGAM_PENERIMAAN_CACHE_DATA.find(function(r) {
          var rTahapNum = parseInt(String(r.tahap || 'Laporan 1').replace(/[^0-9]/g, '')) || 1;
          return String(r.npsn).trim() === String(group.npsn).trim() &&
                 String(r.jenis_seragam || "").indexOf(jns) >= 0 &&
                 rTahapNum === 1;
        });
        
        var L1Detail = {};
        if (L1Penerimaan) {
          try { L1Detail = L1Penerimaan.detail_json ? JSON.parse(L1Penerimaan.detail_json) : {}; } catch(e) {}
        }

        // Construct cells arrays
        var rowAwal = [];
        var rowTerima = [];
        var rowDiserahkan = [];
        var rowBelum = [];

        sizes.forEach(function(ukr) {
          var L1SizeData = (L1Detail[jns] && L1Detail[jns][ukr]) ? L1Detail[jns][ukr] : {};
          var rekapAsliL = (L1Penerimaan && typeof L1SizeData.rekap_l !== 'undefined') ? (parseInt(L1SizeData.rekap_l) || 0) : 0;
          var rekapAsliP = (L1Penerimaan && typeof L1SizeData.rekap_p !== 'undefined') ? (parseInt(L1SizeData.rekap_p) || 0) : 0;
          var rJ = rekapAsliL + rekapAsliP;

          var tL = 0, tP = 0;
          relatedPenerimaan.forEach(function(r) {
            var rDetail = {};
            try { rDetail = r.detail_json ? JSON.parse(r.detail_json) : {}; } catch(e) {}
            var rSizeData = (rDetail[jns] && rDetail[jns][ukr]) ? rDetail[jns][ukr] : {};
            tL += parseInt(rSizeData.terima_l) || 0;
            tP += parseInt(rSizeData.terima_p) || 0;
          });
          var tJ = tL + tP;

          var disL = 0, disP = 0;
          group.rows.forEach(function(r) {
            var rDetail = {};
            try { rDetail = r.detail_json ? JSON.parse(r.detail_json) : {}; } catch(e) {}
            var rSizeData = (rDetail[jns] && rDetail[jns][ukr]) ? rDetail[jns][ukr] : {};
            disL += parseInt(rSizeData.terima_l) || 0;
            disP += parseInt(rSizeData.terima_p) || 0;
          });
          var disJ = disL + disP;

          var bL = tL - disL;
          var bP = tP - disP;
          var bJ = tJ - disJ;

          rowAwal.push(rekapAsliL, rekapAsliP, rJ);
          rowTerima.push(tL, tP, tJ);
          rowDiserahkan.push(disL, disP, disJ);
          rowBelum.push(bL, bP, bJ);
        });

        // Totals
        var tot_rL = 0, tot_rP = 0;
        var tot_tL = 0, tot_tP = 0;
        var tot_disL = 0, tot_disP = 0;

        sizes.forEach(function(ukr) {
          var L1SizeData = (L1Detail[jns] && L1Detail[jns][ukr]) ? L1Detail[jns][ukr] : {};
          tot_rL += (L1Penerimaan && typeof L1SizeData.rekap_l !== 'undefined') ? (parseInt(L1SizeData.rekap_l) || 0) : 0;
          tot_rP += (L1Penerimaan && typeof L1SizeData.rekap_p !== 'undefined') ? (parseInt(L1SizeData.rekap_p) || 0) : 0;

          relatedPenerimaan.forEach(function(r) {
            var rDetail = {};
            try { rDetail = r.detail_json ? JSON.parse(r.detail_json) : {}; } catch(e) {}
            var rSizeData = (rDetail[jns] && rDetail[jns][ukr]) ? rDetail[jns][ukr] : {};
            tot_tL += parseInt(rSizeData.terima_l) || 0;
            tot_tP += parseInt(rSizeData.terima_p) || 0;
          });

          group.rows.forEach(function(r) {
            var rDetail = {};
            try { rDetail = r.detail_json ? JSON.parse(r.detail_json) : {}; } catch(e) {}
            var rSizeData = (rDetail[jns] && rDetail[jns][ukr]) ? rDetail[jns][ukr] : {};
            tot_disL += parseInt(rSizeData.terima_l) || 0;
            tot_disP += parseInt(rSizeData.terima_p) || 0;
          });
        });

        var tot_rJml = tot_rL + tot_rP;
        var tot_tJml = tot_tL + tot_tP;
        var tot_disJml = tot_disL + tot_disP;
        var tot_bL = tot_tL - tot_disL;
        var tot_bP = tot_tP - tot_disP;
        var tot_bJml = tot_tJml - tot_disJml;

        rowAwal.push(tot_rL, tot_rP, tot_rJml);
        rowTerima.push(tot_tL, tot_tP, tot_tJml);
        rowDiserahkan.push(tot_disL, tot_disP, tot_disJml);
        rowBelum.push(tot_bL, tot_bP, tot_bJml);

        rowsToExport.push({
          namaSekolah: namaSekolah,
          rowAwal: rowAwal,
          rowTerima: rowTerima,
          rowDiserahkan: rowDiserahkan,
          rowBelum: rowBelum
        });
      });

      // Sort by school name alphabetically (A-Z)
      rowsToExport.sort(function(a, b) {
        return a.namaSekolah.localeCompare(b.namaSekolah);
      });

      // Build HTML rows (4 rows per school)
      var excelRows = '';
      rowsToExport.forEach(function(r) {
        // Row 1: Data Awal
        excelRows += '<tr style="background-color: #ffffff;">';
        excelRows += '<td style="text-align: left; font-weight: bold; vertical-align: middle;">' + r.namaSekolah + '</td>';
        r.rowAwal.forEach(function(val) {
          excelRows += '<td style="text-align: center; mso-number-format:\'0;\\-0;\\-\';">' + (val === 0 ? '-' : val) + '</td>';
        });
        excelRows += '</tr>';

        // Row 2: Diterima
        excelRows += '<tr style="background-color: rgba(0, 123, 255, 0.05);">';
        excelRows += '<td style="text-align: right; font-style: italic; font-weight: bold; color: #007bff; padding-right: 10px;">Diterima</td>';
        r.rowTerima.forEach(function(val) {
          excelRows += '<td style="text-align: center; mso-number-format:\'0;\\-0;\\-\'; color: #007bff;">' + (val === 0 ? '-' : val) + '</td>';
        });
        excelRows += '</tr>';

        // Row 3: Diserahkan
        excelRows += '<tr style="background-color: rgba(23, 162, 184, 0.05);">';
        excelRows += '<td style="text-align: right; font-style: italic; font-weight: bold; color: #17a2b8; padding-right: 10px;">Diserahkan</td>';
        r.rowDiserahkan.forEach(function(val) {
          excelRows += '<td style="text-align: center; mso-number-format:\'0;\\-0;\\-\'; color: #17a2b8;">' + (val === 0 ? '-' : val) + '</td>';
        });
        excelRows += '</tr>';

        // Row 4: Belum Diserahkan
        excelRows += '<tr style="background-color: rgba(220, 53, 69, 0.05); border-bottom: 2px solid #000000;">';
        excelRows += '<td style="text-align: right; font-style: italic; font-weight: bold; color: #dc3545; padding-right: 10px;">Belum</td>';
        r.rowBelum.forEach(function(val) {
          var style = 'text-align: center; mso-number-format:\'0;\\-0;\\-\'; font-weight: bold;';
          if (val > 0) {
            style += ' color: #dc3545;';
          } else if (val < 0) {
            style += ' color: #28a745;';
          } else {
            style += ' color: #6c757d;';
          }
          excelRows += '<td style="' + style + '">' + (val === 0 ? '-' : val) + '</td>';
        });
        excelRows += '</tr>';
      });

      // Compute totals for each row category
      var totAwal = new Array(27).fill(0);
      var totTerima = new Array(27).fill(0);
      var totDiserahkan = new Array(27).fill(0);
      var totBelum = new Array(27).fill(0);

      rowsToExport.forEach(function(r) {
        for (var idx = 0; idx < 27; idx++) {
          totAwal[idx] += r.rowAwal[idx] || 0;
          totTerima[idx] += r.rowTerima[idx] || 0;
          totDiserahkan[idx] += r.rowDiserahkan[idx] || 0;
          totBelum[idx] += r.rowBelum[idx] || 0;
        }
      });

      // Build 4-row Footer HTML
      var excelFoot = '';
      
      // Total Data Awal
      excelFoot += '<tr style="background-color: #d4edda;">';
      excelFoot += '<th style="text-align: left; font-weight: bold; color: #155724;">TOTAL DATA AWAL</th>';
      totAwal.forEach(function(val) {
        excelFoot += '<th style="text-align: center; mso-number-format:\'0;\\-0;\\-\'; font-weight: bold; color: #155724;">' + (val === 0 ? '-' : val) + '</th>';
      });
      excelFoot += '</tr>';

      // Total Diterima
      excelFoot += '<tr style="background-color: #cce5ff;">';
      excelFoot += '<th style="text-align: left; font-weight: bold; color: #004085;">TOTAL DITERIMA</th>';
      totTerima.forEach(function(val) {
        excelFoot += '<th style="text-align: center; mso-number-format:\'0;\\-0;\\-\'; font-weight: bold; color: #004085;">' + (val === 0 ? '-' : val) + '</th>';
      });
      excelFoot += '</tr>';

      // Total Diserahkan
      excelFoot += '<tr style="background-color: #e2f0d9;">';
      excelFoot += '<th style="text-align: left; font-weight: bold; color: #385723;">TOTAL DISERAHKAN</th>';
      totDiserahkan.forEach(function(val) {
        excelFoot += '<th style="text-align: center; mso-number-format:\'0;\\-0;\\-\'; font-weight: bold; color: #385723;">' + (val === 0 ? '-' : val) + '</th>';
      });
      excelFoot += '</tr>';

      // Total Belum Diserahkan
      excelFoot += '<tr style="background-color: #f8d7da;">';
      excelFoot += '<th style="text-align: left; font-weight: bold; color: #721c24;">TOTAL BELUM DISERAHKAN</th>';
      totBelum.forEach(function(val) {
        var style = 'text-align: center; mso-number-format:\'0;\\-0;\\-\'; font-weight: bold;';
        if (val > 0) {
          style += ' color: #721c24;';
        } else if (val < 0) {
          style += ' color: #155724;';
        } else {
          style += ' color: #6c757d;';
        }
        excelFoot += '<th style="' + style + '">' + (val === 0 ? '-' : val) + '</th>';
      });
      excelFoot += '</tr>';

      var html = '<html><head><meta charset="utf-8"><style>';
      html += 'table { border-collapse: collapse; }';
      html += 'th, td { border: 1px solid #000000; padding: 4px; font-family: Arial, sans-serif; font-size: 10pt; }';
      html += 'thead th { background-color: #f2f2f2; font-weight: bold; text-align: center; }';
      html += 'tfoot th { font-weight: bold; text-align: center; }';
      html += '</style></head><body>';
      html += '<table>';
      html += '<tr><td colspan="28" style="font-weight: bold; font-size: 14pt; border: none; text-align: left;">PENDISTRIBUSIAN PENYERAHAN SERAGAM ' + jenisSeragam + '</td></tr>';
      html += '<tr><td colspan="28" style="font-weight: bold; font-size: 12pt; border: none; text-align: left;">KORWIL DISDIKBUD KECAMATAN SECANG</td></tr>';
      html += '<tr><td colspan="28" style="font-weight: bold; font-size: 12pt; border: none; text-align: left;">PER ' + formattedDate + '</td></tr>';
      html += '<tr><td colspan="28" style="border: none;"></td></tr>';
      html += '<thead>' + originalHead + '</thead>';
      html += '<tbody>' + excelRows + '</tbody>';
      html += '<tfoot>' + excelFoot + '</tfoot>';
      html += '</table>';
      html += '</body></html>';
      
      var url = 'data:application/vnd.ms-excel;charset=utf-8,' + encodeURIComponent(html);
      var link = document.createElement("a");
      var fileName = "Pendistribusian_Penyerahan_Seragam_" + jenisSeragam.replace(/\s+/g, '_') + "_" + formattedDate.replace(/\s+/g, '_') + ".xls";
      link.download = fileName;
      link.href = url;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

  })();
</script>
