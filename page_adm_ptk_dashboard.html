    <!-- FILTER BAR TERPUSAT SULTAN UI -->

      <div class="filter-controls-group">

        <!-- 1. Filter Jenis Dokumen (Kategori) -->

          <select id="admptk_dash_filterKategori" class="form-control" aria-label="Pilih Jenis Dokumen">
            <option value="">Memuat Jenis Dokumen...</option>
          </select>
          <i class="fas fa-chevron-down"></i>
        </div>

        <!-- 2. Filter Tahun -->
        <div class="sultan-filter-item" id="admptk_dash_filterTahunContainer">
          <select id="admptk_dash_filterTahun" class="form-control" aria-label="Pilih Tahun">
            <option value="SEMUA">Semua Tahun</option>
          </select>

        <!-- Filter Periode (Opsional) -->
        <div class="sultan-filter-item" id="admptk_dash_filterPeriodeContainer" style="display: none;">
          <select id="admptk_dash_filterPeriode" class="form-control" aria-label="Pilih Periode">
            <option value="SEMUA">Semua Periode</option>
          </select>
          <i class="fas fa-chevron-down"></i>
        </div>

        <!-- 3. Filter Jenjang (Khusus Admin) -->
        <div class="sultan-filter-item" id="admptk_dash_filterJenjangContainer" style="min-width: 150px; display: none;">
          <select id="admptk_dash_filterJenjang" class="form-control" aria-label="Pilih Jenjang">
            <option value="SEMUA">Semua Jenjang</option>
            <option value="PAUD">PAUD</option>
            <option value="SD" selected>SD</option>
          </select>
          <i class="fas fa-chevron-down"></i>
        </div>

        <!-- 4. Filter Nama Sekolah (Khusus Admin) -->
        <div class="sultan-filter-item" id="admptk_dash_filterNamaSekolahContainer" style="min-width: 220px; max-width: 360px; display: none;">
          <select id="admptk_dash_filterNamaSekolah" class="form-control" aria-label="Pilih Nama Sekolah">
            <option value="SEMUA">Semua Sekolah</option>

          <i class="fas fa-chevron-down"></i>

        <!-- Tombol Refresh Data -->

    <!-- Loading State Terpusat -->

        <i class="fas fa-circle-notch fa-spin"></i>
      </div>
      <h6 class="text-muted font-weight-bold sultan-loading-text mb-0" style="letter-spacing: 0.5px; text-transform: uppercase; font-size: 11px;">Memuat Data Dasbor Administrasi PTK...</h6>
    </div>

    <div id="admptk_dash_dashboardState" style="display: none;">

      <!-- Row 1: Card Progress (4 Metric Cards Minimal) -->
      <div id="admptk_dash_metricRow1"></div>

      <!-- Row 2: Card Status Breakdown (5 Status Cards) -->
      <div id="admptk_dash_metricRow2"></div>

      <!-- Row 3: Card DAFTAR PTK SUDAH UNGGAH (4 Cards List Terpusat) -->

      <!-- Row 4: Card Tabel Rekapitulasi Per Unit Kerja -->
      <div class="row mb-4">
        <div class="col-12">
          <div class="card card-sultan-terpusat shadow-xs border-0">
            <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center pt-3 pb-2 px-3">
              <h6 class="font-weight-bold text-sultan-utama m-0 text-uppercase" id="admptk_dash_tableTitle" style="letter-spacing: 0.5px;">
                <i class="fas fa-table mr-2"></i>REKAPITULASI PER UNIT KERJA
              </h6>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive sultan-scroll">
                <table id="admptk_dash_tabelRekap" class="table table-hover sultan-table-datatable text-nowrap mb-0 w-100">
                  <thead>
                    <tr>
                      <th class="align-middle text-left font-weight-bold col-sticky-left" style="min-width: 250px;">NAMA SEKOLAH</th>
                      <th class="align-middle text-center font-weight-bold">JML PTK</th>
                      <th class="align-middle text-center font-weight-bold">SUDAH UNGGAH</th>

                      <th class="align-middle text-center font-weight-bold" style="width: 120px;">PROGRESS</th>
                    </tr>
                  </thead>
                  <tbody id="admptk_dash_tbodyRekap"></tbody>
                  <tfoot class="bg-light font-weight-bold text-sultan-utama" style="font-size: 13px;">
                    <tr>
                      <td class="text-left align-middle font-weight-bold">JUMLAH TOTAL</td>
                      <td class="text-center align-middle" id="admptk_dash_totalPtk">0</td>
                      <td class="text-center align-middle" id="admptk_dash_totalSudah">0</td>
                      <td class="text-center align-middle" id="admptk_dash_totalBelum">0</td>
                      <td class="text-center align-middle" id="admptk_dash_totalProgress">0%</td>

                  </tfoot>
                </table>
              </div>
            </div>
          </div>

    </div>

  </div>
</section>

<script>
  var ADMPTK_DASH_CACHE_REKAP = [];
  var ADMPTK_DASH_CACHE_BELUM = [];
  var ADMPTK_DASH_TABEL_REKAP = null;
  var ADMPTK_DASH_KATEGORI_MAP = [];
  var ADMPTK_DASH_PENDING_REQ = 0;
  var ADMPTK_DASH_IS_ADMIN = false;
  var ADMPTK_DASH_USER_NPSN = "";
  var ADMPTK_DASH_TAHUN_DEFAULTED = false;
  var ADMPTK_DASH_PERIODE_DEFAULTED = false;
  var ADMPTK_DASH_JENIS_PERIODE = "TAHUNAN";

  $(document).ready(function () {
    try {
      var user = typeof getSesiUser === 'function' ? getSesiUser() : {};
      var rStr = String(user.role || "").toLowerCase();
      ADMPTK_DASH_IS_ADMIN = (typeof checkUserRoleIsAdmin === 'function' && checkUserRoleIsAdmin()) || rStr.includes("admin") || rStr.includes("verifikator");
      ADMPTK_DASH_USER_NPSN = user.npsn || user.unit || user.username || "";
    } catch(e) { ADMPTK_DASH_USER_NPSN = ""; ADMPTK_DASH_IS_ADMIN = false; }

    // 1. Render Row 1: Card Progress (JML SASARAN, SUDAH UNGGAH, BELUM UNGGAH, PROGRESS)
    if (typeof SultanUI !== 'undefined' && SultanUI.renderDashboardRow1Minimal) {
      $('#admptk_dash_metricRow1').html(SultanUI.renderDashboardRow1Minimal('admptk_dash', {
        totalLabel: 'JML SASARAN',
        sudahLabel: 'SUDAH UNGGAH',
        belumLabel: 'BELUM UNGGAH',
        progressLabel: 'PROGRESS'
      }));
    }

    // 2. Render Row 2: Card Status (JML DOKUMEN, DIPROSES, DISETUJUI, REVISI, DITOLAK)
    if (typeof SultanUI !== 'undefined' && SultanUI.renderDashboardRow2Minimal) {
      $('#admptk_dash_metricRow2').html(SultanUI.renderDashboardRow2Minimal('admptk_dash', {
        totalLabel: 'JML DOKUMEN',
        diprosesLabel: 'DIPROSES',
        disetujuiLabel: 'DISETUJUI',
        revisiLabel: 'REVISI',
        ditolakLabel: 'DITOLAK'
      }));
    }

    // 3. Render Row 3: Card DAFTAR PTK SUDAH UNGGAH (DIPROSES, DISETUJUI, REVISI, DITOLAK)
    if (typeof SultanUI !== 'undefined' && SultanUI.renderDashboardStatusCards4) {
      $('#admptk_dash_statusCardsContainer').html(SultanUI.renderDashboardStatusCards4('admptk_dash', {
        title: 'DAFTAR PTK SUDAH UNGGAH',
        diprosesLabel: 'DIPROSES',
        disetujuiLabel: 'DISETUJUI',
        revisiLabel: 'REVISI',
        ditolakLabel: 'DITOLAK',
        copyActionFn: 'admptk_dash_salinWaRekap()'
      }));
    }

    // Filter Jenjang & Sekolah untuk Admin / User
    if (ADMPTK_DASH_IS_ADMIN) {
      $('#admptk_dash_filterJenjangContainer').show();
      $('#admptk_dash_filterNamaSekolahContainer').show();
    } else {
      $('#admptk_dash_filterJenjangContainer').hide();
      $('#admptk_dash_filterNamaSekolahContainer').hide();
    }

    // Event listeners
    $('#admptk_dash_btnRefresh').click(function () {
      var k = $('#admptk_dash_filterKategori').val();
      if (k !== "" && k != null) admptk_dash_loadDataKategori(k, true);
    });

    $('#admptk_dash_filterKategori').change(function () {
      var k = $(this).val();
      if (k) admptk_dash_loadDataKategori(k);
    });

    $('#admptk_dash_filterTahun, #admptk_dash_filterPeriode, #admptk_dash_filterNamaSekolah').change(admptk_dash_terapkanFilterLokal);

    $('#admptk_dash_filterJenjang').change(function () {
      admptk_dash_initDropdownSekolah();
      admptk_dash_terapkanFilterLokal();
    });

    // Live search listener 4 Card List Status
    $(document).off('keyup', '#admptk_dash_inputCariDiproses').on('keyup', '#admptk_dash_inputCariDiproses', function() {
      var val = $(this).val().toLowerCase().trim();
      $('#admptk_dash_listDiproses li.admptk-dash-item').filter(function() {
        $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
      });
    });
    $(document).off('keyup', '#admptk_dash_inputCariDisetujui').on('keyup', '#admptk_dash_inputCariDisetujui', function() {
      var val = $(this).val().toLowerCase().trim();
      $('#admptk_dash_listDisetujui li.admptk-dash-item').filter(function() {
        $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
      });
    });
    $(document).off('keyup', '#admptk_dash_inputCariRevisi').on('keyup', '#admptk_dash_inputCariRevisi', function() {
      var val = $(this).val().toLowerCase().trim();
      $('#admptk_dash_listRevisi li.admptk-dash-item').filter(function() {
        $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
      });
    });
    $(document).off('keyup', '#admptk_dash_inputCariDitolak').on('keyup', '#admptk_dash_inputCariDitolak', function() {
      var val = $(this).val().toLowerCase().trim();
      $('#admptk_dash_listDitolak li.admptk-dash-item').filter(function() {
        $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
      });
    });

    admptk_dash_initMasterAccess();
  });

  function admptk_dash_initMasterAccess() {
    if (typeof SultanUI !== 'undefined') {
      SultanUI.showLoading('#admptk_dash_loadingState', 'Memuat Kategori Administrasi PTK...');
    } else {
      $('#admptk_dash_loadingState').show();
    }
    $('#admptk_dash_dashboardState').hide();

    google.script.run
      .withSuccessHandler(function (json) {
        var res = typeof json === 'string' ? JSON.parse(json) : json;
        if (!res.success) {
          if (typeof SultanUI !== 'undefined') {
            SultanUI.showLoadingError('#admptk_dash_loadingState', res.message || 'Gagal memuat kategori');
          }
          return;
        }

        ADMPTK_DASH_KATEGORI_MAP = (res.kategori || []).filter(function(k) { return k.idKat; });
        if (ADMPTK_DASH_KATEGORI_MAP.length === 0) {
          if (typeof SultanUI !== 'undefined') {
            SultanUI.showLoadingError('#admptk_dash_loadingState', 'Belum ada Kategori yang berintegrasi ke Dashboard.');
          }
          return;
        }

        var selectKat = $('#admptk_dash_filterKategori');
        selectKat.empty();
        ADMPTK_DASH_KATEGORI_MAP.forEach(function(k) {
          selectKat.append($('<option>', { value: k.idKat, text: k.namaKategori }));
        });
        admptk_dash_loadDataKategori($('#admptk_dash_filterKategori').val());
      })
      .withFailureHandler(function (err) {
        if (typeof SultanUI !== 'undefined') {
          SultanUI.showLoadingError('#admptk_dash_loadingState', 'Koneksi Terputus: ' + (err.message || err));
        }
      })
      .getAdmPtkDashboardInit(ADMPTK_DASH_IS_ADMIN ? "" : ADMPTK_DASH_USER_NPSN);
  }

  function admptk_dash_loadDataKategori(idKategori, forceRefresh) {
    if (ADMPTK_DASH_PENDING_REQ > 0) return;
    ADMPTK_DASH_TAHUN_DEFAULTED = false;
    ADMPTK_DASH_PERIODE_DEFAULTED = false;
    ADMPTK_DASH_PENDING_REQ = 1;
    forceRefresh = !!forceRefresh;

    var mapData = ADMPTK_DASH_KATEGORI_MAP.find(k => k.idKat === idKategori);
    if (!mapData) { ADMPTK_DASH_PENDING_REQ = 0; return; }

    if (typeof SultanUI !== 'undefined') {
      SultanUI.showLoading('#admptk_dash_loadingState', 'Memuat Data Dasbor Administrasi PTK...');
    } else {
      $('#admptk_dash_loadingState').show();
    }
    $('#admptk_dash_dashboardState').hide();

    var jenjang = $('#admptk_dash_filterJenjang').val() || "SD";
    var npsnFilter = ADMPTK_DASH_IS_ADMIN ? "" : ADMPTK_DASH_USER_NPSN;

    google.script.run
      .withSuccessHandler(function(jsonStr) {
        ADMPTK_DASH_PENDING_REQ = 0;
        if (typeof SultanUI !== 'undefined') {
          SultanUI.hideLoading('#admptk_dash_loadingState');
        } else {
          $('#admptk_dash_loadingState').hide();
        }

        var data = typeof jsonStr === 'string' ? JSON.parse(jsonStr) : jsonStr;
        if (!data.success) {
          if (typeof SultanUI !== 'undefined') {
            SultanUI.showLoadingError('#admptk_dash_loadingState', data.message || 'Gagal memuat data');
          }
          return;
        }

        ADMPTK_DASH_JENIS_PERIODE = data.jenisPeriode || "TAHUNAN";
        ADMPTK_DASH_CACHE_REKAP = data.rekap || [];
        ADMPTK_DASH_CACHE_BELUM = data.belum || [];

        admptk_dash_initDropdownSekolah();
        admptk_dash_initDropdownTahun();

        $('#admptk_dash_dashboardState').fadeIn();
        admptk_dash_terapkanFilterLokal();
      })
      .withFailureHandler(function(err) {
        ADMPTK_DASH_PENDING_REQ = 0;
        if (typeof SultanUI !== 'undefined') {
          SultanUI.showLoadingError('#admptk_dash_loadingState', 'Koneksi Terputus: ' + (err.message || err));
        }
      })
      .getAdmPtkDashboardData(idKategori, npsnFilter, jenjang, forceRefresh);
  }

  function admptk_dash_initDropdownSekolah() {
    var unique = {}; 
    var filterJenjang = $('#admptk_dash_filterJenjang').val() || "SEMUA";
    ADMPTK_DASH_CACHE_REKAP.forEach(function(r) {
      var jj = String(r.jenjang || "").toUpperCase(); 
      var pass = true;
      if (filterJenjang !== "SEMUA") {
        if (filterJenjang === "PAUD") pass = (jj === "TK" || jj === "KB" || jj === "SPS" || jj === "TPA" || jj.includes("PAUD"));
        else if (filterJenjang === "SD") pass = (jj === "SD" || jj === "SDS");
      }
      if (pass && r.sekolah) unique[r.sekolah] = true;
    });
    var sorted = Object.keys(unique).sort();
    var select = $('#admptk_dash_filterNamaSekolah'); 
    var curVal = select.val();
    select.empty().append('<option value="SEMUA">Semua Sekolah</option>');
    sorted.forEach(function(s) { 
      select.append('<option value="' + admptk_dash_esc(s) + '">' + admptk_dash_esc(s) + '</option>'); 
    });
    if (curVal && unique[curVal]) select.val(curVal);
  }

  function admptk_dash_getTahunAjaranSaatIni() {
    var now = new Date();
    var currentYear = now.getFullYear();
    var currentMonth = now.getMonth();
    var startYear = (currentMonth >= 6) ? currentYear : currentYear - 1;
    return startYear + '/' + (startYear + 1);
  }

  function admptk_dash_getDefaultPeriodeSaatIni(jenisPeriode) {
    var now = new Date();
    var month = now.getMonth();
    var jP = String(jenisPeriode).toUpperCase();
    
    if (jP.includes("BULANAN") || jP === "BULAN") {
      var bulans = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
      return bulans[month];
    }
    if (jP.includes("SEMESTER")) {
      return (month >= 6) ? "Semester 1" : "Semester 2";
    }
    if (jP.includes("TRIWULAN")) {
      var triwulan = Math.floor(month / 3) + 1;
      return "Triwulan " + triwulan;
    }
    return "SEMUA";
  }

  function admptk_dash_initDropdownTahun() {
    var uniqueTahun = new Set(); var uniquePeriode = new Set();
    ADMPTK_DASH_CACHE_REKAP.concat(ADMPTK_DASH_CACHE_BELUM).forEach(function(r) {
      var thn = String(r.tahun || "").trim(); if (thn && thn !== "-") uniqueTahun.add(thn);
      var per = String(r.periode || "").trim(); if (per && per !== "-") uniquePeriode.add(per);
    });
    var selTahun = $('#admptk_dash_filterTahun'); var curTahun = selTahun.val();
    selTahun.empty().append('<option value="SEMUA">Semua Tahun</option>');
    var selPeriode = $('#admptk_dash_filterPeriode'); var curPeriode = selPeriode.val();
    selPeriode.empty().append('<option value="SEMUA">Semua Periode</option>');
    var sortedTahun = Array.from(uniqueTahun).sort(function(a, b) { var na = parseInt(a, 10), nb = parseInt(b, 10); return !isNaN(na) && !isNaN(nb) ? nb - na : String(b).localeCompare(String(a)); });
    sortedTahun.forEach(function(t) { selTahun.append('<option value="' + admptk_dash_esc(t) + '">' + admptk_dash_esc(t) + '</option>'); });
    
    var tapelSaatIni = admptk_dash_getTahunAjaranSaatIni();
    if (!ADMPTK_DASH_TAHUN_DEFAULTED) {
      if (uniqueTahun.has(tapelSaatIni)) {
        selTahun.val(tapelSaatIni);
      } else if (sortedTahun.length > 0) {
        selTahun.val(sortedTahun[0]);
      }
      ADMPTK_DASH_TAHUN_DEFAULTED = true;
    }
    else if (curTahun && (curTahun === "SEMUA" || uniqueTahun.has(curTahun))) {
      selTahun.val(curTahun);
    }
    
    var sortedPeriode = Array.from(uniquePeriode).sort(function(a, b) { return String(b).localeCompare(String(a)); });
    sortedPeriode.forEach(function(p) { selPeriode.append('<option value="' + admptk_dash_esc(p) + '">' + admptk_dash_esc(p) + '</option>'); });
    var jP = ADMPTK_DASH_JENIS_PERIODE;
    if (jP === "TAHUNAN" || jP === "PERMANEN" || jP === "TMT") { 
      $('#admptk_dash_filterPeriodeContainer').hide(); 
    } else { 
      $('#admptk_dash_filterPeriodeContainer').show(); 
      var defaultPeriode = admptk_dash_getDefaultPeriodeSaatIni(jP);
      if (!ADMPTK_DASH_PERIODE_DEFAULTED) {
        if (uniquePeriode.has(defaultPeriode)) {
          selPeriode.val(defaultPeriode);
        } else if (sortedPeriode.length > 0) {
          selPeriode.val(sortedPeriode[0]);
        }
        ADMPTK_DASH_PERIODE_DEFAULTED = true;
      }
      else if (curPeriode && (curPeriode === "SEMUA" || uniquePeriode.has(curPeriode))) {
        selPeriode.val(curPeriode);
      }
    }
  }

  function admptk_dash_terapkanFilterLokal() {
    var fSekolah = String($('#admptk_dash_filterNamaSekolah').val() || "").trim().toUpperCase();
    var fTahun = String($('#admptk_dash_filterTahun').val() || "").trim().toUpperCase();
    var fPeriode = String($('#admptk_dash_filterPeriode').val() || "").trim().toUpperCase();
    var filterJenjang = $('#admptk_dash_filterJenjang').val() || "SEMUA";

    function passFilt(r) {
      var jj = String(r.jenjang || "").toUpperCase();
      if (filterJenjang !== "SEMUA") {
        if (filterJenjang === "PAUD" && !(jj === "TK" || jj === "KB" || jj === "SPS" || jj === "TPA" || jj.includes("PAUD"))) return false;
        if (filterJenjang === "SD" && !(jj === "SD" || jj === "SDS")) return false;
      }
      if (fSekolah !== "SEMUA" && fSekolah !== "" && String(r.sekolah || "").trim().toUpperCase() !== fSekolah) return false;
      if (fTahun !== "SEMUA" && fTahun !== "" && String(r.tahun || "").trim().toUpperCase() !== fTahun) return false;
      if (fPeriode !== "SEMUA" && fPeriode !== "" && String(r.periode || "").trim().toUpperCase() !== fPeriode) return false;
      return true;
    }

    var filterRekap = ADMPTK_DASH_CACHE_REKAP.filter(passFilt);
    var filterBelum = ADMPTK_DASH_CACHE_BELUM.filter(passFilt);

    var selKatText = $('#admptk_dash_filterKategori option:selected').text();
    $('#admptk_dash_tableTitle').html('<i class="fas fa-table mr-2"></i>REKAPITULASI PER UNIT KERJA');

    admptk_dash_renderDashboard(filterRekap, filterBelum, fTahun, fPeriode);
  }

  function admptk_dash_renderDashboard(dataRekap, dataBelum, fTahun, fPeriode) {
    var totPtk = 0;
    var totSudah = 0;
    var totBelum = 0;
    var jmlDokumen = 0;
    var jmlDiproses = 0;
    var jmlDisetujui = 0;
    var jmlRevisi = 0;
    var jmlDitolak = 0;

    var listDiproses = [];
    var listDisetujui = [];
    var listRevisi = [];
    var listDitolak = [];
    var listBelumNama = [];

    // Kelompokkan data per sekolah untuk tabel rekapitulasi per unit kerja
    var mapTabelSekolah = {};

    dataRekap.forEach(function(r) {
      var sek = r.sekolah || "Tidak Diketahui";
      if (!mapTabelSekolah[sek]) {
        mapTabelSekolah[sek] = { ptkSet: new Set(), sudahSet: new Set() };
      }
      mapTabelSekolah[sek].ptkSet.add(r.id);

      totPtk++;
      var isSudah = (parseInt(r.sudah) || 0) > 0;

      if (isSudah) {
        totSudah++;
        mapTabelSekolah[sek].sudahSet.add(r.id);

        var statusDok = String(r.status_dokumen || "").trim().toLowerCase();
        if (statusDok !== "") {
          jmlDokumen++;
          if (statusDok.includes("setuju") || statusDok.includes("ok") || statusDok.includes("valid")) {
            jmlDisetujui++;
            listDisetujui.push({ nama: r.unit, nip: r.nip });
          } else if (statusDok.includes("revisi")) {
            jmlRevisi++;
            listRevisi.push({ nama: r.unit, nip: r.nip });
          } else if (statusDok.includes("tolak")) {
            jmlDitolak++;
            listDitolak.push({ nama: r.unit, nip: r.nip });
          } else {
            jmlDiproses++;
            listDiproses.push({ nama: r.unit, nip: r.nip });
          }
        } else {
          jmlDiproses++;
          listDiproses.push({ nama: r.unit, nip: r.nip });
        }
      } else {
        totBelum++;
        listBelumNama.push({ nama: r.unit, nip: r.nip, sekolah: r.sekolah });
      }
    });

    // Tambahkan dataBelum murni ke listBelum
    dataBelum.forEach(function(b) {
      var sek = b.sekolah || "Tidak Diketahui";
      if (!mapTabelSekolah[sek]) {
        mapTabelSekolah[sek] = { ptkSet: new Set(), sudahSet: new Set() };
      }
      mapTabelSekolah[sek].ptkSet.add(b.id);
      totPtk++;
      totBelum++;
      listBelumNama.push({ nama: b.unit, nip: b.nip, sekolah: b.sekolah });
    });

    // Cache untuk salin WA
    window.ADMPTK_DASH_LIST_BELUM_CACHE = listBelumNama;
    window.ADMPTK_DASH_LIST_REVISI_CACHE = listRevisi;
    window.ADMPTK_DASH_LIST_DITOLAK_CACHE = listDitolak;

    // 1. Update Card Progress
    var percentage = totPtk > 0 ? Math.round((totSudah / totPtk) * 100) : 0;
    $('#admptk_dash_cardTotalSekolah').text(totPtk.toLocaleString('id-ID'));
    $('#admptk_dash_cardSudah').text(totSudah.toLocaleString('id-ID'));
    $('#admptk_dash_cardBelum').text(totBelum.toLocaleString('id-ID'));
    $('#admptk_dash_cardProgress').text(percentage + '%');

    // 2. Update Card Status Breakdown
    $('#admptk_dash_cardJmlDokumen').text(jmlDokumen.toLocaleString('id-ID'));
    $('#admptk_dash_cardDiproses').text(jmlDiproses.toLocaleString('id-ID'));
    $('#admptk_dash_cardDisetujui').text(jmlDisetujui.toLocaleString('id-ID'));
    $('#admptk_dash_cardRevisi').text(jmlRevisi.toLocaleString('id-ID'));
    $('#admptk_dash_cardDitolak').text(jmlDitolak.toLocaleString('id-ID'));

    // 3. Update Badges 4 Status Cards List
    $('#admptk_dash_badgeDiproses').text(jmlDiproses);
    $('#admptk_dash_badgeDisetujui').text(jmlDisetujui);
    $('#admptk_dash_badgeRevisi').text(jmlRevisi);
    $('#admptk_dash_badgeDitolak').text(jmlDitolak);

    // Populate 4 List Cards (Hanya nama PTK saja tanpa identitas/tombol lain)
    var categories = [
      { id: '#admptk_dash_listDiproses', list: listDiproses, emptyText: 'Tidak ada PTK diproses' },
      { id: '#admptk_dash_listDisetujui', list: listDisetujui, emptyText: 'Tidak ada PTK disetujui' },
      { id: '#admptk_dash_listRevisi', list: listRevisi, emptyText: 'Tidak ada PTK revisi' },
      { id: '#admptk_dash_listDitolak', list: listDitolak, emptyText: 'Tidak ada PTK ditolak' }
    ];

    categories.forEach(function(cat) {
      var $list = $(cat.id);
      $list.empty();

      if (cat.list.length === 0) {
        var emptyHtml = typeof SultanUI !== 'undefined' && SultanUI.renderListEmptyInfo ? 
          SultanUI.renderListEmptyInfo(cat.emptyText) : 
          '<li class="list-group-item bg-transparent text-center text-muted py-4 border-0" style="font-size:11px;">' + cat.emptyText + '</li>';
        $list.html(emptyHtml);
      } else {
        cat.list.forEach(function(item, index) {
          var idxNum = index + 1;
          var nama = String(item.nama || "-").toUpperCase();
          var delay = Math.min(index * 20, 300);

          var itemHtml = 
            '<li class="list-group-item bg-transparent py-2 px-3 font-weight-bold dashlapbul-list-item d-flex align-items-center animate__animated animate__fadeIn admptk-dash-item" style="font-size:12px;line-height:1.4;animation-delay:' + delay + 'ms;">' +
              '<span class="badge dashlapbul-badge-idx mr-2" style="width:25px;min-width:25px;flex-shrink:0;">' + idxNum + '</span>' +
              '<span class="school-name flex-grow-1 text-truncate" style="word-break:break-word;">' + nama + '</span>' +
            '</li>';

          $list.append(itemHtml);
        });
      }
    });

    // 4. Render Tabel Rekapitulasi Per Unit Kerja (Default 10 Entri)
    var dtArray = [];
    var listSekolahKeys = Object.keys(mapTabelSekolah).sort();

    listSekolahKeys.forEach(function(sek) {
      var ptkCount = mapTabelSekolah[sek].ptkSet.size;
      var sudahCount = mapTabelSekolah[sek].sudahSet.size;
      var belumCount = ptkCount - sudahCount;
      var pctSek = ptkCount > 0 ? Math.round((sudahCount / ptkCount) * 100) : 0;

      var bgClass = pctSek >= 80 ? 'bg-success' : (pctSek >= 50 ? 'bg-warning' : 'bg-danger');
      var progressHtml = '<div class="d-flex align-items-center justify-content-center" style="font-size:13px;">' +
                           '<span class="mr-2 font-weight-bold" style="min-width:38px;text-align:right;">' + pctSek + '%</span>' +
                           '<div class="progress shadow-xs" style="width:60px;height:7px;border-radius:4px;background-color:rgba(0,0,0,0.06);">' +
                             '<div class="progress-bar ' + bgClass + '" role="progressbar" style="width:' + pctSek + '%;border-radius:4px;"></div>' +
                           '</div>' +
                         '</div>';

      dtArray.push([
        '<span class="font-weight-bold sultan-table-primary">' + sek + '</span>',
        ptkCount > 0 ? '<span class="font-weight-bold">' + ptkCount.toLocaleString('id-ID') + '</span>' : '<span class="text-muted opacity-50 font-weight-normal">-</span>',
        sudahCount > 0 ? '<span class="font-weight-bold text-success">' + sudahCount.toLocaleString('id-ID') + '</span>' : '<span class="text-muted opacity-50 font-weight-normal">-</span>',
        belumCount > 0 ? '<span class="font-weight-bold text-danger">' + belumCount.toLocaleString('id-ID') + '</span>' : '<span class="text-muted opacity-50 font-weight-normal">-</span>',
        progressHtml
      ]);
    });

    if ($.fn.DataTable.isDataTable('#admptk_dash_tabelRekap')) {
      $('#admptk_dash_tabelRekap').DataTable().destroy();
    }
    ADMPTK_DASH_TABEL_REKAP = $('#admptk_dash_tabelRekap').DataTable({
      destroy: true,
      data: dtArray,
      ordering: true,
      pageLength: 10,
      autoWidth: false,
      order: [[0, 'asc']],
      columnDefs: [
        { targets: 0, className: 'text-left align-middle' },
        { targets: [1, 2, 3, 4], className: 'text-center align-middle' }
      ],
      language: {
        search: "Cari:",
        lengthMenu: "Tampilkan _MENU_ data",
        info: "Menampilkan _START_ sampai _END_ dari _TOTAL_ data",
        emptyTable: "Tidak ada data yang tersedia pada tabel ini",
        paginate: { previous: "Sebelumnya", next: "Berikutnya" }
      },
      dom: "<'row mb-2'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>>" +
           "<'row'<'col-sm-12'tr>>" +
           "<'row mt-2'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>"
    });

    // Update Footer Totals
    var formatTotal = function(val) {
      return val === 0 ? "-" : val.toLocaleString('id-ID');
    };
    $('#admptk_dash_totalPtk').text(formatTotal(totPtk));
    $('#admptk_dash_totalSudah').text(formatTotal(totSudah));
    $('#admptk_dash_totalBelum').text(formatTotal(totBelum));
    $('#admptk_dash_totalProgress').text(percentage + '%');
  }

  function admptk_dash_salinWaRekap() {
    var belumList = window.ADMPTK_DASH_LIST_BELUM_CACHE || [];
    var revisiList = window.ADMPTK_DASH_LIST_REVISI_CACHE || [];
    var ditolakList = window.ADMPTK_DASH_LIST_DITOLAK_CACHE || [];

    if (belumList.length === 0 && revisiList.length === 0 && ditolakList.length === 0) {
      if (typeof Sultan !== 'undefined' && Sultan.notif) {
        Sultan.notif.info('Semua PTK telah mengunggah dokumen dan berstatus valid.');
      } else {
        alert('Semua PTK telah mengunggah dokumen.');
      }
      return;
    }

    var fTahun = $('#admptk_dash_filterTahun').val() || '-';
    var fKat = $('#admptk_dash_filterKategori option:selected').text() || 'Administrasi PTK';
    var timeNow = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) + ' ' +
                  new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

    var txt = "*📢 REKAP DOKUMEN ADMINISTRASI PTK*\n";
    txt += "📁 *Jenis Dokumen:* " + fKat.toUpperCase() + "\n";
    txt += "📅 *Tahun:* " + fTahun + "\n";
    txt += "⏱️ *Data per:* " + timeNow + " WIB\n";
    txt += "=========================================\n\n";

    if (belumList.length > 0) {
      txt += "🔴 *BELUM UNGGAH (" + belumList.length + " PTK):*\n";
      belumList.forEach(function (item, i) {
        var nama = (typeof item === 'string') ? item : (item.nama || "-");
        var sek = item.sekolah ? " _(" + item.sekolah + ")_" : "";
        txt += (i + 1) + ". " + nama + sek + "\n";
      });
      txt += "\n";
    }

    if (revisiList.length > 0) {
      txt += "🟡 *PERLU REVISI (" + revisiList.length + " PTK):*\n";
      revisiList.forEach(function (item, i) {
        var nama = (typeof item === 'string') ? item : (item.nama || "-");
        txt += (i + 1) + ". " + nama + "\n";
      });
      txt += "\n";
    }

    if (ditolakList.length > 0) {
      txt += "🔴 *DITOLAK (" + ditolakList.length + " PTK):*\n";
      ditolakList.forEach(function (item, i) {
        var nama = (typeof item === 'string') ? item : (item.nama || "-");
        txt += (i + 1) + ". " + nama + "\n";
      });
      txt += "\n";
    }

    txt += "_Mohon PTK/sekolah terkait dapat menindaklanjuti pada aplikasi SIKS-Reborn._";

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(txt).then(function () {
        if (typeof Sultan !== 'undefined' && Sultan.notif) {
          Sultan.notif.sukses('Daftar berhasil disalin ke clipboard!');
        } else {
          alert('Daftar berhasil disalin ke clipboard!');
        }
      });
    } else {
      var $temp = $("<textarea>");
      $("body").append($temp);
      $temp.val(txt).select();
      document.execCommand("copy");
      $temp.remove();
      if (typeof Sultan !== 'undefined' && Sultan.notif) {
        Sultan.notif.sukses('Daftar berhasil disalin ke clipboard!');
      } else {
        alert('Daftar berhasil disalin ke clipboard!');
      }
    }
  }

  function admptk_dash_esc(text) {
    return text ? String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;") : "";
  }
</script>
