<style>
  /* Adaptif Upload Box & Form Elements */
  body:not(.dark-mode) .upload-box-sultan {
    border: 2px dashed #ced4da;
    background: #ffffff;
  }
  .dark-mode .upload-box-sultan {
    border: 2px dashed rgba(255, 255, 255, 0.2);
    background: rgba(0, 0, 0, 0.2);
  }
  .upload-box-sultan {
    border-radius: 12px;
    padding: 24px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
  }
  body:not(.dark-mode) .upload-box-sultan:hover {
    border-color: var(--warna-maroon);
    background: #fff8f8;
  }
  .dark-mode .upload-box-sultan:hover {
    border-color: var(--sultan-aksi-utama);
    background: rgba(255, 255, 255, 0.05);
  }

  .upload-box-title {
    font-weight: 700;
    margin-bottom: 4px;
    color: #333333;
  }
  .dark-mode .upload-box-title {
    color: var(--dm-text-main, #e1e4e8);
  }

  .preview-image-box {
    max-height: 260px;
    width: 100%;
    object-fit: cover;
    border-radius: 10px;
    box-shadow: var(--shadow-sm);
  }

  /* Custom File Input Adaptive */
  body:not(.dark-mode) .custom-file-label {
    background-color: #ffffff !important;
    color: #495057 !important;
    border: 1px solid #ced4da !important;
    border-radius: 10px !important;
    font-weight: 600 !important;
    font-size: 13px !important;
    padding-top: 0.55rem !important;
  }
  body:not(.dark-mode) .custom-file-label::after {
    background-color: #f1f3f5 !important;
    color: var(--warna-maroon) !important;
    font-weight: 700 !important;
    border-left: 1px solid #ced4da !important;
    border-top-right-radius: 10px !important;
    border-bottom-right-radius: 10px !important;
  }
  .dark-mode .custom-file-label {
    background-color: var(--dm-bg-body) !important;
    color: var(--dm-text-main) !important;
    border: 1px solid var(--dm-border) !important;
    border-radius: 10px !important;
    font-weight: 600 !important;
    font-size: 13px !important;
    padding-top: 0.55rem !important;
  }
  .dark-mode .custom-file-label::after {
    background-color: rgba(255, 255, 255, 0.1) !important;
    color: var(--sultan-aksi-utama) !important;
    font-weight: 700 !important;
    border-left: 1px solid var(--dm-border) !important;
    border-top-right-radius: 10px !important;
    border-bottom-right-radius: 10px !important;
  }
</style>

<section class="content sultan-page-transition">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10">

        <!-- FORM UTAMA (SULTAN CARD THEME) -->
        <div class="card card-sultan shadow-sm">
          <div class="card-body p-4">

          <form id="emading_formTulis" enctype="multipart/form-data">
            <input type="hidden" id="emading_idArtikel" value="">
            <input type="hidden" id="emading_existingFotoUrl" value="">
            <input type="hidden" id="emading_existingLampiranUrl" value="">
            <input type="hidden" id="emading_existingLampiranNama" value="">

            <!-- BARIS 1: JUDUL & KATEGORI -->
            <div class="row">
              <div class="col-md-8 col-12">
                <div class="form-group mb-3">
                  <label class="form-label-sultan">
                    JUDUL BERITA / ARTIKEL <span class="text-danger">*</span>
                  </label>
                  <input type="text" id="emading_inputJudul" class="form-control form-control-sultan" placeholder="Contoh: Upacara Hari Pendidikan & Gelar Karya Siswa SDN..." required>
                </div>
              </div>
              <div class="col-md-4 col-12">
                <div class="form-group mb-3">
                  <label class="form-label-sultan">
                    KATEGORI <span class="text-danger">*</span>
                  </label>
                  <select id="emading_inputKategori" class="form-control form-control-sultan" required>
                    <option value="Pengumuman">Pengumuman</option>
                    <option value="Kegiatan" selected>Kegiatan</option>
                    <option value="Prestasi">Prestasi</option>
                    <option value="Inovasi">Inovasi Pembelajaran</option>
                    <option value="Karya Guru & Siswa">Karya Guru & Siswa</option>
                    <option value="Lainnya">Lainnya</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- BARIS 2: NAMA PENGUNGGAH (FREE TEXT SESUAI PERMINTAAN USER) -->
            <div class="row">
              <div class="col-md-6 col-12">
                <div class="form-group mb-3">
                  <label class="form-label-sultan">
                    NAMA PENGUNGGAH / PENULIS <span class="text-danger">*</span>
                  </label>
                  <input type="text" id="emading_inputPengunggah" class="form-control form-control-sultan" placeholder="Nama pribadi, tim redaksi, atau kelompok belajar..." required>
                  <small class="text-muted"><i class="fas fa-info-circle mr-1"></i>Nama ini yang akan tampil di E-Mading sebagai pembuat berita.</small>
                </div>
              </div>
              <div class="col-md-6 col-12">
                <div class="form-group mb-3">
                  <label class="form-label-sultan">
                    UNIT KERJA / INSTANSI
                  </label>
                  <input type="text" id="emading_inputUnitKerja" class="form-control form-control-sultan" placeholder="Unit kerja pengunggah...">
                </div>
              </div>
            </div>

            <!-- BARIS 3: ISI BERITA -->
            <div class="form-group mb-3">
              <label class="form-label-sultan">
                ISI TULISAN BERITA <span class="text-danger">*</span>
              </label>
              <textarea id="emading_inputIsi" class="form-control form-control-sultan" rows="7" placeholder="Tuliskan berita lengkap, waktu pelaksanaan, ringkasan cerita atau inti informasi di sini..." required></textarea>
            </div>

            <!-- BARIS 4: FOTO UTAMA & EMBED VIDEO -->
            <div class="row">
              <!-- UPLOAD FOTO UTAMA -->
              <div class="col-md-6 col-12 mb-3">
                <label class="form-label-sultan mb-2">
                  <i class="fas fa-camera mr-1 text-maroon"></i> FOTO SAMPUL / DOKUMENTASI
                </label>
                <div class="upload-box-sultan" id="emading_uploadFotoTrigger">
                  <input type="file" id="emading_fileFoto" accept="image/png, image/jpeg, image/jpg" style="display: none;">
                  <div id="emading_fotoPlaceholder">
                    <i class="fas fa-cloud-upload-alt fa-2x text-muted mb-2"></i>
                    <div class="upload-box-title">Klik untuk Memilih Foto</div>
                    <small class="text-muted d-block">Format: JPG, JPEG, PNG (Maks. 2MB)</small>
                  </div>
                  <div id="emading_fotoPreviewWrap" class="d-none">
                    <img id="emading_fotoPreviewImg" src="" class="preview-image-box mb-2" alt="Pratinjau Foto">
                    <div class="d-flex justify-content-center">
                      <button type="button" id="emading_btnHapusFotoPreview" class="btn btn-sm btn-outline-danger rounded-pill px-3">
                        <i class="fas fa-times mr-1"></i> Ganti Foto
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- LINK EMBED VIDEO (YOUTUBE) -->
              <div class="col-md-6 col-12 mb-3">
                <label class="form-label-sultan mb-2">
                  <i class="fab fa-youtube mr-1 text-danger"></i> TAUTAN VIDEO (YOUTUBE)
                </label>
                <input type="url" id="emading_inputVideoUrl" class="form-control form-control-sultan mb-2" placeholder="https://www.youtube.com/watch?v=... atau https://youtu.be/...">
                <small class="text-muted d-block mb-3">
                  <i class="fas fa-info-circle mr-1"></i>Tempel tautan video YouTube agar dapat diputar langsung di halaman mading.
                </small>

                <!-- UNGGAH LAMPIRAN DOKUMEN -->
                <label class="form-label-sultan mb-2">
                  <i class="fas fa-paperclip mr-1 text-maroon"></i> BERKAS LAMPIRAN TAMBAHAN (OPSIONAL)
                </label>
                <div class="custom-file">
                  <input type="file" class="custom-file-input" id="emading_fileLampiran" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip">
                  <label class="custom-file-label text-truncate" id="emading_labelLampiran" for="emading_fileLampiran">Pilih berkas dokumen...</label>
                </div>
                <small class="text-muted d-block mt-1">
                  Untuk dokumen pendukung yang dapat diunduh pembaca (PDF, Office, ZIP maks. 5MB).
                </small>
                <div id="emading_existingLampiranWrap" class="mt-2 small text-info d-none">
                  <i class="fas fa-check-circle mr-1"></i> Sudah ada lampiran: <span id="emading_txtExistingLampiranNama"></span>
                </div>
              </div>
            </div>

            <!-- BARIS 5: TAGS / LABEL -->
            <div class="form-group mb-4">
              <label class="form-label-sultan">
                <i class="fas fa-tags mr-1 text-muted"></i> KATA KUNCI / TAGS (OPSIONAL)
              </label>
              <input type="text" id="emading_inputTags" class="form-control form-control-sultan" placeholder="Contoh: upacara, hardiknas, sdn 1, juara umum (pisahkan dengan koma)">
            </div>

            <!-- TOMBOL AKSI SUBMIT (BERDAMPINGAN DI KANAN SESUAI STANDAR WEB) -->
            <div class="d-flex justify-content-end align-items-center pt-3 border-top" style="gap: 12px;">
              <button type="button" id="emading_btnBatalTulis" class="sultan-btn sultan-btn-aksi-batal px-4">
                <i class="fas fa-times mr-2"></i>BATAL
              </button>
              <button type="submit" id="emading_btnSimpanArtikel" class="sultan-btn sultan-btn-aksi-utama px-4">
                <i class="fas fa-paper-plane mr-2"></i>PUBLIKASIKAN BERITA
              </button>
            </div>

          </form>

        </div>
      </div>
    </div>

  </div>
</section>

<script>
  (function () {
    var FOTO_FILE_DATA = null;
    var LAMPIRAN_FILE_DATA = null;

    $(document).ready(function () {
      initFormHandlers();
      cekModeEdit();
    });

    function initFormHandlers() {
      // Kembali ke feed
      $('#emading_btnKembaliFeed, #emading_btnBatalTulis').on('click', function () {
        loadHalaman('emading');
      });

      // Trigger upload foto
      $('#emading_uploadFotoTrigger').on('click', function (e) {
        if (!$(e.target).closest('#emading_btnHapusFotoPreview').length) {
          $('#emading_fileFoto').trigger('click');
        }
      });

      // Handle file foto change
      $('#emading_fileFoto').on('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;

        if (file.size > 2 * 1024 * 1024) {
          Sultan.notif.alert('warning', 'Ukuran Terlalu Besar', 'Maksimal ukuran foto adalah 2 MB.');
          $(this).val('');
          return;
        }

        var reader = new FileReader();
        reader.onload = function (evt) {
          var base64 = evt.target.result.split(',')[1];
          FOTO_FILE_DATA = {
            name: file.name,
            mimeType: file.type,
            data: base64
          };
          $('#emading_fotoPreviewImg').attr('src', evt.target.result);
          $('#emading_fotoPlaceholder').addClass('d-none');
          $('#emading_fotoPreviewWrap').removeClass('d-none');
        };
        reader.readAsDataURL(file);
      });

      // Hapus foto preview
      $('#emading_btnHapusFotoPreview').on('click', function (e) {
        e.stopPropagation();
        FOTO_FILE_DATA = null;
        $('#emading_fileFoto').val('');
        $('#emading_fotoPreviewImg').attr('src', '');
        $('#emading_fotoPreviewWrap').addClass('d-none');
        $('#emading_fotoPlaceholder').removeClass('d-none');
        $('#emading_existingFotoUrl').val('');
      });

      // Handle lampiran change
      $('#emading_fileLampiran').on('change', function (e) {
        var file = e.target.files[0];
        if (!file) {
          $('#emading_labelLampiran').text('Pilih berkas dokumen...');
          LAMPIRAN_FILE_DATA = null;
          return;
        }

        if (file.size > 5 * 1024 * 1024) {
          Sultan.notif.alert('warning', 'Berkas Terlalu Besar', 'Maksimal ukuran lampiran adalah 5 MB.');
          $(this).val('');
          $('#emading_labelLampiran').text('Pilih berkas dokumen...');
          return;
        }

        $('#emading_labelLampiran').text(file.name);

        var reader = new FileReader();
        reader.onload = function (evt) {
          var base64 = evt.target.result.split(',')[1];
          LAMPIRAN_FILE_DATA = {
            name: file.name,
            mimeType: file.type || 'application/octet-stream',
            data: base64
          };
        };
        reader.readAsDataURL(file);
      });

      // Autofill nama pengunggah & unit kerja dari data session login
      var uLogin = (typeof userLogin !== 'undefined' && userLogin) ? userLogin : null;
      if (uLogin) {
        var namaAsli = uLogin.nama || uLogin.nama_pegawai || uLogin.username || '';
        var unitAsli = uLogin.unit_kerja || uLogin.sekolah || '';
        if (!$('#emading_inputPengunggah').val()) {
          $('#emading_inputPengunggah').val(namaAsli);
        }
        if (!$('#emading_inputUnitKerja').val()) {
          $('#emading_inputUnitKerja').val(unitAsli);
        }
      }

      // Submit Form
      $('#emading_formTulis').on('submit', function (e) {
        e.preventDefault();
        simpanArtikel();
      });
    }

    /**
     * Cek apakah user datang dari klik "Edit" di modal baca
     */
    function cekModeEdit() {
      if (window.EDIT_ARTIKEL_MADING) {
        var art = window.EDIT_ARTIKEL_MADING;
        window.EDIT_ARTIKEL_MADING = null; // reset

        $('#emading_formPageTitle').text('Edit Berita E-Mading');
        $('#emading_btnSimpanArtikel').html('<i class="fas fa-save mr-2"></i>SIMPAN PERUBAHAN');

        $('#emading_idArtikel').val(art.id);
        $('#emading_inputJudul').val(art.judul);
        $('#emading_inputKategori').val(art.kategori || 'Kegiatan');
        $('#emading_inputPengunggah').val(art.pengunggah);
        $('#emading_inputUnitKerja').val(art.unitKerja || '');
        $('#emading_inputIsi').val(art.isi);
        $('#emading_inputVideoUrl').val(art.videoUrl || '');
        $('#emading_inputTags').val(art.tags || '');

        if (art.fotoUrl) {
          $('#emading_existingFotoUrl').val(art.fotoUrl);
          $('#emading_fotoPreviewImg').attr('src', art.fotoUrl);
          $('#emading_fotoPlaceholder').addClass('d-none');
          $('#emading_fotoPreviewWrap').removeClass('d-none');
        }

        if (art.lampiranUrl) {
          $('#emading_existingLampiranUrl').val(art.lampiranUrl);
          $('#emading_existingLampiranNama').val(art.lampiranNama || 'Dokumen Lampiran');
          $('#emading_txtExistingLampiranNama').text(art.lampiranNama || 'Dokumen');
          $('#emading_existingLampiranWrap').removeClass('d-none');
        }
      }
    }

    /**
     * Kirim data artikel ke Google Apps Script
     */
    function simpanArtikel() {
      var judul = $('#emading_inputJudul').val().trim();
      var kategori = $('#emading_inputKategori').val().trim();
      var pengunggah = $('#emading_inputPengunggah').val().trim();
      var unitKerja = $('#emading_inputUnitKerja').val().trim();
      var isi = $('#emading_inputIsi').val().trim();
      var videoUrl = $('#emading_inputVideoUrl').val().trim();
      var tags = $('#emading_inputTags').val().trim();
      var idArtikel = $('#emading_idArtikel').val().trim();

      var uLogin = (typeof userLogin !== 'undefined' && userLogin) ? userLogin : null;
      var curUser = uLogin ? (uLogin.username || uLogin.user) : 'anonim';
      var curRole = uLogin ? (uLogin.role || '').toLowerCase() : '';

      var payload = {
        id: idArtikel,
        judul: judul,
        kategori: kategori,
        pengunggah: pengunggah,
        unitKerja: unitKerja,
        isi: isi,
        videoUrl: videoUrl,
        tags: tags,
        userLogin: curUser,
        userRole: curRole,
        existingFotoUrl: $('#emading_existingFotoUrl').val(),
        existingLampiranUrl: $('#emading_existingLampiranUrl').val(),
        existingLampiranNama: $('#emading_existingLampiranNama').val(),
        fotoFile: FOTO_FILE_DATA,
        lampiranFile: LAMPIRAN_FILE_DATA
      };

      Sultan.notif.loading("Memproses dan mempublikasikan berita...");
      $('#emading_btnSimpanArtikel').prop('disabled', true);

      google.script.run
        .withSuccessHandler(function (res) {
          Sultan.notif.tutup();
          $('#emading_btnSimpanArtikel').prop('disabled', false);
          try {
            var data = (typeof res === 'string') ? JSON.parse(res) : res;
            if (data.success) {
              Sultan.notif.alert('success', 'Berhasil Dipublikasikan', data.message || 'Berita telah aktif di E-Mading!');
              setTimeout(function () {
                loadHalaman('emading');
              }, 1200);
            } else {
              Sultan.notif.alert('error', 'Gagal Menyimpan', data.error || 'Terjadi kesalahan sistem.');
            }
          } catch (e) {
            loadHalaman('emading');
          }
        })
        .withFailureHandler(function (err) {
          Sultan.notif.tutup();
          $('#emading_btnSimpanArtikel').prop('disabled', false);
          Sultan.notif.alert('error', 'Error Server', err.message || err);
        })
        .simpanArtikelEmading(payload);
    }

  })();
</script>
