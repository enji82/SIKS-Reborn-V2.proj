<section class="content">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12">

        <!-- FILTER BAR -->

            <div id="kombelmaster_tableState" style="display:none;">
              <table id="kombelmaster_tabelUtama"

                  <tr>
                    <th class="text-left align-middle col-sticky-left" style="width:10%;">

                      <span class="sultan-th-title">FORMAT</span>
                    </th>

                      <span class="sultan-th-title">PERIODE</span>
                    </th>
                    <th class="text-center align-middle text-nowrap" style="width:7%;">
                      <span class="sultan-th-title">STATUS</span>
                    </th>

</section>

<!-- TEMPLATE MODAL -->
<div id="kombelmaster_templates" style="display:none;">

  <!-- Modal Tambah/Edit Master Kategori -->
  <form id="kombelmaster_formInputUtama" novalidate>
    <div class="modal-body modal-body-sultan p-4">
      <input type="hidden" id="kombelmaster_modeEdit">
      <input type="hidden" id="kombelmaster_originalId">

      <div class="row">
        <!-- ID Dokumen -->
        <div class="col-md-4 mb-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            ID Dokumen <span class="text-danger">*</span>
          </label>
          <input type="text" id="kombelmaster_in_id" class="form-control form-control-sultan border-maroon font-weight-bold text-uppercase"
                 placeholder="Contoh: KOMBEL-RPP-SD" required maxlength="30"
                 title="ID unik, tanpa spasi, huruf kapital">
          <small class="text-muted">Kode unik dokumen (tanpa spasi)</small>
        </div>
        <!-- Nama Dokumen -->
        <div class="col-md-8 mb-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            Nama Dokumen <span class="text-danger">*</span>
          </label>
          <input type="text" id="kombelmaster_in_nama" class="form-control form-control-sultan border-maroon"
                 placeholder="Nama Lengkap Dokumen" required maxlength="120">
        </div>
      </div>

      <div class="row">
        <!-- Jenjang -->
        <div class="col-md-4 mb-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            Jenjang <span class="text-danger">*</span>
          </label>
          <select id="kombelmaster_in_jenjang" class="form-control form-control-sultan border-maroon" required>
            <option value="">- Pilih Jenjang -</option>
            <option value="SEMUA">Semua Jenjang</option>
            <option value="PAUD">PAUD</option>
            <option value="SD">SD</option>
          </select>
        </div>
        <!-- Kelas / Mapel -->
        <div class="col-md-4 mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">

              Kelas / Mapel <span class="text-danger">*</span>
            </label>
            <button type="button" id="kombelmaster_btnTambahKkgKustom" class="btn btn-xs btn-outline-primary rounded-pill px-2 py-0" style="font-size:10px;" title="Tambah Kelas/Mapel Baru">

            <button class="btn btn-block form-control-sultan border-maroon text-left d-flex justify-content-between align-items-center dropdown-toggle bg-white" type="button" id="kombelmaster_btnMultiKkg" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" style="height: auto; min-height: 38px;">
              <span id="kombelmaster_lblSelectedKkg" class="text-truncate font-weight-bold text-dark">Pilih Kelas / Mapel</span>

            <div class="dropdown-menu p-3 shadow-lg w-100 border-maroon" aria-labelledby="kombelmaster_btnMultiKkg" style="max-height: 250px; overflow-y: auto;">
              <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
                <div class="custom-control custom-checkbox small">
                  <input type="checkbox" class="custom-control-input" id="kombelmaster_chkSelectAllKkg">
                  <label class="custom-control-label font-weight-bold text-primary cursor-pointer" for="kombelmaster_chkSelectAllKkg">Pilih Semua</label>
                </div>
                <span class="small text-muted font-weight-bold" id="kombelmaster_cntSelectedKkg">0 Dipilih</span>
              </div>
              <div id="kombelmaster_kkgCheckboxList" class="d-flex flex-column" style="gap:6px;">
                <!-- Diisi via JS -->
              </div>
            </div>
          </div>
        </div>
        <!-- Format File -->
        <div class="col-md-4 mb-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            Format File <span class="text-danger">*</span>
          </label>
          <select id="kombelmaster_in_format" class="form-control form-control-sultan border-maroon" required>
            <option value="">- Pilih Format -</option>
            <option value="PDF">PDF</option>
            <option value="IMG">Gambar (JPG/PNG)</option>
            <option value="ALL">PDF / Gambar</option>
            <option value="EXCEL">Excel</option>
          </select>
        </div>
      </div>

      <div class="row">
        <!-- Ukuran Maksimal -->
        <div class="col-md-4 mb-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            Ukuran Maksimal (MB) <span class="text-danger">*</span>
          </label>
          <select id="kombelmaster_in_ukuran" class="form-control form-control-sultan border-maroon" required>
            <option value="1">1 MB</option>
            <option value="2" selected>2 MB</option>
            <option value="5">5 MB</option>
            <option value="10">10 MB</option>
            <option value="25">25 MB</option>
            <option value="50">50 MB</option>
          </select>
        </div>
        <!-- Jenis Periode -->
        <div class="col-md-4 mb-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            Jenis Periode <span class="text-danger">*</span>
          </label>
          <select id="kombelmaster_in_jenis_periode" class="form-control form-control-sultan border-maroon" required>
            <option value="">- Pilih Jenis -</option>

            <option value="TAHUNAN_KALENDER">Tahunan (Kalender)</option>
            <option value="SEMESTER_TAPEL">Semesteran (Tapel)</option>
            <option value="SEMESTER_KALENDER">Semesteran (Kalender)</option>
            <option value="TRIWULAN">Triwulanan</option>
            <option value="PERIODE">Bulanan/Rentang Periode</option>
            <option value="TMT">TMT (Berlaku Mulai Tanggal)</option>
            <option value="PERMANEN">Permanen (1 Kali)</option>
          </select>
        </div>
        <!-- Status Aktif -->
        <div class="col-md-4 mb-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            Status Aktif <span class="text-danger">*</span>
          </label>
          <select id="kombelmaster_in_status" class="form-control form-control-sultan border-maroon" required>
            <option value="Aktif" selected>Aktif</option>
            <option value="Nonaktif">Nonaktif</option>
          </select>

      <div class="row">
        <!-- Keterangan -->
        <div class="col-md-8 mb-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            Keterangan
          </label>
          <textarea id="kombelmaster_in_keterangan" class="form-control form-control-sultan border-maroon"
                    rows="2" placeholder="Penjelasan singkat tentang dokumen..." maxlength="500"></textarea>
        </div>
        <!-- Integrasi Dashboard -->
        <div class="col-md-4 mb-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            Integrasi Dashboard <span class="text-danger">*</span>
          </label>
          <select id="kombelmaster_in_integrasi" class="form-control form-control-sultan border-maroon" required>
            <option value="TRUE">Ya — Tampil di Dashboard</option>
            <option value="FALSE">Tidak — Hanya Arsip</option>

      <button type="button" class="modal-btn-batal" data-dismiss="modal">
        <i class="fas fa-times mr-2"></i>BATAL
      </button>
      <button type="submit" id="kombelmaster_btnSimpan" class="modal-btn-simpan">
        <i class="fas fa-save mr-2"></i>SIMPAN
      </button>

</div>

<script>
/* ================================================================
   MASTER KATEGORI KOMUNITAS BELAJAR — JAVASCRIPT
   (Mengikuti pola identik page_adm_sekolah_master)
   ================================================================ */

var KOMBELMASTER_CACHE_DATA = [];
var KOMBELMASTER_TABEL_INSTANCE = null;
var KOMBELMASTER_SEARCH_TIMEOUT = null;

var KOMBEL_JENIS_PERIODE_LABELS = {
  "TAHUNAN_TAPEL"     : "Tahunan (Tapel)",
  "TAHUNAN_KALENDER"  : "Tahunan (Kalender)",
  "SEMESTER_TAPEL"    : "Semester (Tapel)",
  "SEMESTER_KALENDER" : "Semester (Kalender)",
  "TRIWULAN"          : "Triwulanan",
  "PERIODE"           : "Bulanan / Rentang",
  "TMT"               : "TMT",
  "PERMANEN"          : "Permanen (1×)"
};

var KOMBELMASTER_DAFTAR_KELAS_MAPEL = [
  "KKG Kelas 1", "KKG Kelas 2", "KKG Kelas 3",
  "KKG Kelas 4", "KKG Kelas 5", "KKG Kelas 6",
  "KKG PJOK", "KKG PAI"
];

$(document).ready(function() {
  $('#kombelmaster_tableState').hide();
  SultanUI.showLoading('#kombelmaster_loadingState');
  kombelmaster_renderFilterBar();
  kombelmaster_tarikDataServer();

  $(document).off('click','#kombelmaster_btnRefresh').on('click','#kombelmaster_btnRefresh', kombelmaster_tarikDataServer);
  $(document).off('click','#kombelmaster_btnTambah').on('click','#kombelmaster_btnTambah', kombelmaster_bukaModalTambah);
  $(document).off('submit','#kombelmaster_formInputUtama').on('submit','#kombelmaster_formInputUtama', kombelmaster_submitForm);

  $(document).off('click','.kombelmaster-btn-edit').on('click','.kombelmaster-btn-edit', function() {
    var id = $(this).attr('data-id'); var d = KOMBELMASTER_CACHE_DATA.find(function(x){ return String(x.idKat)===String(id); });
    if (d) kombelmaster_bukaModalEdit(d);
  });
  $(document).off('click','.kombelmaster-btn-hapus').on('click','.kombelmaster-btn-hapus', function() {
    kombelmaster_konfirmasiHapus($(this).attr('data-id'), $(this).attr('data-nama'));
  });

  $(document).off('change','#kombelmaster_filterJenjang, #kombelmaster_filterStatus, #kombelmaster_filterIntegrasi').on('change','#kombelmaster_filterJenjang, #kombelmaster_filterStatus, #kombelmaster_filterIntegrasi', kombelmaster_terapkanFilterLokal);

  $(document).off('input','#kombelmaster_in_id').on('input','#kombelmaster_in_id', function() {
    var v = $(this).val().toUpperCase().replace(/[^A-Z0-9\-_]/g, '');
    $(this).val(v);
  });

  // Listener Multi-Select Checkbox & Tambah Kustom
  $(document).off('change','.kombelmaster-chk-kkg').on('change','.kombelmaster-chk-kkg', kombelmaster_updateSelectedKkgLabel);
  $(document).off('change','#kombelmaster_chkSelectAllKkg').on('change','#kombelmaster_chkSelectAllKkg', function() {
    var isChecked = $(this).is(':checked');
    $('.kombelmaster-chk-kkg').prop('checked', isChecked);
    kombelmaster_updateSelectedKkgLabel();
  });
  $(document).off('click','#kombelmaster_btnTambahKkgKustom').on('click','#kombelmaster_btnTambahKkgKustom', kombelmaster_tambahKkgKustom);
  
  // Cegah dropdown tertutup saat mengkliknya
  $(document).off('click','#kombelmaster_kkgMultiDropdown .dropdown-menu').on('click','#kombelmaster_kkgMultiDropdown .dropdown-menu', function(e) {
    e.stopPropagation();
  });
});

function kombelmaster_renderFilterBar() {
  var filtersConfig = [
    { id: 'kombelmaster_filterJenjang', placeholder: 'Semua Jenjang', options: [
      { value: 'SEMUA', text: 'Semua Jenjang' }, { value: 'PAUD', text: 'PAUD' }, { value: 'SD', text: 'SD' }
    ]},
    { id: 'kombelmaster_filterStatus', placeholder: 'Semua Status', options: [
      { value: 'SEMUA', text: 'Semua Status' }, { value: 'aktif', text: 'Aktif' }, { value: 'nonaktif', text: 'Nonaktif' }
    ]},
    { id: 'kombelmaster_filterIntegrasi', placeholder: 'Semua Integrasi', options: [
      { value: 'SEMUA', text: 'Semua' }, { value: 'TRUE', text: 'Terintegrasi Dashboard' }, { value: 'FALSE', text: 'Hanya Arsip' }
    ]}
  ];
  var extraButtons = '<div class="divider-vertical d-none d-md-block mx-2"></div><button type="button" id="kombelmaster_btnRefresh" class="sultan-btn-refresh" title="Segarkan Data"><i class="fas fa-sync-alt"></i></button><div class="ml-auto d-none d-md-block"></div><button type="button" id="kombelmaster_btnTambah" class="sultan-btn-tambah"><i class="fas fa-plus"></i> TAMBAH</button>';

  if (typeof SultanUI !== 'undefined') {
    var html = SultanUI.renderFilterBar(filtersConfig, extraButtons);
    $('#kombelmaster_filterBarArea').html(html);
  }
}

function kombelmaster_renderKkgCheckboxList(selectedArray) {
  selectedArray = selectedArray || [];
  // Ekstrak KKG kustom jika ada di selectedArray yang belum masuk di master list
  selectedArray.forEach(function(item) {
    var trimmed = String(item).trim();
    if (trimmed && !KOMBELMASTER_DAFTAR_KELAS_MAPEL.includes(trimmed)) {
      KOMBELMASTER_DAFTAR_KELAS_MAPEL.push(trimmed);
    }
  });

  var html = '';
  KOMBELMASTER_DAFTAR_KELAS_MAPEL.forEach(function(item, idx) {
    var isChecked = selectedArray.includes(item) ? 'checked' : '';
    html += `
      <div class="custom-control custom-checkbox small">
        <input type="checkbox" class="custom-control-input kombelmaster-chk-kkg" id="kombelmaster_chk_kkg_${idx}" value="${kombelmaster_esc(item)}" ${isChecked}>
        <label class="custom-control-label font-weight-bold text-dark cursor-pointer" for="kombelmaster_chk_kkg_${idx}">${kombelmaster_esc(item)}</label>
      </div>
    `;
  });
  $('#kombelmaster_kkgCheckboxList').html(html);
  kombelmaster_updateSelectedKkgLabel();
}

function kombelmaster_updateSelectedKkgLabel() {
  var selected = [];
  $('.kombelmaster-chk-kkg:checked').each(function() {
    selected.push($(this).val());
  });
  var totalAll = $('.kombelmaster-chk-kkg').length;
  $('#kombelmaster_chkSelectAllKkg').prop('checked', selected.length > 0 && selected.length === totalAll);
  $('#kombelmaster_cntSelectedKkg').text(selected.length + ' Dipilih');

  if (selected.length === 0) {
    $('#kombelmaster_lblSelectedKkg').text('Pilih Kelas / Mapel').addClass('text-muted').removeClass('text-dark');
  } else {
    $('#kombelmaster_lblSelectedKkg').text(selected.join(', ')).removeClass('text-muted').addClass('text-dark');
  }
}

function kombelmaster_getSelectedKkgValues() {
  var selected = [];
  $('.kombelmaster-chk-kkg:checked').each(function() {
    selected.push($(this).val());
  });
  return selected.join(', ');
}

function kombelmaster_tambahKkgKustom() {
  var namaKkg = prompt("Masukkan nama Kelas / Mapel baru (contoh: KKG Bahasa Inggris / KKG Seni Budaya):");
  if (namaKkg && namaKkg.trim() !== "") {
    var val = namaKkg.trim();
    if (!KOMBELMASTER_DAFTAR_KELAS_MAPEL.includes(val)) {
      KOMBELMASTER_DAFTAR_KELAS_MAPEL.push(val);
    }
    var currentSelected = [];
    $('.kombelmaster-chk-kkg:checked').each(function() { currentSelected.push($(this).val()); });
    if (!currentSelected.includes(val)) currentSelected.push(val);
    kombelmaster_renderKkgCheckboxList(currentSelected);
  }
}

function kombelmaster_tarikDataServer() {
  var btn = $('#kombelmaster_btnRefresh');
  btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin text-maroon"></i>');
  if (!$.fn.DataTable.isDataTable('#kombelmaster_tabelUtama')) {
    $('#kombelmaster_tableState').hide(); SultanUI.showLoading('#kombelmaster_loadingState', "Memuat Data Master Kategori Komunitas Belajar...");
  }

  google.script.run.withSuccessHandler(function(json) {
    btn.prop('disabled', false).html('<i class="fas fa-sync-alt text-maroon"></i>');
    var res = JSON.parse(json);
    if (!res.success) {
      $('#kombelmaster_loadingState').html('<div class="text-center text-danger py-5"><i class="fas fa-exclamation-triangle fa-3x mb-3"></i><br>' + kombelmaster_esc(res.message) + '</div>');
      return;
    }
    KOMBELMASTER_CACHE_DATA = res.kategori || [];
    
    // Kumpulkan KKG unik yang ada di database cache
    KOMBELMASTER_CACHE_DATA.forEach(function(d) {
      if (d.kelas) {
        var parts = d.kelas.split(',');
        parts.forEach(function(p) {
          var trimmed = p.trim();
          if (trimmed && trimmed !== "Semua KKG" && trimmed !== "Umum" && !KOMBELMASTER_DAFTAR_KELAS_MAPEL.includes(trimmed)) {
            KOMBELMASTER_DAFTAR_KELAS_MAPEL.push(trimmed);
          }
        });
      }
    });

    if (!$.fn.DataTable.isDataTable('#kombelmaster_tabelUtama')) kombelmaster_initTable();
    kombelmaster_terapkanFilterLokal();
    SultanUI.hideLoading('#kombelmaster_loadingState');
    $('#kombelmaster_tableState').show();
    if (KOMBELMASTER_TABEL_INSTANCE) setTimeout(function(){ KOMBELMASTER_TABEL_INSTANCE.columns.adjust(); }, 150);
  }).withFailureHandler(function(err) {
    btn.prop('disabled', false).html('<i class="fas fa-sync-alt text-maroon"></i>');
    $('#kombelmaster_loadingState').html('<div class="text-center text-danger py-5"><i class="fas fa-wifi fa-3x mb-3"></i><br>Koneksi Terputus: ' + kombelmaster_esc(err.message) + '</div>');
  }).getKombelMasterData("");
}

function kombelmaster_initTable() {
  KOMBELMASTER_TABEL_INSTANCE = SultanTable.init('#kombelmaster_tabelUtama', {
    destroy: true, ordering: false, pageLength: 25, autoWidth: false,
    dom: "<'row mb-2'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>>" +
         "<'row'<'col-sm-12'<'table-responsive sultan-scroll'tr>>>" +
         "<'row mt-2'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>",
    columnDefs: [
      { targets: 0, width: "10%", className: "text-left align-middle col-sticky-left text-nowrap" },
      { targets: 1, width: "22%", className: "text-left align-middle text-wrap" },
      { targets: [2,3,4,5,6,7], className: "text-center align-middle text-nowrap" },
      { targets: 8, width: "24%", className: "text-center align-middle text-nowrap" }
    ],
    language: { emptyTable: "Belum ada Master Kategori yang sesuai filter." }
  });
}

function kombelmaster_terapkanFilterLokal() {
  if (!KOMBELMASTER_TABEL_INSTANCE) return;
  var fJ = String($('#kombelmaster_filterJenjang').val()||"SEMUA").trim().toUpperCase();
  var fS = String($('#kombelmaster_filterStatus').val()||"SEMUA").trim().toLowerCase();
  var fI = String($('#kombelmaster_filterIntegrasi').val()||"SEMUA").trim().toUpperCase();

  var hasil = KOMBELMASTER_CACHE_DATA.filter(function(d) {
    var dJ = String(d.jenjang||"").trim().toUpperCase();
    var dS = String(d.status||"").trim().toLowerCase();
    var dI = String(d.integrasiDashboard||"TRUE").trim().toUpperCase();
    if (fJ !== "SEMUA" && dJ !== fJ && fJ !== "SEMUA") return false;
    if (fS !== "semua" && dS !== fS) return false;
    if (fI !== "SEMUA" && dI !== fI) return false;
    return true;
  });

  kombelmaster_renderTabel(hasil);
}

function kombelmaster_renderTabel(data) {
  var dtArr = [];
  data.forEach(function(d) {
    var bSts = d.isAktif
      ? '<span class="badge badge-sultan-disetujui font-weight-bold" style="font-size:11px;"><i class="fas fa-check mr-1"></i>Aktif</span>'
      : '<span class="badge badge-sultan-ditolak font-weight-bold" style="font-size:11px;"><i class="fas fa-times mr-1"></i>Nonaktif</span>';

    var iD = String(d.integrasiDashboard||"TRUE").toUpperCase();
    var bInteg = (iD !== "FALSE")
      ? '<span class="badge badge-sultan-disetujui font-weight-bold" style="font-size:11px;"><i class="fas fa-chart-bar mr-1"></i>Ya</span>'
      : '<span class="badge badge-secondary font-weight-bold" style="font-size:11px;"><i class="fas fa-archive mr-1"></i>Tidak</span>';

    var fmtLabel = { PDF:'PDF', IMG:'IMG (JPG/PNG)', ALL:'PDF/IMG', EXCEL:'Excel', BEBAS:'Bebas' };
    var fmt = String(d.format||"PDF").toUpperCase(); var fmtText = fmtLabel[fmt] || fmt;

    var jPeriodeLbl = KOMBEL_JENIS_PERIODE_LABELS[String(d.jenisPeriode||"").toUpperCase()] || String(d.jenisPeriode||"-");
    
    // Tampilkan list Kelas/Mapel dengan badge cantik
    var rawKelas = d.kelas || "Semua KKG";
    var kelasArr = rawKelas.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    var kelasBadge = '';
    if (kelasArr.length <= 2) {
      kelasArr.forEach(function(k){ kelasBadge += '<span class="badge badge-dark font-weight-bold mr-1" style="font-size:10.5px;">'+kombelmaster_esc(k)+'</span>'; });
    } else {
      kelasBadge = '<span class="badge badge-dark font-weight-bold" style="font-size:10.5px;" title="'+kombelmaster_esc(rawKelas)+'">'+kelasArr.length+' Kelas/Mapel Terpilih</span>';
    }

    var keterHtml = (d.keterangan && d.keterangan.trim() !== "")
      ? '<br><small class="text-muted font-italic" title="'+kombelmaster_esc(d.keterangan)+'" style="font-size:10px;"><i class="fas fa-info-circle mr-1"></i>' + kombelmaster_esc(String(d.keterangan).length > 60 ? String(d.keterangan).substring(0,60)+'...' : d.keterangan) + '</small>'
      : '';

    var btnEdit = '<button type="button" class="sultan-btn-aksi sultan-btn-aksi-warning kombelmaster-btn-edit" data-id="'+kombelmaster_esc(d.idKat)+'" title="Edit"><i class="fas fa-edit"></i></button>';
    var btnHapus = '<button type="button" class="sultan-btn-aksi sultan-btn-aksi-danger kombelmaster-btn-hapus" data-id="'+kombelmaster_esc(d.idKat)+'" data-nama="'+kombelmaster_esc(d.namaKat)+'" title="Hapus"><i class="fas fa-trash-alt"></i></button>';
    var aksi = '<div class="d-flex flex-nowrap justify-content-center" style="gap:4px;">'+btnEdit+btnHapus+'</div>';

    dtArr.push([
      '<span class="badge badge-dark font-weight-bold font-monospace" style="font-size:11px;letter-spacing:0.5px;">'+kombelmaster_esc(d.idKat)+'</span>',
      '<div class="font-weight-bold text-wrap" style="font-size:12px;">'+kombelmaster_esc(d.namaKat)+keterHtml+'</div>',
      '<span class="badge badge-secondary font-weight-bold" style="font-size:11px;">'+kombelmaster_esc(d.jenjang||"SEMUA")+'</span>',
      kelasBadge,
      '<span class="badge badge-info font-weight-bold" style="font-size:11px;">'+kombelmaster_esc(fmtText)+'</span>',
      '<span class="font-weight-bold" style="font-size:11px;">'+kombelmaster_esc(jPeriodeLbl)+'</span>',
      bSts, bInteg, aksi
    ]);
  });
  KOMBELMASTER_TABEL_INSTANCE.clear().rows.add(dtArr).draw(false);
}

function kombelmaster_bukaModalTambah() {
  var $form = $('#kombelmaster_formInputUtama'); $form[0].reset(); $form.removeClass('was-validated');
  $('#kombelmaster_modeEdit').val('');
  $('#kombelmaster_originalId').val('');
  $('#kombelmaster_in_id').prop('disabled', false).val('');
  $('#kombelmaster_in_nama').val('');
  $('#kombelmaster_in_jenjang').val('');
  kombelmaster_renderKkgCheckboxList(KOMBELMASTER_DAFTAR_KELAS_MAPEL);
  $('#kombelmaster_in_format').val('');
  $('#kombelmaster_in_ukuran').val('2');
  $('#kombelmaster_in_jenis_periode').val('');
  $('#kombelmaster_in_keterangan').val('');
  $('#kombelmaster_in_status').val('Aktif');
  $('#kombelmaster_in_integrasi').val('TRUE');

  kombelmaster_bukaModal('tambah', 'Tambah Master Kategori Kombel');
}

function kombelmaster_bukaModalEdit(d) {
  var $form = $('#kombelmaster_formInputUtama'); $form[0].reset(); $form.removeClass('was-validated');
  $('#kombelmaster_modeEdit').val('edit');
  $('#kombelmaster_originalId').val(d.idKat);
  $('#kombelmaster_in_id').prop('disabled', true).val(d.idKat);
  $('#kombelmaster_in_nama').val(d.namaKat);
  $('#kombelmaster_in_jenjang').val(d.jenjang||"");
  
  var selectedKkgArr = (d.kelas || "").split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  kombelmaster_renderKkgCheckboxList(selectedKkgArr);

  $('#kombelmaster_in_format').val(d.format||"PDF");
  $('#kombelmaster_in_ukuran').val(d.ukuran||"2");
  $('#kombelmaster_in_jenis_periode').val(d.jenisPeriode||"");
  $('#kombelmaster_in_keterangan').val(d.keterangan||"");
  $('#kombelmaster_in_status').val(d.status||"Aktif");
  var integVal = (String(d.integrasiDashboard||"TRUE").toUpperCase() !== "FALSE") ? "TRUE" : "FALSE";
  $('#kombelmaster_in_integrasi').val(integVal);

  kombelmaster_bukaModal('edit', 'Edit Master Kategori Kombel');
}

function kombelmaster_bukaModal(tipe, judul) {
  var isEdit = (tipe === 'edit');
  $('#global_modalFormSize').removeClass('modal-xl modal-lg').addClass('modal-lg');
  $('#global_modalFormHeader').removeClass('modal-header-sultan-primary modal-header-sultan-warning modal-header-sultan-danger modal-header-sultan-success modal-header-sultan-info modal-header-sultan-dark modal-header-edit modal-header-tambah-edit modal-header-hapus').addClass(isEdit ? 'modal-header-sultan-warning' : 'modal-header-tambah-edit');
  $('#global_modalFormTitle').html('<i class="fas fa-'+(isEdit?'edit':'plus')+' mr-2"></i>'+kombelmaster_esc(judul));
  $('#global_modalFormBody, #global_modalFormFooter').hide();
  $('#kombelmaster_formInputUtama').appendTo('#global_modalFormSize .modal-content');
  $('#global_modalForm').off('hidden.bs.modal.kombelmaster').on('hidden.bs.modal.kombelmaster', function() {
    $('#kombelmaster_formInputUtama').appendTo('#kombelmaster_templates');
    $('#global_modalFormBody, #global_modalFormFooter').show();
  });
  $('#global_modalForm').modal('show');
}

function kombelmaster_submitForm(e) {
  e.preventDefault();
  var $form = $('#kombelmaster_formInputUtama');
  if (!$form[0].checkValidity()) { $form.addClass('was-validated'); return; }

  var selectedKkgVal = kombelmaster_getSelectedKkgValues();
  if (!selectedKkgVal) { Sultan.alert('warning','Perhatian','Pilih minimal 1 Kelas / Mapel.'); return; }

  var modeEdit = $('#kombelmaster_modeEdit').val() === 'edit';
  var idKat = modeEdit ? $('#kombelmaster_originalId').val() : $('#kombelmaster_in_id').val().trim().toUpperCase();
  if (!idKat) { Sultan.alert('warning','Perhatian','ID Dokumen tidak boleh kosong.'); return; }

  if (!modeEdit) {
    var cek = KOMBELMASTER_CACHE_DATA.find(function(x){ return String(x.idKat).trim().toUpperCase() === idKat.toUpperCase(); });
    if (cek) { Sultan.alert('warning','ID Duplikat','ID Dokumen "' + idKat + '" sudah terdaftar. Gunakan ID berbeda.'); return; }
  }

  var payload = {
    idKat      : idKat,
    namaKat    : $('#kombelmaster_in_nama').val().trim(),
    jenjang    : $('#kombelmaster_in_jenjang').val() || "SEMUA",
    kelas      : selectedKkgVal,
    format     : $('#kombelmaster_in_format').val() || "PDF",
    ukuran     : $('#kombelmaster_in_ukuran').val() || "2",
    jenisPeriode: $('#kombelmaster_in_jenis_periode').val() || "TAHUNAN_TAPEL",
    keterangan : $('#kombelmaster_in_keterangan').val().trim(),
    status     : $('#kombelmaster_in_status').val() || "Aktif",
    integrasi  : $('#kombelmaster_in_integrasi').val() || "TRUE"
  };

  var btn = $('#kombelmaster_btnSimpan'); var btnTxt = btn.html();
  btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-2"></i>MENYIMPAN...');
  Sultan.notif.loading("Menyimpan data...");

  google.script.run.withSuccessHandler(function(json) {
    Sultan.notif.tutup(); btn.prop('disabled',false).html(btnTxt);
    var res = JSON.parse(json);
    if (res.success) {
      if (typeof Sultan !== 'undefined' && Sultan.modal) Sultan.modal.tutupForm();
      else $('#global_modalForm').modal('hide');
      Sultan.notif.crud.simpan(modeEdit);
      setTimeout(kombelmaster_tarikDataServer, 400);
    } else { Sultan.notif.crud.gagal(res.message); }
  }).withFailureHandler(function(err) {
    Sultan.notif.tutup(); btn.prop('disabled',false).html(btnTxt); Sultan.notif.crud.gagal(err.message);
  }).simpanKombelMaster(payload);
}

function kombelmaster_konfirmasiHapus(idKat, namaKat) {
  if (typeof Sultan !== 'undefined' && Sultan.modal && Sultan.modal.konfirmasiHapus) {
    Sultan.modal.konfirmasiHapus({
      title: 'HAPUS MASTER KATEGORI KOMBEL',
      kode: idKat,
      detail: { 'ID Dokumen': idKat, 'Nama Dokumen': namaKat },
      onConfirm: function() {
        Sultan.notif.loading("Menghapus kategori...");
        google.script.run.withSuccessHandler(function(json) {
          Sultan.notif.tutup(); var res = JSON.parse(json);
          if (res.success) { Sultan.notif.crud.hapus(); kombelmaster_tarikDataServer(); }
          else Sultan.notif.crud.gagal(res.message);
        }).withFailureHandler(function(err) { Sultan.notif.tutup(); Sultan.notif.crud.gagal(err.message); })
        .hapusKombelMaster(idKat);
      }
    });
  } else {
    if (confirm('Hapus kategori "' + namaKat + '"?')) {
      google.script.run.withSuccessHandler(function(json) {
        var res = JSON.parse(json);
        if (res.success) { kombelmaster_tarikDataServer(); } else { alert(res.message); }
      }).hapusKombelMaster(idKat);
    }
  }
}

function kombelmaster_esc(t) {
  return t ? String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;') : '';
}
</script>
