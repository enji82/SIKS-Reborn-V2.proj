<style>
  /* ==========================================================================
     NEWSPAPER (KORAN DIGITAL) EDITORIAL THEME - 2 KOLOM GRID
     ========================================================================== */
  .koran-container {
    max-width: 100%;
    margin: 0 auto;
  }

  /* KORAN ARTICLE CARD */
  .koran-article {
    background: #ffffff;
    border: 1px solid #e2e5ec;
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 24px;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
    transition: box-shadow 0.2s ease;
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .dark-mode .koran-article {
    background: #1e2229;
    border-color: rgba(255, 255, 255, 0.08);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
  }

  /* KORAN HEADLINE (BORDER AKSEN ATAS) */
  .koran-article.koran-headline {
    border-top: 3px solid var(--warna-maroon, #800000);
  }
  .dark-mode .koran-article.koran-headline {
    border-top-color: var(--sultan-aksi-utama, #a71d2a);
  }

  /* HEADINGS & TYPOGRAPHY */
  .koran-category-badge {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--warna-maroon, #800000);
    margin-bottom: 6px;
  }
  .dark-mode .koran-category-badge {
    color: #ff8a80;
  }

  .koran-article-actions .btn {
    border-radius: 6px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .koran-title {
    font-family: "Georgia", "Times New Roman", serif;
    font-size: 1.28rem;
    font-weight: 800;
    line-height: 1.32;
    color: #1a1a1a;
    margin-bottom: 10px;
    letter-spacing: -0.2px;
  }
  .dark-mode .koran-title {
    color: #f3f4f6;
  }

  /* METADATA BAR */
  .koran-meta {
    font-size: 0.78rem;
    color: #6b7280;
    padding-bottom: 10px;
    margin-bottom: 14px;
    border-bottom: 1px solid #edf0f5;
  }
  .dark-mode .koran-meta {
    color: #9ca3af;
    border-bottom-color: rgba(255, 255, 255, 0.08);
  }
  .koran-meta b {
    color: #374151;
  }
  .dark-mode .koran-meta b {
    color: #e5e7eb;
  }

  /* MEDIA SECTION & GALLERY (DI AWAL ATAU DI TENGAH PARAGRAF) */
  .koran-inline-media {
    margin: 14px 0 16px 0;
    border-radius: 8px;
    overflow: hidden;
  }
  .koran-media-img {
    width: 100%;
    max-height: 320px;
    object-fit: cover;
    display: block;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  .koran-media-img:hover {
    transform: scale(1.01);
  }

  /* 2 FOTO SIDE BY SIDE */
  .koran-gallery-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .koran-gallery-2 img {
    height: 190px;
    width: 100%;
    object-fit: cover;
    border-radius: 6px;
  }

  /* 3 FOTO COLLAGE */
  .koran-gallery-3 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 8px;
  }
  .koran-gallery-3 .gallery-item-main {
    grid-column: 1 / -1;
    height: 220px;
    width: 100%;
    object-fit: cover;
    border-radius: 6px;
  }
  .koran-gallery-3 .gallery-item-sub {
    height: 140px;
    width: 100%;
    object-fit: cover;
    border-radius: 6px;
  }

  /* ARTICLE BODY TEXT (LEFT ALIGNED AGAR TIDAK TERPOTONG / JANGGAL) */
  .koran-body-text {
    font-size: 0.90rem;
    line-height: 1.72;
    color: #2c3038;
    text-align: left;
    margin-bottom: 14px;
    flex-grow: 1;
    word-break: break-word;
  }
  .dark-mode .koran-body-text {
    color: #d1d5db;
  }
  .koran-body-text p {
    margin-bottom: 10px;
  }
  .koran-body-text ul, .koran-body-text ol {
    padding-left: 20px;
    margin-bottom: 10px;
  }
  .koran-body-text blockquote {
    border-left: 3px solid var(--warna-maroon, #800000);
    padding-left: 12px;
    margin: 10px 0;
    color: #6c757d;
    font-style: italic;
  }
  .dark-mode .koran-body-text blockquote {
    border-left-color: var(--sultan-aksi-utama, #ff7b7b);
    color: #a0aec0;
  }

  /* DROP CAP FIRST LETTER (HANYA PADA PARAGRAF LEAD) */
  .koran-drop-cap::first-letter {
    font-family: "Georgia", "Times New Roman", serif;
    float: left;
    font-size: 2.6rem;
    line-height: 0.85;
    font-weight: 700;
    margin-right: 8px;
    margin-top: 2px;
    color: var(--warna-maroon, #800000);
  }
  .dark-mode .koran-drop-cap::first-letter {
    color: var(--sultan-aksi-utama, #ff7b7b);
  }

  /* ATTACHMENT BOX IN KORAN */
  .koran-attachment-box {
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .dark-mode .koran-attachment-box {
    background: #252b36;
    border-color: rgba(255, 255, 255, 0.15);
  }

  /* ACTION & INTERACTION BAR */
  .koran-footer-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 12px;
    margin-top: auto;
    border-top: 1px solid #edf0f5;
  }
  .dark-mode .koran-footer-actions {
    border-top-color: rgba(255, 255, 255, 0.08);
  }

  /* INLINE COMMENTS SECTION */
  .koran-comments-collapse {
    background: #f9fafb;
    border-radius: 8px;
    padding: 14px;
    margin-top: 12px;
    border: 1px solid #edf0f5;
  }
  .dark-mode .koran-comments-collapse {
    background: #171a21;
    border-color: rgba(255, 255, 255, 0.06);
  }
  .koran-comment-item {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 8px 12px;
    margin-bottom: 8px;
  }
  .dark-mode .koran-comment-item {
    background: #222731;
    border-color: rgba(255, 255, 255, 0.08);
  }

  .btn-koran-like {
    border-radius: 50px;
    font-weight: 600;
    font-size: 0.78rem;
    padding: 4px 12px;
    transition: all 0.2s ease;
  }
  .btn-koran-comment {
    border-radius: 50px;
    font-weight: 600;
    font-size: 0.78rem;
    padding: 4px 12px;
  }
</style>

<section class="content sultan-page-transition">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12 col-xl-11">

        <!-- FILTER BAR (GLOBAL SULTAN STYLE) -->
        <div class="sultan-filter-pill-container shadow-sm mb-4">
          <div class="sultan-filter-item">
            <select id="emading_filterKategori" class="form-control">
              <option value="">- Semua Kategori -</option>
              <option value="Pengumuman">Pengumuman</option>
              <option value="Kegiatan">Kegiatan</option>
              <option value="Prestasi">Prestasi</option>
              <option value="Inovasi">Inovasi Pembelajaran</option>
              <option value="Karya Guru & Siswa">Karya Guru & Siswa</option>
              <option value="Lainnya">Lainnya</option>
            </select>
            <i class="fas fa-chevron-down"></i>
          </div>

          <div class="sultan-filter-item" style="min-width: 250px; flex-grow: 1;">
            <input type="text" id="emading_filterSearch" class="form-control" placeholder="Cari berita koran, judul, penulis, kata kunci...">
            <i class="fas fa-search"></i>
          </div>

          <div class="divider-vertical d-none d-md-block"></div>

          <button type="button" id="emading_btnRefresh" class="sultan-btn-refresh" title="Segarkan Data">
            <i class="fas fa-sync-alt"></i>
          </button>
        </div>

        <!-- WADAH FEED KORAN -->
        <div id="emading_loadingFeed" class="text-center py-5">
          <div class="spinner-border text-maroon mb-3" role="status" style="width: 3rem; height: 3rem;"></div>
          <p class="font-weight-bold text-muted">Membuka Koran Digital E-Mading...</p>
        </div>

        <div id="emading_emptyFeed" class="text-center py-5 d-none">
          <div class="text-muted mb-3"><i class="fas fa-newspaper fa-4x opacity-50"></i></div>
          <h5 class="font-weight-bold text-muted">Belum Ada Berita Diterbitkan</h5>
          <p class="text-muted small">Belum ada berita koran yang tersedia untuk kategori ini.</p>
        </div>

        <!-- FEED ARTIKEL KORAN LANGSUNG BACA (2 KOLOM GRID BERDAMPINGAN) -->
        <div id="emading_feedContainer" class="koran-container d-none">
          <div class="row" id="emading_koranRow">
            <!-- Diisi artikel koran 2 kolom secara dinamis via JavaScript -->
          </div>
        </div>

      </div>
    </div>
  </div>
</section>

<script>
  (function () {
    var EMADING_ARTIKEL_CACHE = [];

    // Inisialisasi awal saat halaman dimuat
    $(document).ready(function () {
      muatDaftarMading();
      initEventHandlers();
    });

    function initEventHandlers() {
      // Filter Kategori
      $('#emading_filterKategori').on('change', function () {
        terapkanFilterLocal();
      });

      // Pencarian dengan Debounce
      var searchTimeout = null;
      $('#emading_filterSearch').on('input', function () {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(function () {
          terapkanFilterLocal();
        }, 300);
      });

      // Tombol Refresh
      $('#emading_btnRefresh').on('click', function () {
        muatDaftarMading();
      });
    }

    /**
     * Memuat daftar artikel dari Google Apps Script
     */
    function muatDaftarMading() {
      $('#emading_loadingFeed').removeClass('d-none');
      $('#emading_emptyFeed').addClass('d-none');
      $('#emading_feedContainer').addClass('d-none');

      var filter = {
        status: "Dipublikasikan"
      };

      google.script.run
        .withSuccessHandler(function (response) {
          $('#emading_loadingFeed').addClass('d-none');
          try {
            var data = (typeof response === 'string') ? JSON.parse(response) : response;
            if (data.error) {
              Sultan.alert('error', 'Gagal', data.error);
              return;
            }
            EMADING_ARTIKEL_CACHE = Array.isArray(data) ? data : [];
            terapkanFilterLocal();
          } catch (e) {
            console.error("Error parse mading:", e);
            $('#emading_emptyFeed').removeClass('d-none');
          }
        })
        .withFailureHandler(function (err) {
          $('#emading_loadingFeed').addClass('d-none');
          Sultan.alert('error', 'Koneksi Terputus', err.message || err);
        })
        .getDaftarArtikelEmading(filter);
    }

    /**
     * Terapkan filter kategori dan pencarian secara lokal dari cache
     */
    function terapkanFilterLocal() {
      var kat = $('#emading_filterKategori').val().toLowerCase().trim();
      var keyword = $('#emading_filterSearch').val().toLowerCase().trim();

      var filtered = EMADING_ARTIKEL_CACHE.filter(function (item) {
        var matchKat = !kat || (item.kategori && item.kategori.toLowerCase() === kat);
        var matchSearch = true;
        if (keyword) {
          var gabung = (item.judul + " " + item.isi + " " + item.pengunggah + " " + item.tags).toLowerCase();
          matchSearch = gabung.indexOf(keyword) !== -1;
        }
        return matchKat && matchSearch;
      });

      renderFeedKoran(filtered);
    }

    /**
     * Merender daftar artikel dengan TAMPILAN KORAN (LANGSUNG DIBACA TANPA POPUP)
     */
    function renderFeedKoran(data) {
      var $container = $('#emading_feedContainer');
      var $row = $('#emading_koranRow');
      $row.empty();

      if (!data || data.length === 0) {
        $('#emading_emptyFeed').removeClass('d-none');
        $container.addClass('d-none');
        return;
      }

      $('#emading_emptyFeed').addClass('d-none');
      $container.removeClass('d-none');

      var uLogin = null;
      if (typeof userLogin !== 'undefined' && userLogin) {
        uLogin = userLogin;
      } else {
        try {
          var stored = localStorage.getItem('siksUser');
          if (stored) uLogin = JSON.parse(stored);
        } catch (e) {}
      }
      var curUser = uLogin ? (uLogin.username || uLogin.user || '') : '';
      var curRole = uLogin ? (uLogin.role || '').toLowerCase() : '';

      data.forEach(function (art, index) {
        var isHeadline = (index === 0);
        var headlineClass = isHeadline ? 'koran-headline' : '';
        var isOwnerOrAdmin = (curRole === 'admin') || (curUser && String(curUser).toLowerCase() === String(art.userLogin).toLowerCase());

        // Kumpulkan daftar foto (mendukung s.d. 3 foto)
        var listFoto = [];
        if (art.fotoList && Array.isArray(art.fotoList) && art.fotoList.length > 0) {
          listFoto = art.fotoList;
        } else if (art.fotoUrl) {
          var splitF = String(art.fotoUrl).split(/\s*,\s*|\s*\|\s*|\n+/);
          listFoto = splitF.filter(function(f) { return f && f.trim().length > 0; });
        }

        // Susun HTML Galeri Foto Koran (1 Foto, 2 Foto Side-by-Side, 3 Foto Trio Collage)
        var fotoHtml = '';
        if (listFoto.length === 1) {
          var fUrl1 = konversiDriveImageUrl(listFoto[0]);
          fotoHtml = `
            <div class="koran-inline-media shadow-sm">
              <img src="${fUrl1}" class="koran-media-img" alt="${art.judul}" loading="lazy" referrerpolicy="no-referrer" onerror="handleImageError(this, '${listFoto[0]}')">
            </div>
          `;
        } else if (listFoto.length === 2) {
          var f1 = konversiDriveImageUrl(listFoto[0]);
          var f2 = konversiDriveImageUrl(listFoto[1]);
          fotoHtml = `
            <div class="koran-inline-media shadow-sm">
              <div class="koran-gallery-2">
                <img src="${f1}" alt="Dokumentasi 1" loading="lazy" referrerpolicy="no-referrer" onerror="handleImageError(this, '${listFoto[0]}')">
                <img src="${f2}" alt="Dokumentasi 2" loading="lazy" referrerpolicy="no-referrer" onerror="handleImageError(this, '${listFoto[1]}')">
              </div>
            </div>
          `;
        } else if (listFoto.length >= 3) {
          var g1 = konversiDriveImageUrl(listFoto[0]);
          var g2 = konversiDriveImageUrl(listFoto[1]);
          var g3 = konversiDriveImageUrl(listFoto[2]);
          fotoHtml = `
            <div class="koran-inline-media shadow-sm">
              <div class="koran-gallery-3">
                <img src="${g1}" class="gallery-item-main" alt="Dokumentasi Utama" loading="lazy" referrerpolicy="no-referrer" onerror="handleImageError(this, '${listFoto[0]}')">
                <img src="${g2}" class="gallery-item-sub" alt="Dokumentasi 2" loading="lazy" referrerpolicy="no-referrer" onerror="handleImageError(this, '${listFoto[1]}')">
                <img src="${g3}" class="gallery-item-sub" alt="Dokumentasi 3" loading="lazy" referrerpolicy="no-referrer" onerror="handleImageError(this, '${listFoto[2]}')">
              </div>
            </div>
          `;
        }

        // Posisi Foto: Di Awal atau Di Tengah Paragraf
        var posisiFoto = (art.posisiFoto || 'awal').toLowerCase();

        // Susun Isi Berita (Mendukung Rich Text HTML atau Plain Text)
        var isiRaw = (art.isi || '').trim();
        var bodyIsiHtml = '';

        // Cek apakah isi berupa format HTML (ada tag <p>, <div>, <ul>, <h3> dll)
        var isHtml = /<[a-z][\s\S]*>/i.test(isiRaw);

        if (posisiFoto === 'awal') {
          // JIKA POSISI DI AWAL: Tampilkan foto di atas teks
          var isiKonten = isHtml ? isiRaw : `<div style="white-space: pre-line;">${isiRaw}</div>`;
          bodyIsiHtml = `
            ${fotoHtml}
            <div class="koran-body-text">
              ${isiKonten}
            </div>
          `;
        } else {
          // JIKA POSISI DI TENGAH PARAGRAF:
          if (isHtml) {
            // Jika HTML, kita pisahkan tag paragraf pembuka
            var matchP = isiRaw.match(/(<p[\s\S]*?<\/p>|<div[\s\S]*?<\/div>)/i);
            if (matchP && matchP.index === 0) {
              var pAwal = matchP[0];
              var pSisa = isiRaw.substring(pAwal.length);
              bodyIsiHtml = `
                <div class="koran-body-text">
                  ${pAwal}
                  ${fotoHtml}
                  ${pSisa}
                </div>
              `;
            } else {
              bodyIsiHtml = `
                <div class="koran-body-text">
                  ${fotoHtml}
                  ${isiRaw}
                </div>
              `;
            }
          } else {
            // Jika Plain Text, pisahkan paragraf pertama
            var paragrafList = isiRaw.split(/\n\s*\n|\r\n\r\n/);
            if (paragrafList.length > 1) {
              var lead = `<p class="koran-drop-cap mb-3">${paragrafList[0]}</p>`;
              var sisa = paragrafList.slice(1).map(function(p) { return `<p class="mb-3">${p.trim()}</p>`; }).join('');
              bodyIsiHtml = `
                <div class="koran-body-text">
                  ${lead}
                  ${fotoHtml}
                  ${sisa}
                </div>
              `;
            } else {
              bodyIsiHtml = `
                <div class="koran-body-text">
                  ${fotoHtml}
                  <div style="white-space: pre-line;">${isiRaw}</div>
                </div>
              `;
            }
          }
        }

        // Media Video (Embed YouTube jika ada)
        var videoHtml = '';
        if (art.videoUrl) {
          var embedUrl = konversiUrlEmbed(art.videoUrl);
          if (embedUrl) {
            videoHtml = `
              <div class="mb-3 rounded overflow-hidden shadow-sm">
                <div class="embed-responsive embed-responsive-16by9">
                  <iframe class="embed-responsive-item" src="${embedUrl}" allowfullscreen></iframe>
                </div>
              </div>
            `;
          }
        }

        // Berkas Dokumen Lampiran Resmi
        var lampiranHtml = '';
        if (art.lampiranUrl) {
          lampiranHtml = `
            <div class="koran-attachment-box">
              <div class="d-flex align-items-center">
                <i class="fas fa-file-pdf text-maroon fa-2x mr-3"></i>
                <div>
                  <span class="font-weight-bold text-dark d-block" style="font-size: 0.85rem;">${art.lampiranNama || 'Dokumen Pendukung'}</span>
                  <small class="text-muted">Klik tombol di samping untuk mengunduh lampiran resmi artikel ini.</small>
                </div>
              </div>
              <a href="${art.lampiranUrl}" target="_blank" class="btn btn-sm btn-maroon rounded-pill px-3 ml-2 flex-shrink-0">
                <i class="fas fa-download mr-1"></i> Unduh
              </a>
            </div>
          `;
        }

        // Tombol Manajemen (Owner/Admin)
        var actionOwnerHtml = '';
        if (isOwnerOrAdmin) {
          actionOwnerHtml = `
            <div class="koran-article-actions ml-auto">
              <button type="button" class="btn btn-xs btn-outline-warning btn-koran-edit px-2 py-1 mr-1" data-id="${art.id}" title="Edit Berita Ini">
                <i class="fas fa-edit mr-1"></i>Edit
              </button>
              <button type="button" class="btn btn-xs btn-outline-danger btn-koran-hapus px-2 py-1" data-id="${art.id}" title="Hapus Berita Ini">
                <i class="fas fa-trash-alt mr-1"></i>Hapus
              </button>
            </div>
          `;
        }

        var htmlKoran = `
          <div class="col-12 col-lg-6 mb-4 d-flex">
            <article class="koran-article ${headlineClass} w-100" id="koran_article_${art.id}">
              
              <!-- BADGE KATEGORI KORAN -->
              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="koran-category-badge">${art.kategori || 'Berita Utama'}</span>
                ${actionOwnerHtml}
              </div>

              <!-- JUDUL ARTIKEL GAYA KORAN -->
              <h2 class="koran-title">${art.judul}</h2>

              <!-- BYLINE / META PENULIS & WAKTU -->
              <div class="koran-meta d-flex flex-wrap align-items-center justify-content-between">
                <div>
                  <i class="fas fa-feather-alt text-maroon mr-1"></i> Ditulis oleh: <b>${art.pengunggah || 'Redaksi'}</b>
                  ${art.unitKerja ? `<span class="mx-2">•</span><i class="fas fa-university text-muted mr-1"></i> ${art.unitKerja}` : ''}
                </div>
                <div class="mt-1 mt-sm-0 text-muted">
                  <i class="far fa-clock mr-1"></i> ${art.tglPosting || '-'}
                </div>
              </div>

              <!-- ISI BERITA & FOTO (POSISI SESUAI PILIHAN PENULIS: AWAL ATAU TENGAH) -->
              ${bodyIsiHtml}

              <!-- VIDEO JIKA TERSEDIA -->
              ${videoHtml}

              <!-- LAMPIRAN BERKAS JIKA ADA -->
              ${lampiranHtml}

              <!-- FOOTER INTERAKSI: SUKA & KOMENTAR -->
              <div class="koran-footer-actions">
                <div class="d-flex align-items-center">
                  <button type="button" class="btn btn-outline-danger btn-koran-like mr-2" data-id="${art.id}" id="koran_btn_like_${art.id}">
                    <i class="far fa-heart mr-1" id="koran_icon_like_${art.id}"></i>
                    <span id="koran_label_like_${art.id}">Suka</span> 
                    (<span id="koran_count_like_${art.id}">${art.jmlSuka || 0}</span>)
                  </button>

                  <button type="button" class="btn btn-outline-secondary btn-koran-comment" data-toggle="collapse" data-target="#koran_komentar_${art.id}" data-id="${art.id}">
                    <i class="far fa-comments mr-1 text-info"></i> Komentar 
                    (<span id="koran_count_komentar_${art.id}">${art.jmlKomentar || 0}</span>)
                  </button>
                </div>

                ${art.tags ? `<div class="text-muted small d-none d-sm-block"><i class="fas fa-tags mr-1"></i> ${art.tags}</div>` : ''}
              </div>

              <!-- COLLAPSIBLE KOMENTAR PEMBACA DI BAWAH ARTIKEL -->
              <div class="collapse koran-comments-collapse" id="koran_komentar_${art.id}">
                <div class="font-weight-bold text-maroon mb-3">
                  <i class="fas fa-comments mr-2"></i>Komentar Pembaca
                </div>

                <!-- FORM KIRIM KOMENTAR LANGSUNG -->
                <form class="koran-form-komentar mb-3" data-id="${art.id}">
                  <div class="form-group mb-2">
                    <textarea class="form-control form-control-sultan input-isi-komentar" rows="2" placeholder="Tulis komentar atau tanggapan Anda..." required></textarea>
                  </div>
                  <div class="text-right">
                    <button type="submit" class="btn btn-maroon btn-sm rounded-pill px-3">
                      <i class="fas fa-paper-plane mr-1"></i> Kirim Komentar
                    </button>
                  </div>
                </form>

                <!-- LIST KOMENTAR -->
                <div class="koran-list-komentar" id="koran_list_komentar_${art.id}">
                  <div class="text-center py-2 text-muted small"><i class="fas fa-spinner fa-spin mr-1"></i> Memuat tanggapan...</div>
                </div>
              </div>

            </article>
          </div>
        `;
        $row.append(htmlKoran);

        // Periksa status like pengguna secara mandiri
        cekStatusLikeKoran(art.id);
      });

      // BIND EVENTS
      initKoranInteractions();
    }

    /**
     * Interaksi Tombol di Koran: Suka, Komentar Collapse, Edit, Hapus
     */
    function initKoranInteractions() {
      // Toggle Like
      $('.btn-koran-like').off('click').on('click', function () {
        var id = $(this).attr('data-id');
        toggleLikeKoran(id);
      });

      // Buka Komentar: muat list komentar ketika collapse dibuka
      $('.btn-koran-comment').off('click').on('click', function () {
        var id = $(this).attr('data-id');
        muatKomentarKoran(id);
      });

      // Submit Form Komentar
      $('.koran-form-komentar').off('submit').on('submit', function (e) {
        e.preventDefault();
        var id = $(this).attr('data-id');
        var $textarea = $(this).find('.input-isi-komentar');
        var teks = $textarea.val().trim();
        if (!teks) return;

        kirimKomentarKoran(id, teks, function () {
          $textarea.val('');
        });
      });

      // Edit Artikel
      $('.btn-koran-edit').off('click').on('click', function () {
        var id = $(this).attr('data-id');
        var art = EMADING_ARTIKEL_CACHE.find(function (item) { return item.id === id; });
        if (!art) return;
        window.EDIT_ARTIKEL_MADING = art;
        if (typeof loadContent === 'function') loadContent('emading_tulis');
        else if (typeof loadHalaman === 'function') loadHalaman('emading_tulis');
      });

      // Hapus Artikel
      $('.btn-koran-hapus').off('click').on('click', function () {
        var id = $(this).attr('data-id');
        var art = EMADING_ARTIKEL_CACHE.find(function (item) { return item.id === id; });
        if (art) konfirmasiHapusArtikel(art);
      });
    }

    /**
     * Konversi URL Foto Google Drive ke format direct render terbaik
     */
    function konversiDriveImageUrl(url) {
      if (!url) return "";
      var driveId = extractDriveId(url);
      if (driveId) {
        // Format thumbnail lh3.googleusercontent.com adalah format terandal untuk Google Apps Script
        return "https://lh3.googleusercontent.com/d/" + driveId + "=w1200";
      }
      return url;
    }

    function extractDriveId(url) {
      if (!url) return null;
      var match = url.match(/id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    }

    window.handleImageError = function (imgEl, originalUrl) {
      var driveId = extractDriveId(originalUrl);
      if (driveId && !imgEl.getAttribute('data-fallback-tried')) {
        imgEl.setAttribute('data-fallback-tried', '1');
        // Coba alternatif kedua: Google Drive thumbnail API
        imgEl.src = "https://drive.google.com/thumbnail?id=" + driveId + "&sz=w1200";
      } else if (driveId && imgEl.getAttribute('data-fallback-tried') === '1') {
        imgEl.setAttribute('data-fallback-tried', '2');
        // Coba alternatif ketiga: export=view
        imgEl.src = "https://drive.google.com/uc?export=view&id=" + driveId;
      }
    };

    /**
     * Konversi URL YouTube ke Embed Format
     */
    function konversiUrlEmbed(url) {
      if (!url) return "";
      var match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      if (match && match[1]) {
        return "https://www.youtube.com/embed/" + match[1];
      }
      return url;
    }

    /**
     * Cek apakah user saat ini sudah me-like artikel
     */
    function cekStatusLikeKoran(idArtikel) {
      var uLogin = (typeof userLogin !== 'undefined' && userLogin) ? userLogin : null;
      var curUser = uLogin ? (uLogin.username || uLogin.user) : 'anonim';

      google.script.run
        .withSuccessHandler(function (res) {
          try {
            var data = (typeof res === 'string') ? JSON.parse(res) : res;
            if (data.liked) {
              $('#koran_btn_like_' + idArtikel).removeClass('btn-outline-danger').addClass('btn-danger text-white');
              $('#koran_icon_like_' + idArtikel).removeClass('far').addClass('fas');
              $('#koran_label_like_' + idArtikel).text('Disukai');
            } else {
              $('#koran_btn_like_' + idArtikel).removeClass('btn-danger text-white').addClass('btn-outline-danger');
              $('#koran_icon_like_' + idArtikel).removeClass('fas').addClass('far');
              $('#koran_label_like_' + idArtikel).text('Suka');
            }
          } catch (e) {}
        })
        .cekStatusSukaEmading(idArtikel, curUser);
    }

    /**
     * Toggle Like / Batal Like
     */
    function toggleLikeKoran(idArtikel) {
      var uLogin = (typeof userLogin !== 'undefined' && userLogin) ? userLogin : null;
      var curUser = uLogin ? (uLogin.username || uLogin.user) : 'anonim';

      google.script.run
        .withSuccessHandler(function (res) {
          try {
            var data = (typeof res === 'string') ? JSON.parse(res) : res;
            if (data.success) {
              $('#koran_count_like_' + idArtikel).text(data.totalSuka);
              if (data.liked) {
                $('#koran_btn_like_' + idArtikel).removeClass('btn-outline-danger').addClass('btn-danger text-white');
                $('#koran_icon_like_' + idArtikel).removeClass('far').addClass('fas');
                $('#koran_label_like_' + idArtikel).text('Disukai');
              } else {
                $('#koran_btn_like_' + idArtikel).removeClass('btn-danger text-white').addClass('btn-outline-danger');
                $('#koran_icon_like_' + idArtikel).removeClass('fas').addClass('far');
                $('#koran_label_like_' + idArtikel).text('Suka');
              }
            }
          } catch (e) {}
        })
        .toggleSukaEmading(idArtikel, curUser);
    }

    /**
     * Memuat komentar untuk artikel tertentu di koran
     */
    function muatKomentarKoran(idArtikel) {
      var $wrap = $('#koran_list_komentar_' + idArtikel);

      google.script.run
        .withSuccessHandler(function (res) {
          try {
            var data = (typeof res === 'string') ? JSON.parse(res) : res;
            renderKomentarKoran(idArtikel, data);
          } catch (e) {
            $wrap.html('<div class="text-muted small">Belum ada komentar.</div>');
          }
        })
        .getKomentarEmading(idArtikel);
    }

    function renderKomentarKoran(idArtikel, list) {
      var $wrap = $('#koran_list_komentar_' + idArtikel);
      $wrap.empty();

      if (!list || list.length === 0) {
        $wrap.html('<div class="text-muted small py-1">Belum ada komentar. Berikan tanggapan pertama Anda!</div>');
        return;
      }

      var uLogin = (typeof userLogin !== 'undefined' && userLogin) ? userLogin : null;
      var curUser = uLogin ? (uLogin.username || uLogin.user) : '';
      var curRole = uLogin ? (uLogin.role || '').toLowerCase() : '';

      list.forEach(function (k) {
        var canDelete = (curRole === 'admin') || (curUser && curUser === k.userLogin);
        var delBtn = canDelete ? `<button type="button" class="btn btn-link text-danger p-0 ml-2 btn-hapus-komentar-koran" data-id="${k.idKomentar}" data-art="${idArtikel}" title="Hapus"><i class="fas fa-times"></i></button>` : '';

        var html = `
          <div class="koran-comment-item">
            <div class="d-flex align-items-center justify-content-between mb-1">
              <div>
                <span class="font-weight-bold small text-dark">${k.namaKomentator}</span>
                <span class="badge badge-light ml-1 text-muted">${k.unitKerja || '-'}</span>
              </div>
              <div class="small text-muted">
                ${k.tglKomentar} ${delBtn}
              </div>
            </div>
            <div class="small text-secondary" style="white-space: pre-line;">${k.isiKomentar}</div>
          </div>
        `;
        $wrap.append(html);
      });

      // Event Hapus Komentar
      $('.btn-hapus-komentar-koran').off('click').on('click', function () {
        var idKom = $(this).attr('data-id');
        var idArt = $(this).attr('data-art');
        hapusKomentarKoran(idArt, idKom);
      });
    }

    function kirimKomentarKoran(idArtikel, teks, onSuccess) {
      var uLogin = (typeof userLogin !== 'undefined' && userLogin) ? userLogin : null;
      var curName = uLogin ? (uLogin.nama || uLogin.nama_pegawai || uLogin.username) : 'Anonim';
      var curUser = uLogin ? (uLogin.username || uLogin.user) : 'anonim';
      var curUnit = uLogin ? (uLogin.unit_kerja || uLogin.sekolah || '-') : '-';

      var payload = {
        idArtikel: idArtikel,
        namaKomentator: curName,
        userLogin: curUser,
        unitKerja: curUnit,
        isiKomentar: teks
      };

      Sultan.notif.loading("Mengirim komentar...");

      google.script.run
        .withSuccessHandler(function (res) {
          Sultan.notif.tutup();
          try {
            var data = (typeof res === 'string') ? JSON.parse(res) : res;
            if (data.success) {
              $('#koran_count_komentar_' + idArtikel).text(data.totalKomentar);
              if (onSuccess) onSuccess();
              muatKomentarKoran(idArtikel);
            }
          } catch (e) {}
        })
        .withFailureHandler(function (err) {
          Sultan.notif.tutup();
          Sultan.alert('error', 'Gagal', err.message || err);
        })
        .kirimKomentarEmading(payload);
    }

    function hapusKomentarKoran(idArtikel, idKom) {
      var uLogin = (typeof userLogin !== 'undefined' && userLogin) ? userLogin : null;
      var curUser = uLogin ? (uLogin.username || uLogin.user) : '';
      var curRole = uLogin ? (uLogin.role || '').toLowerCase() : '';

      google.script.run
        .withSuccessHandler(function () {
          muatKomentarKoran(idArtikel);
        })
        .hapusKomentarEmading({
          idKomentar: idKom,
          userLogin: curUser,
          userRole: curRole
        });
    }

    /**
     * Konfirmasi Hapus / Takedown Artikel dengan Standar Kode Verifikasi Web
     */
    function konfirmasiHapusArtikel(art) {
      var dDate = new Date();
      var kd = dDate.getFullYear() + "" + String(dDate.getMonth() + 1).padStart(2, '0') + "" + String(dDate.getDate()).padStart(2, '0');

      Sultan.modal.konfirmasiHapus({
        title: 'Takedown / Hapus Artikel Koran',
        kode: kd,
        detail: {
          'JUDUL ARTIKEL': art.judul,
          'PENGUNGGAH': art.pengunggah,
          'TGL POSTING': art.tglPosting
        },
        onConfirm: function () {
          Sultan.notif.loading("Menghapus artikel...");
          var uLogin = (typeof userLogin !== 'undefined' && userLogin) ? userLogin : null;
          var curUser = uLogin ? (uLogin.username || uLogin.user) : '';
          var curRole = uLogin ? (uLogin.role || '').toLowerCase() : '';

          google.script.run
            .withSuccessHandler(function (res) {
              Sultan.notif.tutup();
              try {
                var data = (typeof res === 'string') ? JSON.parse(res) : res;
                if (data.success) {
                  Sultan.notif.crud.hapus();
                  muatDaftarMading();
                } else {
                  Sultan.alert('error', 'Gagal', data.error || 'Terjadi kesalahan.');
                }
              } catch (e) {
                muatDaftarMading();
              }
            })
            .withFailureHandler(function (err) {
              Sultan.notif.tutup();
              Sultan.alert('error', 'Error', err.message || err);
            })
            .hapusArtikelEmading({
              id: art.id,
              userLogin: curUser,
              userRole: curRole
            });
        }
      });
    }

  })();
</script>
