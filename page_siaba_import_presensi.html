<section class="content pt-3">
  <div class="container-fluid">
    <div class="d-flex justify-content-end mb-2">
      <button type="button" class="sultan-btn-tambah" onclick="openModalImportPresensi()">
        <i class="fas fa-plus"></i> TAMBAH
      </button>
    </div>

    <div class="card-sultan">
      <div class="card-body p-3">
        <div class="table-responsive">
          <table class="table table-hover table-sultan" id="tblImportPresensi">
            <thead>
              <tr>
                <th style="width:55px;" class="text-center">No</th>
                <th>Bulan</th>
                <th>Tahun</th>
                <th>Link Spreadsheet</th>
                <th>ID Spreadsheet</th>
                <th>Status</th>
                <th style="width:120px;" class="text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="tbodyImportPresensi">
              <tr><td colspan="7" class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin mr-1"></i> Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Modal Tambah / Edit (Bootstrap 4 / AdminLTE) -->
<div class="modal fade" id="modalImportPresensi" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header bg-maroon text-white">
        <h5 class="modal-title font-weight-bold" id="modalImportTitle">Tambah Sumber Presensi</h5>
        <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="impRowIndex" value="">
        <div class="row">
          <div class="col-md-6 form-group">
            <label class="font-weight-bold">Bulan</label>
            <select class="form-control" id="impBulan">
              <option value="Januari">Januari</option>
              <option value="Februari">Februari</option>
              <option value="Maret">Maret</option>
              <option value="April">April</option>
              <option value="Mei">Mei</option>
              <option value="Juni">Juni</option>
              <option value="Juli">Juli</option>
              <option value="Agustus">Agustus</option>
              <option value="September">September</option>
              <option value="Oktober">Oktober</option>
              <option value="November">November</option>
              <option value="Desember">Desember</option>
            </select>
          </div>
          <div class="col-md-6 form-group">
            <label class="font-weight-bold">Tahun</label>
            <input type="number" class="form-control" id="impTahun" value="2026" min="2020" max="2035">
          </div>
        </div>
        <div class="form-group mb-0">
          <label class="font-weight-bold">Link Spreadsheet</label>
          <input type="url" class="form-control" id="impLink" placeholder="https://docs.google.com/spreadsheets/d/...">
          <small class="form-text text-muted">ID Spreadsheet akan diambil otomatis dari link.</small>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="simpanImportPresensi()">
          <i class="fas fa-save mr-1"></i> Simpan
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  var importPresensiData = [];

  function loadImportPresensi() {
    google.script.run
      .withSuccessHandler(function(resStr) {
        var res = JSON.parse(resStr);
        var tbody = document.getElementById("tbodyImportPresensi");
        if (res.status !== "success") {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">' + (res.message || "Gagal memuat data") + '</td></tr>';
          return;
        }
        importPresensiData = res.data || [];
        if (importPresensiData.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Belum ada data sumber presensi.</td></tr>';
          return;
        }
        var html = "";
        importPresensiData.forEach(function(item, idx) {
          html += '<tr>' +
            '<td class="text-center">' + (idx + 1) + '</td>' +
            '<td>' + item.bulan + '</td>' +
            '<td>' + item.tahun + '</td>' +
            '<td><a href="' + item.link + '" target="_blank" class="btn btn-xs btn-outline-info"><i class="fas fa-external-link-alt mr-1"></i>Buka Sheet</a></td>' +
            '<td><code>' + item.idSpreadsheet + '</code></td>' +
            '<td><span class="badge badge-secondary">' + item.status + '</span></td>' +
            '<td class="text-center">' +
              '<button class="btn btn-warning btn-xs mr-1" onclick="editImportPresensi(' + idx + ')" title="Edit"><i class="fas fa-edit"></i></button>' +
              '<button class="btn btn-danger btn-xs" onclick="hapusImportPresensi(' + item.rowIndex + ')" title="Hapus"><i class="fas fa-trash"></i></button>' +
            '</td>' +
          '</tr>';
        });
        tbody.innerHTML = html;
      })
      .getImportPresensiList();
  }

  function openModalImportPresensi() {
    document.getElementById("modalImportTitle").innerText = "Tambah Sumber Presensi";
    document.getElementById("impRowIndex").value = "";
    document.getElementById("impLink").value = "";
    $('#modalImportPresensi').modal('show');
  }

  function editImportPresensi(idx) {
    var item = importPresensiData[idx];
    if (!item) return;
    document.getElementById("modalImportTitle").innerText = "Edit Sumber Presensi";
    document.getElementById("impRowIndex").value = item.rowIndex;
    document.getElementById("impBulan").value = item.bulan;
    document.getElementById("impTahun").value = item.tahun;
    document.getElementById("impLink").value = item.link;
    $('#modalImportPresensi').modal('show');
  }

  function simpanImportPresensi() {
    var payload = {
      rowIndex: document.getElementById("impRowIndex").value,
      bulan: document.getElementById("impBulan").value,
      tahun: document.getElementById("impTahun").value,
      link: document.getElementById("impLink").value
    };
    google.script.run
      .withSuccessHandler(function(resStr) {
        var res = JSON.parse(resStr);
        if (res.status === "success") {
          $('#modalImportPresensi').modal('hide');
          loadImportPresensi();
        } else {
          alert(res.message);
        }
      })
      .saveImportPresensi(payload);
  }

  function hapusImportPresensi(rowIndex) {
    if (!confirm("Yakin ingin menghapus sumber presensi ini?")) return;
    google.script.run
      .withSuccessHandler(function(resStr) {
        var res = JSON.parse(resStr);
        if (res.status === "success") loadImportPresensi();
        else alert(res.message);
      })
      .deleteImportPresensi(rowIndex);
  }

  loadImportPresensi();
</script>
