<!-- 
  UI HELPERS SULTAN EDITION 
  File ini berisi komponen UI reusable seperti Skeleton Screens dan Empty States.
-->

<script>
var SultanUI = {
    /**
     * Helper Sanitasi Teks (Anti-XSS) Terpusat
     * @param {string} text - Teks mentah
     */
    escapeHtml: function(text) {
        if (!text) return "";
        return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    },
    /**
     * Menghasilkan HTML Empty State yang Cantik
     * @param {string} judul - Judul pesan
     * @param {string} deskripsi - Deskripsi pesan
     * @param {string} icon - FontAwesome icon class
     */
    emptyState: function(judul = "Data Kosong", deskripsi = "Belum ada data untuk ditampilkan.", icon = "fa-folder-open") {
        return `
            <div class="d-flex flex-column align-items-center justify-content-center p-5 text-center sultan-page-transition">
                <div class="icon-circle mb-4" style="width: 100px; height: 100px; font-size: 40px; line-height: 100px; border-radius: 30px; background: linear-gradient(135deg, #fff5f5 0%, #fff 100%); box-shadow: var(--shadow-md); border: 1px solid rgba(128,0,0,0.05);">
                    <i class="fas ${icon} text-maroon" style="opacity: 0.3;"></i>
                </div>
                <h5 class="font-weight-bold text-dark mb-2" style="letter-spacing: -0.5px;">${judul}</h5>
                <p class="text-muted small mb-0" style="max-width: 280px; line-height: 1.6;">${deskripsi}</p>
            </div>
        `;
    },

    /**
     * Menampilkan Spinner Loading Terpusat
     * @param {string} targetId - ID elemen target (misal: '#lapbulkelola_loadingState')
     * @param {string} text - Teks indikator proses
     */
    showLoading: function(targetId, text = "Memuat Data...") {
        var $target = $(targetId);

        if ($target.find('.sultan-skeleton-loader').length > 0) {
            $target.find('.sultan-skeleton-caption').text(text);
            $target.show();
            return;
        }

        // Skeleton row template
        var skRow = function(cols) {
            var cells = '';
            for (var i = 0; i < cols; i++) {
                var w = (i === 0) ? '55%' : (i === cols - 1 ? '30%' : '70%');
                cells += '<td><div class="sultan-skel-bar" style="width:' + w + '"></div></td>';
            }
            return '<tr>' + cells + '</tr>';
        };

        var rows = '';
        for (var r = 0; r < 6; r++) { rows += skRow(6); }

        var html = `
            <div class="sultan-skeleton-loader sultan-page-transition">
                <div class="sultan-skel-header">
                    <div class="sultan-skel-bar w-40"></div>
                    <div class="sultan-skel-bar w-20 ml-auto"></div>
                </div>
                <table class="sultan-skel-table">
                    <thead>
                        <tr>
                            <th><div class="sultan-skel-bar w-60"></div></th>
                            <th><div class="sultan-skel-bar w-50"></div></th>
                            <th><div class="sultan-skel-bar w-40"></div></th>
                            <th><div class="sultan-skel-bar w-40"></div></th>
                            <th><div class="sultan-skel-bar w-50"></div></th>
                            <th><div class="sultan-skel-bar w-30"></div></th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
                <div class="sultan-skel-footer">
                    <div class="sultan-skel-bar w-20"></div>
                    <div class="sultan-skel-bar w-20 ml-auto"></div>
                </div>
                <div class="sultan-skel-caption sultan-loading-text mt-3">${text}</div>
            </div>
        `;
        $target.html(html).show();
    },

    /**
     * Menyembunyikan Spinner Loading Terpusat
     * @param {string} targetId - ID elemen target
     */
    hideLoading: function(targetId) {
        $(targetId).empty().hide();
    },

    /**
     * Animasi Counter Angka Berputar Terpusat (Sultan UI Counter Engine)
     * @param {string|HTMLElement} target - ID elemen (misal: 'kpi_id' atau '#kpi_id') atau objek DOM
     * @param {number|string} endValue - Nilai target akhir
     * @param {string} suffix - Opsional akhiran (misal: '%', ' PTK', dll)
     * @param {number} duration - Durasi animasi dalam ms (default: 1000ms)
     */
    animateValue: function(target, endValue, suffix = "", duration = 1000) {
        if (typeof SultanUI !== 'undefined' && SultanUI.stopLottery) {
            var targetSelector = typeof target === 'string' ? (target.startsWith('#') ? target : '#' + target) : target;
            SultanUI.stopLottery(targetSelector);
        }
        var obj = typeof target === 'string' 
            ? document.getElementById(target.replace(/^#/, '')) 
            : target;
        if (!obj) return;
        
        if (obj.dataset.sultanAnimId) {
            cancelAnimationFrame(parseInt(obj.dataset.sultanAnimId, 10));
        }

        var start = 0;
        var end = parseInt(endValue, 10);
        if (isNaN(end)) end = 0;

        if (end === 0) {
            obj.innerHTML = "0" + (suffix ? `<small class="ml-1">${suffix}</small>` : '');
            return;
        }

        var startTime = null;
        function step(timestamp) {
            if (!startTime) startTime = timestamp;
            var progress = Math.min((timestamp - startTime) / duration, 1);
            var easeProgress = progress * (2 - progress); // Easing out quadratic
            var curVal = Math.floor(easeProgress * (end - start) + start);
            obj.innerHTML = curVal.toLocaleString('id-ID') + (suffix ? `<small class="ml-1">${suffix}</small>` : '');
            if (progress < 1) {
                var animId = window.requestAnimationFrame(step);
                obj.dataset.sultanAnimId = animId;
            } else {
                obj.dataset.sultanAnimId = "";
            }
        }
        obj.dataset.sultanAnimId = window.requestAnimationFrame(step);
    },

    /**
     * Merender Skeleton Loader untuk Dashboard
     * @param {string} targetId - ID elemen target dashboardState (misal: '#admsekolahdash_dashboardState')
     */
    showSkeleton: function(targetId) {
        var $target = $(targetId);
        var html = `
            <div class="sultan-skeleton-page sultan-page-transition">
                <!-- Row 1 Skeleton: 4 Cards -->
                <div class="row mb-3">
                    <div class="col-lg-3 col-md-6 mb-2">
                        <div class="sultan-skeleton-wrapper"><div class="sultan-skeleton sultan-skeleton-title w-50"></div><div class="sultan-skeleton sultan-skeleton-text"></div></div>
                    </div>
                    <div class="col-lg-3 col-md-6 mb-2">
                        <div class="sultan-skeleton-wrapper"><div class="sultan-skeleton sultan-skeleton-title w-50"></div><div class="sultan-skeleton sultan-skeleton-text"></div></div>
                    </div>
                    <div class="col-lg-3 col-md-6 mb-2">
                        <div class="sultan-skeleton-wrapper"><div class="sultan-skeleton sultan-skeleton-title w-50"></div><div class="sultan-skeleton sultan-skeleton-text"></div></div>
                    </div>
                    <div class="col-lg-3 col-md-6 mb-2">
                        <div class="sultan-skeleton-wrapper"><div class="sultan-skeleton sultan-skeleton-title w-50"></div><div class="sultan-skeleton sultan-skeleton-text"></div></div>
                    </div>
                </div>
                <!-- Row 2 Skeleton: 5 mini cards -->
                <div class="row mb-3">
                    <div class="col-sm-2 col-6 mb-2"><div class="sultan-skeleton" style="height: 80px; border-radius: 16px;"></div></div>
                    <div class="col-sm-2 col-6 mb-2"><div class="sultan-skeleton" style="height: 80px; border-radius: 16px;"></div></div>
                    <div class="col-sm-2 col-6 mb-2"><div class="sultan-skeleton" style="height: 80px; border-radius: 16px;"></div></div>
                    <div class="col-sm-2 col-6 mb-2"><div class="sultan-skeleton" style="height: 80px; border-radius: 16px;"></div></div>
                    <div class="col-sm-2 col-6 mb-2"><div class="sultan-skeleton" style="height: 80px; border-radius: 16px;"></div></div>
                    <div class="col-sm-2 col-6 mb-2"><div class="sultan-skeleton" style="height: 80px; border-radius: 16px;"></div></div>
                </div>
                <!-- List Skeleton -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <div class="sultan-skeleton-wrapper" style="height: 300px;"><div class="sultan-skeleton sultan-skeleton-title"></div><div class="sultan-skeleton sultan-skeleton-text"></div><div class="sultan-skeleton sultan-skeleton-text w-75"></div></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="sultan-skeleton-wrapper" style="height: 300px;"><div class="sultan-skeleton sultan-skeleton-title"></div><div class="sultan-skeleton sultan-skeleton-text"></div><div class="sultan-skeleton sultan-skeleton-text w-75"></div></div>
                    </div>
                </div>
            </div>
        `;
        $target.html(html).show();
    },

    /**
     * Otomatis deteksi waktu terakhir dari data log (Global Standard)
     * @param {Array} rows - Data baris dari server
     * @param {string} txtId - ID penampung teks (default: '#statussk_txtLastUpdate')
     * @param {string} areaId - ID penampung area (default: '#statussk_lastUpdateArea')
     */
    autoDetectLastUpdate: function(rows, txtId, areaId) {
        var tglTerakhir = null;
        if (rows && rows.length > 0) {
            rows.forEach(function(row) {
                var searchArea = Array.isArray(row) ? row : Object.values(row);
                searchArea.forEach(function(val) {
                    var sVal = String(val || "");
                    if (sVal.includes('|')) {
                        var parts = sVal.split('|');
                        parts.forEach(function(p) {
                            p = p.trim();
                            if (p.match(/\d{2,4}[-/]\d{2}[-/]\d{2,4}/) || p.match(/\d{2}:\d{2}/)) {
                                if (!tglTerakhir || p > tglTerakhir) tglTerakhir = p;
                            }
                        });
                    }
                });
            });
        }
        if (!tglTerakhir) {
            var now = new Date();
            tglTerakhir = now.toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' (Sinkron)';
        }
        $(txtId).text(tglTerakhir);
        $(areaId).show();
    },

    /**
     * Merender Banner Judul Halaman Modern & Adaptif (Light & Dark Mode)
     * @param {string} title - Judul halaman
     * @param {string} subtitle - Subjudul deskriptif
     * @param {string} icon - Kelas ikon FontAwesome
     */
    renderHeader: function(title, subtitle = "", icon = "fas fa-info-circle") {
        var subtitleHtml = subtitle ? `<p class="sultan-page-header-subtitle">${subtitle}</p>` : '';
        return `
            <div class="sultan-page-header-banner animate__animated animate__fadeIn sultan-page-transition">
                <div class="sultan-page-header-body">
                    <div class="sultan-page-header-left">
                        <div class="sultan-page-header-icon-box">
                            <i class="${icon}"></i>
                        </div>
                        <div class="sultan-page-header-text">
                            <h4 class="sultan-page-header-title">${title}</h4>
                            ${subtitleHtml}
                        </div>
                    </div>
                    <div class="sultan-page-header-watermark">
                        <i class="${icon}"></i>
                    </div>
                </div>
            </div>
        `;
    },

    /**
     * Merender Filter Bar Global secara Dinamis dan Seragam
     * @param {Array} filters - Konfigurasi dropdown filter
     * @param {string} extraButtonsHtml - HTML tombol tambahan (misal: refresh/download)
     */
    renderFilterBar: function(filters = [], extraButtonsHtml = '') {
        var itemsHtml = '';
        filters.forEach(function(f) {
            var displayStyle = f.visible === false ? 'style="display:none;"' : '';
            var disabledAttr = f.disabled ? 'disabled' : '';
            var optionsHtml = f.value ? `<option value="${f.value}" selected>${f.text || f.value}</option>` : `<option value="">${f.placeholder || '- Memilih -'}</option>`;
            itemsHtml += `
                <div class="sultan-filter-item" id="${f.id}_container" ${displayStyle}>
                    <select id="${f.id}" class="form-control" ${disabledAttr} style="width: auto; min-width: 120px; max-width: 260px;">
                        ${optionsHtml}
                    </select>
                    <i class="fas ${f.icon || 'fa-chevron-down'}"></i>
                </div>
            `;
        });
        
        return `
            <div class="sultan-filter-pill-container shadow-sm mb-4 sultan-page-transition">
                ${itemsHtml}
                ${extraButtonsHtml}
            </div>
        `;
    },

    /**
     * Merender Header Judul di dalam Card (Global Standard)
     * @param {Object} options - Konfigurasi header { title, icon, id, extraHtml }
     */
    renderCardSectionHeader: function(options) {
        options = options || {};
        var title = options.title || '';
        var icon = options.icon ? `<i class="fas ${options.icon} text-maroon"></i>` : '';
        var idAttr = options.id ? `id="${options.id}"` : '';
        var extraHtml = options.extraHtml || '';
        return `
            <div class="sultan-card-section-header">
                <div class="sultan-card-section-title">
                    ${icon}
                    <h6 ${idAttr} class="mb-0">${title}</h6>
                </div>
                ${extraHtml ? `<div>${extraHtml}</div>` : ''}
            </div>
        `;
    },

    /**
     * Menjalankan animasi angka acak bergulir (lottery/slot machine) saat loading
     * @param {string} selector - Selektor jQuery elemen target
     * @param {number} digitCount - Jumlah digit acak yang di-roll
     * @param {string} suffix - Karakter tambahan setelah angka (misal: '%')
     */
    startLottery: function(selector, digitCount = 3, suffix = "") {
        var $el = $(selector);
        if ($el.length === 0) return;
        
        $el.each(function() {
            var el = this;
            if (el.dataset.sultanLotteryId) {
                clearInterval(parseInt(el.dataset.sultanLotteryId, 10));
            }
            
            var intervalId = setInterval(function() {
                var randNum = "";
                for (var i = 0; i < digitCount; i++) {
                    randNum += Math.floor(Math.random() * 10);
                }
                el.innerText = randNum + suffix;
            }, 60);
            
            el.dataset.sultanLotteryId = intervalId;
        });
    },

    /**
     * Menghentikan animasi angka acak bergulir
     * @param {string} selector - Selektor jQuery elemen target
     */
    stopLottery: function(selector) {
        var $el = $(selector);
        $el.each(function() {
            if (this.dataset.sultanLotteryId) {
                clearInterval(parseInt(this.dataset.sultanLotteryId, 10));
                this.dataset.sultanLotteryId = "";
            }
        });
    },

    /**
     * Merender Row 1 (Statistik Utama) secara Dinamis agar Seragam Visual
     * @param {string} prefix - Prefix ID unik (misal: 'dashsk')
     * @param {Object} labels - Label custom (default: { total: 'JML SEKOLAH', sudah: 'SUDAH', belum: 'BELUM', progress: 'PROGRESS' })
     */
    renderDashboardRow1: function(prefix, labels = {}) {
        const lbl = {
            total: labels.total || 'JML SEKOLAH',
            sudah: labels.sudah || 'SUDAH',
            belum: labels.belum || 'BELUM',
            progress: labels.progress || 'PROGRESS'
        };
        return `
        <!-- Row 1: Statistik Utama (4 Cards) -->
        <div class="row mb-3">
            <!-- KARTU 1: TOTAL -->
            <div class="col-lg-3 col-md-6 mb-2">
                <div class="sultan-metric-card metric-navy" style="height: 95px !important; min-height: 95px !important; padding: 12px 15px !important;">
                    <div class="inner">
                        <h3 id="${prefix}_cardTotalSekolah" class="dashsk-count-up" style="font-size: 2.0rem; font-weight: bold; margin-bottom: 2px;">0</h3>
                        <p style="font-weight: bold; margin-bottom: 0; font-size: 11px;">${lbl.total}</p>
                    </div>
                    <div class="icon" style="font-size: 40px; right: 15px; top: 12px;"><i class="fas fa-school"></i></div>
                </div>
            </div>

            <!-- KARTU 2: SUDAH -->
            <div class="col-lg-3 col-md-6 mb-2">
                <div class="sultan-metric-card metric-success" style="height: 95px !important; min-height: 95px !important; padding: 12px 15px !important;">
                    <div class="inner">
                        <h3 id="${prefix}_cardSudah" class="dashsk-count-up" style="font-size: 2.0rem; font-weight: bold; margin-bottom: 2px;">0</h3>
                        <p style="font-weight: bold; margin-bottom: 0; font-size: 11px;">${lbl.sudah}</p>
                    </div>
                    <div class="icon" style="font-size: 40px; right: 15px; top: 12px;"><i class="fas fa-check-circle"></i></div>
                </div>
            </div>

            <!-- KARTU 3: BELUM -->
            <div class="col-lg-3 col-md-6 mb-2">
                <div class="sultan-metric-card metric-maroon" style="height: 95px !important; min-height: 95px !important; padding: 12px 15px !important;">
                    <div class="inner">
                        <h3 id="${prefix}_cardBelum" class="dashsk-count-up" style="font-size: 2.0rem; font-weight: bold; margin-bottom: 2px;">0</h3>
                        <p style="font-weight: bold; margin-bottom: 0; font-size: 11px;">${lbl.belum}</p>
                    </div>
                    <div class="icon" style="font-size: 40px; right: 15px; top: 12px;"><i class="fas fa-times-circle"></i></div>
                </div>
            </div>

            <!-- KARTU 4: PROGRESS -->
            <div class="col-lg-3 col-md-6 mb-2">
                <div class="sultan-metric-card metric-gold" style="height: 95px !important; min-height: 95px !important; padding: 12px 15px !important;">
                    <div class="inner" style="width: 100%;">
                        <h3 id="${prefix}_cardProgress" class="dashsk-count-up" style="font-size: 2.0rem; font-weight: bold; margin-bottom: 2px; line-height: 1.1;">0%</h3>
                        <p style="font-weight: bold; margin-bottom: 0; font-size: 11px; opacity: 0.85; line-height: 1.1;">${lbl.progress}</p>
                        <div class="progress" style="height: 5px; border-radius: 3px; background-color: rgba(0, 0, 0, 0.1); width: 85%; margin-top: 6px;">
                            <div id="${prefix}_progressBar" class="progress-bar" role="progressbar" style="width: 0%; transition: width 0.6s ease, background-color 0.6s ease; border-radius: 3px;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <span id="${prefix}_progressText" style="display:none;">0% Selesai</span>
                    </div>
                    <div class="icon" style="font-size: 40px; right: 15px; top: 12px; opacity: 0.25;"><i class="fas fa-chart-line"></i></div>
                </div>
            </div>
        </div>
        `;
    },

    /**
     * Merender Row 1 (Statistik Utama) secara Minimal Modern (4 Cards Minimal)
     * @param {string} prefix - Prefix ID unik (misal: 'efiledash')
     * @param {Object} labels - Label custom
     */
    renderDashboardRow1Minimal: function(prefix, labels = {}) {
        const lbl = {
            total: labels.total || 'TARGET SASARAN',
            sudah: labels.sudah || 'SUDAH UNGGAH',
            belum: labels.belum || 'BELUM UNGGAH',
            progress: labels.progress || 'CAPAIAN PROGRES',
            subTotal: labels.subTotal || 'Total PTK Wajib Unggah',
            subSudah: labels.subSudah || 'PTK Telah Mengunggah',
            subBelum: labels.subBelum || 'PTK Belum Mengunggah',
            subProgress: labels.subProgress || 'Tingkat Kepatuhan'
        };
        return `
        <!-- Row 1: Statistik Utama Minimal Modern (4 Cards) -->
        <div class="row mb-4">
            <div class="col-lg-3 col-6 mb-3">
                <div class="sultan-metric-card-minimal minimal-slate h-100">
                    <div class="minimal-label"><i class="fas fa-users mr-1"></i>${lbl.total}</div>
                    <div class="minimal-value" id="${prefix}_cardTotalSekolah">0</div>
                    <div class="minimal-sub text-muted">${lbl.subTotal}</div>
                </div>
            </div>
            <div class="col-lg-3 col-6 mb-3">
                <div class="sultan-metric-card-minimal minimal-success h-100">
                    <div class="minimal-label"><i class="fas fa-check-circle mr-1"></i>${lbl.sudah}</div>
                    <div class="minimal-value" id="${prefix}_cardSudah">0</div>
                    <div class="minimal-sub text-muted">${lbl.subSudah}</div>
                </div>
            </div>
            <div class="col-lg-3 col-6 mb-3">
                <div class="sultan-metric-card-minimal minimal-maroon h-100">
                    <div class="minimal-label"><i class="fas fa-exclamation-circle mr-1"></i>${lbl.belum}</div>
                    <div class="minimal-value" id="${prefix}_cardBelum">0</div>
                    <div class="minimal-sub text-muted">${lbl.subBelum}</div>
                </div>
            </div>
            <div class="col-lg-3 col-6 mb-3">
                <div class="sultan-metric-card-minimal minimal-info h-100">
                    <div class="minimal-label"><i class="fas fa-chart-line mr-1"></i>${lbl.progress}</div>
                    <div class="minimal-value" id="${prefix}_cardProgress">0%</div>
                    <div class="minimal-sub text-muted">${lbl.subProgress}</div>
                </div>
            </div>
        </div>
        `;
    },

    /**
     * Merender Row 2 (Status Detil) secara Dinamis dan Fleksibel
     * @param {string} prefix - Prefix ID unik (misal: 'dashsk')
     * @param {Array} cards - Konfigurasi kartu di Row 2 (misal: [{key: 'Diproses', label: 'DIPROSES', theme: 'metric-info', icon: 'fas fa-spinner fa-spin', detailKey: 'infoProsesDetail'}, ...])
     */
    renderDashboardRow2: function(prefix, cards = []) {
        if (cards.length === 0) {
            cards = [
                { key: 'TotalDokumen', label: 'JML DOKUMEN', theme: 'metric-navy', icon: 'fas fa-file-alt', detailKey: 'infoTotalDetail' },
                { key: 'Diproses', label: 'DIPROSES', theme: 'metric-info', icon: 'fas fa-spinner fa-spin', detailKey: 'infoProsesDetail' },
                { key: 'Disetujui', label: 'DISETUJUI', theme: 'metric-success', icon: 'fas fa-check-double', detailKey: 'infoValidDetail' },
                { key: 'Revisi', label: 'REVISI', theme: 'metric-gold', icon: 'fas fa-exclamation-triangle', detailKey: 'infoRevisiDetail' },
                { key: 'Ditolak', label: 'DITOLAK', theme: 'metric-maroon', icon: 'fas fa-ban', detailKey: 'infoTolakDetail' }
            ];
        }

        const flexWidth = (100 / cards.length) + '%';
        let cardsHtml = '';
        cards.forEach(function(c) {
            let detailHtml = '';
            if (prefix === 'dashsk' && c.detailKey) {
                detailHtml = `
                    <div id="${prefix}_${c.detailKey}" class="small mt-0.5 pt-0.5 border-top" style="font-size: 11px; font-weight: 500; opacity: 0.85; line-height: 1.2;">
                        Awal: 0 | Perb: 0
                    </div>
                `;
            }
            cardsHtml += `
            <div style="flex: 0 0 ${flexWidth}; max-width: ${flexWidth}; padding: 0 7.5px;" class="mb-2 col-sm-6">
                <div class="sultan-metric-card ${c.theme}" style="min-height: 80px; padding: 10px 12px;">
                    <div class="inner">
                        <h3 id="${prefix}_card${c.key}" class="dashsk-count-up" style="font-size: 1.6rem; font-weight: bold; margin-bottom: 2px;">0</h3>
                        <p style="font-size: 10px; font-weight: bold; margin-bottom: 0;">${c.label}</p>
                    </div>
                    <div class="icon" style="font-size: 40px; right: 10px; top: 8px;"><i class="${c.icon}"></i></div>
                    ${detailHtml}
                </div>
            </div>
            `;
        });

        return `
        <!-- Row 2: Status Detil -->
        <div class="row mb-3">
            ${cardsHtml}
        </div>
        `;

    /**

    /**
     * Helper to render standardized list item content for Already Uploaded / Not Yet Uploaded list rows.
     * @param {number} index - Index/number of the item (1-indexed)

     * @param {string} dateOrLabel - Additional label or date (e.g. Uploaded date or status label)
     * @param {string} statusType - Status theme ('success', 'warning', 'info', 'danger')
     * @param {string} extraAttrs - Extra HTML attributes to insert on the list item tag (e.g. 'class="my-class" data-id="123"')
     */
    renderListItem: function(index, title, subtitle, dateOrLabel, statusType = 'success', extraAttrs = '') {
        let badgeColor = '#28a745';
        let textColor = 'text-success';
        let iconClass = 'fas fa-check';
        let badgeClass = 'badge-success';
        let iconColor = '#ffffff';
        let softBg = 'rgba(40, 167, 69, 0.15)';
        let numTextColor = '#28a745';

        const type = String(statusType).toLowerCase();
        if (type === 'danger' || type === 'error' || type === 'belum') {
            badgeColor = '#dc3545';
            textColor = 'text-danger';
            iconClass = 'fas fa-exclamation-circle';
            badgeClass = 'badge-danger';
            iconColor = '#ffffff';
            softBg = 'rgba(220, 53, 69, 0.15)';
            numTextColor = '#dc3545';
        } else if (type === 'warning' || type === 'revisi') {
            badgeColor = '#ffc107';
            textColor = 'text-warning';
            iconClass = 'fas fa-exclamation-triangle';
            badgeClass = 'badge-warning';
            iconColor = '#212529';
            softBg = 'rgba(243, 177, 16, 0.15)';
            numTextColor = '#f3b110';
        } else if (type === 'info' || type === 'proses' || type === 'diproses') {
            badgeColor = '#17a2b8';
            textColor = 'text-info';
            iconClass = 'fas fa-clock';
            badgeClass = 'badge-info';
            iconColor = '#ffffff';
            softBg = 'rgba(23, 162, 184, 0.15)';
            numTextColor = '#17a2b8';
        } else if (type === 'cetak' || type === 'dicetak') {
            badgeColor = '#6f42c1';
            textColor = 'text-primary';
            iconClass = 'fas fa-print';
            badgeClass = 'badge-primary';
            iconColor = '#ffffff';
            softBg = 'rgba(111, 66, 193, 0.15)';
            numTextColor = '#6f42c1';
        }

        let classes = 'list-group-item hover-sultan animated fadeIn d-flex align-items-center';
        if (extraAttrs && extraAttrs.indexOf('class="') > -1) {
            let classMatch = extraAttrs.match(/class="([^"]+)"/);
            if (classMatch) {
                classes += ' ' + classMatch[1];
                extraAttrs = extraAttrs.replace(/class="[^"]+"/, '');
            }
        }

        return `
            <li class="${classes} animate__animated animate__fadeIn" style="border-left: 3px solid ${badgeColor}; margin-bottom: 3px; border-radius: 4px; height: 48px !important; padding: 10px !important; overflow: hidden;" ${extraAttrs}>

                </div>
            </li>
        `;

    /**
     * Escape karakter HTML untuk keamanan teks
     * @param {string} text - Teks mentah
     */
    escapeHtml: function(text) {
        if (!text) return "";
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    },

     * STANDARISASI KOLOM: BADGE STATUS & BACA CATATAN

            icon = 'check-circle';

        } else if (s.includes('koreksi') || s.includes('cetak ulang') || s.includes('cetak_ulang')) {
            style = 'sultan-badge-warning';
            noteStyle = 'sultan-btn-note-warning';
            icon = 'redo';
            label = s.includes('teknis') ? "Pengajuan Cetak Ulang (Teknis)" : "Pengajuan Cetak Ulang";
        } else if (s.includes('dicetak')) {
            style = 'sultan-badge-dicetak';
            noteStyle = 'sultan-btn-note-info';
            icon = 'print';
            label = "Dicetak";
        } else if (s.includes('revisi')) {
            style = 'sultan-badge-info';
            noteStyle = 'sultan-btn-note-info';
            icon = 'sync-alt';
            label = "Revisi";
        } else if (s.includes('tolak')) {
            style = 'sultan-badge-danger';
            noteStyle = 'sultan-btn-note-danger';
            icon = 'times-circle';
            label = "Ditolak";
        }

        var badgeHtml = `<span class="sultan-badge ${style}"><i class="fas fa-${icon} mr-1"></i>${label}</span>`;

        // Aturan Universal Baca Catatan: Tampilkan icon indicator inline jika ada catatan valid
        if (catatan && String(catatan).trim().length > 2 && String(catatan).trim() !== "-") {
            var safeCatatan = SultanUI.escapeHtml(catatan);
            var previewKet = String(catatan).trim();
            if (previewKet.length > 60) previewKet = previewKet.substring(0, 60) + '...';
            var safePreview = SultanUI.escapeHtml(previewKet);

            var meta = typeof opsiMetadata === 'object' && opsiMetadata !== null ? opsiMetadata : {};
            var attrUnit = meta.unit || meta.sekolah ? `data-unit="${SultanUI.escapeHtml(meta.unit || meta.sekolah)}"` : '';
            var attrNoSk = meta.noSk || meta.dokumen ? `data-nosk="${SultanUI.escapeHtml(meta.noSk || meta.dokumen)}"` : '';
            var attrVerif = meta.verifikator ? `data-verifikator="${SultanUI.escapeHtml(meta.verifikator)}"` : '';
            var attrWaktu = meta.waktu || meta.tglVerval ? `data-waktu="${SultanUI.escapeHtml(meta.waktu || meta.tglVerval)}"` : '';

            var btnCatatan = `
                <button type="button" class="sultan-btn-note sultan-btn-note-inline ${noteStyle}"
                    data-pesan="${safeCatatan}"
                    ${attrUnit} ${attrNoSk} ${attrVerif} ${attrWaktu}
                    data-toggle="tooltip" data-placement="top" title="Catatan: ${safePreview}">
                    <i class="fas fa-comment-dots"></i>
                </button>
            `;

            return `<div class="text-left d-inline-flex align-items-center">${badgeHtml}${btnCatatan}</div>`;
        }

        return `<div class="text-left d-inline-flex align-items-center">${badgeHtml}</div>`;
    },

    /**
     * STANDARISASI KOLOM: NAMA PTK / ASN (NAMA, NIP/NIY, & SEKOLAH UNTUK ADMIN)
     * @param {string} nama - Nama lengkap PTK/ASN
     * @param {string} nip - NIP / NIY / NUPTK
     * @param {string} [unit] - Nama sekolah / unit kerja
     * @param {boolean} [isAdmin=false] - Flag apakah user adalah admin (tampilkan sekolah jika true)
     */
    renderPegawaiCell: function(nama, nip, unit, isAdmin = false) {

        return `

    /**

     */
    renderUnitSekolah: function(namaSekolah, npsn) {

        var subHtml = npsnClean ? `<div class="sultan-table-secondary text-muted text-left" style="font-size: 11px; margin-top: 3px; line-height: 1.2;">${SultanUI.escapeHtml(npsnClean)}</div>` : '';

    /**
     * STANDARISASI KOLOM: SEL 2 BARIS (TEKS UTAMA & KETERANGAN/SUB)

     * @param {Object} [opsi] - Opsi tambahan
     * @param {string} [opsi.warnaUtama] - Warna teks atas (default: var(--warna-maroon))

    renderCellDuaBaris: function(teksUtama, teksSub, opsi = {}) {

    /**
     * STANDARISASI KOLOM: TOMBOL DOKUMEN (PDF / LIHAT BERKAS)
     * @param {string} url - URL file / ID
     * @param {Object} [opsi] - Konfigurasi tombol
     * @param {string} [opsi.label='LIHAT'] - Label teks tombol
     * @param {string} [opsi.icon='fa-file-pdf'] - Ikon FontAwesome
     * @param {string} [opsi.onClick] - Fungsi onclick global (misal: 'tugas_bukaPreview')
     * @param {string} [opsi.tooltip='Lihat Dokumen'] - Teks tooltip
     */
    renderDokumenPdf: function(url, opsi = {}) {
        if (!url || String(url).trim().length < 5) {
            return '<div class="text-center"><span class="text-muted small">-</span></div>';
        }
        var label = opsi.label || 'LIHAT';
        var icon = opsi.icon || 'fa-file-pdf';
        var tooltip = opsi.tooltip || 'Lihat Dokumen';
        var safeUrl = String(url).replace(/'/g, "%27").replace(/"/g, "%22");
        
        var clickAttr = opsi.onClick 
            ? `onclick="${opsi.onClick}('${safeUrl}')"` 
            : `onclick="window.open('${safeUrl}', '_blank')"`;

        return `

                <button type="button" class="sultan-btn-pdf" ${clickAttr} data-toggle="tooltip" title="${SultanUI.escapeHtml(tooltip)}">

                </button>
            </div>
        `;
    },

    /**
     * STANDARISASI KOLOM: METADATA AUDIT LOG (DIUNGGAH, DIUBAH, DIVERIFIKASI)
     * Mendukung pemanggilan sederhana (waktu, user) atau pemanggilan terstruktur (opsi)
     * @param {string|Object} waktuOrOptions - Waktu/tanggal log ATAU objek { waktu, user, label, tooltip }
     * @param {string} [user] - Nama user pelaksana (jika argumen 1 string)
     * @param {string} [emptyText='-'] - Teks pengganti jika kosong
     */
    renderAuditCell: function(waktuOrOptions, user, emptyText = '-') {
        var w = "", u = "", label = "", customTooltip = "";
        if (typeof waktuOrOptions === 'object' && waktuOrOptions !== null) {
            w = waktuOrOptions.waktu || "";
            u = waktuOrOptions.user || "";
            label = waktuOrOptions.label || "";
            customTooltip = waktuOrOptions.tooltip || "";
        } else {
            w = waktuOrOptions || "";
            u = user || "";
        }

        var cleanW = String(w || "").trim();
        var cleanU = String(u || "").trim();

        if ((!cleanW || cleanW === "-") && (!cleanU || cleanU === "-")) {
            return `<div class="text-left text-muted font-italic" style="font-size: 11px;">${emptyText}</div>`;
        }

        var wkt = cleanW || '-';
        var usr = cleanU || '-';
        var labelHtml = label ? `<span class="font-weight-semibold text-secondary">${SultanUI.escapeHtml(label)}:</span> ` : '';
        var tooltipAttr = customTooltip ? `data-toggle="tooltip" data-placement="top" title="${SultanUI.escapeHtml(customTooltip)}"` : '';

        return `
            <div class="text-left" ${tooltipAttr}>
                <div class="font-weight-bold text-dark text-left" style="font-size: 11.5px; line-height: 1.2;">
                    ${SultanUI.escapeHtml(wkt)}
                </div>
                <div class="text-muted text-lowercase text-truncate text-left" style="font-size: 11px; line-height: 1.2; max-width: 180px;">
                    ${labelHtml}${SultanUI.escapeHtml(usr).toLowerCase()}
                </div>
            </div>
        `;
    },

    /**
     * STANDARISASI KOLOM: TOMBOL AKSI TERPUSAT
     * Otomatis mengunci tombol Edit & Hapus jika status data telah Disetujui / Valid / Selesai.
     * @param {Object} options - Konfigurasi aksi
     * @param {string|number} options.id - Row ID / ID baris data
     * @param {string} [options.status=""] - Status data (misal: "Disetujui", "Diproses")
     * @param {boolean} [options.isAdmin=false] - Flag apakah user adalah Admin / Verifikator
     * @param {boolean} [options.isDisetujui=false] - Flag explicit jika data sudah berstatus Disetujui
     * @param {boolean} [options.allowEditDisetujui=false] - Pengecualian khusus jika user boleh edit walau disetujui
     * @param {string} [options.onVerif] - Nama fungsi global untuk Verifikasi (misal: 'bukaVerif')
     * @param {string} [options.onEdit] - Nama fungsi global untuk Edit (misal: 'bukaEdit')
     * @param {string} [options.onHapus] - Nama fungsi global untuk Hapus (misal: 'bukaHapus')
     * @param {string} [options.extraButtons=""] - HTML tombol ekstra tambahan (jika ada)
     */
    renderTombolAksi: function(options = {}) {
        var id = options.id != null ? String(options.id) : "";
        var isAdmin = !!options.isAdmin;
        var st = String(options.status || "").toLowerCase();
        var isApproved = !!options.isDisetujui || (st.includes('setuju') || st.includes('acc') || st.includes('ok') || st.includes('valid') || st.includes('terima') || st.includes('selesai'));
        var allowEdit = !!options.allowEditDisetujui;
        // Aturan Global: Tombol Edit & Hapus terkunci jika data sudah Disetujui (kecuali allowEdit diberikan secara eksplisit)
        var isLocked = isApproved && !allowEdit;

        var btns = [];

        // 1. Tombol Verifikasi (Hanya Admin)
        if (isAdmin && options.onVerif) {
            btns.push(`
                <button type="button" class="sultan-btn-aksi sultan-btn-aksi-primary" onclick="${options.onVerif}('${id}')" data-toggle="tooltip" title="Verifikasi Data">
                    <i class="fas fa-clipboard-check"></i>
                </button>
            `);
        }

        // 2. Tombol Edit
        if (options.onEdit) {
            if (isLocked) {
                btns.push(`
                    <button type="button" class="sultan-btn-aksi" disabled style="opacity: 0.4; cursor: not-allowed;" data-toggle="tooltip" title="Terkunci (Sudah Disetujui)">
                        <i class="fas fa-pencil-alt"></i>
                    </button>
                `);
            } else {
                btns.push(`
                    <button type="button" class="sultan-btn-aksi sultan-btn-aksi-warning" onclick="${options.onEdit}('${id}')" data-toggle="tooltip" title="Edit Data">
                        <i class="fas fa-pencil-alt"></i>
                    </button>
                `);
            }
        }

        // 3. Tombol Hapus
        if (options.onHapus) {
            if (isLocked) {
                btns.push(`
                    <button type="button" class="sultan-btn-aksi" disabled style="opacity: 0.4; cursor: not-allowed;" data-toggle="tooltip" title="Terkunci (Sudah Disetujui)">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                `);
            } else {
                btns.push(`
                    <button type="button" class="sultan-btn-aksi sultan-btn-aksi-maroon" onclick="${options.onHapus}('${id}')" data-toggle="tooltip" title="Hapus Data">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                `);
            }
        }

        // 4. Tombol Ekstra jika ada
        if (options.extraButtons) {
            btns.push(options.extraButtons);
        }

        return `<div class="d-flex flex-nowrap justify-content-center" style="gap: 4px;">${btns.join('')}</div>`;
    }
};

/**
 * ============================================================================
 * SULTAN CRUD ENGINE (STANDARISASI GLOBAL)
 * Standar operasi tabel CRUD:
 * 1. updateRowPreserved: Update baris DataTables in-place tanpa mereset halaman/posisi
 * 2. isStatusLocked: Pengecekan status kunci dokumen (Disetujui/OK/Valid)
 * ============================================================================
 */
var SultanCRUD = {
    /**
     * Memeriksa apakah suatu status data terkunci (Disetujui/OK/Selesai)
     * @param {string} status - String status dokumen
     * @returns {boolean}
     */
    isStatusLocked: function(status) {
        if (!status) return false;
        var s = String(status).toLowerCase();
        return s.includes('setuju') || s.includes('acc') || s.includes('ok') || s.includes('valid') || s.includes('terima') || s.includes('selesai');
    },

    /**
     * Memperbarui satu baris DataTables dengan mempertahankan pagination & scroll saat ini.
     * Ideal untuk aksi verifikasi admin agar admin tetap berada di baris/halaman yang sama.
     * @param {Object} dataTableInstance - Instance DataTable (jQuery DataTables)
     * @param {string|number|Node|jQuery} rowSelector - Node TR, ID baris, atau selector baris
     * @param {Array} newRowData - Data array baru untuk baris tersebut
     */
    updateRowPreserved: function(dataTableInstance, rowSelector, newRowData) {
        if (!dataTableInstance) return;
        try {
            var currentPage = 0;
            if (typeof dataTableInstance.page === 'function') {
                currentPage = dataTableInstance.page();
            } else if (dataTableInstance.api && typeof dataTableInstance.api().page === 'function') {
                currentPage = dataTableInstance.api().page();
            }

            var dtApi = dataTableInstance.api ? dataTableInstance.api() : dataTableInstance;
            var targetRow = dtApi.row(rowSelector);
            if (targetRow && targetRow.length) {
                targetRow.data(newRowData).draw(false);
                if (typeof dtApi.page === 'function') {
                    dtApi.page(currentPage).draw(false);
                }
            } else {
                dtApi.draw(false);
            }
        } catch (e) {
            console.warn("SultanCRUD.updateRowPreserved fallback draw:", e);
            if (dataTableInstance.draw) dataTableInstance.draw(false);
        }
    }
};

/**
 * ============================================================================
 * SULTAN DASHBOARD ENGINE (TERPUSAT)
 * Arsitektur standar global untuk seluruh halaman dashboard di SIKS-Reborn.
 * Mengontrol konsep "1 Halaman 2 Mode" (Unit vs Rekap), Picker Jenjang/Sekolah,
 * State Transition, dan Data Binding.
 * ============================================================================
 */
var SultanDashboard = {
    /**
     * Inisialisasi Dashboard Dual Mode (Unit & Rekap)
     * @param {Object} config
     * @param {string} config.pageKey - Identifier unik halaman (misal: 'dashlapbul', 'dashsk', 'ptksds')
     * @param {string} config.unitViewId - ID container view Unit (misal: '#dashlapbul_viewUser')
     * @param {string} config.rekapViewId - ID container view Rekap (misal: '#dashlapbul_viewAdmin')
     * @param {string} [config.switchSelector='.sultan-segmented-btn'] - Selektor tombol switch
     * @param {Function} [config.onInit] - Callback saat dashboard pertama kali diinisialisasi
     * @param {Function} [config.onSwitchMode] - Callback saat mode berganti (mode: 'unit'|'rekap')
     * @param {Function} [config.onLoadUnit] - Callback untuk memuat data Mode Unit
     * @param {Function} [config.onLoadRekap] - Callback untuk memuat data Mode Rekap
     * @param {Object} [config.customRoleCheck] - Override role check jika ada
     */
    initDualMode: function(config) {
        if (!config || !config.pageKey) {
            console.error("SultanDashboard.initDualMode membutuhkan properti pageKey.");
            return;
        }

        var pageKey = config.pageKey;
        var unitViewId = config.unitViewId || ('#' + pageKey + '_viewUser');
        var rekapViewId = config.rekapViewId || ('#' + pageKey + '_viewAdmin');
        var switchSelector = config.switchSelector || '.sultan-segmented-btn';

        // 1. Deteksi Role Pengguna secara terpusat
        var user = (typeof getSesiUser === 'function') ? getSesiUser() : {};
        var role = (user.role || "").toLowerCase();
        var isAdmin = false;
        if (config.customRoleCheck && typeof config.customRoleCheck === 'function') {
            isAdmin = config.customRoleCheck(user, role);
        } else {
            isAdmin = (role.indexOf("admin") !== -1 || role.indexOf("verifikator") !== -1 || role.indexOf("korwil") !== -1);
        }

        var userNpsn = isAdmin ? "" : String(user.npsn !== undefined && user.npsn !== null ? user.npsn : (user.username || "")).trim();
        var userSekolah = isAdmin ? "" : String(user.unit || user.nama_lengkap || user.fullname || user.nama || "").trim();

        var dashboardType = config.dashboardType || config.tabType || 'multi_tab';

        // Simpan state di namespace SultanDashboard
        if (!window.SultanDashboardState) window.SultanDashboardState = {};
        window.SultanDashboardState[pageKey] = {
            isAdmin: isAdmin,
            userNpsn: userNpsn,
            userSekolah: userSekolah,
            dashboardType: dashboardType,
            currentMode: isAdmin ? 'rekap' : 'unit',
            unitViewId: unitViewId,
            rekapViewId: rekapViewId,
            config: config
        };

        var state = window.SultanDashboardState[pageKey];

        // Kontrol Visibilitas Segmented Switcher berdasarkan dashboardType & role:
        // - multi_tab: User hanya bisa Tab Unit (tombol Rekap di-hide atau seluruh switch di-hide jika single option), Admin bisa Unit & Rekap (Default Rekap).
        // - dual_tab: User & Admin beda view (switcher di-hide total).
        // - single_tab: User & Admin pakai bersama (semua tombol switcher tampil untuk User & Admin).
        if (dashboardType === 'multi_tab') {
            if (!isAdmin) {
                // User tidak boleh melihat/membuka tab Rekap
                $(`${switchSelector}[data-mode="rekap"]`).addClass('d-none');
                // Sembunyikan seluruh segmented switch wrapper jika hanya sisa 1 tombol Unit
                var $switchWrapper = $(switchSelector).closest('.sultan-segmented-switch');
                if ($switchWrapper.length) {
                    $switchWrapper.addClass('d-none');
                }
            } else {
                $(`${switchSelector}`).removeClass('d-none');
                var $switchWrapper = $(switchSelector).closest('.sultan-segmented-switch');
                if ($switchWrapper.length) {
                    $switchWrapper.removeClass('d-none');
                }
            }
        } else if (dashboardType === 'dual_tab') {
            var $switchWrapper = $(switchSelector).closest('.sultan-segmented-switch');
            if ($switchWrapper.length) {
                $switchWrapper.addClass('d-none');
            } else {
                $(switchSelector).addClass('d-none');
            }
        } else if (dashboardType === 'single_tab') {
            var $switchWrapper = $(switchSelector).closest('.sultan-segmented-switch');
            if ($switchWrapper.length) {
                $switchWrapper.removeClass('d-none');
            }
            $(switchSelector).removeClass('d-none');
        }

        // 2. Setup switcher click event
        $(document).off('click', switchSelector).on('click', switchSelector, function (e) {
            e.preventDefault();
            var mode = $(this).data('mode') || $(this).attr('data-mode');
            if (!mode) return;

            // Proteksi tambahan untuk multi_tab: User biasa dilarang buka Rekap
            if (dashboardType === 'multi_tab' && !isAdmin && mode === 'rekap') {
                return;
            }

            SultanDashboard.switchMode(pageKey, mode);
        });

        // 3. Panggil callback inisialisasi awal
        if (typeof config.onInit === 'function') {
            config.onInit(state);
        }

        // 4. Set mode awal
        SultanDashboard.switchMode(pageKey, state.currentMode, true);

        return state;
    },

    /**
     * Berpindah Mode antara Unit dan Rekap
     * @param {string} pageKey - Identifier halaman
     * @param {string} mode - 'unit' atau 'rekap'
     * @param {boolean} [isFirstLoad=false] - Penanda apakah dipanggil saat startup
     */
    switchMode: function(pageKey, mode, isFirstLoad = false) {
        var state = window.SultanDashboardState ? window.SultanDashboardState[pageKey] : null;
        if (!state) return;

        state.currentMode = mode;
        var config = state.config;

        // Update indikator active pada segmented button di seluruh halaman
        var switchSelector = config.switchSelector || '.sultan-segmented-btn';
        $(switchSelector).removeClass('active');
        $(`${switchSelector}[data-mode="${mode}"]`).addClass('active');

        // Tampilkan/sembunyikan container view dengan transisi halus
        if (mode === 'unit') {
            $(state.rekapViewId).addClass('d-none');
            $(state.unitViewId).removeClass('d-none');
            if (typeof config.onLoadUnit === 'function') {
                config.onLoadUnit(state, isFirstLoad);
            }
        } else {
            $(state.unitViewId).addClass('d-none');
            $(state.rekapViewId).removeClass('d-none');
            if (typeof config.onLoadRekap === 'function') {
                config.onLoadRekap(state, isFirstLoad);
            }
        }

        if (typeof config.onSwitchMode === 'function') {
            config.onSwitchMode(mode, state, isFirstLoad);
        }
    },

    /**
     * Konfigurasi Dropdown Jenjang & Nama Sekolah di Mode Unit secara Terpadu
     * @param {Object} options
     * @param {string} options.pageKey - Key dashboard
     * @param {string} options.wrapperJenjangId - Wrapper filter jenjang (misal: '#dashlapbul_wrapperUserJenjang')
     * @param {string} options.selectJenjangId - Select jenjang (misal: '#dashlapbul_filterUserJenjang')
     * @param {string} options.wrapperSekolahId - Wrapper filter sekolah (misal: '#dashlapbul_wrapperUserSekolah')
     * @param {string} options.selectSekolahId - Select sekolah (misal: '#dashlapbul_filterUserSekolah')
     * @param {string} options.btnActionId - Tombol Buka Data / Refresh Data (misal: '#dashlapbul_btnBukaDataUser')
     * @param {Array} options.masterSekolah - List master data sekolah [{npsn, namaSekolah/nama, jenjang}]
     * @param {Function} [options.onSelectSchool] - Callback saat sekolah dipilih
     */
    setupUnitSchoolPicker: function(options) {
        var pageKey = options.pageKey;
        var state = window.SultanDashboardState ? window.SultanDashboardState[pageKey] : null;
        if (!state) return;

        var $wrapperJenjang = $(options.wrapperJenjangId);
        var $selJenjang = $(options.selectJenjangId);
        var $wrapperSekolah = $(options.wrapperSekolahId);
        var $selSekolah = $(options.selectSekolahId);
        var $btn = $(options.btnActionId);

        if (!state.isAdmin) {
            // USER SEKOLAH: Sembunyikan jenjang, sekolah, dan garis pemisah tambahan
            $wrapperJenjang.addClass('d-none');
            $wrapperSekolah.addClass('d-none');
            var $group = $wrapperJenjang.closest('.filter-controls-group');
            if ($group.length) {
                var $dividers = $group.children('.divider-vertical');
                $dividers.addClass('d-none');
            }
            $selSekolah.empty().append(`<option value="${state.userNpsn}">${state.userSekolah || state.userNpsn}</option>`);
            $selSekolah.prop('disabled', true);

            // Jika segmented switch juga di-hide (pada multi_tab / dual_tab), sembunyikan seluruh filter bar wrapper
            var $filterBar = $wrapperJenjang.closest('.sultan-filter-bar-balanced');
            var $switchWrapper = $group ? $group.find('.sultan-segmented-switch') : $();
            if ($filterBar.length && ($switchWrapper.hasClass('d-none') || $switchWrapper.length === 0)) {
                $filterBar.addClass('d-none');
            }
        } else {
            // ADMIN: Tampilkan dropdown jenjang & sekolah (dapat dipilih) beserta semua garis pemisah
            var $filterBar = $wrapperJenjang.closest('.sultan-filter-bar-balanced');
            if ($filterBar.length) {
                $filterBar.removeClass('d-none');
            }
            $wrapperJenjang.removeClass('d-none');
            $wrapperSekolah.removeClass('d-none');
            var $group = $wrapperJenjang.closest('.filter-controls-group');
            if ($group.length) {
                $group.children('.divider-vertical').removeClass('d-none');
            } else {
                $wrapperJenjang.prev('.divider-vertical').removeClass('d-none');
                $wrapperSekolah.next('.divider-vertical').removeClass('d-none');
            }
            $selSekolah.prop('disabled', false);

            var populate = function(selectedJjg) {
                $selSekolah.empty().append('<option value="" selected>Pilih Sekolah...</option>');
                var list = options.masterSekolah || [];
                if (selectedJjg) {
                    list = list.filter(function(s) {
                        return String(s.jenjang || "").toUpperCase() === selectedJjg.toUpperCase();
                    });
                }
                list.sort(function(a, b) {
                    return String(a.namaSekolah || a.nama || "").localeCompare(String(b.namaSekolah || b.nama || ""));
                });

                list.forEach(function(s) {
                    var npsn = s.npsn || s.id || "";
                    var nama = s.namaSekolah || s.nama || npsn;
                    var isSelected = (state.userNpsn && state.userNpsn === npsn) ? ' selected' : '';
                    $selSekolah.append(`<option value="${npsn}"${isSelected}>${nama}</option>`);
                });
            };

            populate($selJenjang.val() || "");

            $selJenjang.off('change.sultanPicker').on('change.sultanPicker', function() {
                populate($(this).val());
                if (typeof options.onSelectSchool === 'function') {
                    options.onSelectSchool("", "");
                }
            });

            $selSekolah.off('change.sultanPicker').on('change.sultanPicker', function() {
                var chosenNpsn = $(this).val();
                var chosenName = $(this).find('option:selected').text();
                state.userNpsn = chosenNpsn || "";
                state.userSekolah = chosenNpsn ? chosenName : "";
                if (typeof options.onSelectSchool === 'function') {
                    options.onSelectSchool(chosenNpsn, chosenName);
                }
            });

            if ($btn.length && !$btn.hasClass('sultan-btn-refresh')) {
                $btn.html('<i class="fas fa-folder-open mr-1"></i> Buka Data');
            }
        }
    }
};
</script>
