<!-- 
  UI HELPERS SULTAN EDITION 
  File ini berisi komponen UI reusable seperti Skeleton Screens dan Empty States.
-->

<script>
var SultanUI = {
    /**
     * Menghasilkan HTML Empty State yang Cantik
     * @param {string} judul - Judul pesan
     * @param {string} deskripsi - Deskripsi pesan
     * @param {string} icon - FontAwesome icon class
     */
    emptyState: function(judul = "Data Kosong", deskripsi = "Belum ada data untuk ditampilkan.", icon = "fa-folder-open") {
        return `
            <div class="d-flex flex-column align-items-center justify-content-center p-5 text-center sultan-page-transition">
                <div class="icon-circle mb-4" style="width: 100px; height: 100px; font-size: 40px; line-height: 100px; border-radius: 30px; background: linear-gradient(135deg, #fff5f5 0%, #fff 100%); box-shadow: var(--shadow-md); border: 1px solid rgba(128,0,0,0.05);">
                    <i class="fas ${icon} text-maroon" style="opacity: 0.3;"></i>
                </div>
                <h5 class="font-weight-bold text-dark mb-2" style="letter-spacing: -0.5px;">${judul}</h5>
                <p class="text-muted small mb-0" style="max-width: 280px; line-height: 1.6;">${deskripsi}</p>
            </div>
        `;
    },

    /**
     * Menampilkan Spinner Loading Terpusat
     * @param {string} targetId - ID elemen target (misal: '#lapbulkelola_loadingState')
     * @param {string} text - Teks indikator proses
     */
    showLoading: function(targetId, text = "Memuat Data...") {
        var $target = $(targetId);
        
        if ($target.find('.sultan-loading-text').length > 0) {
            $target.find('.sultan-loading-text').text(text);
            $target.show();
            return;
        }

        const html = `
            <div class="sultan-loading-box sultan-page-transition">
                <div class="sultan-spinner-icon">
                    <i class="fas fa-circle-notch fa-spin"></i>
                </div>
                <h6 class="text-dark font-weight-bold sultan-loading-text mb-0" style="letter-spacing: 0.5px; text-transform: uppercase; font-size: 11px;">${text}</h6>
            </div>
        `;
        $target.html(html).show();
    },

    /**
     * Menyembunyikan Spinner Loading Terpusat
     * @param {string} targetId - ID elemen target
     */
    hideLoading: function(targetId) {
        $(targetId).empty().hide();
    },

    /**
     * Otomatis deteksi waktu terakhir dari data log (Global Standard)
     * @param {Array} rows - Data baris dari server
     * @param {string} txtId - ID penampung teks (default: '#statussk_txtLastUpdate')
     * @param {string} areaId - ID penampung area (default: '#statussk_lastUpdateArea')
     */
    autoDetectLastUpdate: function(rows, txtId, areaId) {
        var tglTerakhir = null;
        if (rows && rows.length > 0) {
            rows.forEach(function(row) {
                var searchArea = Array.isArray(row) ? row : Object.values(row);
                searchArea.forEach(function(val) {
                    var sVal = String(val || "");
                    if (sVal.includes('|')) {
                        var parts = sVal.split('|');
                        parts.forEach(function(p) {
                            p = p.trim();
                            if (p.match(/\d{2,4}[-/]\d{2}[-/]\d{2,4}/) || p.match(/\d{2}:\d{2}/)) {
                                if (!tglTerakhir || p > tglTerakhir) tglTerakhir = p;
                            }
                        });
                    }
                });
            });
        }
        if (!tglTerakhir) {
            var now = new Date();
            tglTerakhir = now.toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' (Sinkron)';
        }
        $(txtId).text(tglTerakhir);
        $(areaId).show();
    },

    /**
     * Merender Header Halaman secara Dinamis agar Seragam Visual
     * @param {string} title - Judul halaman
     * @param {string} subtitle - Subjudul deskriptif
     * @param {string} icon - Kelas ikon FontAwesome
     */
    renderHeader: function(title, subtitle = "", icon = "fas fa-info-circle") {
        var subtitleHtml = subtitle ? `<small class="text-white-50">${subtitle}</small>` : '';
        return `
            <div class="card sultan-dashboard-banner mb-3 animate__animated animate__fadeIn sultan-page-transition">
              <div class="card-body">
                <div class="sultan-dashboard-banner-content">
                  <h5 class="sultan-dashboard-banner-title">
                    <i class="${icon} mr-2 text-warning"></i>${title}
                  </h5>
                  ${subtitleHtml}
                </div>
                <div class="sultan-dashboard-banner-icon">
                  <i class="${icon}"></i>
                </div>
              </div>
            </div>
        `;
    },

    /**
     * Merender Filter Bar Global secara Dinamis dan Seragam
     * @param {Array} filters - Konfigurasi dropdown filter
     * @param {string} extraButtonsHtml - HTML tombol tambahan (misal: refresh/download)
     */
    renderFilterBar: function(filters = [], extraButtonsHtml = '') {
        var itemsHtml = '';
        filters.forEach(function(f) {
            var displayStyle = f.visible === false ? 'style="display:none;"' : '';
            var disabledAttr = f.disabled ? 'disabled' : '';
            var optionsHtml = f.value ? `<option value="${f.value}" selected>${f.text || f.value}</option>` : `<option value="">${f.placeholder || '- Memilih -'}</option>`;
            itemsHtml += `
                <div class="sultan-filter-item" id="${f.id}_container" ${displayStyle}>
                    <select id="${f.id}" class="form-control" ${disabledAttr}>
                        ${optionsHtml}
                    </select>
                    <i class="fas ${f.icon || 'fa-chevron-down'}"></i>
                </div>
            `;
        });
        
        return `
            <div class="sultan-filter-pill-container shadow-sm mb-4 sultan-page-transition">
                ${itemsHtml}
                ${extraButtonsHtml}
            </div>
        `;
    },

    /**
     * Menjalankan animasi angka acak bergulir (lottery/slot machine) saat loading
     * @param {string} selector - Selektor jQuery elemen target
     * @param {number} digitCount - Jumlah digit acak yang di-roll
     * @param {string} suffix - Karakter tambahan setelah angka (misal: '%')
     */
    startLottery: function(selector, digitCount = 3, suffix = "") {
        var $el = $(selector);
        if ($el.length === 0) return;
        
        $el.each(function() {
            var el = this;
            if (el.dataset.sultanLotteryId) {
                clearInterval(parseInt(el.dataset.sultanLotteryId, 10));
            }
            
            var intervalId = setInterval(function() {
                var randNum = "";
                for (var i = 0; i < digitCount; i++) {
                    randNum += Math.floor(Math.random() * 10);
                }
                el.innerText = randNum + suffix;
            }, 60);
            
            el.dataset.sultanLotteryId = intervalId;
        });
    },

    /**
     * Menghentikan animasi angka acak bergulir
     * @param {string} selector - Selektor jQuery elemen target
     */
    stopLottery: function(selector) {
        var $el = $(selector);
        $el.each(function() {
            if (this.dataset.sultanLotteryId) {
                clearInterval(parseInt(this.dataset.sultanLotteryId, 10));
                this.dataset.sultanLotteryId = "";
            }
        });
    },

    /**
     * Merender Row 1 (Statistik Utama) secara Dinamis agar Seragam Visual
     * @param {string} prefix - Prefix ID unik (misal: 'dashsk')
     * @param {Object} labels - Label custom (default: { total: 'JML SEKOLAH', sudah: 'SUDAH', belum: 'BELUM', progress: 'PROGRESS' })
     */
    renderDashboardRow1: function(prefix, labels = {}) {
        const lbl = {
            total: labels.total || 'JML SEKOLAH',
            sudah: labels.sudah || 'SUDAH',
            belum: labels.belum || 'BELUM',
            progress: labels.progress || 'PROGRESS'
        };
        return `
        <!-- Row 1: Statistik Utama (4 Cards) -->
        <div class="row mb-3">
            <!-- KARTU 1: TOTAL -->
            <div class="col-lg-3 col-md-6 mb-2">
                <div class="sultan-metric-card metric-navy" style="min-height: 85px; padding: 12px 15px;">
                    <div class="inner">
                        <h3 id="${prefix}_cardTotalSekolah" class="dashsk-count-up" style="font-size: 2.0rem; font-weight: bold; margin-bottom: 2px;">0</h3>
                        <p style="font-weight: bold; margin-bottom: 0; font-size: 11px;">${lbl.total}</p>
                    </div>
                    <div class="icon" style="font-size: 40px; right: 15px; top: 12px;"><i class="fas fa-school"></i></div>
                </div>
            </div>

            <!-- KARTU 2: SUDAH -->
            <div class="col-lg-3 col-md-6 mb-2">
                <div class="sultan-metric-card metric-success" style="min-height: 85px; padding: 12px 15px;">
                    <div class="inner">
                        <h3 id="${prefix}_cardSudahUnggah" class="dashsk-count-up" style="font-size: 2.0rem; font-weight: bold; margin-bottom: 2px;">0</h3>
                        <p style="font-weight: bold; margin-bottom: 0; font-size: 11px;">${lbl.sudah}</p>
                    </div>
                    <div class="icon" style="font-size: 40px; right: 15px; top: 12px;"><i class="fas fa-check-circle"></i></div>
                </div>
            </div>

            <!-- KARTU 3: BELUM -->
            <div class="col-lg-3 col-md-6 mb-2">
                <div class="sultan-metric-card metric-maroon" style="min-height: 85px; padding: 12px 15px;">
                    <div class="inner">
                        <h3 id="${prefix}_cardBelumUnggah" class="dashsk-count-up" style="font-size: 2.0rem; font-weight: bold; margin-bottom: 2px;">0</h3>
                        <p style="font-weight: bold; margin-bottom: 0; font-size: 11px;">${lbl.belum}</p>
                    </div>
                    <div class="icon" style="font-size: 40px; right: 15px; top: 12px;"><i class="fas fa-times-circle"></i></div>
                </div>
            </div>

            <!-- KARTU 4: PROGRESS -->
            <div class="col-lg-3 col-md-6 mb-2">
                <div class="sultan-metric-card metric-gold" style="min-height: 85px; padding: 10px 15px; display: flex; align-items: center;">
                    <div class="inner" style="width: 100%;">
                        <h3 id="${prefix}_cardProgress" class="dashsk-count-up" style="font-size: 1.8rem; font-weight: bold; margin-bottom: 0px; line-height: 1.1;">0%</h3>
                        <p style="font-weight: bold; margin-bottom: 0; font-size: 10px; opacity: 0.85; line-height: 1;">${lbl.progress}</p>
                        <div class="progress mt-1.5" style="height: 5px; border-radius: 3px; background-color: rgba(0, 0, 0, 0.1); width: 85%;">
                            <div id="${prefix}_progressBar" class="progress-bar" role="progressbar" style="width: 0%; transition: width 0.6s ease, background-color 0.6s ease; border-radius: 3px;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <span id="${prefix}_progressText" style="display:none;">0% Selesai</span>
                    </div>
                    <div class="icon" style="font-size: 40px; right: 15px; top: 12px; opacity: 0.25;"><i class="fas fa-chart-line"></i></div>
                </div>
            </div>
        </div>
        `;
    },

    /**
     * Merender Row 2 (Status Detil) secara Dinamis dan Fleksibel
     * @param {string} prefix - Prefix ID unik (misal: 'dashsk')
     * @param {Array} cards - Konfigurasi kartu di Row 2 (misal: [{key: 'Diproses', label: 'DIPROSES', theme: 'metric-info', icon: 'fas fa-spinner fa-spin', detailKey: 'infoProsesDetail'}, ...])
     */
    renderDashboardRow2: function(prefix, cards = []) {
        if (cards.length === 0) {
            cards = [
                { key: 'TotalDokumen', label: 'JML DOKUMEN', theme: 'metric-navy', icon: 'fas fa-file-alt', detailKey: 'infoTotalDetail' },
                { key: 'Diproses', label: 'DIPROSES', theme: 'metric-info', icon: 'fas fa-spinner fa-spin', detailKey: 'infoProsesDetail' },
                { key: 'Disetujui', label: 'DISETUJUI', theme: 'metric-success', icon: 'fas fa-check-double', detailKey: 'infoValidDetail' },
                { key: 'Revisi', label: 'REVISI', theme: 'metric-gold', icon: 'fas fa-exclamation-triangle', detailKey: 'infoRevisiDetail' },
                { key: 'Ditolak', label: 'DITOLAK', theme: 'metric-maroon', icon: 'fas fa-ban', detailKey: 'infoTolakDetail' }
            ];
        }

        const flexWidth = (100 / cards.length) + '%';
        let cardsHtml = '';
        cards.forEach(function(c) {
            cardsHtml += `
            <div style="flex: 0 0 ${flexWidth}; max-width: ${flexWidth}; padding: 0 7.5px;" class="mb-2 col-sm-6">
                <div class="sultan-metric-card ${c.theme}" style="min-height: 80px; padding: 10px 12px;">
                    <div class="inner">
                        <h3 id="${prefix}_card${c.key}" class="dashsk-count-up" style="font-size: 1.6rem; font-weight: bold; margin-bottom: 2px;">0</h3>
                        <p style="font-size: 10px; font-weight: bold; margin-bottom: 0;">${c.label}</p>
                    </div>
                    <div class="icon" style="font-size: 40px; right: 10px; top: 8px;"><i class="${c.icon}"></i></div>
                    <div id="${prefix}_${c.detailKey}" class="small mt-0.5 pt-0.5 border-top" style="font-size: 11px; font-weight: 500; opacity: 0.85; line-height: 1.2;">
                        Awal: 0 | Perb: 0
                    </div>
                </div>
            </div>
            `;
        });

        return `
        <!-- Row 2: Status Detil -->
        <div class="row mb-3">
            ${cardsHtml}
        </div>
        `;
    }
};
</script>
