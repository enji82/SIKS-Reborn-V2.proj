<style>
  /* Menghilangkan style overrides lokal agar menggunakan style premium global dari css_sultan.html */
</style>

<section class="content">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12">

        <div class="sultan-filter-pill-container shadow-sm mb-4 sultan-page-transition">
          <!-- Filter Tahun -->
          <div class="sultan-filter-item">
            <select id="seragamdash_filterTahun" class="form-control" aria-label="Pilih Tahun">
              <option value="">- Memuat Tahun... -</option>
            </select>
            <i class="fas fa-chevron-down"></i>
          </div>
          <!-- Filter Kategori -->
          <div class="sultan-filter-item">
            <select id="seragamdash_filterKategori" class="form-control" aria-label="Pilih Kategori">
              <option value="penerimaan">Penerimaan</option>
              <option value="penyerahan">Penyerahan</option>
            </select>
            <i class="fas fa-chevron-down"></i>
          </div>
          <!-- Filter Jenis Seragam -->
          <div class="sultan-filter-item" id="seragamdash_filterJenisContainer">
            <select id="seragamdash_filterJenis" class="form-control" aria-label="Pilih Jenis Seragam">
              <option value="SEMUA">Semua Jenis Seragam</option>
              <option value="Merah Putih">Merah Putih</option>
              <option value="Pramuka">Pramuka</option>
            </select>
            <i class="fas fa-chevron-down"></i>
          </div>
          
          <div class="divider-vertical d-none d-md-block mx-2"></div>

          <button type="button" id="seragamdash_btnRefresh" class="sultan-btn-refresh" title="Segarkan Data">
            <i class="fas fa-sync-alt"></i>
          </button>
        </div>

        <div id="seragamdash_loadingState"></div>

        <div id="seragamdash_dashboardState">

          <!-- Row 1: Statistik Utama (4 Cards) - Rendered Dynamically -->
          <div id="seragamdash_metricRow1"></div>

          <!-- Row 2: Status Detil (5 Columns) - Rendered Dynamically -->
          <div id="seragamdash_metricRow2"></div>

          <!-- Dua Kolom: Sudah & Belum Unggah -->
          <div class="row">
            <div class="row w-100 m-0">
              <!-- Kolom Sudah Unggah -->
              <div class="col-md-6 mb-3 d-flex flex-column">
                <div class="card-sultan flex-fill d-flex flex-column border-success" style="border-width: 2px; border-radius: var(--radius-sultan) !important; overflow: hidden; margin-bottom: 0.5rem;">
                  <div class="card-header card-header-sultan-adaptive py-2.5 d-flex justify-content-between align-items-center">
                    <h6 class="m-0 font-weight-bold text-success" style="font-size: 14px;"><i class="fas fa-check-circle mr-2"></i>Sudah Unggah</h6>
                    <span class="shadow-sm" id="seragamdash_lblBadgeSudah" style="font-size: 12px; background-color: #28a745 !important; color: #ffffff !important; padding: 2px 8px !important; border-radius: 10px !important; font-weight: bold !important; display: inline-block !important; line-height: 1.2 !important;">0</span>
                  </div>
                  <div class="p-2 bg-light border-bottom">
                    <div class="input-group input-group-sm">
                      <div class="input-group-prepend"><span class="input-group-text bg-white border-right-0"><i class="fas fa-search text-muted"></i></span></div>
                      <input type="text" id="seragamdash_inputCariSudah" class="form-control border-left-0" placeholder="Cari NPSN atau nama sekolah...">
                    </div>
                  </div>
                  <div class="card-body p-0" style="height: calc(100vh - 390px); min-height: 280px; overflow-y: auto;">
                    <ul class="list-group list-group-flush" id="seragamdash_listSudah">
                      <li class="list-group-item text-center text-muted py-4"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat daftar...</li>
                    </ul>
                  </div>
                </div>
              </div>

              <!-- Kolom Belum Unggah -->
              <div class="col-md-6 mb-3 d-flex flex-column">
                <div class="card-sultan flex-fill d-flex flex-column border-danger" style="border-width: 2px; border-radius: var(--radius-sultan) !important; overflow: hidden; margin-bottom: 0.5rem;">
                  <div class="card-header card-header-sultan-adaptive py-2.5 d-flex justify-content-between align-items-center">
                    <h6 class="m-0 font-weight-bold text-danger" style="font-size: 14px;"><i class="fas fa-times-circle mr-2"></i>Belum Unggah</h6>
                    <span class="shadow-sm" id="seragamdash_lblBadgeBelum" style="font-size: 12px; background-color: #dc3545 !important; color: #ffffff !important; padding: 2px 8px !important; border-radius: 10px !important; font-weight: bold !important; display: inline-block !important; line-height: 1.2 !important;">0</span>
                  </div>
                  <div class="p-2 bg-light border-bottom">
                    <div class="input-group input-group-sm">
                      <div class="input-group-prepend"><span class="input-group-text bg-white border-right-0"><i class="fas fa-search text-muted"></i></span></div>
                      <input type="text" id="seragamdash_inputCariBelum" class="form-control border-left-0" placeholder="Cari NPSN atau nama sekolah...">
                      <div class="input-group-append">
                        <button type="button" id="seragamdash_btnSalinWa" class="btn btn-success px-3" title="Salin Daftar ke WhatsApp" style="border-top-right-radius: 4px; border-bottom-right-radius: 4px;">
                          <i class="fab fa-whatsapp mr-1"></i> Salin
                        </button>
                      </div>
                    </div>
                  </div>
                  <div class="card-body p-0" style="height: calc(100vh - 390px); min-height: 280px; overflow-y: auto;">
                    <ul class="list-group list-group-flush" id="seragamdash_listBelum">
                      <li class="list-group-item text-center text-muted py-4"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat daftar...</li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div><!-- /seragamdash_dashboardState -->

      </div>
    </div>
  </div>
</section>

<script>
var SERAGAM_DASH_CACHE_REKAP = [];
var SERAGAM_DASH_CACHE_LAPORAN = [];
var SERAGAM_DASH_PENDING_REQ = 0;
var SERAGAM_DASH_LIST_SUDAH = [];
var SERAGAM_DASH_LIST_BELUM = [];

function seragam_dash_showSkeleton() {
    if (typeof SultanUI !== 'undefined') {
        SultanUI.startLottery('#seragamdash_cardTotalSekolah, #seragamdash_cardSudah, #seragamdash_cardBelum, #seragamdash_statusTotal, #seragamdash_statusDiproses, #seragamdash_statusDisetujui, #seragamdash_statusRevisi, #seragamdash_statusDitolak', 3);
        SultanUI.startLottery('#seragamdash_cardProgress', 2, '%');
    } else {
        $('#seragamdash_cardTotalSekolah, #seragamdash_cardSudah, #seragamdash_cardBelum, #seragamdash_cardProgress')
            .html('<span class="sultan-skeleton" style="width: 50px; height: 22px; display: inline-block; vertical-align: middle;"></span>');
        $('#seragamdash_statusTotal, #seragamdash_statusDiproses, #seragamdash_statusDisetujui, #seragamdash_statusRevisi, #seragamdash_statusDitolak')
            .html('<span class="sultan-skeleton" style="width: 40px; height: 18px; display: inline-block; vertical-align: middle;"></span>');
    }
    $('#seragamdash_progressText').html('<span class="sultan-skeleton" style="width: 80px; height: 14px; display: inline-block;"></span>');
    $('#seragamdash_lastUpdate').text('-');
    
    var skeletonList = '';
    for (var i = 0; i < 4; i++) {
        skeletonList += '<li class="list-group-item p-3 d-flex align-items-center">' +
            '<div class="w-100">' +
              '<div class="sultan-skeleton mb-1" style="width: 60%; height: 16px;"></div>' +
              '<div class="sultan-skeleton" style="width: 40%; height: 12px;"></div>' +
            '</div>' +
            '</li>';
    }
    $('#seragamdash_listSudah, #seragamdash_listBelum').html(skeletonList);
}

$(document).ready(function() {
    // Render metric rows secara dinamis (Terpusat lewat SultanUI)
    $('#seragamdash_metricRow1').html(SultanUI.renderDashboardRow1('seragamdash', { total: 'JUMLAH SASARAN', sudah: 'SUDAH UNGGAH', belum: 'BELUM UNGGAH', progress: 'PROGRESS' }));
    var row2Cards = [
        { key: 'statusTotal', label: 'JML DOKUMEN', theme: 'metric-navy', icon: 'fas fa-file-alt' },
        { key: 'statusDiproses', label: 'DIPROSES', theme: 'metric-info', icon: 'fas fa-spinner fa-spin' },
        { key: 'statusDisetujui', label: 'DISETUJUI', theme: 'metric-success', icon: 'fas fa-check-double' },
        { key: 'statusRevisi', label: 'REVISI', theme: 'metric-gold', icon: 'fas fa-edit' },
        { key: 'statusDitolak', label: 'DITOLAK', theme: 'metric-maroon', icon: 'fas fa-ban' }
    ];
    $('#seragamdash_metricRow2').html(SultanUI.renderDashboardRow2('seragamdash', row2Cards));

    $('#seragamdash_dashboardState').show();
    seragam_dash_showSkeleton();

    $(document).off('click', '#seragamdash_btnRefresh').on('click', '#seragamdash_btnRefresh', function() {
        var thn = $('#seragamdash_filterTahun').val();
        var kat = $('#seragamdash_filterKategori').val();
        if (thn) seragam_dash_loadData(thn, kat, true);
    });

    $(document).off('change', '#seragamdash_filterTahun, #seragamdash_filterKategori').on('change', '#seragamdash_filterTahun, #seragamdash_filterKategori', function() {
        var thn = $('#seragamdash_filterTahun').val();
        var kat = $('#seragamdash_filterKategori').val();
        if (thn) seragam_dash_loadData(thn, kat);
    });

    $(document).off('change', '#seragamdash_filterJenis').on('change', '#seragamdash_filterJenis', function() {
        seragam_dash_terapkanFilterLokal();
    });

    // Pemicu pencarian lokal
    $(document).on('input', '#seragamdash_inputCariSudah', function() {
        seragam_dash_renderListSudah($(this).val());
    });
    $(document).on('input', '#seragamdash_inputCariBelum', function() {
        seragam_dash_renderListBelum($(this).val());
    });

    // Tombol Salin WA
    $(document).off('click', '#seragamdash_btnSalinWa').on('click', '#seragamdash_btnSalinWa', function() {
        if (SERAGAM_DASH_LIST_BELUM.length === 0) {
            Sultan.alert('info', 'Daftar Kosong', 'Tidak ada sekolah yang belum mengirim laporan.');
            return;
        }
        var thn = $('#seragamdash_filterTahun').val() || '';
        var kat = $('#seragamdash_filterKategori').val() || 'penerimaan';
        var labelKat = kat.toUpperCase();
        var jns = $('#seragamdash_filterJenis').val() || 'SEMUA';
        var labelJns = jns === 'SEMUA' ? 'Semua Jenis Seragam' : jns;
        
        var txt = '*[SIKS - DAFTAR BELUM UNGGAH LAPORAN ' + labelKat + ' SERAGAM GRATIS]*\n' +
                  'Tahun Pelajaran: ' + thn + '\n' +
                  'Kategori: ' + (kat === 'penyerahan' ? 'Penyerahan' : 'Penerimaan') + '\n' +
                  'Jenis Seragam: ' + labelJns + '\n\n' +
                  'Berikut daftar sekolah yang belum mengunggah berkas Laporan ' + (kat === 'penyerahan' ? 'Penyerahan' : 'Penerimaan') + ':\n';
                  
        SERAGAM_DASH_LIST_BELUM.forEach(function(s, idx) {
            txt += (idx + 1) + '. ' + s.namaSekolah + ' (' + s.npsn + ') - Sasaran: ' + s.jmlPenerima + ' murid\n';
        });
        txt += '\nMohon untuk segera mengunggah Laporan Penerimaan di aplikasi SIKS. Terima kasih.';
        
        var temp = $('<textarea>');
        $('body').append(temp);
        temp.val(txt).select();
        document.execCommand('copy');
        temp.remove();
        
        Sultan.alert('success', 'Berhasil Disalin', 'Daftar sekolah belum unggah telah disalin ke clipboard Anda dalam format WhatsApp.');
    });

    seragam_dash_initYears();
});

function seragam_dash_initYears() {
    google.script.run.withSuccessHandler(function(jsonStr) {
        var res = JSON.parse(jsonStr);
        if (!res.success) {
            Sultan.alert('danger', 'Error', 'Gagal memuat tahun pelajaran: ' + res.message);
            return;
        }
        var select = $('#seragamdash_filterTahun');
        select.empty();
        res.data.forEach(function(yr) {
            select.append('<option value="' + yr + '">' + yr + '</option>');
        });
        if (res.data.length > 0) {
            var kat = $('#seragamdash_filterKategori').val() || 'penerimaan';
            seragam_dash_loadData(res.data[0], kat);
        }
    }).seragam_getAvailableYears();
}

function seragam_dash_loadData(tahun, kategori, forceRefresh) {
    if (SERAGAM_DASH_PENDING_REQ > 0) return;
    SERAGAM_DASH_PENDING_REQ = 1;
    
    var btn = $('#seragamdash_btnRefresh');
    btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin text-maroon"></i>');
    $('#seragamdash_filterTahun, #seragamdash_filterKategori, #seragamdash_filterJenis').prop('disabled', true);
    
    seragam_dash_showSkeleton();

    google.script.run.withSuccessHandler(function(jsonStr) {
        SERAGAM_DASH_PENDING_REQ = 0;
        btn.prop('disabled', false).html('<i class="fas fa-sync-alt text-maroon"></i>');
        $('#seragamdash_filterTahun, #seragamdash_filterKategori, #seragamdash_filterJenis').prop('disabled', false);

        var res = JSON.parse(jsonStr);
        if (!res.success) {
            Sultan.alert('danger', 'Error', 'Gagal memuat data: ' + res.message);
            return;
        }

        SERAGAM_DASH_CACHE_REKAP = res.rekap || [];
        SERAGAM_DASH_CACHE_LAPORAN = res.laporan || [];

        seragam_dash_terapkanFilterLokal();
        var timeString = new Date().toLocaleTimeString('id-ID') + " WIB";
        $('#seragamdash_lastUpdate').text(timeString);

    }).withFailureHandler(function(err) {
        SERAGAM_DASH_PENDING_REQ = 0;
        btn.prop('disabled', false).html('<i class="fas fa-sync-alt text-maroon"></i>');
        $('#seragamdash_filterTahun, #seragamdash_filterKategori, #seragamdash_filterJenis').prop('disabled', false);
        Sultan.alert('danger', 'Koneksi Terputus', 'Gagal memuat data dasbor.');
    }).seragam_getDashboardData(tahun, kategori);
}

function seragam_dash_terapkanFilterLokal() {
    var jenisFilt = $('#seragamdash_filterJenis').val() || "SEMUA";

    // Petakan laporan yang masuk per NPSN berdasarkan filter Jenis Seragam
    var mapLap = {}; // NPSN -> { sp, dok, tgl, status }
    
    // Inisialisasi hitungan status
    var statTotal = 0;
    var statDiproses = 0;
    var statDisetujui = 0;
    var statRevisi = 0;
    var statDitolak = 0;

    SERAGAM_DASH_CACHE_LAPORAN.forEach(function(l) {
        var matchJenis = false;
        if (jenisFilt === "SEMUA") {
            matchJenis = true;
        } else {
            matchJenis = String(l.jenis || "").trim().toUpperCase() === jenisFilt.trim().toUpperCase();
        }

        if (matchJenis) {
            // Jika ada banyak laporan, utamakan yang memiliki berkas lengkap
            if (!mapLap[l.npsn] || (!mapLap[l.npsn].sp && l.sp)) {
                mapLap[l.npsn] = { sp: l.sp, dok: l.dok, tgl: l.tgl || "-", status: l.status || "DIPROSES" };
            }
            
            // Hitung status unggahan
            statTotal++;
            var st = String(l.status || "DIPROSES").toUpperCase().trim();
            if (st === "DISETUJUI") statDisetujui++;
            else if (st === "REVISI") statRevisi++;
            else if (st === "DITOLAK") statDitolak++;
            else statDiproses++;
        }
    });

    // Pilah rekap data sekolah sasaran
    SERAGAM_DASH_LIST_SUDAH = [];
    SERAGAM_DASH_LIST_BELUM = [];

    SERAGAM_DASH_CACHE_REKAP.forEach(function(r) {
        var lap = mapLap[r.npsn];
        var sudahKirim = false;
        var tglUpload = "-";
        
        if (lap && (lap.sp || lap.dok)) {
            sudahKirim = true;
            tglUpload = lap.tgl || "-";
        }

        var item = {
            npsn: r.npsn,
            namaSekolah: r.namaSekolah,
            jmlPenerima: r.jmlPenerima,
            tglUpload: tglUpload,
            sudahKirim: sudahKirim
        };

        if (sudahKirim) {
            SERAGAM_DASH_LIST_SUDAH.push(item);
        } else {
            SERAGAM_DASH_LIST_BELUM.push(item);
        }
    });

    // Hitung ulang metrik lokal
    var totalSek = SERAGAM_DASH_CACHE_REKAP.length;
    var sudah = SERAGAM_DASH_LIST_SUDAH.length;
    var belum = SERAGAM_DASH_LIST_BELUM.length;
    var pct = totalSek > 0 ? Math.round((sudah / totalSek) * 100) : 0;

    // Animasikan Metrik Baris 1
    seragam_dash_animateValue('seragamdash_cardTotalSekolah', totalSek);
    seragam_dash_animateValue('seragamdash_cardSudah', sudah);
    seragam_dash_animateValue('seragamdash_cardBelum', belum);
    if (typeof SultanUI !== 'undefined') {
        SultanUI.stopLottery('#seragamdash_cardProgress');
    }
    $('#seragamdash_cardProgress').text(pct + '%');
    
    // Animasikan Metrik Baris 2 (Status)
    seragam_dash_animateValue('seragamdash_statusTotal', statTotal);
    seragam_dash_animateValue('seragamdash_statusDiproses', statDiproses);
    seragam_dash_animateValue('seragamdash_statusDisetujui', statDisetujui);
    seragam_dash_animateValue('seragamdash_statusRevisi', statRevisi);
    seragam_dash_animateValue('seragamdash_statusDitolak', statDitolak);
    
    $('#seragamdash_lblBadgeSudah').text(sudah);
    $('#seragamdash_lblBadgeBelum').text(belum);

    // Progress bar global (Model Tipis Polos)
    var pBar = $('#seragamdash_progressBar');
    pBar.css('width', pct + '%').attr('aria-valuenow', pct);
    $('#seragamdash_progressText').text(pct + '% Selesai');
    
    if (pct < 30) pBar.css('background-color', '#dc3545'); 
    else if (pct < 75) pBar.css('background-color', '#ffc107'); 
    else pBar.css('background-color', '#28a745');

    // Kosongkan kolom pencarian & Render
    $('#seragamdash_inputCariSudah').val('');
    $('#seragamdash_inputCariBelum').val('');
    
    seragam_dash_renderListSudah();
    seragam_dash_renderListBelum();
}

function seragam_dash_renderListSudah(query) {
    query = String(query || "").trim().toUpperCase();
    var listEl = $('#seragamdash_listSudah');
    listEl.empty();
    
    var data = SERAGAM_DASH_LIST_SUDAH.filter(function(r) {
        if (!query) return true;
        return String(r.namaSekolah || "").toUpperCase().indexOf(query) !== -1 || String(r.npsn || "").indexOf(query) !== -1;
    });

    if (data.length === 0) {
        listEl.append('<li class="list-group-item text-center py-5">' +
                  '<i class="fas fa-exclamation-triangle fa-3x text-warning mb-3 opacity-50"></i><br>' +
                  '<div class="font-weight-bold text-dark mb-1" style="font-size: 13px;">Belum Ada Data</div>' +
                  '<div class="text-muted" style="font-size: 12px;">Belum ada sekolah yang mengunggah berkas.</div>' +
                  '</li>');
        return;
    }

    data.forEach(function(r) {
        var li = $('<li class="list-group-item py-2 px-3 hover-sultan">');
        var container = $('<div class="d-flex justify-content-between align-items-center">');
        var left = $('<div>');
        left.append('<div class="nama-asn font-weight-bold text-dark text-uppercase mb-0" style="font-size: 13px; line-height: 1.2;">' + seragam_dash_esc(r.namaSekolah) + '</div>');
        left.append('<div class="text-muted" style="font-size: 11px; line-height: 1.2;">NPSN: ' + r.npsn + ' | Sasaran: <b>' + r.jmlPenerima + '</b> murid</div>');
        left.append('<div class="unit-asn text-success font-weight-bold mt-1 text-uppercase" style="font-size: 11px; line-height: 1.2;">(Uploaded: ' + r.tglUpload + ')</div>');
        
        var right = $('<span class="badge badge-success ml-2 px-2 py-1"><i class="fas fa-check"></i></span>');
        container.append(left).append(right);
        li.append(container);
        listEl.append(li);
    });
}

function seragam_dash_renderListBelum(query) {
    query = String(query || "").trim().toUpperCase();
    var listEl = $('#seragamdash_listBelum');
    listEl.empty();
    
    var data = SERAGAM_DASH_LIST_BELUM.filter(function(r) {
        if (!query) return true;
        return String(r.namaSekolah || "").toUpperCase().indexOf(query) !== -1 || String(r.npsn || "").indexOf(query) !== -1;
    });

    if (data.length === 0) {
        listEl.append('<li class="list-group-item text-center py-5">' +
                  '<i class="fas fa-check-circle fa-3x text-success mb-3 opacity-50"></i><br>' +
                  '<div class="font-weight-bold text-dark mb-1" style="font-size: 13px;">Luar Biasa!</div>' +
                  '<div class="text-muted" style="font-size: 12px;">Tidak ada sekolah yang belum unggah.</div>' +
                  '</li>');
        return;
    }

    data.forEach(function(r) {
        var li = $('<li class="list-group-item py-2 px-3 hover-sultan">');
        var container = $('<div class="d-flex justify-content-between align-items-center">');
        var left = $('<div>');
        left.append('<div class="nama-asn font-weight-bold text-dark text-uppercase mb-0" style="font-size: 13px; line-height: 1.2;">' + seragam_dash_esc(r.namaSekolah) + '</div>');
        left.append('<div class="text-muted" style="font-size: 11px; line-height: 1.2;">NPSN: ' + r.npsn + ' | Sasaran: <b>' + r.jmlPenerima + '</b> murid</div>');
        left.append('<div class="unit-asn text-danger font-weight-bold mt-1 text-uppercase" style="font-size: 11px; line-height: 1.2;">(BELUM UNGGAH)</div>');
        
        var right = $('<span class="badge badge-danger ml-2 px-2 py-1"><i class="fas fa-exclamation-circle"></i></span>');
        container.append(left).append(right);
        li.append(container);
        listEl.append(li);
    });
}

function seragam_dash_animateValue(id, end) {
    if (typeof SultanUI !== 'undefined') {
        SultanUI.stopLottery('#' + id);
    }
    var obj = document.getElementById(id);
    if (!obj) return;
    var start = 0;
    var duration = 400;
    var range = end - start;
    var minTimer = 25;
    var stepTime = Math.abs(Math.floor(duration / range));
    stepTime = Math.max(stepTime, minTimer);
    var startTime = new Date().getTime();
    var endTime = startTime + duration;
    var timer;
    
    function run() {
        var now = new Date().getTime();
        var remaining = Math.max((endTime - now) / duration, 0);
        var value = Math.round(end - (remaining * range));
        obj.innerHTML = value;
        if (value == end) {
            clearInterval(timer);
        }
    }
    timer = setInterval(run, stepTime);
    run();
}

function seragam_dash_esc(t) { return t ? String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;') : ''; }
