<style>
  #seragamdash_tabelRekap_wrapper,
  #seragamdash_tabelRekap_wrapper .dataTables_length,
  #seragamdash_tabelRekap_wrapper .dataTables_length select,
  #seragamdash_tabelRekap_wrapper .dataTables_filter,
  #seragamdash_tabelRekap_wrapper .dataTables_filter input,
  #seragamdash_tabelRekap_wrapper .dataTables_info,
  #seragamdash_tabelRekap_wrapper .dataTables_paginate,
  #seragamdash_tabelRekap_wrapper .pagination,
  #seragamdash_tabelRekap_wrapper .page-item,
  #seragamdash_tabelRekap_wrapper .page-link,
  #seragamdash_tabelRekap_wrapper table,

    font-size: 13px !important;

  #seragamdash_tabelRekap .badge {

</style>

<section class="content sultan-page-transition">
  <div class="container-fluid">

    <!-- FILTER BAR TERPUSAT SULTAN UI -->
    <div class="sultan-filter-bar-balanced mb-4 sultan-page-transition" id="seragamdash_filterBar">
      <div class="filter-controls-group">

        <!-- 1. Filter Tahun -->
        <div class="sultan-filter-item" id="seragamdash_filterTahunContainer">
          <select id="seragamdash_filterTahun" class="form-control" aria-label="Pilih Tahun">
            <option value="">Memuat Tahun...</option>
          </select>
          <i class="fas fa-chevron-down"></i>
        </div>

        <!-- 2. Filter Penerimaan / Penyerahan -->
        <div class="sultan-filter-item" id="seragamdash_filterKategoriContainer" style="min-width: 170px;">
          <select id="seragamdash_filterKategori" class="form-control" aria-label="Pilih Kategori">
            <option value="penerimaan" selected>Penerimaan</option>
            <option value="penyerahan">Penyerahan</option>
          </select>
          <i class="fas fa-chevron-down"></i>
        </div>

        <!-- 3. Filter Jenis Seragam -->
        <div class="sultan-filter-item" id="seragamdash_filterJenisContainer" style="min-width: 180px;">
          <select id="seragamdash_filterJenis" class="form-control" aria-label="Pilih Jenis Seragam">
            <option value="SEMUA">Semua Jenis Seragam</option>
            <option value="Merah Putih">Merah Putih</option>
            <option value="Pramuka">Pramuka</option>
          </select>
          <i class="fas fa-chevron-down"></i>
        </div>

        <!-- 4. Filter Jenjang (Khusus Admin) -->
        <div class="sultan-filter-item" id="seragamdash_filterJenjangContainer" style="min-width: 150px; display: none;">
          <select id="seragamdash_filterJenjang" class="form-control" aria-label="Pilih Jenjang">
            <option value="SEMUA">Semua Jenjang</option>
          </select>
          <i class="fas fa-chevron-down"></i>
        </div>

        <!-- 5. Filter Nama Sekolah (Khusus Admin) -->
        <div class="sultan-filter-item" id="seragamdash_filterSekolahContainer" style="min-width: 220px; max-width: 360px; display: none;">
          <select id="seragamdash_filterSekolah" class="form-control" aria-label="Pilih Nama Sekolah">
            <option value="SEMUA">Semua Sekolah</option>
          </select>
          <i class="fas fa-chevron-down"></i>
        </div>

        <div class="divider-vertical d-none d-md-block mx-1"></div>

        <!-- Tombol Refresh Data -->
        <button type="button" id="seragamdash_btnRefresh" class="sultan-btn-refresh" title="Refresh Data">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
    </div>

    <!-- Loading State Terpusat -->
    <div id="seragamdash_loadingState" class="sultan-loading-box sultan-page-transition">
      <div class="sultan-spinner-icon">
        <i class="fas fa-circle-notch fa-spin"></i>
      </div>
      <h6 class="text-muted font-weight-bold sultan-loading-text mb-0" style="letter-spacing: 0.5px; text-transform: uppercase; font-size: 11px;">Memuat Data Dasbor Seragam Gratis...</h6>
    </div>

    <div id="seragamdash_dashboardState" style="display: none;">

      <!-- Row 1: Card Progress (4 Metric Cards Minimal) -->
      <div id="seragamdash_metricRow1"></div>

      <!-- Row 2: Card Status Breakdown (5 Status Cards) -->
      <div id="seragamdash_metricRow2"></div>

      <!-- Row 3: Card DAFTAR SEKOLAH SUDAH UNGGAH (4 Cards List Terpusat) -->
      <div id="seragamdash_statusCardsContainer" class="mb-4"></div>

      <!-- Row 4: Card Tabel Rekapitulasi Per Unit Kerja -->
      <div class="row mb-4">
        <div class="col-12">
          <div class="card card-sultan-terpusat shadow-xs border-0">
            <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center pt-3 pb-2 px-3">
              <h6 class="font-weight-bold text-sultan-utama m-0 text-uppercase" id="seragamdash_tableTitle" style="letter-spacing: 0.5px;">
                <i class="fas fa-table mr-2"></i>REKAPITULASI PER UNIT KERJA
              </h6>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive sultan-scroll">
                <table id="seragamdash_tabelRekap" class="table table-hover sultan-table-datatable text-nowrap mb-0 w-100">
                  <thead>
                    <tr>
                      <th class="align-middle text-left font-weight-bold col-sticky-left" style="min-width: 250px;">NAMA SEKOLAH</th>
                      <th class="align-middle text-center font-weight-bold">JML PENERIMA</th>
                      <th class="align-middle text-center font-weight-bold">SUDAH UNGGAH</th>
                      <th class="align-middle text-center font-weight-bold">BELUM UNGGAH</th>
                      <th class="align-middle text-center font-weight-bold" style="width: 120px;">PROGRESS</th>
                    </tr>
                  </thead>
                  <tbody id="seragamdash_tbodyRekap"></tbody>
                  <tfoot class="bg-light font-weight-bold text-sultan-utama" style="font-size: 13px;">
                    <tr>
                      <td class="text-left align-middle font-weight-bold">JUMLAH TOTAL</td>
                      <td class="text-center align-middle" id="seragamdash_totalPenerima">0</td>
                      <td class="text-center align-middle" id="seragamdash_totalSudah">0</td>
                      <td class="text-center align-middle" id="seragamdash_totalBelum">0</td>
                      <td class="text-center align-middle" id="seragamdash_totalProgress">0%</td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>
</section>

<script>
  var SERAGAM_DASH_CACHE_REKAP = [];
  var SERAGAM_DASH_CACHE_LAPORAN = [];
  var SERAGAM_DASH_TABEL_REKAP = null;
  var SERAGAM_DASH_IS_ADMIN = false;

  $(document).ready(function () {
    var userLogin = typeof getSesiUser === 'function' ? getSesiUser() : {};
    var rStr = String(userLogin.role || "").toLowerCase();
    SERAGAM_DASH_IS_ADMIN = (rStr === "admin" || rStr === "superadmin");

    // 1. Render Row 1: Card Progress (JML SEKOLAH, SUDAH UNGGAH, BELUM UNGGAH, PROGRESS)
    if (typeof SultanUI !== 'undefined' && SultanUI.renderDashboardRow1Minimal) {
      $('#seragamdash_metricRow1').html(SultanUI.renderDashboardRow1Minimal('seragamdash', {
        totalLabel: 'JML SEKOLAH',
        sudahLabel: 'SUDAH UNGGAH',
        belumLabel: 'BELUM UNGGAH',
        progressLabel: 'PROGRESS'
      }));
    }

    // 2. Render Row 2: Card Status (JML DOKUMEN, DIPROSES, DISETUJUI, REVISI, DITOLAK)
    if (typeof SultanUI !== 'undefined' && SultanUI.renderDashboardRow2Minimal) {
      $('#seragamdash_metricRow2').html(SultanUI.renderDashboardRow2Minimal('seragamdash', {
        totalLabel: 'JML DOKUMEN',
        diprosesLabel: 'DIPROSES',
        disetujuiLabel: 'DISETUJUI',
        revisiLabel: 'REVISI',
        ditolakLabel: 'DITOLAK'
      }));
    }

    // 3. Render Row 3: Card DAFTAR SEKOLAH SUDAH UNGGAH (DIPROSES, DISETUJUI, REVISI, DITOLAK)
    if (typeof SultanUI !== 'undefined' && SultanUI.renderDashboardStatusCards4) {
      $('#seragamdash_statusCardsContainer').html(SultanUI.renderDashboardStatusCards4('seragamdash', {
        title: 'DAFTAR SEKOLAH SUDAH UNGGAH',
        diprosesLabel: 'DIPROSES',
        disetujuiLabel: 'DISETUJUI',
        revisiLabel: 'REVISI',
        ditolakLabel: 'DITOLAK',
        copyActionFn: 'seragamdash_salinWaRekap()'
      }));
    }

    // Filter Jenjang & Sekolah untuk Admin / User
    if (SERAGAM_DASH_IS_ADMIN) {
      $('#seragamdash_filterJenjangContainer').show();
      $('#seragamdash_filterSekolahContainer').show();
    } else {
      $('#seragamdash_filterJenjangContainer').hide();
      $('#seragamdash_filterSekolahContainer').hide();
    }

    // Event listeners
    $('#seragamdash_btnRefresh').click(function () {
      var thn = $('#seragamdash_filterTahun').val();
      var kat = $('#seragamdash_filterKategori').val();
      if (thn) seragam_dash_loadData(thn, kat, true);
    });

    $('#seragamdash_filterTahun, #seragamdash_filterKategori').change(function () {
      var thn = $('#seragamdash_filterTahun').val();
      var kat = $('#seragamdash_filterKategori').val();
      if (thn) seragam_dash_loadData(thn, kat);
    });

    $('#seragamdash_filterJenis, #seragamdash_filterJenjang, #seragamdash_filterSekolah').change(function () {
      if (this.id === 'seragamdash_filterJenjang') {
        populateSekolahDropdown();
      }
      seragam_dash_terapkanFilterLokal();
    });

    // Live search listener 4 Card List Status
    $(document).off('keyup', '#seragamdash_inputCariDiproses').on('keyup', '#seragamdash_inputCariDiproses', function() {
      var val = $(this).val().toLowerCase().trim();
      $('#seragamdash_listDiproses li.seragamdash-item').filter(function() {
        $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
      });
    });
    $(document).off('keyup', '#seragamdash_inputCariDisetujui').on('keyup', '#seragamdash_inputCariDisetujui', function() {
      var val = $(this).val().toLowerCase().trim();
      $('#seragamdash_listDisetujui li.seragamdash-item').filter(function() {
        $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
      });
    });
    $(document).off('keyup', '#seragamdash_inputCariRevisi').on('keyup', '#seragamdash_inputCariRevisi', function() {
      var val = $(this).val().toLowerCase().trim();
      $('#seragamdash_listRevisi li.seragamdash-item').filter(function() {
        $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
      });
    });
    $(document).off('keyup', '#seragamdash_inputCariDitolak').on('keyup', '#seragamdash_inputCariDitolak', function() {
      var val = $(this).val().toLowerCase().trim();
      $('#seragamdash_listDitolak li.seragamdash-item').filter(function() {
        $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
      });
    });

    seragam_dash_initYears();
  });

  function seragam_dash_initYears() {
    google.script.run.withSuccessHandler(function(jsonStr) {
      var res = typeof jsonStr === 'string' ? JSON.parse(jsonStr) : jsonStr;
      if (!res.success) {
        if (typeof SultanUI !== 'undefined') {
          SultanUI.showLoadingError('#seragamdash_loadingState', 'Gagal memuat tahun: ' + (res.message || 'Error'));
        }
        return;
      }
      var select = $('#seragamdash_filterTahun');
      select.empty();
      (res.data || []).forEach(function(yr) {
        select.append('<option value="' + yr + '">' + yr + '</option>');
      });
      if (res.data && res.data.length > 0) {
        var kat = $('#seragamdash_filterKategori').val() || 'penerimaan';
        seragam_dash_loadData(res.data[0], kat);
      }
    }).seragam_getAvailableYears();
  }

  function seragam_dash_loadData(tahun, kategori, forceRefresh) {
    if (typeof SultanUI !== 'undefined') {
      SultanUI.showLoading('#seragamdash_loadingState', 'Memuat Data Dasbor Seragam Gratis...');
    } else {
      $('#seragamdash_loadingState').show();
    }
    $('#seragamdash_dashboardState').hide();

    google.script.run
      .withSuccessHandler(function (jsonStr) {
        if (typeof SultanUI !== 'undefined') {
          SultanUI.hideLoading('#seragamdash_loadingState');
        } else {
          $('#seragamdash_loadingState').hide();
        }

        var res = typeof jsonStr === 'string' ? JSON.parse(jsonStr) : jsonStr;
        if (!res.success) {
          if (typeof SultanUI !== 'undefined') {
            SultanUI.showLoadingError('#seragamdash_loadingState', 'Gagal memuat data: ' + (res.message || 'Unknown error'));
          }
          return;
        }

        SERAGAM_DASH_CACHE_REKAP = res.rekap || [];
        SERAGAM_DASH_CACHE_LAPORAN = res.laporan || [];

        if (SERAGAM_DASH_IS_ADMIN) {
          populateJenjangDropdown(SERAGAM_DASH_CACHE_REKAP);
          populateSekolahDropdown();
        }

        $('#seragamdash_dashboardState').fadeIn();
        seragam_dash_terapkanFilterLokal();
      })
      .withFailureHandler(function (err) {
        if (typeof SultanUI !== 'undefined') {
          SultanUI.showLoadingError('#seragamdash_loadingState', 'Terjadi kesalahan: ' + (err.message || err));
        }
      })
      .seragam_getDashboardData(tahun, kategori);
  }

  function populateJenjangDropdown(rekapList) {
    var selJenjang = $('#seragamdash_filterJenjang');
    var curVal = selJenjang.val() || "SEMUA";
    var jenjangSet = new Set();
    
    (rekapList || []).forEach(function(r) {
      var j = (r.jenjang || r.bentuk || r.bentukPendidikan || "SD").toUpperCase().trim();
      if (j && j !== '-') jenjangSet.add(j);
    });

    selJenjang.empty().append('<option value="SEMUA">Semua Jenjang</option>');
    Array.from(jenjangSet).sort().forEach(function(j) {
      selJenjang.append($('<option>', { value: j, text: j }));
    });
    selJenjang.val(curVal);
  }

  function populateSekolahDropdown() {
    if (!SERAGAM_DASH_CACHE_REKAP) return;
    var selSekolah = $('#seragamdash_filterSekolah');
    var selJenjang = $('#seragamdash_filterJenjang').val() || "SEMUA";
    var curVal = selSekolah.val() || "SEMUA";

    selSekolah.empty().append('<option value="SEMUA">Semua Sekolah</option>');
    
    var filtered = SERAGAM_DASH_CACHE_REKAP.filter(function(r) {
      if (selJenjang === "SEMUA") return true;
      var j = (r.jenjang || r.bentuk || r.bentukPendidikan || "SD").toUpperCase().trim();
      return j === selJenjang;
    });

    filtered.sort(function(a,b) { return String(a.namaSekolah || "").localeCompare(String(b.namaSekolah || "")); });

    filtered.forEach(function(r) {
      selSekolah.append($('<option>', { value: r.npsn, text: r.namaSekolah }));
    });

    if (selSekolah.find('option[value="' + curVal + '"]').length > 0) {
      selSekolah.val(curVal);
    } else {
      selSekolah.val("SEMUA");
    }
  }

  function seragam_dash_terapkanFilterLokal() {
    var jenisFilt = $('#seragamdash_filterJenis').val() || "SEMUA";
    var fJenjang = $('#seragamdash_filterJenjang').val() || "SEMUA";
    var fSekolah = $('#seragamdash_filterSekolah').val() || "SEMUA";
    var kat = $('#seragamdash_filterKategori').val() || "penerimaan";

    // Update judul tabel
    var labelKat = (kat === "penyerahan") ? "PENYERAHAN" : "PENERIMAAN";
    $('#seragamdash_tableTitle').html('<i class="fas fa-table mr-2"></i>REKAPITULASI ' + labelKat + ' SERAGAM GRATIS PER UNIT KERJA');

    // Filter rekap data sekolah sasaran
    var rekapFiltered = SERAGAM_DASH_CACHE_REKAP.filter(function(r) {
      var j = (r.jenjang || r.bentuk || r.bentukPendidikan || "SD").toUpperCase().trim();
      var matchJenjang = (fJenjang === "SEMUA") || (j === fJenjang);
      var matchSekolah = (fSekolah === "SEMUA") || (r.npsn === fSekolah);
      return matchJenjang && matchSekolah;
    });

    // Urutkan alfabetis
    rekapFiltered.sort(function(a, b) {
      return String(a.namaSekolah || "").localeCompare(String(b.namaSekolah || ""));
    });

    // Petakan laporan yang masuk per NPSN berdasarkan filter Jenis Seragam
    var mapLap = {};
    var statTotal = 0;
    var statDiproses = 0;
    var statDisetujui = 0;
    var statRevisi = 0;
    var statDitolak = 0;

    var listDiproses = [];
    var listDisetujui = [];
    var listRevisi = [];
    var listDitolak = [];
    var listBelum = [];

    // Filter laporan sesuai jenis dan daftar sekolah yang tersaring
    SERAGAM_DASH_CACHE_LAPORAN.forEach(function(l) {
      var matchJenis = (jenisFilt === "SEMUA") || (String(l.jenis || "").trim().toUpperCase() === jenisFilt.trim().toUpperCase());
      
      if (matchJenis) {
        var matchSekolahInRekap = rekapFiltered.some(function(r) { return r.npsn === l.npsn; });
        if (matchSekolahInRekap) {
          if (!mapLap[l.npsn] || (!mapLap[l.npsn].sp && l.sp)) {
            mapLap[l.npsn] = { sp: l.sp, dok: l.dok, tgl: l.tgl || "-", status: l.status || "DIPROSES" };
          }

          statTotal++;
          var st = String(l.status || "DIPROSES").toUpperCase().trim();
          if (st === "DISETUJUI") statDisetujui++;
          else if (st === "REVISI") statRevisi++;
          else if (st === "DITOLAK") statDitolak++;
          else statDiproses++;
        }
      }
    });

    var totSekolah = rekapFiltered.length;
    var sudah = 0;
    var belum = 0;
    var sumPenerima = 0;

    var dtArray = [];

    rekapFiltered.forEach(function(r) {
      var lap = mapLap[r.npsn];
      var sudahKirim = false;
      var statusStr = "Belum Unggah";

      if (lap && (lap.sp || lap.dok)) {
        sudahKirim = true;
        statusStr = String(lap.status || "DIPROSES").toUpperCase().trim();
      }

      var jmlP = parseInt(r.jmlPenerima || 0);
      sumPenerima += jmlP;

      if (sudahKirim) {
        sudah++;
        if (statusStr === "DISETUJUI") {
          listDisetujui.push({ nama: r.namaSekolah, npsn: r.npsn });
        } else if (statusStr === "REVISI") {
          listRevisi.push({ nama: r.namaSekolah, npsn: r.npsn });
        } else if (statusStr === "DITOLAK") {
          listDitolak.push({ nama: r.namaSekolah, npsn: r.npsn });
        } else {
          listDiproses.push({ nama: r.namaSekolah, npsn: r.npsn });
        }
      } else {
        belum++;
        listBelum.push({ nama: r.namaSekolah, npsn: r.npsn });
      }

      var progressHtml = '<div class="d-flex align-items-center justify-content-center" style="font-size:13px;">' +
                           '<span class="mr-2 font-weight-bold" style="min-width:38px;text-align:right;">' + (sudahKirim ? '100%' : '0%') + '</span>' +
                           '<div class="progress shadow-xs" style="width:60px;height:7px;border-radius:4px;background-color:rgba(0,0,0,0.06);">' +
                             '<div class="progress-bar ' + (sudahKirim ? 'bg-success' : 'bg-danger') + '" role="progressbar" style="width:' + (sudahKirim ? '100%' : '0%') + ';border-radius:4px;"></div>' +
                           '</div>' +
                         '</div>';

      dtArray.push([
        '<span class="font-weight-bold sultan-table-primary">' + r.namaSekolah + '</span>',
        jmlP > 0 ? '<span class="font-weight-bold">' + jmlP.toLocaleString('id-ID') + '</span>' : '<span class="text-muted opacity-50 font-weight-normal">-</span>',
        sudahKirim ? '<span class="font-weight-bold text-success">1</span>' : '<span class="text-muted opacity-50 font-weight-normal">-</span>',
        !sudahKirim ? '<span class="font-weight-bold text-danger">1</span>' : '<span class="text-muted opacity-50 font-weight-normal">-</span>',
        progressHtml
      ]);
    });

    // Cache list untuk salin WA
    window.SERAGAM_DASH_LIST_BELUM_CACHE = listBelum;
    window.SERAGAM_DASH_LIST_REVISI_CACHE = listRevisi;
    window.SERAGAM_DASH_LIST_DITOLAK_CACHE = listDitolak;

    // 1. Update Card Progress
    var percentage = totSekolah > 0 ? Math.round((sudah / totSekolah) * 100) : 0;
    $('#seragamdash_cardTotalSekolah').text(totSekolah.toLocaleString('id-ID'));
    $('#seragamdash_cardSudah').text(sudah.toLocaleString('id-ID'));
    $('#seragamdash_cardBelum').text(belum.toLocaleString('id-ID'));
    $('#seragamdash_cardProgress').text(percentage + '%');

    // 2. Update Card Status Breakdown
    $('#seragamdash_cardTotalDokumen').text(statTotal.toLocaleString('id-ID'));
    $('#seragamdash_cardDiproses').text(statDiproses.toLocaleString('id-ID'));
    $('#seragamdash_cardDisetujui').text(statDisetujui.toLocaleString('id-ID'));
    $('#seragamdash_cardRevisi').text(statRevisi.toLocaleString('id-ID'));
    $('#seragamdash_cardDitolak').text(statDitolak.toLocaleString('id-ID'));

    // 3. Update Badges 4 Status Cards List
    $('#seragamdash_badgeDiproses').text(statDiproses);
    $('#seragamdash_badgeDisetujui').text(statDisetujui);
    $('#seragamdash_badgeRevisi').text(statRevisi);
    $('#seragamdash_badgeDitolak').text(statDitolak);

    // Populate 4 List Cards (Hanya nama sekolah saja)
    var categories = [
      { id: '#seragamdash_listDiproses', list: listDiproses, emptyText: 'Tidak ada data diproses' },
      { id: '#seragamdash_listDisetujui', list: listDisetujui, emptyText: 'Tidak ada data disetujui' },
      { id: '#seragamdash_listRevisi', list: listRevisi, emptyText: 'Tidak ada data revisi' },
      { id: '#seragamdash_listDitolak', list: listDitolak, emptyText: 'Tidak ada data ditolak' }
    ];

    categories.forEach(function(cat) {
      var $list = $(cat.id);
      $list.empty();

      if (cat.list.length === 0) {
        var emptyHtml = typeof SultanUI !== 'undefined' && SultanUI.renderListEmptyInfo ? 
          SultanUI.renderListEmptyInfo(cat.emptyText) : 
          '<li class="list-group-item bg-transparent text-center text-muted py-4 border-0" style="font-size:11px;">' + cat.emptyText + '</li>';
        $list.html(emptyHtml);
      } else {
        cat.list.forEach(function(item, index) {
          var idxNum = index + 1;
          var nama = String(item.nama || "-").toUpperCase();
          var delay = Math.min(index * 20, 300);

          var itemHtml = 
            '<li class="list-group-item bg-transparent py-2 px-3 font-weight-bold dashlapbul-list-item d-flex align-items-center animate__animated animate__fadeIn seragamdash-item" style="font-size:12px;line-height:1.4;animation-delay:' + delay + 'ms;">' +
              '<span class="badge dashlapbul-badge-idx mr-2" style="width:25px;min-width:25px;flex-shrink:0;">' + idxNum + '</span>' +
              '<span class="school-name flex-grow-1 text-truncate" style="word-break:break-word;">' + nama + '</span>' +
            '</li>';

          $list.append(itemHtml);
        });
      }
    });

    // 4. Render Tabel Rekapitulasi (Default 10 Entri)
    if ($.fn.DataTable.isDataTable('#seragamdash_tabelRekap')) {
      $('#seragamdash_tabelRekap').DataTable().destroy();
    }
    SERAGAM_DASH_TABEL_REKAP = $('#seragamdash_tabelRekap').DataTable({
      destroy: true,
      data: dtArray,
      ordering: true,
      pageLength: 10,
      autoWidth: false,
      order: [[0, 'asc']],
      columnDefs: [
        { targets: 0, className: 'text-left align-middle' },
        { targets: [1, 2, 3, 4], className: 'text-center align-middle' }
      ],
      language: {
        search: "Cari:",
        lengthMenu: "Tampilkan _MENU_ data",
        info: "Menampilkan _START_ sampai _END_ dari _TOTAL_ data",
        emptyTable: "Tidak ada data yang tersedia pada tabel ini",
        paginate: { previous: "Sebelumnya", next: "Berikutnya" }
      },
      dom: "<'row mb-2'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>>" +
           "<'row'<'col-sm-12'tr>>" +
           "<'row mt-2'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>"
    });

    // Update Footer Totals
    var formatTotal = function(val) {
      return val === 0 ? "-" : val.toLocaleString('id-ID');
    };
    $('#seragamdash_totalPenerima').text(formatTotal(sumPenerima));
    $('#seragamdash_totalSudah').text(formatTotal(sudah));
    $('#seragamdash_totalBelum').text(formatTotal(belum));
    $('#seragamdash_totalProgress').text(percentage + '%');
  }

  function seragamdash_salinWaRekap() {
    var belumList = window.SERAGAM_DASH_LIST_BELUM_CACHE || [];
    var revisiList = window.SERAGAM_DASH_LIST_REVISI_CACHE || [];
    var ditolakList = window.SERAGAM_DASH_LIST_DITOLAK_CACHE || [];

    if (belumList.length === 0 && revisiList.length === 0 && ditolakList.length === 0) {
      if (typeof Sultan !== 'undefined' && Sultan.notif) {
        Sultan.notif.info('Semua sekolah telah mengunggah dokumen seragam gratis dan berstatus valid.');
      } else {
        alert('Semua sekolah telah mengunggah dokumen.');
      }
      return;
    }

    var fTahun = $('#seragamdash_filterTahun').val() || '-';
    var fKategori = $('#seragamdash_filterKategori option:selected').text() || 'Penerimaan';
    var fJenis = $('#seragamdash_filterJenis option:selected').text() || 'Semua Jenis Seragam';
    var timeNow = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) + ' ' +
                  new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

    var txt = "*📢 REKAP DOKUMEN SERAGAM GRATIS*\n";
    txt += "📁 *Kategori:* " + fKategori.toUpperCase() + " (" + fJenis + ")\n";
    txt += "📅 *Tahun:* " + fTahun + "\n";
    txt += "⏱️ *Data per:* " + timeNow + " WIB\n";
    txt += "=========================================\n\n";

    if (belumList.length > 0) {
      txt += "🔴 *BELUM UNGGAH (" + belumList.length + " Sekolah):*\n";
      belumList.forEach(function (item, i) {
        var nama = (typeof item === 'string') ? item : (item.nama || "-");
        txt += (i + 1) + ". " + nama + "\n";
      });
      txt += "\n";
    }

    if (revisiList.length > 0) {
      txt += "🟡 *PERLU REVISI (" + revisiList.length + " Sekolah):*\n";
      revisiList.forEach(function (item, i) {
        var nama = (typeof item === 'string') ? item : (item.nama || "-");
        txt += (i + 1) + ". " + nama + "\n";
      });
      txt += "\n";
    }

    if (ditolakList.length > 0) {
      txt += "🔴 *DITOLAK (" + ditolakList.length + " Sekolah):*\n";
      ditolakList.forEach(function (item, i) {
        var nama = (typeof item === 'string') ? item : (item.nama || "-");
        txt += (i + 1) + ". " + nama + "\n";
      });
      txt += "\n";
    }

    txt += "_Mohon sekolah terkait dapat menindaklanjuti pada aplikasi SIKS-Reborn._";

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(txt).then(function () {
        if (typeof Sultan !== 'undefined' && Sultan.notif) {
          Sultan.notif.sukses('Daftar berhasil disalin ke clipboard!');
        } else {
          alert('Daftar berhasil disalin ke clipboard!');
        }
      });
    } else {
      var $temp = $("<textarea>");
      $("body").append($temp);
      $temp.val(txt).select();
      document.execCommand("copy");
      $temp.remove();
      if (typeof Sultan !== 'undefined' && Sultan.notif) {
        Sultan.notif.sukses('Daftar berhasil disalin ke clipboard!');
      } else {
        alert('Daftar berhasil disalin ke clipboard!');
      }
    }
  }
</script>
