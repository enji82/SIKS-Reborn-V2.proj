<section class="content sultan-page-transition">
  <div class="container-fluid">

    <!-- ================================================================
         CARD FILTER DENGAN DUAL TAB SWITCHER (STANDAR SULTAN UI)
         ================================================================ -->
    <!-- ================================================================
         FILTER BAR UTAMA DASHBOARD TPG (TERPUSAT SULTAN UI - SINGLE TAB)
         ================================================================ -->
    <div class="sultan-filter-bar-balanced mb-4 sultan-page-transition d-none" id="tpgdash_filterBar">
      <div class="filter-controls-group">

        <!-- Filter Nama Dokumen / Jenis Dokumen -->
        <div class="sultan-filter-item" id="tpgdash_filterJenisDokumenContainer" style="min-width: 180px;">
          <select id="tpgdash_filterJenisDokumen" class="form-control" aria-label="Jenis Dokumen">
            <option value="Perbaikan Gaji" selected>Perbaikan Gaji</option>
          </select>
          <i class="fas fa-chevron-down"></i>
        </div>

        <!-- Filter Jenjang (Khusus Admin) -->
        <div class="sultan-filter-item d-none" id="tpgdash_filterJenjangContainer">
          <select id="tpgdash_filterJenjang" class="form-control" aria-label="Pilih Jenjang">
            <option value="SEMUA">Semua Jenjang</option>
          </select>
          <i class="fas fa-chevron-down"></i>
        </div>

        <!-- Filter Sekolah (Khusus Admin - tergantung jenjang) -->
        <div class="sultan-filter-item d-none" id="tpgdash_filterSekolahContainer" style="min-width: 240px; max-width: 380px;">
          <select id="tpgdash_filterSekolah" class="form-control" aria-label="Pilih Sekolah">
            <option value="SEMUA">Semua Sekolah</option>
          </select>
          <i class="fas fa-chevron-down"></i>
        </div>

        <div class="divider-vertical d-none d-md-block mx-1" id="tpgdash_dividerRefresh"></div>

        <!-- Tombol Refresh Data -->
        <button type="button" id="tpgdash_btnRefresh" class="sultan-btn-refresh" title="Refresh Data">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
    </div>

    <!-- Loading State Terpusat -->
    <div id="tpgdash_loadingState" class="sultan-loading-box sultan-page-transition">
      <div class="sultan-spinner-icon">
        <i class="fas fa-circle-notch fa-spin"></i>
      </div>
      <h6 class="text-muted font-weight-bold sultan-loading-text mb-0" style="letter-spacing: 0.5px; text-transform: uppercase; font-size: 11px;">Memuat Data Dasbor TPG...</h6>
    </div>

    <!-- ================================================================
         MAIN CONTENT DASHBOARD STATE
         ================================================================ -->
    <div id="tpgdash_dashboardState" style="display: none;">

      <!-- CARD TOTAL (KPI SUMMARY CARDS - SULTAN MODERN MINIMALIST) -->
      <div class="row mb-4">

        <!-- JML AJUAN (TOTAL) -->
        <div class="col-lg col-md-4 col-6 mb-3">
          <div class="sultan-metric-card-minimal minimal-slate h-100">
            <div class="minimal-label"><i class="fas fa-file-alt mr-1"></i>JML AJUAN</div>
            <div class="minimal-value" id="tpgdash_countTotal">0</div>
            <div class="minimal-sub text-muted">Total Usulan Perbaikan</div>
          </div>
        </div>

        <!-- DIPROSES -->
        <div class="col-lg col-md-4 col-6 mb-3">
          <div class="sultan-metric-card-minimal minimal-info h-100">
            <div class="minimal-label"><i class="fas fa-spinner fa-spin mr-1"></i>DIPROSES</div>
            <div class="minimal-value" id="tpgdash_countDiproses">0</div>
            <div class="minimal-sub text-muted">Menunggu Verifikasi</div>
          </div>
        </div>

        <!-- DISETUJUI -->
        <div class="col-lg col-md-4 col-6 mb-3">
          <div class="sultan-metric-card-minimal minimal-success h-100">
            <div class="minimal-label"><i class="fas fa-check-circle mr-1"></i>DISETUJUI</div>
            <div class="minimal-value" id="tpgdash_countDisetujui">0</div>
            <div class="minimal-sub text-muted">Telah Diverifikasi</div>
          </div>
        </div>

        <!-- REVISI -->
        <div class="col-lg col-md-6 col-6 mb-3">
          <div class="sultan-metric-card-minimal minimal-warning h-100">
            <div class="minimal-label"><i class="fas fa-exclamation-triangle mr-1"></i>REVISI</div>
            <div class="minimal-value" id="tpgdash_countRevisi">0</div>
            <div class="minimal-sub text-muted">Perlu Perbaikan</div>
          </div>
        </div>

        <!-- DITOLAK -->
        <div class="col-lg col-md-6 col-12 mb-3">
          <div class="sultan-metric-card-minimal minimal-maroon h-100">
            <div class="minimal-label"><i class="fas fa-times-circle mr-1"></i>DITOLAK</div>
            <div class="minimal-value" id="tpgdash_countDitolak">0</div>
            <div class="minimal-sub text-muted">Berkas Tidak Sesuai</div>
          </div>
        </div>

      </div>

      <!-- ================================================================
           2. DAFTAR PTK SUDAH UNGGAH (4 CARD STATUS TERPUSAT SULTAN UI)
           ================================================================ -->
      <div id="tpgdash_statusCardsContainer" class="mb-4"></div>

      <!-- ================================================================
           3. CARD TABEL: DATATABLE REKAPITULASI (TANPA BARIS JUMLAH)
           ================================================================ -->
      <div class="row mb-4">
        <div class="col-12">
          <div class="card card-sultan-terpusat shadow-xs border-0">
            <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center pt-3 pb-2 px-3">
              <h6 class="font-weight-bold text-sultan-utama m-0 text-uppercase" style="letter-spacing: 0.5px;">
                <i class="fas fa-table mr-2"></i>Rekapitulasi Usulan TPG: <span id="tpgdash_tableTitleLabel">Per Unit Kerja</span>
              </h6>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive sultan-scroll">
                <table id="tpgdash_rekapTable" class="table table-hover sultan-table-datatable text-center mb-0 w-100">
                  <thead>
                    <tr>
                      <th class="align-middle text-left font-weight-bold col-sticky-left" style="min-width: 220px;">NAMA SEKOLAH</th>
                      <th class="align-middle font-weight-bold" style="width: 120px;">JML USULAN</th>
                      <th class="align-middle font-weight-bold" style="width: 110px;">DIPROSES</th>
                      <th class="align-middle font-weight-bold" style="width: 110px;">DISETUJUI</th>
                      <th class="align-middle font-weight-bold" style="width: 110px;">REVISI</th>
                      <th class="align-middle font-weight-bold" style="width: 110px;">DITOLAK</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- Populated via JS DataTable -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>
</section>

<script>
  (function() {
    var TPGDASH_RAW_DATA = [];
    var TPGDASH_MASTER_SEKOLAH = [];
    var TPGDASH_IS_ADMIN = false;
    var TPGDASH_USER_UNIT = "";
    var TPGDASH_USER_NPSN = "";
    var tpgdash_dtInstance = null;

    function tpgdash_init() {
      var user = (typeof getSesiUser === 'function') ? getSesiUser() : {};
      var role = String(user.role || "").toLowerCase();
      TPGDASH_IS_ADMIN = (role.indexOf("admin") !== -1 || role.indexOf("verifikator") !== -1 || role.indexOf("korwil") !== -1 || role.indexOf("tpg") !== -1);
      TPGDASH_USER_UNIT = String(user.unit || user.nama_lengkap || user.fullname || user.nama || "").trim();
      TPGDASH_USER_NPSN = String(user.npsn || user.username || "").trim();

      // Inisialisasi 4 Card Status Terpusat Sultan UI
      if (typeof SultanUI !== 'undefined' && SultanUI.renderDashboardStatusCards4) {
        $('#tpgdash_statusCardsContainer').html(SultanUI.renderDashboardStatusCards4('tpgdash', { title: 'Daftar PTK Sudah Unggah' }));
      }

      tpgdash_setupControls();

      // Inisialisasi SultanDashboard Single Mode
      if (typeof SultanDashboard !== 'undefined' && SultanDashboard.initDualMode) {
        SultanDashboard.initDualMode({
          pageKey: 'tpgdash',
          dashboardType: 'single_tab',
          switchSelector: '.sultan-segmented-btn',
          onInit: function(state) {
            TPGDASH_IS_ADMIN = state.isAdmin;
            tpgdash_updateFilterBarControls();
          },
          onSwitchMode: function(mode, state, isFirstLoad) {
            tpgdash_updateFilterBarControls();
          }
        });
      }

      // Muat master sekolah dan data dasbor saat inisialisasi
      tpgdash_loadMasterSekolahThenFetchData();
    }

    function tpgdash_updateFilterBarControls() {
      $('#tpgdash_filterBar').removeClass('d-none');
      $('#tpgdash_filterJenisDokumenContainer').removeClass('d-none');

      if (TPGDASH_IS_ADMIN) {
        // Admin: Tampilkan Filter Nama Dokumen + Jenjang + Sekolah
        $('#tpgdash_filterJenjangContainer').removeClass('d-none');
        $('#tpgdash_filterSekolahContainer').removeClass('d-none');
      } else {
        // User: Hanya Filter Nama Dokumen (Sembunyikan Jenjang & Sekolah)
        $('#tpgdash_filterJenjangContainer').addClass('d-none');
        $('#tpgdash_filterSekolahContainer').addClass('d-none');
      }
    }

    function tpgdash_setupControls() {
      // Event Refresh Button
      $(document).off('click', '#tpgdash_btnRefresh').on('click', '#tpgdash_btnRefresh', function(e) {
        e.preventDefault();
        tpgdash_loadDashboardData();
      });

      // Event Change Jenis Dokumen
      $(document).off('change', '#tpgdash_filterJenisDokumen').on('change', '#tpgdash_filterJenisDokumen', function() {
        tpgdash_applyFiltersAndRender();
      });

      // Event Change Jenjang
      $(document).off('change', '#tpgdash_filterJenjang').on('change', '#tpgdash_filterJenjang', function() {
        var selectedJenjang = $(this).val();
        tpgdash_populateDropdownSekolah(selectedJenjang);
        tpgdash_applyFiltersAndRender();
      });

      // Event Change Sekolah
      $(document).off('change', '#tpgdash_filterSekolah').on('change', '#tpgdash_filterSekolah', function() {
        tpgdash_applyFiltersAndRender();
      });

      // Event Live Search untuk 4 Card List Status
      $(document).off('keyup', '#tpgdash_inputCariDiproses').on('keyup', '#tpgdash_inputCariDiproses', function() {
        var val = $(this).val().toLowerCase().trim();
        $('#tpgdash_listDiproses li.tpgdash-item').filter(function() {
          $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
        });
      });
      $(document).off('keyup', '#tpgdash_inputCariDisetujui').on('keyup', '#tpgdash_inputCariDisetujui', function() {
        var val = $(this).val().toLowerCase().trim();
        $('#tpgdash_listDisetujui li.tpgdash-item').filter(function() {
          $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
        });
      });
      $(document).off('keyup', '#tpgdash_inputCariRevisi').on('keyup', '#tpgdash_inputCariRevisi', function() {
        var val = $(this).val().toLowerCase().trim();
        $('#tpgdash_listRevisi li.tpgdash-item').filter(function() {
          $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
        });
      });
      $(document).off('keyup', '#tpgdash_inputCariDitolak').on('keyup', '#tpgdash_inputCariDitolak', function() {
        var val = $(this).val().toLowerCase().trim();
        $('#tpgdash_listDitolak li.tpgdash-item').filter(function() {
          $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
        });
      });
    }

    function tpgdash_loadMasterSekolahThenFetchData() {
      if (typeof SultanUI !== 'undefined') {
        SultanUI.showLoading('#tpgdash_loadingState', 'Memuat Master Data Sekolah...');
      } else {
        $('#tpgdash_loadingState').show();
      }
      $('#tpgdash_dashboardState').hide();

      google.script.run
        .withSuccessHandler(function(list) {
          if (Array.isArray(list) && list.length > 0) {
            TPGDASH_MASTER_SEKOLAH = list;
          } else {
            TPGDASH_MASTER_SEKOLAH = [];
          }
          tpgdash_initDropdownJenjang();
          tpgdash_loadDashboardData();
        })
        .withFailureHandler(function(err) {
          console.warn("Gagal memuat master sekolah, fallback data kosong:", err);
          TPGDASH_MASTER_SEKOLAH = [];
          tpgdash_initDropdownJenjang();
          tpgdash_loadDashboardData();
        })
        .seragam_getSekolahList();
    }

    function tpgdash_initDropdownJenjang() {
      var selectJenjang = $('#tpgdash_filterJenjang');
      selectJenjang.empty().append('<option value="SEMUA">Semua Jenjang</option>');
      var setJenjang = new Set();

      if (TPGDASH_MASTER_SEKOLAH && TPGDASH_MASTER_SEKOLAH.length > 0) {
        TPGDASH_MASTER_SEKOLAH.forEach(function(item) {
          var j = String(item.jenjang || "").trim().toUpperCase();
          if (j && j !== "-") setJenjang.add(j);
        });
      }

      Array.from(setJenjang).sort().forEach(function(j) {
        selectJenjang.append($('<option>', { value: j, text: j }));
      });

      tpgdash_populateDropdownSekolah("SEMUA");
    }

    function tpgdash_populateDropdownSekolah(selectedJenjang) {
      var selectSekolah = $('#tpgdash_filterSekolah');
      selectSekolah.empty().append('<option value="SEMUA">Semua Sekolah</option>');
      selectedJenjang = String(selectedJenjang || "SEMUA").trim().toUpperCase();

      var filtered = TPGDASH_MASTER_SEKOLAH.filter(function(item) {
        if (selectedJenjang === "SEMUA" || !selectedJenjang) return true;
        return String(item.jenjang || "").trim().toUpperCase() === selectedJenjang;
      });

      filtered.sort(function(a, b) {
        return String(a.nama || "").localeCompare(String(b.nama || ""));
      });

      filtered.forEach(function(item) {
        selectSekolah.append($('<option>', { value: item.nama, text: item.nama }));
      });
    }

    function tpgdash_loadDashboardData() {
      if (typeof SultanUI !== 'undefined') {
        SultanUI.showLoading('#tpgdash_loadingState', 'Memuat Data Usulan TPG...');
      } else {
        $('#tpgdash_loadingState').show();
      }
      $('#tpgdash_dashboardState').hide();

      google.script.run
        .withSuccessHandler(function(response) {
          if (typeof SultanUI !== 'undefined') {
            SultanUI.hideLoading('#tpgdash_loadingState');
          } else {
            $('#tpgdash_loadingState').hide();
          }

          if (response && response.status === 'success') {
            TPGDASH_RAW_DATA = Array.isArray(response.data) ? response.data : [];
            $('#tpgdash_dashboardState').fadeIn();
            tpgdash_applyFiltersAndRender();
          } else {
            if (typeof SultanUI !== 'undefined') {
              SultanUI.showLoadingError('#tpgdash_loadingState', 'Gagal memuat data: ' + (response ? response.message : 'Unknown error'));
            } else {
              alert('Gagal memuat data');
            }
          }
        })
        .withFailureHandler(function(error) {
          if (typeof SultanUI !== 'undefined') {
            SultanUI.showLoadingError('#tpgdash_loadingState', 'Terjadi kesalahan sistem: ' + (error.message || error));
          } else {
            alert('Terjadi kesalahan: ' + error.message);
          }
        })
        .tpg_getPerbaikanData("", true);
    }

    function tpgdash_applyFiltersAndRender() {
      var selectedJenis = $('#tpgdash_filterJenisDokumen').val() || "Perbaikan Gaji";
      var selectedJenjang = $('#tpgdash_filterJenjang').val() || "SEMUA";
      var selectedSekolah = $('#tpgdash_filterSekolah').val() || "SEMUA";

      // 1. Filter Data berdasarkan Role Pengguna
      var filteredData = TPGDASH_RAW_DATA.filter(function(row) {
        var rowUnit = String(row.unitKerja || "").trim();

        if (!TPGDASH_IS_ADMIN) {
          // User: Hanya data milik unit kerjanya saja
          if (TPGDASH_USER_UNIT && rowUnit.toLowerCase() !== TPGDASH_USER_UNIT.toLowerCase()) {
            return false;
          }
        } else {
          // Admin: Tergantung filter jenjang dan sekolah yang dipilih
          if (selectedSekolah && selectedSekolah !== "SEMUA") {
            if (rowUnit.toLowerCase() !== selectedSekolah.toLowerCase()) return false;
          } else if (selectedJenjang && selectedJenjang !== "SEMUA") {
            var matchSekolahJenjang = TPGDASH_MASTER_SEKOLAH.filter(function(s) {
              return String(s.jenjang || "").toUpperCase() === selectedJenjang.toUpperCase();
            }).map(function(s) { return String(s.nama).toLowerCase(); });

            if (matchSekolahJenjang.indexOf(rowUnit.toLowerCase()) === -1) return false;
          }
        }
        return true;
      });

      // 2. Kalkulasi KPI Cards
      var countTotal = filteredData.length;
      var countDiproses = 0;
      var countDisetujui = 0;
      var countRevisi = 0;
      var countDitolak = 0;

      var rekapPerSekolah = {};

      filteredData.forEach(function(row) {
        var st = String(row.status || "").trim();
        var uk = String(row.unitKerja || "Tidak Diketahui").trim();

        if (st === 'Disetujui') countDisetujui++;
        else if (st === 'Revisi') countRevisi++;
        else if (st === 'Ditolak') countDitolak++;
        else countDiproses++; // 'Diproses', 'Menunggu', dll

        if (!rekapPerSekolah[uk]) {
          rekapPerSekolah[uk] = { usulan: 0, diproses: 0, disetujui: 0, revisi: 0, ditolak: 0 };
        }
        rekapPerSekolah[uk].usulan++;

        if (st === 'Disetujui') rekapPerSekolah[uk].disetujui++;
        else if (st === 'Revisi') rekapPerSekolah[uk].revisi++;
        else if (st === 'Ditolak') rekapPerSekolah[uk].ditolak++;
        else rekapPerSekolah[uk].diproses++;
      });

      // Update Angka KPI Card
      $('#tpgdash_countTotal').text(countTotal);
      $('#tpgdash_countDiproses').text(countDiproses);
      $('#tpgdash_countDisetujui').text(countDisetujui);
      $('#tpgdash_countRevisi').text(countRevisi);
      $('#tpgdash_countDitolak').text(countDitolak);

      // Update Label Header Tabel
      if (!TPGDASH_IS_ADMIN) {
        $('#tpgdash_tableTitleLabel').text(TPGDASH_USER_UNIT || "Unit Kerja");
      } else if (selectedSekolah && selectedSekolah !== "SEMUA") {
        $('#tpgdash_tableTitleLabel').text(selectedSekolah);
      } else if (selectedJenjang && selectedJenjang !== "SEMUA") {
        $('#tpgdash_tableTitleLabel').text("Jenjang " + selectedJenjang);
      } else {
        $('#tpgdash_tableTitleLabel').text("Per Unit Kerja");
      }

      // 3. Render DataTable Rekapitulasi (Tanpa Baris Jumlah)
      tpgdash_renderRekapTable(rekapPerSekolah);

      // 4. Render Daftar PTK Sudah Unggah (4 Cards: Diproses, Disetujui, Revisi, Ditolak)
      tpgdash_renderPtkLists(filteredData);
    }

    function tpgdash_renderPtkLists(filteredData) {
      var categories = {
        'Diproses': { list: [], badgeId: '#tpgdash_countDiproses', listId: '#tpgdash_listDiproses', emptyMsg: 'Tidak ada PTK diproses' },
        'Disetujui': { list: [], badgeId: '#tpgdash_countDisetujui', listId: '#tpgdash_listDisetujui', emptyMsg: 'Tidak ada PTK disetujui' },
        'Revisi': { list: [], badgeId: '#tpgdash_countRevisi', listId: '#tpgdash_listRevisi', emptyMsg: 'Tidak ada PTK revisi' },
        'Ditolak': { list: [], badgeId: '#tpgdash_countDitolak', listId: '#tpgdash_listDitolak', emptyMsg: 'Tidak ada PTK ditolak' }
      };

      filteredData.forEach(function(row) {
        var st = String(row.status || "").trim();
        if (st === 'Disetujui') categories['Disetujui'].list.push(row);
        else if (st === 'Revisi') categories['Revisi'].list.push(row);
        else if (st === 'Ditolak') categories['Ditolak'].list.push(row);
        else categories['Diproses'].list.push(row);
      });

      // Update badge counter di header masing-masing card
      $('#tpgdash_countDiproses').text(categories['Diproses'].list.length);
      $('#tpgdash_countDisetujui').text(categories['Disetujui'].list.length);
      $('#tpgdash_countRevisi').text(categories['Revisi'].list.length);
      $('#tpgdash_countDitolak').text(categories['Ditolak'].list.length);

      // Reset input live search
      $('#tpgdash_inputCariDiproses, #tpgdash_inputCariDisetujui, #tpgdash_inputCariRevisi, #tpgdash_inputCariDitolak').val('');

      // Populate list di tiap-tiap card
      Object.keys(categories).forEach(function(catKey) {
        var cat = categories[catKey];
        var $list = $(cat.listId);
        $list.empty();

        if (cat.list.length === 0) {
          $list.append(
            '<li class="list-group-item bg-transparent text-center text-muted py-5 border-0 d-flex flex-column align-items-center justify-content-center h-100">' +
              '<i class="fas fa-info-circle mb-2" style="font-size: 1.8rem; opacity: 0.35;"></i>' +
              '<span style="font-size: 11.5px; font-weight: 500;">' + cat.emptyMsg + '</span>' +
            '</li>'
          );
        } else {
          // Sort alfabetis berdasarkan nama
          cat.list.sort(function(a, b) {
            return String(a.namaAsn || "").localeCompare(String(b.namaAsn || ""));
          });

          cat.list.forEach(function(r, index) {
            var idxNum = index + 1;
            var nama = String(r.namaAsn || "-").toUpperCase();

            var itemHtml = 
              '<li class="list-group-item tpgdash-item hover-sultan d-flex align-items-center py-2 px-3 border-bottom" style="transition: background 0.15s ease;">' +
                '<span class="badge badge-secondary badge-pill flex-shrink-0 d-flex align-items-center justify-content-center mr-2.5" style="width: 22px; height: 22px; font-size: 10.5px; font-weight: 700; background: rgba(128,128,128,0.2); color: inherit;">' + idxNum + '</span>' +
                '<div class="font-weight-bold text-dark text-truncate" style="font-size: 12px; line-height: 1.2;">' + nama + '</div>' +
              '</li>';

            $list.append(itemHtml);
          });
        }
      });
    }

    function tpgdash_renderRekapTable(rekapObj) {
      if (tpgdash_dtInstance) {
        if ($.fn.DataTable.isDataTable('#tpgdash_rekapTable')) {
          $('#tpgdash_rekapTable').DataTable().destroy();
        }
        tpgdash_dtInstance = null;
      }

      var tbody = $('#tpgdash_rekapTable tbody');
      tbody.empty();

      var rekapList = Object.keys(rekapObj).map(function(uk) {
        return { sekolah: uk, data: rekapObj[uk] };
      });

      // Urutkan alfabetis berdasarkan Nama Sekolah
      rekapList.sort(function(a, b) {
        return a.sekolah.localeCompare(b.sekolah);
      });

      var dataTableRows = [];

      function formatValue(val, cssClass) {
        var num = parseInt(val, 10) || 0;
        if (num === 0) {
          return '<span class="text-muted opacity-50 font-weight-normal" style="opacity: 0.45; font-size: 0.9rem;">-</span>';
        }
        return '<span class="' + cssClass + ' font-weight-bold">' + num + '</span>';
      }

      if (rekapList.length === 0) {
        tbody.append('<tr><td colspan="6" class="text-center text-muted py-4 font-italic">Tidak ada data usulan TPG yang sesuai dengan filter.</td></tr>');
      } else {
        rekapList.forEach(function(item) {
          var d = item.data;
          dataTableRows.push([
            '<span class="font-weight-bold sultan-table-primary">' + item.sekolah + '</span>',
            formatValue(d.usulan, ''),
            formatValue(d.diproses, 'text-info'),
            formatValue(d.disetujui, 'text-success'),
            formatValue(d.revisi, 'text-warning'),
            formatValue(d.ditolak, 'text-danger')
          ]);
        });
      }

      // Inisialisasi DataTable Standar Sultan dengan opsi data
      if (dataTableRows.length > 0 && $.fn.DataTable) {
        tpgdash_dtInstance = $('#tpgdash_rekapTable').DataTable({
          "destroy": true,
          "data": dataTableRows,
          "ordering": true,
          "pageLength": 10,
          "autoWidth": false,
          "order": [[0, 'asc']],
          "columnDefs": [
            { "className": "text-left align-middle", "targets": 0 },
            { "className": "text-center align-middle", "targets": [1, 2, 3, 4, 5] }
          ],
          "language": {
            "search": "Cari:",
            "lengthMenu": "Tampilkan _MENU_ data",
            "info": "Menampilkan _START_ sampai _END_ dari _TOTAL_ data",
            "emptyTable": "Tidak ada data yang tersedia pada tabel ini",
            "paginate": { "previous": "Sebelumnya", "next": "Berikutnya" }
          },
          "dom": "<'row mb-2'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>>" +
                 "<'row'<'col-sm-12'tr>>" +
                 "<'row mt-2'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>"
        });
      }
    }

    // Jalankan inisialisasi saat dokumen siap
    $(document).ready(function() {
      tpgdash_init();
    });
  })();
</script>
