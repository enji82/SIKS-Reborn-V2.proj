<section class="content pt-2">
  <div class="container-fluid">
    <!-- Loading State -->
    <div id="tpgDb_loadingState" class="mt-3"></div>

    <!-- Main Container -->
    <div id="tpgDb_mainContainer" style="display: none;">
      
      <!-- Summary Cards Row -->
      <div class="row mb-3">
        <div class="col-md-3 col-sm-6 mb-3 mb-md-0">
          <div class="sultan-metric-card metric-navy">
            <div class="inner">
              <h3 id="tpgDb_countTotal">0</h3>
              <p>Total Pengajuan</p>
            </div>
            <div class="icon">
              <i class="fas fa-file-invoice"></i>
            </div>
          </div>
        </div>
        
        <div class="col-md-3 col-sm-6 mb-3 mb-md-0">
          <div class="sultan-metric-card metric-success">
            <div class="inner">
              <h3 id="tpgDb_countDisetujui">0</h3>
              <p>Disetujui</p>
            </div>
            <div class="icon">
              <i class="fas fa-check-circle"></i>
            </div>
          </div>
        </div>
        
        <div class="col-md-3 col-sm-6 mb-3 mb-md-0">
          <div class="sultan-metric-card metric-info">
            <div class="inner">
              <h3 id="tpgDb_countMenunggu">0</h3>
              <p>Menunggu Verifikasi</p>
            </div>
            <div class="icon">
              <i class="fas fa-hourglass-half"></i>
            </div>
          </div>
        </div>

        <div class="col-md-3 col-sm-6">
          <div class="sultan-metric-card metric-maroon">
            <div class="inner">
              <h3 id="tpgDb_countRevisi">0</h3>
              <p>Perlu Revisi / Ditolak</p>
            </div>
            <div class="icon">
              <i class="fas fa-exclamation-triangle"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Rekapitulasi Row -->
      <div class="row mb-3">
        <div class="col-12 mb-3">
          <div class="card card-sultan shadow-sm" style="border-radius: 12px; border: none; height: 100%;">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-2" style="border-radius: 12px 12px 0 0;">
              <h3 class="card-title font-weight-bold text-primary" style="font-family: 'Inter', sans-serif;"><i class="fas fa-table mr-2"></i>Rekapitulasi Usulan per Unit Kerja</h3>
            </div>
            <div class="card-body">
              <div class="table-responsive sultan-scroll">
                <table id="tpgDb_rekapTable" class="table table-bordered table-premium table-sultan-compact w-100">
                  <thead class="bg-sultan-gradient text-white text-center">
                    <tr>
                      <th class="align-middle" style="width: 50px;">NO</th>
                      <th class="align-middle text-left">UNIT KERJA</th>
                      <th class="align-middle" style="width: 150px;">JUMLAH USULAN</th>
                      <th class="align-middle" style="width: 130px;">DISETUJUI</th>
                      <th class="align-middle" style="width: 130px;">REVISI</th>
                      <th class="align-middle" style="width: 130px;">DITOLAK</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- Populated via JS -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<style>
/* Optional custom style for rekap table if needed */
</style>

<script>
  // Data for rekapitulasi table
  var tpgDb_rekapTableInstance = null;

  function tpgDb_init() {
    var user = getSesiUser();
    var isAdmin = checkUserRoleIsAdmin();

    $('#tpgDb_mainContainer').show();
    if (typeof SultanUI !== 'undefined') {
      SultanUI.startLottery('#tpgDb_countTotal, #tpgDb_countDisetujui, #tpgDb_countMenunggu, #tpgDb_countRevisi', 3);
    }

    if (isAdmin) {
      tpgDb_fetchData("", true);
    } else {
      var npsn = user ? (user.npsn || user.username || "") : "";
      if (!npsn) {
          Sultan.modal.error({ title: 'Gagal', message: 'Akses ditolak: Sesi login tidak valid.' });
          return;
      }
      google.script.run
        .withSuccessHandler(function (resUnit) {
            var dataUnit = JSON.parse(resUnit);
            if (dataUnit.error) {
                Sultan.modal.error({ title: 'Gagal', message: dataUnit.error });
                return;
            }
            tpgDb_fetchData(dataUnit.unitKerja, false);
        })
        .withFailureHandler(function (error) {
            Sultan.modal.error({ title: 'Error', message: 'Koneksi Terputus: ' + error.message });
        })
        .getUnitKerjaByNPSN(npsn, "SIABA_LUPA_DB");
    }
  }

  function tpgDb_fetchData(unitKerja, isAdmin) {
    google.script.run
      .withSuccessHandler(function (response) {
        if (response && response.status === 'success') {
          tpgDb_renderDashboard(response.data, isAdmin);
        } else {
          Sultan.modal.error({ title: 'Gagal', message: 'Gagal mengambil data dashboard: ' + (response ? response.message : 'Unknown error') });
        }
      })
      .withFailureHandler(function (error) {
        Sultan.modal.error({ title: 'Error', message: 'Terjadi kesalahan sistem: ' + error.message });
      })
      .tpg_getPerbaikanData(unitKerja, isAdmin);
  }

  function tpgDb_renderDashboard(data, isAdmin) {
    $('#tpgDb_mainContainer').fadeIn();
    
    // 1. Calculate Summary
    var total = data.length;
    var disetujui = 0;
    var menunggu = 0;
    var revisi = 0;

    var rekapObj = {};

    data.forEach(function(row) {
      // Status overall
      if (row.status === 'Disetujui') disetujui++;
      else if (row.status === 'Revisi' || row.status === 'Ditolak') revisi++;
      else menunggu++; // Termasuk Diproses, Menunggu, dll

      // For Rekapitulasi per Unit Kerja
      var uk = row.unitKerja || 'Tidak Diketahui';
      if (!rekapObj[uk]) {
        rekapObj[uk] = { usulan: 0, disetujui: 0, revisi: 0, ditolak: 0 };
      }
      rekapObj[uk].usulan++;
      
      if (row.status === 'Disetujui') rekapObj[uk].disetujui++;
      else if (row.status === 'Revisi') rekapObj[uk].revisi++;
      else if (row.status === 'Ditolak') rekapObj[uk].ditolak++;
    });

    // Animate numbers
    tpgDb_animateValue('tpgDb_countTotal', 0, total, 1000);
    tpgDb_animateValue('tpgDb_countDisetujui', 0, disetujui, 1000);
    tpgDb_animateValue('tpgDb_countMenunggu', 0, menunggu, 1000);
    tpgDb_animateValue('tpgDb_countRevisi', 0, revisi, 1000);

    // 2. Render Rekapitulasi Table
    var rekapTableBody = $('#tpgDb_rekapTable tbody');
    rekapTableBody.empty();
    
    // Convert object to array
    var rekapArray = Object.keys(rekapObj).map(function(uk) {
      return { unitKerja: uk, data: rekapObj[uk] };
    });
    
    // Sort default by JUMLAH USULAN desc
    rekapArray.sort(function(a, b) {
      return b.data.usulan - a.data.usulan;
    });

    if (rekapArray.length === 0) {
      rekapTableBody.append('<tr><td colspan="6" class="text-center text-muted py-3">Tidak ada data rekapitulasi.</td></tr>');
    } else {
      rekapArray.forEach(function(item, index) {
        var tr = $('<tr>');
        tr.append($('<td class="text-center align-middle">').text(index + 1));
        tr.append($('<td class="text-left align-middle font-weight-bold sultan-table-primary">').text(item.unitKerja));
        tr.append($('<td class="text-center align-middle">').text(item.data.usulan));
        tr.append($('<td class="text-center align-middle text-success font-weight-bold">').text(item.data.disetujui));
        tr.append($('<td class="text-center align-middle text-warning font-weight-bold">').text(item.data.revisi));
        tr.append($('<td class="text-center align-middle text-danger font-weight-bold">').text(item.data.ditolak));
        rekapTableBody.append(tr);
      });
    }

    // Initialize DataTables for sorting and pagination if it's admin or lots of data
    if ($.fn.DataTable.isDataTable('#tpgDb_rekapTable')) {
        $('#tpgDb_rekapTable').DataTable().destroy();
    }
    
    if (typeof SultanTable !== 'undefined') {
        tpgDb_rekapTableInstance = SultanTable.init('#tpgDb_rekapTable', {
            "destroy": true, "ordering": true, "pageLength": 10, "autoWidth": false,
            "dom": "<'row mb-2'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>>" +
                   "<'row'<'col-sm-12'tr>>" +
                   "<'row mt-2'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>"
        });
    }
  }

  function tpgDb_animateValue(id, start, end, duration) {
    if (typeof SultanUI !== 'undefined') {
      SultanUI.stopLottery('#' + id);
    }
    if (start === end) {
      document.getElementById(id).innerHTML = end;
      return;
    }
    var range = end - start;
    var current = start;
    var increment = end > start ? 1 : -1;
    var stepTime = Math.abs(Math.floor(duration / range));
    var obj = document.getElementById(id);
    var timer = setInterval(function() {
      current += increment;
      obj.innerHTML = current;
      if (current == end) {
        clearInterval(timer);
      }
    }, stepTime);
  }



  // Jalankan inisialisasi secara langsung
  tpgDb_init();
</script>
