  #admmuriddash_tabelRekap_wrapper,
  #admmuriddash_tabelRekap_wrapper .dataTables_length,
  #admmuriddash_tabelRekap_wrapper .dataTables_length select,
  #admmuriddash_tabelRekap_wrapper .dataTables_filter,
  #admmuriddash_tabelRekap_wrapper .dataTables_filter input,
  #admmuriddash_tabelRekap_wrapper .dataTables_info,
  #admmuriddash_tabelRekap_wrapper .dataTables_paginate,
  #admmuriddash_tabelRekap_wrapper .pagination,
  #admmuriddash_tabelRekap_wrapper .page-item,
  #admmuriddash_tabelRekap_wrapper .page-link,
  #admmuriddash_tabelRekap_wrapper table,

  #admmuriddash_tabelRekap .badge {

<section class="content sultan-page-transition">
  <div class="container-fluid">

    <!-- FILTER BAR TERPUSAT SULTAN UI -->
    <div class="sultan-filter-bar-balanced mb-4 sultan-page-transition" id="admmuriddash_filterBar">
      <div class="filter-controls-group">

        <!-- 1. Filter Kategori Dokumen -->
        <div class="sultan-filter-item" id="admmuriddash_filterSubmenuContainer" style="min-width: 180px;">
          <select id="admmuriddash_filterSubmenu" class="form-control" aria-label="Kategori Dokumen">
            <option value="SPMB" selected>Laporan SPMB</option>
            <option value="IJAZAH">Cetak Ijazah</option>
            <option value="ARSIP_IJAZAH">Arsip Ijazah</option>
            <option value="ARSIP_TKA">Arsip TKA</option>
          </select>
          <i class="fas fa-chevron-down"></i>
        </div>

        <!-- 2. Filter Tahun -->
        <div class="sultan-filter-item" id="admmuriddash_filterTahunContainer">
          <select id="admmuriddash_filterTahun" class="form-control" aria-label="Pilih Tahun">
            <option value="SEMUA">Semua Tahun</option>
          </select>
          <i class="fas fa-chevron-down"></i>
        </div>

        <!-- 3. Filter Jenjang (Khusus Admin) -->
        <div class="sultan-filter-item" id="admmuriddash_filterJenjangContainer" style="min-width: 150px; display: none;">
          <select id="admmuriddash_filterJenjang" class="form-control" aria-label="Pilih Jenjang">
            <option value="SEMUA">Semua Jenjang</option>
          </select>
          <i class="fas fa-chevron-down"></i>
        </div>

        <!-- 4. Filter Nama Sekolah (Khusus Admin) -->
        <div class="sultan-filter-item" id="admmuriddash_filterSekolahContainer" style="min-width: 220px; max-width: 360px; display: none;">
          <select id="admmuriddash_filterSekolah" class="form-control" aria-label="Pilih Nama Sekolah">
            <option value="SEMUA">Semua Sekolah</option>
          </select>
          <i class="fas fa-chevron-down"></i>
        </div>

        <div class="divider-vertical d-none d-md-block mx-1"></div>

        <!-- Tombol Refresh Data -->
        <button type="button" id="admmuriddash_btnRefresh" class="sultan-btn-refresh" title="Refresh Data">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
    </div>

    <!-- Loading State Terpusat -->
    <div id="admmuriddash_loadingState" class="sultan-loading-box sultan-page-transition">
      <div class="sultan-spinner-icon">
        <i class="fas fa-circle-notch fa-spin"></i>
      </div>
      <h6 class="text-muted font-weight-bold sultan-loading-text mb-0" style="letter-spacing: 0.5px; text-transform: uppercase; font-size: 11px;">Memuat Data Dasbor Administrasi Murid...</h6>
    </div>

    <div id="admmuriddash_dashboardState" style="display: none;">

      <!-- Row 1: Card Progress (4 Metric Cards Minimal) -->
      <div id="admmuriddash_metricRow1"></div>

      <!-- Row 2: Card Status Breakdown (5 Status Cards) -->
      <div id="admmuriddash_metricRow2"></div>

      <!-- Row 3: Card DAFTAR SEKOLAH SUDAH UNGGAH (4 Cards List Terpusat) -->
      <div id="admmuriddash_statusCardsContainer" class="mb-4"></div>

      <!-- Row 4: Card Tabel Rekapitulasi Per Unit Kerja -->
      <div class="row mb-4">
        <div class="col-12">
          <div class="card card-sultan-terpusat shadow-xs border-0">
            <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center pt-3 pb-2 px-3">
              <h6 class="font-weight-bold text-sultan-utama m-0 text-uppercase" id="admmuriddash_tableTitle" style="letter-spacing: 0.5px;">
                <i class="fas fa-table mr-2"></i>REKAPITULASI PER UNIT KERJA
              </h6>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive sultan-scroll">
                <table id="admmuriddash_tabelRekap" class="table table-hover sultan-table-datatable text-nowrap mb-0 w-100">
                  <thead>
                    <tr>
                      <th class="align-middle text-left font-weight-bold col-sticky-left" style="min-width: 250px;">NAMA SEKOLAH</th>
                      <th class="align-middle text-center font-weight-bold">MURID L</th>
                      <th class="align-middle text-center font-weight-bold">MURID P</th>
                      <th class="align-middle text-center font-weight-bold">JML MURID</th>
                    </tr>
                  </thead>
                  <tbody id="admmuriddash_tbodyRekap"></tbody>
                  <tfoot class="bg-light font-weight-bold text-sultan-utama" style="font-size: 13px;">
                    <tr>
                      <td class="text-left align-middle font-weight-bold">JUMLAH TOTAL</td>
                      <td class="text-center align-middle" id="admmuriddash_totalMuridL">0</td>
                      <td class="text-center align-middle" id="admmuriddash_totalMuridP">0</td>
                      <td class="text-center align-middle" id="admmuriddash_totalMuridAll">0</td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>
</section>

<script>
  var ADMMURIDDASH_CACHE_DATA = null;
  var ADMMURIDDASH_TABEL_REKAP = null;
  var ADMMURIDDASH_IS_ADMIN = false;

  $(document).ready(function () {
    var userLogin = typeof getSesiUser === 'function' ? getSesiUser() : {};
    var rStr = String(userLogin.role || "").toLowerCase();
    ADMMURIDDASH_IS_ADMIN = (rStr === "admin" || rStr === "superadmin");

    // 1. Render Row 1: Card Progress (JML SEKOLAH, SUDAH UNGGAH, BELUM UNGGAH, PROGRESS)
    if (typeof SultanUI !== 'undefined' && SultanUI.renderDashboardRow1Minimal) {
      $('#admmuriddash_metricRow1').html(SultanUI.renderDashboardRow1Minimal('admmuriddash', {
        totalLabel: 'JML SEKOLAH',
        sudahLabel: 'SUDAH UNGGAH',
        belumLabel: 'BELUM UNGGAH',
        progressLabel: 'PROGRESS'
      }));
    }

    // 2. Render Row 2: Card Status (JML DOKUMEN, DIPROSES, DISETUJUI, REVISI, DITOLAK)
    if (typeof SultanUI !== 'undefined' && SultanUI.renderDashboardRow2Minimal) {
      $('#admmuriddash_metricRow2').html(SultanUI.renderDashboardRow2Minimal('admmuriddash', {
        totalLabel: 'JML DOKUMEN',
        diprosesLabel: 'DIPROSES',
        disetujuiLabel: 'DISETUJUI',
        revisiLabel: 'REVISI',
        ditolakLabel: 'DITOLAK'
      }));
    }

    // 3. Render Row 3: Card DAFTAR SEKOLAH SUDAH UNGGAH (DIPROSES, DISETUJUI, REVISI, DITOLAK)
    if (typeof SultanUI !== 'undefined' && SultanUI.renderDashboardStatusCards4) {
      $('#admmuriddash_statusCardsContainer').html(SultanUI.renderDashboardStatusCards4('admmuriddash', {
        title: 'DAFTAR SEKOLAH SUDAH UNGGAH',
        diprosesLabel: 'DIPROSES',
        disetujuiLabel: 'DISETUJUI',
        revisiLabel: 'REVISI',
        ditolakLabel: 'DITOLAK',
        copyActionFn: 'admmuriddash_salinWaRekap()'
      }));
    }

    // Filter Jenjang & Sekolah untuk Admin / User
    if (ADMMURIDDASH_IS_ADMIN) {
      $('#admmuriddash_filterJenjangContainer').show();
      $('#admmuriddash_filterSekolahContainer').show();
    } else {
      $('#admmuriddash_filterJenjangContainer').hide();
      $('#admmuriddash_filterSekolahContainer').hide();
    }

    // Inisialisasi Filter Tahun Ajaran secara dinamis
    var now = new Date(); var curYear = now.getFullYear(); var curMonth = now.getMonth();
    var maxYear = (curMonth >= 6) ? curYear : (curYear - 1);
    var htmlTahun = '<option value="SEMUA">Semua Tahun</option>';
    for (var y = 2023; y <= maxYear; y++) {
      var ta = y + "/" + (y + 1);
      htmlTahun += '<option value="' + ta + '">' + ta + '</option>';
    }
    var initSub = $('#admmuriddash_filterSubmenu').val() || "SPMB";
    $('#admmuriddash_filterTahun').html(htmlTahun).val(getDynamicDefaultTahun(initSub));

    // Helper untuk kalkulasi default Tahun Ajaran secara dinamis
    function getDynamicDefaultTahun(submenuVal) {
      var d = new Date(); var y = d.getFullYear(); var m = d.getMonth();
      var curTA = (m >= 6) ? y + "/" + (y + 1) : (y - 1) + "/" + y;
      
      if (submenuVal === "IJAZAH" || submenuVal === "ARSIP_IJAZAH" || submenuVal === "ARSIP_TKA") {
        var parts = curTA.split("/");
        var prevStart = parseInt(parts[0], 10) - 1;
        var prevEnd = parseInt(parts[1], 10) - 1;
        return prevStart + "/" + prevEnd;
      }
      return curTA;
    }

    // Event handlers
    $('#admmuriddash_btnRefresh').click(function () {
      loadDashboardData(true);
    });

    $('#admmuriddash_filterSubmenu').change(function () {
      var subVal = $(this).val();
      var defaultTA = getDynamicDefaultTahun(subVal);
      $('#admmuriddash_filterTahun').val(defaultTA);
      loadDashboardData();
    });

    $('#admmuriddash_filterTahun, #admmuriddash_filterJenjang, #admmuriddash_filterSekolah').change(function () {
      if (this.id === 'admmuriddash_filterJenjang') {
        populateSekolahDropdown();
      }
      admmuriddash_terapkanFilterLokal();
    });

    // Live search listener 4 Card List Status
    $(document).off('keyup', '#admmuriddash_inputCariDiproses').on('keyup', '#admmuriddash_inputCariDiproses', function() {
      var val = $(this).val().toLowerCase().trim();
      $('#admmuriddash_listDiproses li.admmuriddash-item').filter(function() {
        $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
      });
    });
    $(document).off('keyup', '#admmuriddash_inputCariDisetujui').on('keyup', '#admmuriddash_inputCariDisetujui', function() {
      var val = $(this).val().toLowerCase().trim();
      $('#admmuriddash_listDisetujui li.admmuriddash-item').filter(function() {
        $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
      });
    });
    $(document).off('keyup', '#admmuriddash_inputCariRevisi').on('keyup', '#admmuriddash_inputCariRevisi', function() {
      var val = $(this).val().toLowerCase().trim();
      $('#admmuriddash_listRevisi li.admmuriddash-item').filter(function() {
        $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
      });
    });
    $(document).off('keyup', '#admmuriddash_inputCariDitolak').on('keyup', '#admmuriddash_inputCariDitolak', function() {
      var val = $(this).val().toLowerCase().trim();
      $('#admmuriddash_listDitolak li.admmuriddash-item').filter(function() {
        $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
      });
    });

    loadDashboardData();

    function loadDashboardData(forceRefresh) {
      if (typeof SultanUI !== 'undefined') {
        SultanUI.showLoading('#admmuriddash_loadingState', 'Memuat Data Dasbor Administrasi Murid...');
      } else {
        $('#admmuriddash_loadingState').show();
      }
      $('#admmuriddash_dashboardState').hide();

      var activeNpsn = !ADMMURIDDASH_IS_ADMIN ? (userLogin.npsn || userLogin.username || "") : "SEMUA";
      var tahun = $('#admmuriddash_filterTahun').val();

      google.script.run
        .withSuccessHandler(function (resRaw) {
          if (typeof SultanUI !== 'undefined') {
            SultanUI.hideLoading('#admmuriddash_loadingState');
          } else {
            $('#admmuriddash_loadingState').hide();
          }
          
          var res = typeof resRaw === 'string' ? JSON.parse(resRaw) : resRaw;
          if (res.success) {
            ADMMURIDDASH_CACHE_DATA = res;

            // Populasi dropdown Jenjang & Sekolah jika Admin
            if (ADMMURIDDASH_IS_ADMIN && res.detailSekolah) {
              populateJenjangDropdown(res.detailSekolah);
              populateSekolahDropdown();
            }

            $('#admmuriddash_dashboardState').fadeIn();
            admmuriddash_terapkanFilterLokal();
          } else {
            if (typeof SultanUI !== 'undefined') {
              SultanUI.showLoadingError('#admmuriddash_loadingState', 'Gagal memuat data: ' + (res.message || 'Unknown error'));
            }
          }
        })
        .withFailureHandler(function (err) {
          if (typeof SultanUI !== 'undefined') {
            SultanUI.showLoadingError('#admmuriddash_loadingState', 'Terjadi kesalahan: ' + (err.message || err));
          }
        })
        .admMurid_getDashboardData(activeNpsn, tahun);
    }
  });

  function populateJenjangDropdown(detailSekolah) {
    var selJenjang = $('#admmuriddash_filterJenjang');
    var curVal = selJenjang.val() || "SEMUA";
    var jenjangSet = new Set();
    
    (detailSekolah || []).forEach(function(s) {
      var j = (s.jenjang || s.bentuk || s.bentukPendidikan || "").toUpperCase().trim();
      if (j && j !== '-') jenjangSet.add(j);
    });

    selJenjang.empty().append('<option value="SEMUA">Semua Jenjang</option>');
    Array.from(jenjangSet).sort().forEach(function(j) {
      selJenjang.append($('<option>', { value: j, text: j }));
    });
    selJenjang.val(curVal);
  }

  function populateSekolahDropdown() {
    if (!ADMMURIDDASH_CACHE_DATA || !ADMMURIDDASH_CACHE_DATA.detailSekolah) return;
    var selSekolah = $('#admmuriddash_filterSekolah');
    var selJenjang = $('#admmuriddash_filterJenjang').val() || "SEMUA";
    var curVal = selSekolah.val() || "SEMUA";

    selSekolah.empty().append('<option value="SEMUA">Semua Sekolah</option>');
    
    var filtered = ADMMURIDDASH_CACHE_DATA.detailSekolah.filter(function(s) {
      if (selJenjang === "SEMUA") return true;
      var j = (s.jenjang || s.bentuk || s.bentukPendidikan || "").toUpperCase().trim();
      return j === selJenjang;
    });

    filtered.sort(function(a,b) { return String(a.nama || "").localeCompare(String(b.nama || "")); });

    filtered.forEach(function(s) {
      selSekolah.append($('<option>', { value: s.npsn, text: s.nama }));
    });

    if (selSekolah.find('option[value="' + curVal + '"]').length > 0) {
      selSekolah.val(curVal);
    } else {
      selSekolah.val("SEMUA");
    }
  }

  function admmuriddash_terapkanFilterLokal() {
    if (!ADMMURIDDASH_CACHE_DATA || !ADMMURIDDASH_CACHE_DATA.detailSekolah) return;

    var submenu = $('#admmuriddash_filterSubmenu').val(); // "SPMB", "IJAZAH", "ARSIP_IJAZAH", atau "ARSIP_TKA"
    var fJenjang = $('#admmuriddash_filterJenjang').val() || "SEMUA";
    var fSekolah = $('#admmuriddash_filterSekolah').val() || "SEMUA";
    
    // Set table title
    if (submenu === "SPMB") {
      $('#admmuriddash_tableTitle').html('<i class="fas fa-table mr-2"></i>REKAPITULASI LAPORAN SPMB PER UNIT KERJA');
    } else if (submenu === "IJAZAH") {
      $('#admmuriddash_tableTitle').html('<i class="fas fa-table mr-2"></i>REKAPITULASI CETAK IJAZAH PER UNIT KERJA');
    } else if (submenu === "ARSIP_IJAZAH") {
      $('#admmuriddash_tableTitle').html('<i class="fas fa-table mr-2"></i>REKAPITULASI ARSIP IJAZAH PER UNIT KERJA');
    } else {
      $('#admmuriddash_tableTitle').html('<i class="fas fa-table mr-2"></i>REKAPITULASI ARSIP TKA PER UNIT KERJA');
    }

    // Filter detailSekolah
    var schools = ADMMURIDDASH_CACHE_DATA.detailSekolah.filter(function (s) {
      var matchJenjang = (fJenjang === "SEMUA") || ((s.jenjang || s.bentuk || s.bentukPendidikan || "").toUpperCase().trim() === fJenjang);
      var matchSekolah = (fSekolah === "SEMUA") || (s.npsn === fSekolah);
      return matchJenjang && matchSekolah;
    });

    // Sort schools alphabetically by name (A-Z)
    schools.sort(function (a, b) {
      return String(a.nama || "").localeCompare(String(b.nama || ""));
    });

    // Hitung statistik & kumpulkan status lists
    var totSekolah = schools.length;
    var sudah = 0;
    var belum = 0;
    var diproses = 0;
    var disetujui = 0;
    var revisi = 0;
    var ditolak = 0;
    var jmlDokumen = 0;
    var sumL = 0;
    var sumP = 0;
    var sumTotal = 0;

    var listDiproses = [];
    var listDisetujui = [];
    var listRevisi = [];
    var listDitolak = [];
    var listBelum = [];

    var dtArray = [];

    schools.forEach(function (s) {
      var doc = (submenu === "SPMB") ? s.spmb : ((submenu === "IJAZAH") ? s.ijazah : ((submenu === "ARSIP_IJAZAH") ? s.arsip_ijazah : s.arsip_tka));
      var status = doc.status || "Belum Unggah";
      var statusKey = status.toLowerCase().trim();

      if (status === "Belum Unggah") {
        belum++;
        listBelum.push({ nama: s.nama, npsn: s.npsn });
      } else {
        sudah++;
        if (statusKey === "disetujui") {
          disetujui++;
          listDisetujui.push({ nama: s.nama, npsn: s.npsn });
        } else if (statusKey === "revisi") {
          revisi++;
          listRevisi.push({ nama: s.nama, npsn: s.npsn });
        } else if (statusKey === "ditolak") {
          ditolak++;
          listDitolak.push({ nama: s.nama, npsn: s.npsn });
        } else {
          // Status diproses / dicetak / pengajuan koreksi masuk diproses
          diproses++;
          listDiproses.push({ nama: s.nama, npsn: s.npsn });
        }

        // Hitung Jml Dokumen
        if (submenu === "SPMB") {
          jmlDokumen++;
        } else if (submenu === "IJAZAH") {
          if (doc.fileUrl) jmlDokumen++;
          if (doc.fileUrlTranskrip) jmlDokumen++;
          if (doc.fileUrlTranskripKolektif) jmlDokumen++;
        } else if (submenu === "ARSIP_IJAZAH") {
          if (doc.fileUrl) jmlDokumen++;
          if (doc.fileUrlTranskrip) jmlDokumen++;
        } else if (submenu === "ARSIP_TKA") {
          if (doc.fileUrl) jmlDokumen++;
          if (doc.fileDaftarUrl) jmlDokumen++;
        } else {
          if (doc.fileUrl) jmlDokumen++;
        }
      }

      // Kumpulkan data tabel
      var l = 0;
      var p = 0;
      var t = 0;

      if (doc.detail) {
        l = parseInt(doc.detail.muridL || 0);
        p = parseInt(doc.detail.muridP || 0);
        t = parseInt(doc.detail.total || 0);
      }

      sumL += l;
      sumP += p;
      sumTotal += t;

      var formatVal = function(val) {
        var n = parseInt(val) || 0;
        return n === 0 ? '<span class="text-muted opacity-50 font-weight-normal">-</span>' : '<span class="font-weight-bold">' + n.toLocaleString('id-ID') + '</span>';
      };

      dtArray.push([
        '<span class="font-weight-bold sultan-table-primary">' + s.nama + '</span>',
        formatVal(l),
        formatVal(p),
        t > 0 ? '<span class="font-weight-bold text-sultan-utama">' + t.toLocaleString('id-ID') + '</span>' : '<span class="text-muted opacity-50 font-weight-normal">-</span>'
      ]);
    });

    // Simpan cache untuk salin WA
    window.ADMMURIDDASH_LIST_BELUM_CACHE = listBelum;
    window.ADMMURIDDASH_LIST_REVISI_CACHE = listRevisi;
    window.ADMMURIDDASH_LIST_DITOLAK_CACHE = listDitolak;

    // 1. Update Card Progress
    var percentage = totSekolah > 0 ? Math.round((sudah / totSekolah) * 100) : 0;
    $('#admmuriddash_cardTotalSekolah').text(totSekolah.toLocaleString('id-ID'));
    $('#admmuriddash_cardSudah').text(sudah.toLocaleString('id-ID'));
    $('#admmuriddash_cardBelum').text(belum.toLocaleString('id-ID'));
    $('#admmuriddash_cardProgress').text(percentage + '%');

    // 2. Update Card Status Breakdown
    $('#admmuriddash_cardTotalDokumen').text(jmlDokumen.toLocaleString('id-ID'));
    $('#admmuriddash_cardDiproses').text(diproses.toLocaleString('id-ID'));
    $('#admmuriddash_cardDisetujui').text(disetujui.toLocaleString('id-ID'));
    $('#admmuriddash_cardRevisi').text(revisi.toLocaleString('id-ID'));
    $('#admmuriddash_cardDitolak').text(ditolak.toLocaleString('id-ID'));

    // 3. Update Badges 4 Status Cards List
    $('#admmuriddash_badgeDiproses').text(diproses);
    $('#admmuriddash_badgeDisetujui').text(disetujui);
    $('#admmuriddash_badgeRevisi').text(revisi);
    $('#admmuriddash_badgeDitolak').text(ditolak);

    // Populate 4 List Cards (Hanya nama sekolah saja)
    var categories = [
      { id: '#admmuriddash_listDiproses', list: listDiproses, emptyText: 'Tidak ada data diproses' },
      { id: '#admmuriddash_listDisetujui', list: listDisetujui, emptyText: 'Tidak ada data disetujui' },
      { id: '#admmuriddash_listRevisi', list: listRevisi, emptyText: 'Tidak ada data revisi' },
      { id: '#admmuriddash_listDitolak', list: listDitolak, emptyText: 'Tidak ada data ditolak' }
    ];

    categories.forEach(function(cat) {
      var $list = $(cat.id);
      $list.empty();

      if (cat.list.length === 0) {
        var emptyHtml = typeof SultanUI !== 'undefined' && SultanUI.renderListEmptyInfo ? 
          SultanUI.renderListEmptyInfo(cat.emptyText) : 
          '<li class="list-group-item bg-transparent text-center text-muted py-4 border-0" style="font-size:11px;">' + cat.emptyText + '</li>';
        $list.html(emptyHtml);
      } else {
        cat.list.forEach(function(item, index) {
          var idxNum = index + 1;
          var nama = String(item.nama || "-").toUpperCase();
          var delay = Math.min(index * 20, 300);

          var itemHtml = 
            '<li class="list-group-item bg-transparent py-2 px-3 font-weight-bold dashlapbul-list-item d-flex align-items-center animate__animated animate__fadeIn admmuriddash-item" style="font-size:12px;line-height:1.4;animation-delay:' + delay + 'ms;">' +
              '<span class="badge dashlapbul-badge-idx mr-2" style="width:25px;min-width:25px;flex-shrink:0;">' + idxNum + '</span>' +
              '<span class="school-name flex-grow-1 text-truncate" style="word-break:break-word;">' + nama + '</span>' +
            '</li>';

          $list.append(itemHtml);
        });
      }
    });

    // 4. Render Tabel Rekapitulasi (Default 10 Entri)
    if ($.fn.DataTable.isDataTable('#admmuriddash_tabelRekap')) {
      $('#admmuriddash_tabelRekap').DataTable().destroy();
    }
    ADMMURIDDASH_TABEL_REKAP = $('#admmuriddash_tabelRekap').DataTable({
      destroy: true,
      data: dtArray,
      ordering: true,
      pageLength: 10,
      autoWidth: false,
      order: [[0, 'asc']],
      columnDefs: [
        { targets: 0, className: 'text-left align-middle' },
        { targets: [1, 2, 3], className: 'text-center align-middle' }
      ],
      language: {
        search: "Cari:",
        lengthMenu: "Tampilkan _MENU_ data",
        info: "Menampilkan _START_ sampai _END_ dari _TOTAL_ data",
        emptyTable: "Tidak ada data yang tersedia pada tabel ini",
        paginate: { previous: "Sebelumnya", next: "Berikutnya" }
      },
      dom: "<'row mb-2'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>>" +
           "<'row'<'col-sm-12'tr>>" +
           "<'row mt-2'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>"
    });

    // Update Footer Totals
    var formatTotal = function(val) {
      return val === 0 ? "-" : val.toLocaleString('id-ID');
    };
    $('#admmuriddash_totalMuridL').text(formatTotal(sumL));
    $('#admmuriddash_totalMuridP').text(formatTotal(sumP));
    $('#admmuriddash_totalMuridAll').text(formatTotal(sumTotal));
  }

  function admmuriddash_salinWaRekap() {
    var belumList = window.ADMMURIDDASH_LIST_BELUM_CACHE || [];
    var revisiList = window.ADMMURIDDASH_LIST_REVISI_CACHE || [];
    var ditolakList = window.ADMMURIDDASH_LIST_DITOLAK_CACHE || [];

    if (belumList.length === 0 && revisiList.length === 0 && ditolakList.length === 0) {
      if (typeof Sultan !== 'undefined' && Sultan.notif) {
        Sultan.notif.info('Semua sekolah telah mengunggah dokumen dan berstatus valid.');
      } else {
        alert('Semua sekolah telah mengunggah dokumen.');
      }
      return;
    }

    var fTahun = $('#admmuriddash_filterTahun').val() || '-';
    var fSubmenu = $('#admmuriddash_filterSubmenu option:selected').text() || 'Laporan SPMB';
    var timeNow = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) + ' ' +
                  new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

    var txt = "*📢 REKAP DOKUMEN ADMINISTRASI MURID*\n";
    txt += "📁 *Kategori:* " + fSubmenu.toUpperCase() + "\n";
    txt += "📅 *Tahun:* " + fTahun + "\n";
    txt += "⏱️ *Data per:* " + timeNow + " WIB\n";
    txt += "=========================================\n\n";

    if (belumList.length > 0) {
      txt += "🔴 *BELUM UNGGAH (" + belumList.length + " Sekolah):*\n";
      belumList.forEach(function (item, i) {
        var nama = (typeof item === 'string') ? item : (item.nama || "-");
        txt += (i + 1) + ". " + nama + "\n";
      });
      txt += "\n";
    }

    if (revisiList.length > 0) {
      txt += "🟡 *PERLU REVISI (" + revisiList.length + " Sekolah):*\n";
      revisiList.forEach(function (item, i) {
        var nama = (typeof item === 'string') ? item : (item.nama || "-");
        txt += (i + 1) + ". " + nama + "\n";
      });
      txt += "\n";
    }

    if (ditolakList.length > 0) {
      txt += "🔴 *DITOLAK (" + ditolakList.length + " Sekolah):*\n";
      ditolakList.forEach(function (item, i) {
        var nama = (typeof item === 'string') ? item : (item.nama || "-");
        txt += (i + 1) + ". " + nama + "\n";
      });
      txt += "\n";
    }

    txt += "_Mohon sekolah terkait dapat menindaklanjuti pada aplikasi SIKS-Reborn._";

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(txt).then(function () {
        if (typeof Sultan !== 'undefined' && Sultan.notif) {
          Sultan.notif.sukses('Daftar berhasil disalin ke clipboard!');
        } else {
          alert('Daftar berhasil disalin ke clipboard!');
        }
      });
    } else {
      var $temp = $("<textarea>");
      $("body").append($temp);
      $temp.val(txt).select();
      document.execCommand("copy");
      $temp.remove();
      if (typeof Sultan !== 'undefined' && Sultan.notif) {
        Sultan.notif.sukses('Daftar berhasil disalin ke clipboard!');
      } else {
        alert('Daftar berhasil disalin ke clipboard!');
      }
    }
  }
</script>
