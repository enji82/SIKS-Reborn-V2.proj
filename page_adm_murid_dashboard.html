<style>
  #admmuriddash_tabelRekap_wrapper,
  #admmuriddash_tabelRekap_wrapper .dataTables_length,
  #admmuriddash_tabelRekap_wrapper .dataTables_length select,
  #admmuriddash_tabelRekap_wrapper .dataTables_filter,
  #admmuriddash_tabelRekap_wrapper .dataTables_filter input,
  #admmuriddash_tabelRekap_wrapper .dataTables_info,
  #admmuriddash_tabelRekap_wrapper .dataTables_paginate,
  #admmuriddash_tabelRekap_wrapper .pagination,
  #admmuriddash_tabelRekap_wrapper .page-item,
  #admmuriddash_tabelRekap_wrapper .page-link,
  #admmuriddash_tabelRekap_wrapper table,
  #admmuriddash_tabelRekap_wrapper table th,
  #admmuriddash_tabelRekap_wrapper table td,
  #admmuriddash_tabelRekap_wrapper table tr {
    font-size: 13px !important;
  }
  
  #admmuriddash_tabelRekap .badge {
    font-size: 11px !important;
  }
</style>

<section class="content text-sm">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12">

        <!-- Filter Pill Container -->
        <div class="sultan-filter-pill-container shadow-sm mb-4">
            <div class="sultan-filter-item">
                <select id="admmuriddash_filterSubmenu" class="form-control" aria-label="Pilih Sub Menu">
                    <option value="SPMB" selected>Laporan SPMB</option>
                    <option value="IJAZAH">Cetak Ijazah</option>
                    <option value="ARSIP_IJAZAH">Arsip Ijazah</option>
                </select>
                <i class="fas fa-chevron-down"></i>
            </div>

            <div class="sultan-filter-item">
                <select id="admmuriddash_filterTahun" class="form-control" aria-label="Pilih Tahun Ajaran">
                    <option value="SEMUA">- Semua Tahun -</option>
                </select>
                <i class="fas fa-chevron-down"></i>
            </div>

            <div class="sultan-filter-item" id="admmuriddash_filterContainer" style="display: none;">
                <select id="admmuriddash_filterSekolah" class="form-control" disabled aria-label="Pilih Sekolah">
                    <option value="SEMUA">- Semua Sekolah -</option>
                </select>
                <i class="fas fa-chevron-down"></i>
            </div>

            <div class="divider-vertical d-none d-md-block mx-2"></div>

            <button type="button" id="admmuriddash_btnRefresh" class="sultan-btn-refresh" title="Segarkan Data">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>

        <div id="admmuriddash_dashboardState">
            
            <!-- Row 1: Statistik Utama (4 Cards) - Rendered Dynamically -->
            <div id="admmuriddash_metricRow1"></div>

            <!-- Row 2: Status Detil (5 Columns) - Rendered Dynamically -->
            <div id="admmuriddash_metricRow2"></div>

            <!-- Sudah Unggah & Belum Unggah Lists - Rendered Dynamically -->
            <div id="admmuriddash_listsContainer"></div>

            <!-- Row 3: Tabel Rekapitulasi Data (Pindahkan ke paling bawah) -->
            <div class="row mb-4">
                <div class="col-12 mt-2">
                    <div class="card-sultan shadow-sm border-0" style="border-radius: var(--radius-sultan) !important; overflow: hidden;">
                        <div class="card-header card-header-sultan-adaptive py-2.5 d-flex justify-content-between align-items-center">
                            <h6 class="m-0 font-weight-bold text-maroon" id="admmuriddash_tableTitle" style="font-size: 14px;">
                                <i class="fas fa-table mr-2"></i>Rekapitulasi Capaian
                            </h6>
                        </div>
                        <div class="card-body p-3">
                            <div class="table-responsive sultan-scroll">
                                <table id="admmuriddash_tabelRekap" class="table table-premium table-sultan-compact mb-0 w-100 text-nowrap">
                                    <thead class="bg-light text-maroon text-uppercase font-weight-bold">
                                        <tr>
                                            <th class="text-left align-middle" style="min-width: 250px;">Nama Sekolah</th>
                                            <th class="text-center align-middle">Murid L</th>
                                            <th class="text-center align-middle">Murid P</th>
                                            <th class="text-center align-middle">Jml Murid</th>
                                        </tr>
                                    </thead>
                                    <tbody id="admmuriddash_tbodyRekap">
                                    </tbody>
                                    <tfoot class="bg-light font-weight-bold text-maroon" style="font-size: 13px;">
                                        <tr>
                                            <td class="text-left align-middle">JUMLAH TOTAL</td>
                                            <td class="text-center align-middle" id="admmuriddash_totalMuridL">0</td>
                                            <td class="text-center align-middle" id="admmuriddash_totalMuridP">0</td>
                                            <td class="text-center align-middle" id="admmuriddash_totalMuridAll">0</td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>

      </div>
    </div>
  </div>
</section>

<script>
  var ADMMURIDDASH_CACHE_DATA = null;
  var ADMMURIDDASH_TABEL_REKAP = null;
  var ADMMURIDDASH_BELUM_UNGGAH_LIST = [];

  $(document).ready(function () {
    // Render metric rows secara dinamis (Terpusat lewat SultanUI)
    $('#admmuriddash_metricRow1').html(SultanUI.renderDashboardRow1('admmuriddash', { total: 'JML SEKOLAH', sudah: 'SUDAH', belum: 'BELUM', progress: 'PROGRESS' }));
    var row2Cards = [
        { key: 'TotalDokumen', label: 'JML DOKUMEN', theme: 'metric-navy', icon: 'fas fa-file-alt' },
        { key: 'Diproses', label: 'DIPROSES', theme: 'metric-info', icon: 'fas fa-spinner fa-spin' },
        { key: 'Disetujui', label: 'DISETUJUI', theme: 'metric-success', icon: 'fas fa-check-double' },
        { key: 'Revisi', label: 'REVISI', theme: 'metric-gold', icon: 'fas fa-edit' },
        { key: 'Ditolak', label: 'DITOLAK', theme: 'metric-maroon', icon: 'fas fa-ban' }
    ];
    $('#admmuriddash_metricRow2').html(SultanUI.renderDashboardRow2('admmuriddash', row2Cards));
    $('#admmuriddash_listsContainer').html(SultanUI.renderDashboardLists('admmuriddash', { placeholderCari: 'Cari nama sekolah...', hasCopySudah: true, hasCopyBelum: true }));

    var userLogin = typeof getSesiUser === 'function' ? getSesiUser() : {};

    // Inisialisasi Filter Tahun Ajaran secara dinamis
    var now = new Date(); var curYear = now.getFullYear(); var curMonth = now.getMonth();
    var currentTahunAjaran = (curMonth >= 6) ? curYear + "/" + (curYear + 1) : (curYear - 1) + "/" + curYear;

    var htmlTahun = '<option value="SEMUA">- Semua Tahun -</option>';
    for (var y = 2023; y <= curYear + 1; y++) {
        var ta = y + "/" + (y + 1);
        htmlTahun += '<option value="' + ta + '">' + ta + '</option>';
    }
    $('#admmuriddash_filterTahun').html(htmlTahun).val(currentTahunAjaran);
    
    // Inisialisasi filter sekolah
    if (userLogin.role !== "Admin") {
      $('#admmuriddash_filterContainer').show();
      var activeNpsn = userLogin.npsn || userLogin.username || "";
      $('#admmuriddash_filterSekolah').html('<option value="' + activeNpsn + '">' + userLogin.unit + '</option>').prop('disabled', true);
    } else {
      $('#admmuriddash_filterContainer').show();
      $('#admmuriddash_filterSekolah').prop('disabled', false);
    }

    // Bind events
    $('#admmuriddash_btnRefresh').click(function () {
      loadDashboardData(true);
    });

    $('#admmuriddash_filterTahun, #admmuriddash_filterSubmenu, #admmuriddash_filterSekolah').change(function () {
      if (ADMMURIDDASH_CACHE_DATA) {
        admmuriddash_terapkanFilterLokal();
      } else {
        loadDashboardData();
      }
    });

    $(document).off('click', '#admmuriddash_btnSalinWa').on('click', '#admmuriddash_btnSalinWa', admmuriddash_salinKeWA);
    $(document).off('click', '#admmuriddash_btnSalinSudahWa').on('click', '#admmuriddash_btnSalinSudahWa', admmuriddash_salinSudahKeWA);
    $(document).off('keyup', '#admmuriddash_inputCariSudah').on('keyup', '#admmuriddash_inputCariSudah', function() { var val = $(this).val().toLowerCase(); $('.admmuriddash-item-sudah').filter(function() { $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1); }); });
    $(document).off('keyup', '#admmuriddash_inputCariBelum').on('keyup', '#admmuriddash_inputCariBelum', function() { var val = $(this).val().toLowerCase(); $('.admmuriddash-item-belum').filter(function() { $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1); }); });

    // Load Data awal
    loadDashboardData();

    function loadDashboardData(forceRefresh) {
      var btn = $('#admmuriddash_btnRefresh');
      btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin text-maroon"></i>');
      
      // Jalankan animasi rolling lottery
      if (typeof SultanUI !== 'undefined') {
        SultanUI.startLottery('#admmuriddash_cardTotalSekolah, #admmuriddash_cardSudah, #admmuriddash_cardBelum, #admmuriddash_cardTotalDokumen, #admmuriddash_cardDiproses, #admmuriddash_cardDisetujui, #admmuriddash_cardRevisi, #admmuriddash_cardDitolak', 3);
        SultanUI.startLottery('#admmuriddash_cardProgress', 2, '%');
      }
      $('#admmuriddash_progressText').html('<span class="sultan-skeleton" style="width: 80px; height: 14px; display: inline-block;"></span>');

      // Tampilkan skeleton loading di tabel rekapitulasi
      if ($.fn.DataTable.isDataTable('#admmuriddash_tabelRekap')) {
          $('#admmuriddash_tabelRekap').DataTable().destroy();
      }
      var skeletonTbody = '';
      for (var i = 0; i < 5; i++) {
          skeletonTbody += '<tr>' +
              '<td><span class="sultan-skeleton" style="width: 150px; height: 16px; display: inline-block; vertical-align: middle;"></span></td>' +
              '<td class="text-center"><span class="sultan-skeleton" style="width: 30px; height: 16px; display: inline-block; vertical-align: middle;"></span></td>' +
              '<td class="text-center"><span class="sultan-skeleton" style="width: 30px; height: 16px; display: inline-block; vertical-align: middle;"></span></td>' +
              '<td class="text-center"><span class="sultan-skeleton" style="width: 50px; height: 16px; display: inline-block; vertical-align: middle;"></span></td>' +
              '</tr>';
      }
      $('#admmuriddash_tbodyRekap').html(skeletonTbody);

      var activeNpsn = (userLogin.role !== "Admin") ? (userLogin.npsn || userLogin.username || "") : "SEMUA";
      var tahun = $('#admmuriddash_filterTahun').val();

      google.script.run.withSuccessHandler(function (resRaw) {
        btn.prop('disabled', false).html('<i class="fas fa-sync-alt"></i>');
        $('.card-loading-overlay').remove();
        
        var res = JSON.parse(resRaw);
        if (res.success) {
          ADMMURIDDASH_CACHE_DATA = res;

          // Inisialisasi list dropdown sekolah jika admin
          if (userLogin.role === "Admin") {
            var selSekolah = $('#admmuriddash_filterSekolah');
            var curVal = selSekolah.val() || "SEMUA";
            selSekolah.empty().append('<option value="SEMUA">- Semua Sekolah -</option>');
            res.detailSekolah.forEach(function (s) {
              selSekolah.append($('<option>', { value: s.npsn, text: s.nama }));
            });
            selSekolah.val(curVal);
          }

          admmuriddash_terapkanFilterLokal();
        } else {
          Sultan.notif.gagal(res.message || "Gagal memuat data dashboard.");
        }
      }).withFailureHandler(function (err) {
        btn.prop('disabled', false).html('<i class="fas fa-sync-alt"></i>');
        $('.card-loading-overlay').remove();
        Sultan.notif.gagal("Koneksi gagal: " + err.message);
      }).admMurid_getDashboardData(activeNpsn, tahun);
    }
  });

  function admmuriddash_animateValue(id, end, formatPercent) {
    if (typeof SultanUI !== 'undefined') {
        SultanUI.stopLottery('#' + id);
    }
    var obj = document.getElementById(id);
    if(!obj) return;
    var start = 0; 
    var duration = 800; 
    
    if (obj.dataset.animId) {
        cancelAnimationFrame(parseInt(obj.dataset.animId, 10));
    }
    
    var startTime = null;
    
    function step(timestamp) {
        if (!startTime) startTime = timestamp;
        var progress = Math.min((timestamp - startTime) / duration, 1);
        var val = Math.floor(progress * (end - start) + start);
        obj.innerHTML = val.toLocaleString('id-ID') + (formatPercent ? '%' : '');
        if (progress < 1) {
            var animId = window.requestAnimationFrame(step);
            obj.dataset.animId = animId;
        } else {
            obj.dataset.animId = "";
        }
    }
    var firstAnimId = window.requestAnimationFrame(step);
    obj.dataset.animId = firstAnimId;
  }

  function admmuriddash_terapkanFilterLokal() {
    if (!ADMMURIDDASH_CACHE_DATA) return;

    var submenu = $('#admmuriddash_filterSubmenu').val(); // "SPMB", "IJAZAH", atau "ARSIP_IJAZAH"
    var fSekolah = $('#admmuriddash_filterSekolah').val() || "SEMUA";
    
    // Set table title
    if (submenu === "SPMB") {
        $('#admmuriddash_tableTitle').html('<i class="fas fa-table mr-2"></i>Rekapitulasi Jumlah Murid Kelas 1');
    } else if (submenu === "IJAZAH") {
        $('#admmuriddash_tableTitle').html('<i class="fas fa-table mr-2"></i>Rekapitulasi Jumlah Cetak Ijazah');
    } else {
        $('#admmuriddash_tableTitle').html('<i class="fas fa-table mr-2"></i>Rekapitulasi Jumlah Arsip Ijazah');
    }

    // Filter detailSekolah
    var schools = ADMMURIDDASH_CACHE_DATA.detailSekolah.filter(function (s) {
      return fSekolah === "SEMUA" || s.npsn === fSekolah;
    });

    // Sort schools alphabetically by name (A-Z)
    schools.sort(function (a, b) {
      return String(a.nama || "").localeCompare(String(b.nama || ""));
    });

    // Hitung statistik
    var totSekolah = schools.length;
    var sudah = 0;
    var belum = 0;
    var dicetak = 0;
    var diproses = 0;
    var disetujui = 0;
    var revisi = 0;
    var ditolak = 0;
    
    var jmlDokumen = 0;
    var sumRombel = 0;
    var sumL = 0;
    var sumP = 0;
    var sumTotal = 0;

    ADMMURIDDASH_BELUM_UNGGAH_LIST = [];
    ADMMURIDDASH_SUDAH_UNGGAH_LIST = [];
    var dtArray = [];
    var listSudah = [];
    var listBelum = [];

    schools.forEach(function (s) {
      var doc = (submenu === "SPMB") ? s.spmb : ((submenu === "IJAZAH") ? s.ijazah : s.arsip_ijazah);
      var status = doc.status || "Belum Unggah";

      // 1. Hitung Sasaran & Status
      if (status === "Belum Unggah") {
        belum++;
        ADMMURIDDASH_BELUM_UNGGAH_LIST.push({ nama: s.nama, npsn: s.npsn });
        listBelum.push(s);
      } else {
        sudah++;
        listSudah.push(s);
        ADMMURIDDASH_SUDAH_UNGGAH_LIST.push({ nama: s.nama, npsn: s.npsn, status: status });
        var statKey = status.toLowerCase();
        if (statKey === "disetujui") disetujui++;
        else if (statKey === "dicetak") {
          if (submenu === "IJAZAH") {
            dicetak++;
          } else {
            diproses++;
          }
        }
        else if (statKey === "diproses") diproses++;
        else if (statKey === "revisi") revisi++;
        else if (statKey === "ditolak") ditolak++;

        // Hitung Jml Dokumen
        if (submenu === "SPMB") {
          jmlDokumen++;
        } else if (submenu === "IJAZAH") {
          if (doc.fileUrl) jmlDokumen++;
          if (doc.fileUrlTranskrip) jmlDokumen++;
          if (doc.fileUrlTranskripKolektif) jmlDokumen++;
        } else {
          if (doc.fileUrl) jmlDokumen++;
          if (doc.fileUrlTranskrip) jmlDokumen++;
        }
      }

      // 2. Kumpulkan Detail data untuk Tabel
      var r = 0;
      var l = 0;
      var p = 0;
      var t = 0;

      if (doc.detail) {
        r = (submenu === "SPMB") ? (parseInt(doc.detail.rombel) || 0) : 0;
        l = parseInt(doc.detail.muridL || 0);
        p = parseInt(doc.detail.muridP || 0);
        t = parseInt(doc.detail.total || 0);
      }

      sumRombel += r;
      sumL += l;
      sumP += p;
      sumTotal += t;

      var sekolahCell = '<div class="sultan-table-primary">' + s.nama + '</div>' +
                        '<div class="sultan-table-secondary">' + s.npsn + '</div>';

      var badgeClass = "badge-secondary";
      var statLabel = status;
      if (status !== "Belum Unggah") {
        if (status.toLowerCase() === "disetujui") badgeClass = "badge-success";
        else if (status.toLowerCase() === "diproses" || status.toLowerCase() === "dicetak") badgeClass = "badge-warning";
        else if (status.toLowerCase() === "revisi") badgeClass = "badge-info";
        else if (status.toLowerCase() === "ditolak") badgeClass = "badge-danger";
        statLabel = '<i class="fas fa-check-circle mr-1"></i>' + status;
      } else {
        statLabel = '<i class="fas fa-exclamation-circle mr-1"></i>Belum Unggah';
      }

      var formatZero = function(val) {
        var n = parseInt(val) || 0;
        return n === 0 ? '<span class="text-muted opacity-50">-</span>' : n.toLocaleString('id-ID');
      };

      dtArray.push([
         sekolahCell,
         formatZero(l),
         formatZero(p),
         t > 0 ? '<span class="font-weight-bold text-maroon">' + t.toLocaleString('id-ID') + '</span>' : '<span class="text-muted opacity-50">-</span>'
      ]);
    });

    // Render Row 2 dinamis jika kategori adalah Cetak Ijazah (IJAZAH)
    var row2Cards = [];
    if (submenu === "IJAZAH") {
        row2Cards = [
            { key: 'TotalDokumen', label: 'JML DOKUMEN', theme: 'metric-navy', icon: 'fas fa-file-alt' },
            { key: 'Dicetak', label: 'DICETAK', theme: 'metric-info', icon: 'fas fa-print' },
            { key: 'Diproses', label: 'DIPROSES', theme: 'metric-info', icon: 'fas fa-spinner fa-spin' },
            { key: 'Disetujui', label: 'DISETUJUI', theme: 'metric-success', icon: 'fas fa-check-double' },
            { key: 'Revisi', label: 'REVISI', theme: 'metric-gold', icon: 'fas fa-edit' },
            { key: 'Ditolak', label: 'DITOLAK', theme: 'metric-maroon', icon: 'fas fa-ban' }
        ];
    } else {
        row2Cards = [
            { key: 'TotalDokumen', label: 'JML DOKUMEN', theme: 'metric-navy', icon: 'fas fa-file-alt' },
            { key: 'Diproses', label: 'DIPROSES', theme: 'metric-info', icon: 'fas fa-spinner fa-spin' },
            { key: 'Disetujui', label: 'DISETUJUI', theme: 'metric-success', icon: 'fas fa-check-double' },
            { key: 'Revisi', label: 'REVISI', theme: 'metric-gold', icon: 'fas fa-edit' },
            { key: 'Ditolak', label: 'DITOLAK', theme: 'metric-maroon', icon: 'fas fa-ban' }
        ];
    }
    $('#admmuriddash_metricRow2').html(SultanUI.renderDashboardRow2('admmuriddash', row2Cards));

    // Render Metrics
    admmuriddash_animateValue('admmuriddash_cardTotalSekolah', totSekolah);
    admmuriddash_animateValue('admmuriddash_cardSudah', sudah);
    admmuriddash_animateValue('admmuriddash_cardBelum', belum);
    
    var percentage = totSekolah > 0 ? Math.round((sudah / totSekolah) * 100) : 0;
    admmuriddash_animateValue('admmuriddash_cardProgress', percentage, true);

    admmuriddash_animateValue('admmuriddash_cardTotalDokumen', jmlDokumen);
    if (submenu === "IJAZAH") {
        admmuriddash_animateValue('admmuriddash_cardDicetak', dicetak);
    }
    admmuriddash_animateValue('admmuriddash_cardDiproses', diproses);
    admmuriddash_animateValue('admmuriddash_cardDisetujui', disetujui);
    admmuriddash_animateValue('admmuriddash_cardRevisi', revisi);
    admmuriddash_animateValue('admmuriddash_cardDitolak', ditolak);

    // Progress Bar
    var pBar = $('#admmuriddash_progressBar');
    pBar.css('width', percentage + '%').attr('aria-valuenow', percentage);
    $('#admmuriddash_progressText').text(percentage + '% Selesai');
    
    if (percentage < 30) pBar.css('background-color', '#d11a2a');
    else if (percentage < 70) pBar.css('background-color', '#ffc107');
    else pBar.css('background-color', '#28a745');

    // Update Badges Sudah/Belum
    $('#admmuriddash_badgeSudah').text(sudah);
    $('#admmuriddash_badgeBelum').text(belum);

    // List Sudah Unggah
    var uiSudah = '';
    if (listSudah.length === 0) { 
        uiSudah = '<li class="list-group-item text-center py-5"><i class="fas fa-exclamation-triangle fa-2x text-warning mb-3 opacity-50"></i><br><div class="font-weight-bold text-dark mb-1" style="font-size:12px;">Belum Ada Data</div></li>'; 
    } else {
        listSudah.forEach(function(s, idx) {
            var doc = (submenu === "SPMB") ? s.spmb : ((submenu === "IJAZAH") ? s.ijazah : s.arsip_ijazah);
            var t = doc.detail ? (parseInt(doc.detail.total) || 0) : 0;
            var statusStr = doc.status || "Diproses";
            var statusType = 'info';
            if (statusStr.toLowerCase() === "disetujui") statusType = "success";
            else if (statusStr.toLowerCase() === "diproses" || statusStr.toLowerCase() === "dicetak") statusType = "info";
            else if (statusStr.toLowerCase() === "revisi") statusType = "warning";
            else if (statusStr.toLowerCase() === "ditolak") statusType = "danger";

            var extraAttrs = 'class="list-group-item admmuriddash-item-sudah py-2 px-3 hover-sultan"';
            uiSudah += SultanUI.renderListItem(idx + 1, s.nama, 'NPSN: ' + s.npsn, 'Total Murid: ' + t.toLocaleString('id-ID'), statusType, extraAttrs);
        });
    }
    $('#admmuriddash_listSudah').html(uiSudah); $('#admmuriddash_inputCariSudah').val('');

    // List Belum Unggah
    var uiBelum = '';
    if (listBelum.length === 0) { 
        uiBelum = '<li class="list-group-item text-center py-5"><i class="fas fa-check-circle fa-2x text-success mb-3 opacity-50"></i><br><div class="font-weight-bold text-dark mb-1" style="font-size:12px;">Semua Sudah Unggah</div></li>'; 
    } else {
        listBelum.forEach(function(s, idx) {
            var extraAttrs = 'class="list-group-item admmuriddash-item-belum py-2 px-3 hover-sultan"';
            uiBelum += SultanUI.renderListItem(idx + 1, s.nama, 'NPSN: ' + s.npsn, 'BELUM', 'danger', extraAttrs);
        });
    }
    $('#admmuriddash_listBelum').html(uiBelum); $('#admmuriddash_inputCariBelum').val('');



    // Render JQuery DataTable Rekap
    if ($.fn.DataTable.isDataTable('#admmuriddash_tabelRekap')) {
        ADMMURIDDASH_TABEL_REKAP = $('#admmuriddash_tabelRekap').DataTable();
    } else {
        ADMMURIDDASH_TABEL_REKAP = SultanTable.init('#admmuriddash_tabelRekap', {
            destroy: true, ordering: false, pageLength: 10, autoWidth: false, deferRender: true,
            dom: "<'row mb-2'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>>" +
                 "<'row'<'col-sm-12'<'table-responsive sultan-scroll'tr>>>" +
                 "<'row mt-2'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>",
            columnDefs: [
                { targets: 0, className: "text-left align-middle" },
                { targets: [1, 2, 3], className: "text-center align-middle" }
            ],
            language: { url: "//cdn.datatables.net/plug-ins/1.10.25/i18n/Indonesian.json", emptyTable: "Tidak ada data." }
        });
    }

    ADMMURIDDASH_TABEL_REKAP.clear().rows.add(dtArray).draw(false);

    // Update Footer Totals
    var formatTotal = function(val) {
      return val === 0 ? "-" : val.toLocaleString('id-ID');
    };
    $('#admmuriddash_totalMuridL').text(formatTotal(sumL));
    $('#admmuriddash_totalMuridP').text(formatTotal(sumP));
    $('#admmuriddash_totalMuridAll').text(formatTotal(sumTotal));
  }

  function admmuriddash_salinKeWA() {
    if (ADMMURIDDASH_BELUM_UNGGAH_LIST.length === 0) { Sultan.notif.info('Semua sekolah sudah mengunggah dokumen.'); return; }
    
    var submenu = $('#admmuriddash_filterSubmenu').val();
    var selSub = (submenu === "SPMB") ? "Laporan SPMB" : ((submenu === "IJAZAH") ? "Cetak Ijazah" : "Arsip Ijazah");
    var selTahun = $('#admmuriddash_filterTahun').val() === "SEMUA" ? "Semua Tahun" : $('#admmuriddash_filterTahun').val();
    
    var teks = `🚨 *DAFTAR SEKOLAH BELUM UNGGAH* 🚨\n`;
    teks += `Menu: Administrasi Murid (${selSub})\n`;
    teks += `Tahun Ajaran: ${selTahun}\n`;
    teks += `Total Belum Unggah: ${ADMMURIDDASH_BELUM_UNGGAH_LIST.length} Sekolah\n\n`;

    ADMMURIDDASH_BELUM_UNGGAH_LIST.forEach(function(item, idx) {
        teks += `${idx + 1}. ${item.nama.toUpperCase()} | ${item.npsn}\n`;
    });

    teks += `\nMohon segera mengunggah dokumen sekolah Anda melalui SIKS-REBORN. Terima kasih. 🙏`;

    navigator.clipboard.writeText(teks).then(function() {
        Sultan.notif.sukses('Daftar belum unggah berhasil disalin ke Clipboard.');
    }).catch(function() { Sultan.alert('error', 'Gagal Menyalin', 'Browser Anda tidak mendukung Clipboard API.'); });
  }

  function admmuriddash_salinSudahKeWA() {
    if (ADMMURIDDASH_SUDAH_UNGGAH_LIST.length === 0) { Sultan.notif.info('Belum ada sekolah yang mengunggah dokumen.'); return; }
    
    var submenu = $('#admmuriddash_filterSubmenu').val();
    var selSub = (submenu === "SPMB") ? "Laporan SPMB" : ((submenu === "IJAZAH") ? "Cetak Ijazah" : "Arsip Ijazah");
    var selTahun = $('#admmuriddash_filterTahun').val() === "SEMUA" ? "Semua Tahun" : $('#admmuriddash_filterTahun').val();
    
    var teks = `✅ *DAFTAR SEKOLAH SUDAH UNGGAH* ✅\n`;
    teks += `Menu: Administrasi Murid (${selSub})\n`;
    teks += `Tahun Ajaran: ${selTahun}\n`;
    teks += `Total Sudah Unggah: ${ADMMURIDDASH_SUDAH_UNGGAH_LIST.length} Sekolah\n\n`;

    ADMMURIDDASH_SUDAH_UNGGAH_LIST.forEach(function(item, idx) {
        // Capitalize status
        var rawStatus = String(item.status || "Diproses");
        var formattedStatus = rawStatus.charAt(0).toUpperCase() + rawStatus.slice(1).toLowerCase();
        teks += `${idx + 1}. ${item.nama.toUpperCase()} | ${item.npsn} | *${formattedStatus}*\n`;
    });

    teks += `\nTerima kasih sudah melaporkan, bagi yang revisi mohon untuk diperbaiki melalui SIKS-REBORN. 🙏`;

    navigator.clipboard.writeText(teks).then(function() {
        Sultan.notif.sukses('Daftar sudah unggah berhasil disalin ke Clipboard.');
    }).catch(function() { Sultan.alert('error', 'Gagal Menyalin', 'Browser Anda tidak mendukung Clipboard API.'); });
  }
</script>
