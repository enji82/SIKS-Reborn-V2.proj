<!-- CSS tersentralisasi di css_sultan.html Section 18.1 & 18.2 -->
<style>
.ta-freq-badge {
  display: inline-block;
  padding: 2px 6px;
  font-size: 0.75rem;
  font-weight: 700;
  border-radius: 10px;
  background-color: #f0f2f5;
  color: #495057;
  border: 1px solid #e9ecef;
}
.dark-mode .ta-freq-badge {
  background-color: rgba(255, 255, 255, 0.08);
  color: #adb5bd;
  border-color: rgba(255, 255, 255, 0.12);
}

.ta-durasi-val {
  font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  font-size: 0.82rem;
  font-weight: 600;
  color: #212529;
}
.dark-mode .ta-durasi-val {
  color: #e9ecef;
}

.ta-kpi-col {
  background-color: #fff5f5 !important;
}
.dark-mode .ta-kpi-col {
  background-color: rgba(217, 83, 79, 0.15) !important;
}
</style>

<section class="content">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12">

        <!-- BAGIAN INFORMASI (GLOBAL SULTAN STYLE) -->
        <div class="sultan-info-card">
          <div class="card-body">
            <div class="info-header" data-toggle="collapse" data-target="#ta_infoCollapse" aria-expanded="false">
              <div class="info-title">
                                <div class="info-icon-circle"><i class="fas fa-info"></i></div>
                                <span>Informasi</span>
                            </div>
              <i class="fas fa-chevron-down"></i>
            </div>
            <div id="ta_infoCollapse" class="collapse">
              <div class="info-body">
                <ul class="mb-0 pl-3">
                    <li>Data diurutkan berdasarkan <b>Total Menit Terlambat (JUMLAH)</b> terbanyak.</li>
                    <li>Sub-kolom <b>KALI</b> menunjukkan frekuensi keterlambatan (berapa kali), sedangkan <b>DURASI</b> menunjukkan total waktu keterlambatan.</li>
                </ul>
              </div>
            </div>
          </div>
        </div>

        <!-- FILTER BAR (STANDAR GLOBAL SULTAN) -->
        <div id="ta_wadahFilter" class="sultan-filter-pill-container shadow-sm mb-4">
            <div class="sultan-filter-item">
                <select id="ta_filterTahun" class="form-control" disabled></select>
                <i class="fas fa-chevron-down"></i>
            </div>
            
            <div class="sultan-filter-item">
                <select id="ta_filterUnit" class="form-control font-weight-bold text-maroon" disabled>
                    <option value="">- Memvalidasi Akses... -</option>
                </select>
                <i class="fas fa-chevron-down"></i>
            </div>

            <div class="divider-vertical d-none d-md-block mx-2"></div>

            <button type="button" id="ta_btnRefresh" class="sultan-btn-refresh" title="Segarkan Data dari Server" disabled>
                    <i class="fas fa-sync-alt"></i>
                </button>
        </div>

        <div class="card-sultan">
            <div class="card-body p-3">
              
              <div id="ta_loadingState">
                      <!-- Spinner Otomatis via SultanUI.showLoading -->
              </div>

              <div id="ta_tableState" style="display: none;">
                  <table id="ta_tabelUtama" class="table table-bordered table-hover table-premium table-sultan-compact table-header-compact mb-0 w-100">
                    <thead class="thead-sultan-premium thead-tiered">
                        <tr id="ta_rowHeaderTop">
                            <th class="col-sticky-left text-left px-3 align-middle">NAMA ASN</th>
                            <th class="text-center align-middle px-2">Memuat...</th>
                        </tr>
                        <tr id="ta_rowHeaderSub"></tr>
                    </thead>
                    <tbody></tbody>
                  </table>
              </div>

            </div>
        </div>

      </div>
    </div>
  </div>
</section>

<script>
// ======================================================================
// ISOLASI VARIABEL GLOBAL (MASTER BLUEPRINT V8 - DYNAMIC READ ONLY)
// BAB I: Prefix Mutlak ta_
// ======================================================================
var TA_CACHE_DATA = []; 
var TA_HEADER_TOP = [];
var TA_HEADER_SUB = [];
var TA_CACHE_THN = "";
var TA_TABEL_INSTANCE = null;

var TA_USER_AKTIF = "";
var TA_IS_ADMIN = false;
var TA_UNIT_TERKUNCI = ""; 
var TA_USER_NPSN = "";
var TA_IS_LOADING = false; // GUARD: Mencegah load ganda

// =================================================================
// 1. INITIALIZATION & SPA VACCINE (Hukum Ke-1)
// =================================================================
$(document).ready(function() {
    TA_TABEL_INSTANCE = null;
    $('#ta_tableState').hide();
    SultanUI.showLoading('#ta_loadingState');

    // Cek Sesi Login
    try {
        var user = (typeof getSesiUser === 'function') ? getSesiUser() : {};
        TA_USER_AKTIF = user.nama_lengkap || user.fullname || user.nama || user.username || "User Web";
        TA_IS_ADMIN = (user.role || "").toLowerCase().includes("admin");
        TA_USER_NPSN = user.npsn || user.username || ""; 
    } catch(e) { TA_USER_NPSN = ""; TA_IS_ADMIN = false; }
    
    // VAKSINASI EVENT SPA DELEGATION (Pemusnahan onClick Inline)
    // 1. Pemicu Dropdown -> Menggunakan Cache (Zero Blink)
    $(document).off('change', '#ta_filterTahun').on('change', '#ta_filterTahun', ta_prosesCariData);
    $(document).off('change', '#ta_filterUnit').on('change', '#ta_filterUnit', ta_terapkanFilterLokal);
    
    // 2. Pemicu Tombol Refresh -> Paksa ambil dari Server (Bypass Cache)
    $(document).off('click', '#ta_btnRefresh').on('click', '#ta_btnRefresh', ta_tarikDataServer);

    ta_initFilters();
});

// =================================================================
// 2. CHAINED INITIALIZATION: FILTERS -> GATEKEEPER -> FETCH
// =================================================================
function ta_initFilters() {
    $('#ta_loadingText').html('Memuat Konfigurasi Tahun...');

    google.script.run.withSuccessHandler(function(res) {
        var data = JSON.parse(res);
        
        var elThn = $('#ta_filterTahun').empty().append('<option value="">- Tahun -</option>');
        if (data.years && data.years.length > 0) {
            data.years.forEach(y => elThn.append(`<option value="${ta_escapeHtml(y)}">${ta_escapeHtml(y)}</option>`));
        }
        
        var curYear = new Date().getFullYear().toString();
        if ($("#ta_filterTahun option[value='"+curYear+"']").length > 0) {
            $('#ta_filterTahun').val(curYear);
        }
        
        $('#ta_filterTahun, #ta_btnRefresh').prop('disabled', false);

        ta_validasiAksesUser(); 

    }).getSiabaTerlambatFilters();
}

function ta_validasiAksesUser() {
    $('#ta_loadingText').html('Mempersiapkan Akses...');

    if (TA_IS_ADMIN) {
        $('#ta_filterUnit').empty().append('<option value="SEMUA">- Semua Unit Kerja -</option>').prop('disabled', false).removeClass('bg-light text-maroon font-weight-bold');
        ta_tarikDataServer(); 
    } else {
        if (!TA_USER_NPSN) {
            $('#ta_filterUnit').empty().append('<option value="">AKSES DITOLAK</option>');
            $('#ta_loadingText').html('<span class="text-danger"><i class="fas fa-ban mb-2"></i><br>Akses ditolak: Sesi login tidak valid.</span>');
            return;
        }

        google.script.run
            .withSuccessHandler(function(resUnit) {
                var dataUnit = JSON.parse(resUnit);
                if (dataUnit.error) {
                    $('#ta_filterUnit').empty().append('<option value="">AKSES DITOLAK</option>');
                    $('#ta_loadingText').html(`<span class="text-danger"><i class="fas fa-exclamation-triangle mb-2"></i><br>${ta_escapeHtml(dataUnit.error)}</span>`);
                    return;
                }

                TA_UNIT_TERKUNCI = dataUnit.unitKerja;
                $('#ta_filterUnit').empty().append($('<option>', {value: TA_UNIT_TERKUNCI, text: TA_UNIT_TERKUNCI})).prop('disabled', true);
                
                ta_tarikDataServer();
            })
            .withFailureHandler(function(err) {
                $('#ta_filterUnit').empty().append('<option value="">ERROR SERVER</option>');
                $('#ta_loadingText').html(`<span class="text-danger"><i class="fas fa-wifi mb-2"></i><br>Koneksi Database Induk Terputus: ${ta_escapeHtml(err.message)}</span>`);
            })
            .getUnitKerjaByNPSN(TA_USER_NPSN); 
    }
}

// =================================================================
// 3. FETCH DATA DARI SERVER (BAB VIII)
// =================================================================
function ta_prosesCariData() {
    var th = $('#ta_filterTahun').val();
    if (!th) { Sultan.notif.info('Pilih Tahun terlebih dahulu.'); return; }
    
    // Filter Lokal (Zero Blink)
    if (th === TA_CACHE_THN && TA_CACHE_DATA.length > 0) { 
        ta_terapkanFilterLokal(); 
    } else { 
        ta_tarikDataServer(); 
    }
}

function ta_tarikDataServer() {
    if (TA_IS_LOADING) return;

    var th = $('#ta_filterTahun').val();
    if(!th) return;

    TA_IS_LOADING = true;
    var btn = $('#ta_btnRefresh');
    btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin text-maroon"></i>');
    if(TA_IS_ADMIN) $('#ta_filterUnit').prop('disabled', true);
    
    // MUNCULKAN RUANG A JIKA TABEL BELUM PERNAH DIBUAT ATAU REFRESH PAKSA
    if (!$.fn.DataTable.isDataTable('#ta_tabelUtama')) {
        $('#ta_tableState').hide();
        $('#ta_loadingText').html('Mengambil data presensi terlambat...');
        SultanUI.showLoading('#ta_loadingState');
    }

    google.script.run
        .withSuccessHandler(function(res) {
            btn.prop('disabled', false).html('<i class="fas fa-sync-alt text-maroon"></i>');
            if(TA_IS_ADMIN) $('#ta_filterUnit').prop('disabled', false);
            
            var data;
            try {
                data = typeof res === 'string' ? JSON.parse(res) : res;
            } catch(e) {
                console.error("JSON Error:", e);
                $('#ta_tableState').hide();
                SultanUI.showLoading('#ta_loadingState');
                $('#ta_loadingText').html('<span class="text-danger"><i class="fas fa-times-circle mb-2"></i><br>Gagal memproses struktur JSON Server.</span>');
                return;
            }
            
            if (data && data.error) {
                $('#ta_tableState').hide();
                SultanUI.showLoading('#ta_loadingState');
                $('#ta_loadingText').html(`<span class="text-danger"><i class="fas fa-exclamation-triangle mb-2"></i><br>${ta_escapeHtml(data.error)}</span>`);
                return;
            }
            
            try {
                TA_HEADER_TOP = data.headerTop || [];
                TA_HEADER_SUB = data.headerSub || [];
                TA_CACHE_DATA = data.rows || []; 
                TA_CACHE_THN = th; 
                
                if(TA_IS_ADMIN) ta_populateDropdownUnit();

                TA_IS_LOADING = false; // BUKA KUNCI
                // Render Tabel otomatis menghandle Dynamic Header & Injeksi
                ta_terapkanFilterLokal(); 

            } catch(e) { 
                console.error("Table Error:", e);
                $('#ta_tableState').hide();
                SultanUI.showLoading('#ta_loadingState');
                $('#ta_loadingText').html('<span class="text-danger"><i class="fas fa-exclamation-triangle mb-2"></i><br>Gagal merakit tabel: ' + ta_escapeHtml(e.message) + '</span>'); 
            }
        })
        .withFailureHandler(function(err) {
            TA_IS_LOADING = false; // BUKA KUNCI
            btn.prop('disabled', false).html('<i class="fas fa-search text-maroon"></i>');
            if(TA_IS_ADMIN) $('#ta_filterUnit').prop('disabled', false);
            $('#ta_tableState').hide();
            SultanUI.showLoading('#ta_loadingState');
            $('#ta_loadingText').html(`<span class="text-danger"><i class="fas fa-wifi mb-2"></i><br>Koneksi Terputus: ${ta_escapeHtml(err.message)}</span>`);
        })
        .getSiabaTerlambatData(th, "SEMUA"); 
}

function ta_populateDropdownUnit() {
    var unique = new Set();
    TA_CACHE_DATA.forEach(function(row) {
        var lastIdx = row.length - 1;
        var unit = String(row[lastIdx]).trim();
        if (unit) unique.add(unit);
    });
    
    var sortedUnits = Array.from(unique).sort();
    var select = $('#ta_filterUnit');
    var currentVal = select.val();
    
    select.empty().append('<option value="SEMUA">- Semua Unit Kerja -</option>');
    sortedUnits.forEach(function(u) { select.append(`<option value="${ta_escapeHtml(u)}">${ta_escapeHtml(u)}</option>`); });
    
    select.prop('disabled', false).removeClass('bg-light text-maroon font-weight-bold');
    if(currentVal && unique.has(currentVal)) { select.val(currentVal); }
}

// =================================================================
// 4. INJEKSI ZERO BLINK & DYNAMIC HEADER (BAB VII)
// =================================================================
function ta_terapkanFilterLokal() {
    var tAdminUnit = TA_IS_ADMIN ? String($('#ta_filterUnit').val() || "").toUpperCase() : "";
    var tUnitUser  = String(TA_UNIT_TERKUNCI || "").trim().toUpperCase();
    
    var hasil = TA_CACHE_DATA.filter(function(row) {
        var lastIdx = row.length - 1; 
        var rUnit = String(row[lastIdx] || "").trim().toUpperCase(); 
        
        if (TA_IS_ADMIN) {
            return (tAdminUnit === "SEMUA" || tAdminUnit === "" || rUnit === tAdminUnit);
        } else {
            return (rUnit === tUnitUser);
        }
    });
    
    ta_renderTabel(hasil);
}

function ta_renderTabel(rows) {
    var isFirstLoad = !$.fn.DataTable.isDataTable('#ta_tabelUtama');

    // --- A. BANGUN HEADER DINAMIS (Dijalankan hanya saat inisialisasi) ---
    if (isFirstLoad) {
        var headerTop = TA_HEADER_TOP; 
        var headerSub = TA_HEADER_SUB; 
        
        var htmlTop = `<th rowspan="2" class="sultan-sticky-col text-left px-3 align-middle">Nama ASN / NIP</th>`;
        var htmlSub = '';

        for (let i = 2; i < headerTop.length; i++) {
            let titleTop = ta_escapeHtml(headerTop[i]);
            let rawSub = String(headerSub[i] || "").trim();

            let labelSub = rawSub.toUpperCase() === "X" ? "KALI" : (rawSub.toUpperCase() === "JAM:MNT" ? "DURASI" : ta_escapeHtml(rawSub));
            let isKpiCol = (titleTop.toUpperCase() === "JUMLAH" || i >= headerTop.length - 2);
            let kpiClass = isKpiCol ? 'ta-kpi-col font-weight-bold' : '';

            if (titleTop !== "" && i < headerTop.length - 1) {
                htmlTop += `<th colspan="2" class="text-center align-middle ${kpiClass}">${titleTop}</th>`;
                htmlSub += `<th class="text-center align-middle py-2 ${kpiClass}">${labelSub}</th>`;
            } else if (titleTop === "" && i > 0) {
                htmlSub += `<th class="text-center align-middle py-2 ${kpiClass}">${labelSub}</th>`;
            } else {
                htmlTop += `<th rowspan="2" class="text-center align-middle ${kpiClass}">${titleTop}</th>`;
            }
        }
        $('#ta_rowHeaderTop').html(htmlTop);
        $('#ta_rowHeaderSub').html(htmlSub);
    }

    // --- B. BANGUN ARRAY DATA ---
    var dtArray = [];
    if (rows && rows.length > 0) {
        rows.forEach(function(row) {
            var arrRow = [];
            
            var safeNama = ta_escapeHtml(row[0]);
            var safeNip  = ta_escapeHtml(row[1]);
            var safeUnit = ta_escapeHtml(row[row.length - 1] || '-');
            
            var txtUnitHtml = TA_IS_ADMIN ? `<div class="data-tersier text-left mt-1">${safeUnit}</div>` : '';
            arrRow.push(`<div class="sultan-table-primary text-left">${safeNama}</div><div class="sultan-table-secondary text-left">${safeNip}</div>${txtUnitHtml}`);
            
            for (var colIdx = 2; colIdx < row.length - 1; colIdx++) {
                var val = row[colIdx];
                var strVal = String(val || "").trim();

                if (strVal === "" || strVal === "-" || strVal === "0") {
                    arrRow.push('<span class="text-muted opacity-50">-</span>');
                } else {
                    var isFrekuensiCol = (colIdx % 2 === 0);
                    var safeText = ta_escapeHtml(strVal);

                    if (isFrekuensiCol) {
                        arrRow.push(`<span class="ta-freq-badge">${safeText}x</span>`);
                    } else {
                        arrRow.push(`<span class="ta-durasi-val">${safeText}</span>`);
                    }
                }
            }
            dtArray.push(arrRow);
        });
    }

    // --- C. INISIALISASI & INJEKSI DATA (BAB VII) ---
    if (isFirstLoad) {
        var totalCols = (dtArray.length > 0) ? dtArray[0].length : (TA_HEADER_TOP.length - 1);
        var targetDynamicArray = Array.from({length: Math.max(0, totalCols - 1)}, function(_, i) { return i + 1; });

        TA_TABEL_INSTANCE = SultanTable.init('#ta_tabelUtama', {
            "responsive": false,
            "data": dtArray, 
            "destroy": true, 
            "ordering": false,
            "pageLength": 10,
            "autoWidth": false,
            "deferRender": true,
            "dom": "<'row mb-2'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>>" +
                   "<'row'<'col-sm-12'<'sultan-scroll-container sultan-scroll'tr>>>" +
                   "<'row mt-3'<'col-sm-12 col-md-5 small text-muted'i><'col-sm-12 col-md-7'p>>",
            "language": { 
                "url": "//cdn.datatables.net/plug-ins/1.10.25/i18n/Indonesian.json", 
                "search": "", "searchPlaceholder": "Cari Nama/NIP...",
                "emptyTable": '<div class="py-5 text-center text-muted"><div class="mb-3"><i class="fas fa-clipboard-list fa-3x text-gray-300" style="opacity: 0.6;"></i></div><h6 class="font-weight-bold text-dark mb-1">Belum Ada Presensi</h6><p class="small mb-0">Tidak ada data terlambat presensi untuk filter terpilih.</p></div>' 
            },
            "columnDefs": [
                { "targets": 0, "width": "auto", "className": "sultan-sticky-col text-left px-3 align-middle font-weight-bold" },
                { "targets": targetDynamicArray, "className": "text-center align-middle" }
            ],
            "createdRow": function(row, data, dataIndex) {
                 var tds = row.children;
                 var lastIdx = tds.length - 1; 
                 var secondLastIdx = tds.length - 2;

                 for (var visIdx = 0; visIdx < tds.length; visIdx++) {
                     var cell = tds[visIdx];
                     if (visIdx === 0) {
                         cell.className = 'sultan-sticky-col text-left px-3 py-1 align-middle font-weight-bold';
                         cell.style.setProperty('padding', '4px 10px', 'important');
                     } else {
                         cell.style.setProperty('padding', '4px 6px', 'important');
                         if (visIdx === lastIdx || visIdx === secondLastIdx) {
                             cell.classList.add('ta-kpi-col', 'text-danger', 'font-weight-bold');
                         }
                     }
                 }
            }
        });

        // BUKA RUANG B SEKALI SAJA (Instan, No fadeIn)
        SultanUI.hideLoading('#ta_loadingState');
        $('#ta_tableState').show();
        
        // VAKSIN MICRO BLINK (Beri waktu browser menyelesaikan lukisan sebelum mengatur ulang kolom)
        setTimeout(function(){ TA_TABEL_INSTANCE.columns.adjust(); }, 100);
        
    } else {
        // Zero Blink Injeksi Array Baru
        TA_TABEL_INSTANCE.clear().rows.add(dtArray).draw(false);
        
        if ($('#ta_tableState').is(':hidden')) {
            SultanUI.hideLoading('#ta_loadingState');
            $('#ta_tableState').show();
        }

        setTimeout(function(){ TA_TABEL_INSTANCE.columns.adjust(); }, 50);
    }
}

// =================================================================
// 5. HELPER UTILITIES: PEMBERSIH XSS (Hukum Ke-5)
// =================================================================
function ta_escapeHtml(text) { 
    if(!text) return ""; 
    return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); 
}
</script>
