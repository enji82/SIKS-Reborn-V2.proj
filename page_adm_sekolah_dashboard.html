<style>
  /* ================================================================
     DASBOR ADMINISTRASI SEKOLAH — STYLES
     ================================================================ */

  /* Enforce 13px font size for all elements in Rekapitulasi per Sekolah table wrapper */
  #admsekolahdash_tabelRekap_wrapper,
  #admsekolahdash_tabelRekap_wrapper .dataTables_length,
  #admsekolahdash_tabelRekap_wrapper .dataTables_length select,
  #admsekolahdash_tabelRekap_wrapper .dataTables_filter,
  #admsekolahdash_tabelRekap_wrapper .dataTables_filter input,
  #admsekolahdash_tabelRekap_wrapper .dataTables_info,
  #admsekolahdash_tabelRekap_wrapper .dataTables_paginate,
  #admsekolahdash_tabelRekap_wrapper .pagination,
  #admsekolahdash_tabelRekap_wrapper .page-item,
  #admsekolahdash_tabelRekap_wrapper .page-link,
  #admsekolahdash_tabelRekap_wrapper table,

    font-size: 13px !important;
  }

  #admsekolahdash_tabelRekap .text-muted,
  #admsekolahdash_tabelRekap .badge,
  #admsekolahdash_tabelRekap .badge-sultan {
    font-size: 13px !important;
  }

  /* Unit View Styles */
  .admsekolahdash-unit-banner {
    background: linear-gradient(135deg, #6b1a2a 0%, #9b2335 100%);
    border-radius: 12px;
    color: #fff;
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .admsekolahdash-unit-banner .unit-icon {
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;

    font-size: 18px; flex-shrink: 0;
  }
  .admsekolahdash-unit-banner .unit-name {
    font-size: 15px; font-weight: 700; margin: 0;

    font-size: 11px; opacity: 0.8; margin: 0;

  .admsekolahdash-kat-card {
    border: none;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    margin-bottom: 12px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .admsekolahdash-kat-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.11); }
  .admsekolahdash-kat-card .card-header {
    background: #f8f9fa;
    border-bottom: 1px solid #e9ecef;
    padding: 10px 16px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
  }
  .admsekolahdash-kat-card .card-header .kat-title {
    font-weight: 600; font-size: 13px; color: #2c2c2c;

  .admsekolahdash-kat-card .card-body {

  }
  .admsekolahdash-kat-table th {
    background: #fff; font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.4px;
    color: #888; padding: 8px 14px; border-bottom: 1px solid #f0f0f0;
  }
  .admsekolahdash-kat-table td {
    padding: 8px 14px; vertical-align: middle;
    border-bottom: 1px solid #f8f8f8;
    color: #444;
  }
  .admsekolahdash-kat-table tr:last-child td { border-bottom: none; }
  .admsekolahdash-kat-table tr:hover td { background: #fafafa; }

  .admsekolahdash-status-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
    white-space: nowrap;
  }
  .admsekolahdash-status-badge.disetujui { background: #d4edda; color: #155724; }
  .admsekolahdash-status-badge.diproses  { background: #cce5ff; color: #004085; }
  .admsekolahdash-status-badge.revisi    { background: #fff3cd; color: #856404; }
  .admsekolahdash-status-badge.ditolak   { background: #f8d7da; color: #721c24; }
  .admsekolahdash-status-badge.belum     { background: #e9ecef; color: #6c757d; }

  .admsekolahdash-link-lihat {
    font-size: 11px; color: #6b1a2a; font-weight: 600;
    text-decoration: none; border: 1px solid #6b1a2a;
    border-radius: 4px; padding: 2px 8px;
    transition: all 0.15s;
    display: inline-block;
  }
  .admsekolahdash-link-lihat:hover { background: #6b1a2a; color: #fff; text-decoration: none; }

  .admsekolahdash-unit-empty {
    text-align: center; padding: 40px 20px; color: #aaa;
  }
  .admsekolahdash-unit-empty i { font-size: 40px; margin-bottom: 12px; display: block; }
  .admsekolahdash-unit-empty p { font-size: 13px; margin: 0; }
</style>

  <div class="container-fluid">
    <div class="row justify-content-center">

             ================================================================ -->

            <!-- Segmented Switch Mode -->

                <button type="button" class="sultan-segmented-btn" data-admsekolah-mode="rekap" id="admsekolahdash_btnModeRekap2">

                <div id="admsekolahdash_metricRow1"></div>
                <!-- Row 2: Status Detil (5 Columns) - Rendered Dynamically -->
                <div id="admsekolahdash_metricRow2"></div>
                <!-- Sudah Unggah & Belum Unggah Lists - Rendered Dynamically -->
                <div id="admsekolahdash_listsContainer"></div>

             VIEW UNIT
             ================================================================ -->

                </div>

                        <p class="unit-name" id="admsekolahdash_unitNamaSekolah">-</p>

<script>
/* ================================================================
   DASBOR ADMINISTRASI SEKOLAH — JAVASCRIPT
   ================================================================ */

// --- STATE GLOBAL ---
var ADMSEKOLAHDASH_CACHE_REKAP = [];
var ADMSEKOLAHDASH_CACHE_BELUM = [];
var ADMSEKOLAHDASH_KATEGORI_MAP = [];
var ADMSEKOLAHDASH_TABEL_INSTANCE = null;
var ADMSEKOLAHDASH_PENDING_REQ = 0;
var ADMSEKOLAHDASH_JENIS_PERIODE = "TAHUNAN_TAPEL";
var ADMSEKOLAHDASH_TAHUN_DEFAULTED = false;

var ADMSEKOLAHDASH_USER_AKTIF = "";
var ADMSEKOLAHDASH_IS_ADMIN = false;
var ADMSEKOLAHDASH_UNIT_TERKUNCI = "";
var ADMSEKOLAHDASH_USER_NPSN = "";
var ADMSEKOLAHDASH_USE_NPSN_FILTER = false;

// Master data sekolah dari DB (untuk cascading filter)
var ADMSEKOLAHDASH_MASTER_SEKOLAH = []; // [{npsn, nama, jenjang}]
var ADMSEKOLAHDASH_MODE = "rekap"; // "rekap" | "unit"

// ================================================================
// INIT
// ================================================================
$(document).ready(function() {
    ADMSEKOLAHDASH_TABEL_INSTANCE = null;

    // Render metric rows (Rekap mode)
    $('#admsekolahdash_metricRow1').html(SultanUI.renderDashboardRow1('admsekolahdash', { total: 'TARGET SASARAN', sudah: 'SUDAH UNGGAH', belum: 'BELUM UNGGAH', progress: 'PROGRES' }));
    var row2Cards = [
        { key: 'TotalDokumen', label: 'JML DOKUMEN', theme: 'metric-navy', icon: 'fas fa-file-alt' },
        { key: 'Diproses', label: 'DIPROSES', theme: 'metric-info', icon: 'fas fa-spinner fa-spin' },
        { key: 'Disetujui', label: 'DISETUJUI', theme: 'metric-success', icon: 'fas fa-check-double' },
        { key: 'Revisi', label: 'REVISI', theme: 'metric-gold', icon: 'fas fa-edit' },
        { key: 'Ditolak', label: 'DITOLAK', theme: 'metric-maroon', icon: 'fas fa-ban' }
    ];
    $('#admsekolahdash_metricRow2').html(SultanUI.renderDashboardRow2('admsekolahdash', row2Cards));
    $('#admsekolahdash_listsContainer').html(SultanUI.renderDashboardLists('admsekolahdash', { placeholderCari: 'Cari NPSN atau nama sekolah...', hasCopyBelum: true }));
    $('#admsekolahdash_jenisPeriodeBadge').hide();

    if (typeof SultanUI !== 'undefined') {
        SultanUI.startLottery('#admsekolahdash_cardTotalSekolah, #admsekolahdash_cardSudah, #admsekolahdash_cardBelum, #admsekolahdash_cardTotalDokumen, #admsekolahdash_cardDiproses, #admsekolahdash_cardDisetujui, #admsekolahdash_cardRevisi, #admsekolahdash_cardDitolak', 3);
        SultanUI.startLottery('#admsekolahdash_cardProgress', 2, '%');
    }

    // Baca sesi user
    try {
        var user = typeof getSesiUser === 'function' ? getSesiUser() : {};
        ADMSEKOLAHDASH_USER_AKTIF = user.nama_lengkap || user.fullname || user.nama || user.username || "User Web";
        var rStr = String(user.role || "").toLowerCase();
        ADMSEKOLAHDASH_IS_ADMIN = (typeof checkUserRoleIsAdmin === 'function' && checkUserRoleIsAdmin()) || rStr.includes("admin") || rStr.includes("verifikator");
        ADMSEKOLAHDASH_USER_NPSN = String(user.npsn || user.unit || user.username || "").trim();
    } catch(e) { ADMSEKOLAHDASH_USER_NPSN = ""; ADMSEKOLAHDASH_IS_ADMIN = false; }

    // Event listeners — Mode Switcher (semua tombol)
    $(document).on('click', '[data-admsekolah-mode]', function() {
        var mode = $(this).data('admsekolah-mode');
        admsekolahdash_switchMode(mode);
    });

    // Event listeners — Rekap mode
    $(document).off('click', '#admsekolahdash_btnRefresh').on('click', '#admsekolahdash_btnRefresh', function() {
        var k = $('#admsekolahdash_filterKategori').val();
        if (k !== "" && k != null) admsekolahdash_loadDataKategori(k, true);
    });
    $(document).off('change', '#admsekolahdash_filterKategori').on('change', '#admsekolahdash_filterKategori', function() {
        ADMSEKOLAHDASH_TAHUN_DEFAULTED = false;
        var k = $(this).val(); if(k) admsekolahdash_loadDataKategori(k);
    });
    $(document).off('change', '#admsekolahdash_filterTahun, #admsekolahdash_filterPeriode').on('change', '#admsekolahdash_filterTahun, #admsekolahdash_filterPeriode', admsekolahdash_terapkanFilterLokal);
    $(document).off('change', '#admsekolahdash_filterSekolah').on('change', '#admsekolahdash_filterSekolah', admsekolahdash_terapkanFilterLokal);
    $(document).off('change', '#admsekolahdash_filterJenjangRekap').on('change', '#admsekolahdash_filterJenjangRekap', function() {
        admsekolahdash_updateSekolahDropdown('rekap');
        admsekolahdash_terapkanFilterLokal();
    });

    // Event listeners — Unit mode
    $(document).off('click', '#admsekolahdash_btnRefreshUnit').on('click', '#admsekolahdash_btnRefreshUnit', function() {
        var npsn = $('#admsekolahdash_filterUnitSekolah').val();
        if (npsn) admsekolahdash_loadUnitData(npsn, true);
    });
    $(document).off('change', '#admsekolahdash_filterJenjangUnit').on('change', '#admsekolahdash_filterJenjangUnit', function() {
        admsekolahdash_updateSekolahDropdown('unit');
    });
    $(document).off('change', '#admsekolahdash_filterUnitSekolah').on('change', '#admsekolahdash_filterUnitSekolah', function() {
        var npsn = $(this).val();
        if (npsn) admsekolahdash_loadUnitData(npsn);
        else {
            $('#admsekolahdash_unitContent').hide();
            $('#admsekolahdash_unitLoadingState').show().find('.sultan-loading-text').text('Pilih sekolah untuk melihat kelengkapan dokumen...');
        }
    });

    // Cari list
    $(document).off('keyup', '#admsekolahdash_inputCariSudah').on('keyup', '#admsekolahdash_inputCariSudah', function() {
        var val = $(this).val().toLowerCase();
        $('.admsekolahdash-item-sudah').filter(function() { $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1); });
    });
    $(document).off('keyup', '#admsekolahdash_inputCariBelum').on('keyup', '#admsekolahdash_inputCariBelum', function() {
        var val = $(this).val().toLowerCase();
        $('.admsekolahdash-item-belum').filter(function() { $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1); });
    });
    $(document).off('click', '#admsekolahdash_btnSalinWa').on('click', '#admsekolahdash_btnSalinWa', admsekolahdash_salinKeWA);

    admsekolahdash_initMasterAccess();
});

// ================================================================
// MODE SWITCHER
// ================================================================
function admsekolahdash_switchMode(mode) {
    ADMSEKOLAHDASH_MODE = mode;

    if (mode === 'unit') {
        $('#admsekolahdash_filterBarRekap').hide();
        $('#admsekolahdash_filterBarUnit').show();
        $('#admsekolahdash_viewRekap').hide();
        $('#admsekolahdash_viewUnit').show();
        // Jika user non-admin: auto-load sekolah sendiri
        if (!ADMSEKOLAHDASH_IS_ADMIN && ADMSEKOLAHDASH_USER_NPSN) {
            admsekolahdash_loadUnitData(ADMSEKOLAHDASH_USER_NPSN);
        }
    } else {
        $('#admsekolahdash_filterBarUnit').hide();
        $('#admsekolahdash_filterBarRekap').show();
        $('#admsekolahdash_viewUnit').hide();
        $('#admsekolahdash_viewRekap').show();
    }
}

// ================================================================
// INIT MASTER ACCESS (load master sekolah dari DB, setup filter)
// ================================================================
function admsekolahdash_initMasterAccess() {
    if (!ADMSEKOLAHDASH_IS_ADMIN && !ADMSEKOLAHDASH_USER_NPSN) {
        $('#admsekolahdash_loadingState').find('.sultan-loading-text').html('<span class="text-danger"><i class="fas fa-ban mb-2"></i><br>Akses ditolak: Sesi login tidak valid.</span>');
        return;
    }

    var targetNpsn = ""; // Ambil semua sekolah

    google.script.run.withSuccessHandler(function(json) {
        var res = JSON.parse(json);
        if (!res.success) {
            $('#admsekolahdash_loadingState').find('.sultan-loading-text').html('<span class="text-danger"><i class="fas fa-exclamation-triangle mb-2"></i><br>' + admsekolahdash_escapeHtml(res.message) + '</span>');
            return;
        }

        // Simpan master sekolah
        ADMSEKOLAHDASH_MASTER_SEKOLAH = res.sekolah || [];

        // Ambil daftar kategori
        ADMSEKOLAHDASH_KATEGORI_MAP = (res.kategori || []).map(function(k) {
            return { idKat: k.idKat, namaKategori: k.namaKat };
        }).filter(function(k) { return k.idKat; });

        // Setup filter Jenjang & Sekolah (Rekap)
        admsekolahdash_setupJenjangDropdowns();

        // Setup filter Sekolah (Unit)
        admsekolahdash_setupUnitSekolahDropdown();

        // Untuk non-admin di Mode Rekap: sembunyikan filter Jenjang, set sekolah otomatis
        if (!ADMSEKOLAHDASH_IS_ADMIN) {
            $('#admsekolahdash_filterJenjangRekapContainer').hide();
            $('#admsekolahdash_filterJenjangUnitContainer').hide();
        } else {
            $('#admsekolahdash_filterJenjangRekapContainer').show();
            $('#admsekolahdash_filterJenjangUnitContainer').show();
        }

        if (ADMSEKOLAHDASH_KATEGORI_MAP.length === 0) {
            $('#admsekolahdash_loadingState').find('.sultan-loading-text').html('<span class="text-danger"><i class="fas fa-exclamation-triangle mb-2"></i><br>Belum ada Kategori yang berintegrasi ke Dashboard.</span>');
            return;
        }

        var selectKat = $('#admsekolahdash_filterKategori');
        selectKat.empty();
        ADMSEKOLAHDASH_KATEGORI_MAP.forEach(function(k) {
            selectKat.append($('<option>', { value: k.idKat, text: k.namaKategori }));
        });

        admsekolahdash_loadDataKategori($('#admsekolahdash_filterKategori').val());

    }).withFailureHandler(function(err) {
        $('#admsekolahdash_loadingState').find('.sultan-loading-text').html('<span class="text-danger"><i class="fas fa-wifi mb-2"></i><br>Koneksi Terputus: ' + admsekolahdash_escapeHtml(err.message) + '</span>');
    }).getAdmSekolahMasterData(targetNpsn);
}

// ================================================================
// SETUP JENJANG & SEKOLAH DROPDOWNS (CASCADING)
// ================================================================
function admsekolahdash_setupJenjangDropdowns() {
    // Kumpulkan jenjang unik dari master sekolah
    var jenjangSet = new Set();
    ADMSEKOLAHDASH_MASTER_SEKOLAH.forEach(function(s) {
        var j = String(s.jenjang || "").trim().toUpperCase();
        if (j) jenjangSet.add(j);
    });

    var jenjangList = Array.from(jenjangSet).sort();

    // Populate Jenjang Rekap
    var selJenjangRekap = $('#admsekolahdash_filterJenjangRekap');
    selJenjangRekap.empty().append('<option value="SEMUA">Semua Jenjang</option>');
    jenjangList.forEach(function(j) {
        selJenjangRekap.append($('<option>', { value: j, text: j }));
    });

    // Populate Jenjang Unit
    var selJenjangUnit = $('#admsekolahdash_filterJenjangUnit');
    selJenjangUnit.empty().append('<option value="SEMUA">Semua Jenjang</option>');
    jenjangList.forEach(function(j) {
        selJenjangUnit.append($('<option>', { value: j, text: j }));
    });

    // Setup sekolah dropdown Rekap (semua dulu)
    admsekolahdash_updateSekolahDropdown('rekap');
}

function admsekolahdash_setupUnitSekolahDropdown() {
    admsekolahdash_updateSekolahDropdown('unit');
}

function admsekolahdash_updateSekolahDropdown(mode) {
    if (mode === 'rekap') {
        var filterJenjang = String($('#admsekolahdash_filterJenjangRekap').val() || "SEMUA").toUpperCase();
        var sel = $('#admsekolahdash_filterSekolah');
        var curVal = sel.val();

        var filtered = ADMSEKOLAHDASH_MASTER_SEKOLAH.filter(function(s) {
            if (filterJenjang === "SEMUA") return true;
            return String(s.jenjang || "").trim().toUpperCase() === filterJenjang;
        });

        // Untuk non-admin: hanya tampilkan sekolah sendiri
        if (!ADMSEKOLAHDASH_IS_ADMIN && ADMSEKOLAHDASH_USER_NPSN) {
            filtered = filtered.filter(function(s) {
                return String(s.npsn || "").trim() === ADMSEKOLAHDASH_USER_NPSN ||
                       String(s.npsn || "").trim().toUpperCase() === ADMSEKOLAHDASH_USER_NPSN.toUpperCase();
            });
        }

        sel.empty();
        if (ADMSEKOLAHDASH_IS_ADMIN) {
            sel.append('<option value="SEMUA">Semua Sekolah</option>');
        }
        filtered.sort(function(a,b) { return String(a.nama).localeCompare(String(b.nama)); });
        filtered.forEach(function(s) {
            sel.append($('<option>', { value: s.npsn, text: s.nama }));
        });

        // Non-admin: auto pilih sekolah sendiri & kunci
        if (!ADMSEKOLAHDASH_IS_ADMIN && ADMSEKOLAHDASH_USER_NPSN) {
            sel.val(ADMSEKOLAHDASH_USER_NPSN);
            if (!sel.val()) sel.val(sel.find('option:first').val());
            sel.prop('disabled', true).addClass('bg-light text-maroon font-weight-bold');
            $('#admsekolahdash_filterRekapSekolahContainer').show();
        } else {
            sel.prop('disabled', false).removeClass('bg-light text-maroon font-weight-bold');
            if (curVal && sel.find('option[value="' + curVal + '"]').length) {
                sel.val(curVal);
            }
            if (ADMSEKOLAHDASH_IS_ADMIN) $('#admsekolahdash_filterRekapSekolahContainer').show();
        }

    } else if (mode === 'unit') {
        var filterJenjangUnit = String($('#admsekolahdash_filterJenjangUnit').val() || "SEMUA").toUpperCase();
        var selUnit = $('#admsekolahdash_filterUnitSekolah');
        var curValUnit = selUnit.val();

        var filteredUnit = ADMSEKOLAHDASH_MASTER_SEKOLAH.filter(function(s) {
            if (filterJenjangUnit === "SEMUA") return true;
            return String(s.jenjang || "").trim().toUpperCase() === filterJenjangUnit;
        });

        // Non-admin: hanya sekolah sendiri
        if (!ADMSEKOLAHDASH_IS_ADMIN && ADMSEKOLAHDASH_USER_NPSN) {
            filteredUnit = filteredUnit.filter(function(s) {
                return String(s.npsn || "").trim() === ADMSEKOLAHDASH_USER_NPSN ||
                       String(s.npsn || "").trim().toUpperCase() === ADMSEKOLAHDASH_USER_NPSN.toUpperCase();
            });
        }

        selUnit.empty();
        if (ADMSEKOLAHDASH_IS_ADMIN) {
            selUnit.append('<option value="">Pilih Sekolah...</option>');
        }
        filteredUnit.sort(function(a,b) { return String(a.nama).localeCompare(String(b.nama)); });
        filteredUnit.forEach(function(s) {
            selUnit.append($('<option>', { value: s.npsn, text: s.nama }));
        });

        if (!ADMSEKOLAHDASH_IS_ADMIN && ADMSEKOLAHDASH_USER_NPSN) {
            selUnit.val(ADMSEKOLAHDASH_USER_NPSN);
            if (!selUnit.val()) selUnit.val(selUnit.find('option:first').val());
            selUnit.prop('disabled', true).addClass('bg-light text-maroon font-weight-bold');
        } else {
            selUnit.prop('disabled', false).removeClass('bg-light text-maroon font-weight-bold');
            if (curValUnit && selUnit.find('option[value="' + curValUnit + '"]').length) {
                selUnit.val(curValUnit);
            }
        }
    }
}

function admsekolahdash_loadDataKategori(idKategori, forceRefresh) {
    if (ADMSEKOLAHDASH_PENDING_REQ > 0) return;
    ADMSEKOLAHDASH_PENDING_REQ = 1;
    forceRefresh = !!forceRefresh;

    var mapData = ADMSEKOLAHDASH_KATEGORI_MAP.find(function(k) { return k.idKat === idKategori; });
    if (!mapData) { ADMSEKOLAHDASH_PENDING_REQ = 0; return; }

    var btn = $('#admsekolahdash_btnRefresh');
    btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin text-maroon"></i>');
    $('#admsekolahdash_filterKategori, #admsekolahdash_filterTahun, #admsekolahdash_filterPeriode, #admsekolahdash_filterSekolah').prop('disabled', true);

    if (typeof SultanUI !== 'undefined') {
        SultanUI.showSkeleton('#admsekolahdash_dashboardState');
    }
    $('#admsekolahdash_dashboardState').show();

    google.script.run.withSuccessHandler(function(jsonStr) {
        ADMSEKOLAHDASH_PENDING_REQ = 0;
        btn.prop('disabled', false).html('<i class="fas fa-sync-alt text-maroon"></i>');
        $('#admsekolahdash_filterKategori, #admsekolahdash_filterTahun, #admsekolahdash_filterPeriode').prop('disabled', false);
        if (ADMSEKOLAHDASH_IS_ADMIN) $('#admsekolahdash_filterSekolah').prop('disabled', false);
        $('.card-loading-overlay').remove();

        var data = JSON.parse(jsonStr);
        if (!data.success) {
            $('#admsekolahdash_loadingState').html('<div class="text-center p-4"><span class="text-danger"><i class="fas fa-exclamation-triangle mb-2"></i><br>' + admsekolahdash_escapeHtml(data.message) + '</span></div>');
            return;
        }

        ADMSEKOLAHDASH_JENIS_PERIODE = data.jenisPeriode || "TAHUNAN";
        ADMSEKOLAHDASH_CACHE_REKAP = data.rekap || [];
        ADMSEKOLAHDASH_CACHE_BELUM = data.belum || [];

        // Re-render struktur dashboard
        $('#admsekolahdash_dashboardState').html(`
            <div id="admsekolahdash_metricRow1"></div>
            <div id="admsekolahdash_metricRow2"></div>
            <div id="admsekolahdash_listsContainer"></div>
        `);
        $('#admsekolahdash_metricRow1').html(SultanUI.renderDashboardRow1('admsekolahdash', { total: 'TARGET SASARAN', sudah: 'SUDAH UNGGAH', belum: 'BELUM UNGGAH', progress: 'PROGRES' }));
        var row2Cards = [
            { key: 'TotalDokumen', label: 'JML DOKUMEN', theme: 'metric-navy', icon: 'fas fa-file-alt' },
            { key: 'Diproses', label: 'DIPROSES', theme: 'metric-info', icon: 'fas fa-spinner fa-spin' },
            { key: 'Disetujui', label: 'DISETUJUI', theme: 'metric-success', icon: 'fas fa-check-double' },
            { key: 'Revisi', label: 'REVISI', theme: 'metric-gold', icon: 'fas fa-edit' },
            { key: 'Ditolak', label: 'DITOLAK', theme: 'metric-maroon', icon: 'fas fa-ban' }
        ];
        $('#admsekolahdash_metricRow2').html(SultanUI.renderDashboardRow2('admsekolahdash', row2Cards));
        $('#admsekolahdash_listsContainer').html(SultanUI.renderDashboardLists('admsekolahdash', { placeholderCari: 'Cari NPSN atau nama sekolah...', hasCopyBelum: true }));

        if (typeof SultanUI !== 'undefined') {
            SultanUI.startLottery('#admsekolahdash_cardTotalSekolah, #admsekolahdash_cardSudah, #admsekolahdash_cardBelum, #admsekolahdash_cardTotalDokumen, #admsekolahdash_cardDiproses, #admsekolahdash_cardDisetujui, #admsekolahdash_cardRevisi, #admsekolahdash_cardDitolak', 3);
            SultanUI.startLottery('#admsekolahdash_cardProgress', 2, '%');
        }

        admsekolahdash_initDropdownTahun();
        admsekolahdash_terapkanFilterLokal();
        SultanUI.hideLoading('#admsekolahdash_loadingState');

    }).withFailureHandler(function(err) {
        ADMSEKOLAHDASH_PENDING_REQ = 0;
        btn.prop('disabled', false).html('<i class="fas fa-sync-alt text-maroon"></i>');
        $('#admsekolahdash_filterKategori').prop('disabled', false);
        $('.card-loading-overlay').remove();
        $('#admsekolahdash_loadingState').html('<div class="text-center p-4"><span class="text-danger"><i class="fas fa-wifi mb-2"></i><br>Koneksi Terputus: ' + admsekolahdash_escapeHtml(err.message) + '</span></div>');
    }).getAdmSekolahDashboardData(idKategori, forceRefresh);
}

function admsekolahdash_initDropdownTahun() {
    var uniqueTahun = new Set();
    var uniquePeriode = new Set();
    var isPermanen = (ADMSEKOLAHDASH_JENIS_PERIODE === "PERMANEN" || ADMSEKOLAHDASH_JENIS_PERIODE === "TMT");

    ADMSEKOLAHDASH_CACHE_REKAP.forEach(function(r) {
        var thn = String(r.tahun || "").trim();
        if (thn && thn !== "-" && thn !== "PERMANEN") uniqueTahun.add(thn);
        var per = String(r.periode || "").trim(); if (per && per !== "-") uniquePeriode.add(per);
    });
    ADMSEKOLAHDASH_CACHE_BELUM.forEach(function(r) {
        var thn = String(r.tahun || "").trim();
        if (thn && thn !== "-" && thn !== "PERMANEN") uniqueTahun.add(thn);
        var per = String(r.periode || "").trim(); if (per && per !== "-") uniquePeriode.add(per);
    });

    if (isPermanen) {
        $('#admsekolahdash_filterTahunContainer').hide();
        $('#admsekolahdash_filterTahun').val("SEMUA");
    } else {
        $('#admsekolahdash_filterTahunContainer').show();
    }

    admsekolahdash_updateJenisPeriodeBadge();

    var selTahun = $('#admsekolahdash_filterTahun');
    var curTahun = selTahun.val();
    selTahun.empty().append('<option value="SEMUA">Semua Tahun</option>');

    var selPeriode = $('#admsekolahdash_filterPeriode');
    var curPeriode = selPeriode.val();
    selPeriode.empty().append('<option value="SEMUA">Semua Periode</option>');

    var sortedTahun = Array.from(uniqueTahun);
    sortedTahun.sort(function(a, b) {
        var splitA = a.split("/"), splitB = b.split("/");
        var na = parseInt(splitA[0], 10), nb = parseInt(splitB[0], 10);
        if (!isNaN(na) && !isNaN(nb)) return nb - na;
        return String(b).localeCompare(String(a));
    });
    sortedTahun.forEach(function(t) { selTahun.append($('<option>', { value: t, text: t })); });

    if (isPermanen) {
        selTahun.val("SEMUA");
        ADMSEKOLAHDASH_TAHUN_DEFAULTED = true;
    } else if (!ADMSEKOLAHDASH_TAHUN_DEFAULTED && sortedTahun.length > 0) {
        selTahun.val(sortedTahun[0]);
        ADMSEKOLAHDASH_TAHUN_DEFAULTED = true;
    } else if (curTahun && (curTahun === "SEMUA" || uniqueTahun.has(curTahun))) {
        selTahun.val(curTahun);
    }

    var sortedPeriode = Array.from(uniquePeriode);
    var mapBulan = {"Jan":1,"Feb":2,"Mar":3,"Apr":4,"Mei":5,"Jun":6,"Jul":7,"Agu":8,"Sep":9,"Okt":10,"Nov":11,"Des":12};
    if (ADMSEKOLAHDASH_JENIS_PERIODE === "BULANAN" || ADMSEKOLAHDASH_JENIS_PERIODE === "PERIODE") {
        sortedPeriode.sort(function(a, b) {
            var bA = mapBulan[a] || 0, bB = mapBulan[b] || 0;
            if (bA && bB) return bB - bA;
            return String(b).localeCompare(String(a));
        });
    } else {
        sortedPeriode.sort(function(a, b) { return String(b).localeCompare(String(a)); });
    }
    sortedPeriode.forEach(function(p) { selPeriode.append($('<option>', { value: p, text: p })); });

    if (ADMSEKOLAHDASH_JENIS_PERIODE === "SEMESTER_TAPEL" || ADMSEKOLAHDASH_JENIS_PERIODE === "SEMESTER_KALENDER" || ADMSEKOLAHDASH_JENIS_PERIODE === "TRIWULAN") {
        if (curPeriode && curPeriode !== "SEMUA" && uniquePeriode.has(curPeriode)) {
            selPeriode.val(curPeriode);
        } else if (sortedPeriode.length > 0) {
            selPeriode.val(sortedPeriode[0]);
        }
    } else {
        if (curPeriode && uniquePeriode.has(curPeriode)) selPeriode.val(curPeriode);
        else selPeriode.val("SEMUA");
    }

    var jPeriode = ADMSEKOLAHDASH_JENIS_PERIODE;
    if (jPeriode === "TAHUNAN_TAPEL" || jPeriode === "TAHUNAN_KALENDER" || jPeriode === "PERMANEN" || jPeriode === "TMT") {
        $('#admsekolahdash_filterPeriodeContainer').hide();
    } else {
        $('#admsekolahdash_filterPeriodeContainer').show();
    }
}

function admsekolahdash_updateJenisPeriodeBadge() {

function admsekolahdash_terapkanFilterLokal() {
    var fUnit = "";
    if (ADMSEKOLAHDASH_IS_ADMIN) {
        fUnit = String($('#admsekolahdash_filterSekolah').val() || "").trim().toUpperCase();
    } else if (ADMSEKOLAHDASH_USER_NPSN) {
        fUnit = ADMSEKOLAHDASH_USER_NPSN.toUpperCase();
    }

    var isPermanen = (ADMSEKOLAHDASH_JENIS_PERIODE === "PERMANEN" || ADMSEKOLAHDASH_JENIS_PERIODE === "TMT");
    var fTahun = isPermanen ? "SEMUA" : String($('#admsekolahdash_filterTahun').val() || "").trim().toUpperCase();
    var fPeriode = String($('#admsekolahdash_filterPeriode').val() || "").trim().toUpperCase();

    var filterRekap = ADMSEKOLAHDASH_CACHE_REKAP.filter(function(r) {
        if (!admsekolahdash_rowMatchesUnit(r, fUnit)) return false;
        var rTahun = String(r.tahun || "").trim().toUpperCase();
        if (!isPermanen && fTahun !== "SEMUA" && fTahun !== "" && rTahun !== fTahun) return false;
        if (fPeriode !== "SEMUA" && fPeriode !== "" && String(r.periode || "").trim().toUpperCase() !== fPeriode) return false;
        return true;
    });

    var filterBelum = ADMSEKOLAHDASH_CACHE_BELUM.filter(function(r) {
        if (!admsekolahdash_rowMatchesUnit(r, fUnit)) return false;
        var rTahun = String(r.tahun || "").trim().toUpperCase();
        if (!isPermanen && fTahun !== "SEMUA" && fTahun !== "" && rTahun !== fTahun) return false;
        if (fPeriode !== "SEMUA" && fPeriode !== "" && String(r.periode || "").trim().toUpperCase() !== fPeriode) return false;
        return true;
    });

    admsekolahdash_renderDashboard(filterRekap, filterBelum, fTahun, fPeriode);
}

function admsekolahdash_rowMatchesUnit(r, fUnit) {
    // Filter Jenjang (Rekap)
    var filterJenjang = String($('#admsekolahdash_filterJenjangRekap').val() || "SEMUA").toUpperCase();
    if (filterJenjang !== "SEMUA") {
        var jenjang = String(r.jenjang || "").toUpperCase();
        if (filterJenjang === "PAUD") {
            if (jenjang !== "TK" && jenjang !== "KB" && jenjang !== "SPS" && jenjang !== "TPA" && !jenjang.includes("PAUD")) return false;
        } else if (jenjang !== filterJenjang) {
            return false;
        }
    }

    if (!fUnit || fUnit === "SEMUA" || fUnit === "") return true;

    // Cocokkan berdasarkan NPSN
    if (String(r.npsn || "").trim().toUpperCase() === fUnit) return true;
    // Fallback: cocokkan berdasarkan nama unit
    if (String(r.unit || "").trim().toUpperCase() === fUnit) return true;

    return false;
}

function admsekolahdash_getRekapForMetrics(dataRekap, fTahun, fPeriode) {
    if (ADMSEKOLAHDASH_JENIS_PERIODE === "PERMANEN" || ADMSEKOLAHDASH_JENIS_PERIODE === "TMT") return dataRekap;
    if (fTahun !== "SEMUA" && fTahun !== "" && fPeriode !== "SEMUA" && fPeriode !== "") return dataRekap;

    var sorted = dataRekap.slice();
    var mapBulan = {"Jan":1,"Feb":2,"Mar":3,"Apr":4,"Mei":5,"Jun":6,"Jul":7,"Agu":8,"Sep":9,"Okt":10,"Nov":11,"Des":12};
    sorted.sort(function(a, b) {
        var ta = String(a.tahun || "").trim(), tb = String(b.tahun || "").trim();
        var pa = String(a.periode || "").trim(), pb = String(b.periode || "").trim();
        if (ta !== tb) {
            var splitA = ta.split("/"), splitB = tb.split("/");
            var na = parseInt(splitA[0], 10), nb = parseInt(splitB[0], 10);
            if (!isNaN(na) && !isNaN(nb)) return nb - na;
            return tb.localeCompare(ta);
        }
        if (ADMSEKOLAHDASH_JENIS_PERIODE === "BULANAN" || ADMSEKOLAHDASH_JENIS_PERIODE === "PERIODE") {
            var bA = mapBulan[pa] || 0, bB = mapBulan[pb] || 0;
            if (bA && bB) return bB - bA;
        }
        return pb.localeCompare(pa);
    });

    if (sorted.length === 0) return dataRekap;
    var maxTahun = sorted[0].tahun, maxPeriode = sorted[0].periode;
    return dataRekap.filter(function(r) {
        return String(r.tahun || "").trim() === maxTahun && String(r.periode || "").trim() === maxPeriode;
    });
}

function admsekolahdash_renderDashboard(dataRekap, dataBelum, fTahun, fPeriode) {
    fTahun = String(fTahun || $('#admsekolahdash_filterTahun').val() || "").trim().toUpperCase();
    fPeriode = String(fPeriode || $('#admsekolahdash_filterPeriode').val() || "").trim().toUpperCase();
    var rekapMetrics = admsekolahdash_getRekapForMetrics(dataRekap, fTahun, fPeriode);

    var totAsn = 0, totSudah = 0, totBelum = 0;
    var totDiproses = 0, totDisetujui = 0, totRevisi = 0, totDitolak = 0;
    var dataSudah = [], dataBelumList = [];

    rekapMetrics.forEach(function(r) {
        totAsn += parseInt(r.jml) || 0;
        totSudah += parseInt(r.sudah) || 0;
        totBelum += parseInt(r.belum) || 0;
        var st = String(r.status || "").toLowerCase();
        if (st.includes("disetujui") || st.includes("setuju") || st.includes("ok") || st.includes("valid")) totDisetujui++;
        else if (st.includes("proses") || st.includes("pending") || st.includes("menunggu")) totDiproses++;
        else if (st.includes("revisi")) totRevisi++;
        else if (st.includes("tolak") || st.includes("ditolak")) totDitolak++;
        if (parseInt(r.sudah) > 0) dataSudah.push(r);
        else if (parseInt(r.belum) > 0) dataBelumList.push(r);
    });

    admsekolahdash_animateValue('admsekolahdash_cardTotalSekolah', totAsn);
    admsekolahdash_animateValue('admsekolahdash_cardSudah', totSudah);
    admsekolahdash_animateValue('admsekolahdash_cardBelum', totBelum);
    var percentage = totAsn > 0 ? Math.round((totSudah / totAsn) * 100) : 0;
    admsekolahdash_animateValue('admsekolahdash_cardProgress', percentage, true);
    admsekolahdash_animateValue('admsekolahdash_cardTotalDokumen', totSudah);
    admsekolahdash_animateValue('admsekolahdash_cardDiproses', totDiproses);
    admsekolahdash_animateValue('admsekolahdash_cardDisetujui', totDisetujui);
    admsekolahdash_animateValue('admsekolahdash_cardRevisi', totRevisi);
    admsekolahdash_animateValue('admsekolahdash_cardDitolak', totDitolak);

    var pBar = $('#admsekolahdash_progressBar');
    pBar.css('width', percentage + '%').attr('aria-valuenow', percentage);
    $('#admsekolahdash_progressText').text(percentage + '% Selesai');
    if (percentage < 30) pBar.css('background-color', '#d11a2a');
    else if (percentage < 70) pBar.css('background-color', '#ffc107');
    else pBar.css('background-color', '#28a745');

    $('#admsekolahdash_badgeSudah').text(totSudah);
    $('#admsekolahdash_badgeBelum').text(totBelum);

    var isPermanenView = (ADMSEKOLAHDASH_JENIS_PERIODE === "PERMANEN" || ADMSEKOLAHDASH_JENIS_PERIODE === "TMT");
    var uiSudah = "";
    if (dataSudah.length === 0) {
        uiSudah = SultanUI.renderListEmptyWarning('Belum Ada Data', 'Belum ada sekolah yang mengunggah dokumen.');
    } else {
        dataSudah.forEach(function(b, idx) {
            var uploadLabel = isPermanenView
                ? (b.thnUpload ? 'Upload: ' + admsekolahdash_escapeHtml(b.thnUpload) : '')
                : admsekolahdash_escapeHtml(b.tahun) + (b.periode && b.periode !== "-" ? " " + admsekolahdash_escapeHtml(b.periode) : "");
            var extraAttrs = 'class="list-group-item admsekolahdash-item-sudah py-2 px-3 hover-sultan" data-unit="' + admsekolahdash_escapeHtml(b.unit) + '"';
            uiSudah += SultanUI.renderListItem(idx + 1, b.unit, 'NPSN: ' + b.npsn, uploadLabel, 'success', extraAttrs);
        });
    }
    $('#admsekolahdash_listSudah').html(uiSudah); $('#admsekolahdash_inputCariSudah').val("");

    var uiBelum = "";
    if (dataBelumList.length === 0) {
        uiBelum = SultanUI.renderListEmptySuccess('Luar Biasa!', 'Tidak ada sekolah yang belum unggah.');
    } else {
        dataBelumList.forEach(function(b, idx) {
            var label = admsekolahdash_escapeHtml(b.tahun) + (b.periode && b.periode !== "-" ? " " + admsekolahdash_escapeHtml(b.periode) : "");
            var extraAttrs = 'class="list-group-item admsekolahdash-item-belum py-2 px-3 hover-sultan" data-unit="' + admsekolahdash_escapeHtml(b.unit) + '"';
            uiBelum += SultanUI.renderListItem(idx + 1, b.unit, 'NPSN: ' + b.npsn, label, 'danger', extraAttrs);
        });
    }
    $('#admsekolahdash_listBelum').html(uiBelum); $('#admsekolahdash_inputCariBelum').val("");
}

// ================================================================
// UNIT MODE — Load & Render
// ================================================================
function admsekolahdash_loadUnitData(npsn, forceRefresh) {
    if (!npsn) return;

    $('#admsekolahdash_unitContent').hide();
    $('#admsekolahdash_unitLoadingState').show().find('.sultan-loading-text').html('Memuat data kelengkapan dokumen...');
    $('#admsekolahdash_btnRefreshUnit').prop('disabled', true).html('<i class="fas fa-spinner fa-spin text-maroon"></i>');

    var npsnSafe = String(npsn).trim();

    google.script.run.withSuccessHandler(function(jsonStr) {
        $('#admsekolahdash_btnRefreshUnit').prop('disabled', false).html('<i class="fas fa-sync-alt text-maroon"></i>');
        var data;
        try { data = JSON.parse(jsonStr); } catch(e) {
            $('#admsekolahdash_unitLoadingState').find('.sultan-loading-text').html('<span class="text-danger"><i class="fas fa-exclamation-triangle mb-2"></i><br>Gagal memproses data.</span>');
            return;
        }
        if (!data.success) {
            $('#admsekolahdash_unitLoadingState').find('.sultan-loading-text').html('<span class="text-danger"><i class="fas fa-exclamation-triangle mb-2"></i><br>' + admsekolahdash_escapeHtml(data.message) + '</span>');
            return;
        }
        admsekolahdash_renderUnitView(data);
    }).withFailureHandler(function(err) {
        $('#admsekolahdash_btnRefreshUnit').prop('disabled', false).html('<i class="fas fa-sync-alt text-maroon"></i>');
        $('#admsekolahdash_unitLoadingState').find('.sultan-loading-text').html('<span class="text-danger"><i class="fas fa-wifi mb-2"></i><br>Koneksi Terputus: ' + admsekolahdash_escapeHtml(err.message) + '</span>');
    }).getAdmSekolahViewerData(npsnSafe, ADMSEKOLAHDASH_IS_ADMIN ? "" : ADMSEKOLAHDASH_USER_NPSN);
}

function admsekolahdash_renderUnitView(data) {
    var school = data.school || {};
    var categories = data.categories || [];
    var files = data.files || [];

    // Update banner
    $('#admsekolahdash_unitNamaSekolah').text(school.nama || '-');
    $('#admsekolahdash_unitMetaSekolah').text('NPSN: ' + (school.npsn || '-') + '  |  Jenjang: ' + (school.jenjang || '-'));

    // Kelompokkan file per id_kategori
    var fileByKat = {};
    files.forEach(function(f) {
        var kid = String(f.id_kategori || "").trim();
        if (!fileByKat[kid]) fileByKat[kid] = [];
        fileByKat[kid].push(f);
    });

    var html = '';
    if (categories.length === 0) {
        html = '<div class="admsekolahdash-unit-empty"><i class="fas fa-folder-open"></i><p>Belum ada kategori dokumen terdaftar.</p></div>';
    } else {
        categories.forEach(function(kat, idx) {
            var kid = String(kat.idKat || "").trim();
            var katFiles = fileByKat[kid] || [];
            var jumlahDok = katFiles.length;

            var badgeHtml = jumlahDok > 0
                ? '<span class="badge badge-success ml-2" style="font-size:10px;">' + jumlahDok + ' Dokumen</span>'
                : '<span class="badge badge-secondary ml-2" style="font-size:10px;">Belum Ada</span>';

            var rowsHtml = '';
            if (katFiles.length === 0) {
                rowsHtml = '<tr><td colspan="4" class="text-center text-muted" style="font-size:12px; padding: 14px;">— Belum ada dokumen untuk kategori ini —</td></tr>';
            } else {
                katFiles.forEach(function(f) {
                    var stLower = String(f.status || "").toLowerCase();
                    var stClass = 'belum';
                    var stIcon = '—';
                    if (stLower.includes('disetujui') || stLower.includes('setuju') || stLower.includes('ok') || stLower.includes('valid')) { stClass = 'disetujui'; stIcon = '✅'; }
                    else if (stLower.includes('proses') || stLower.includes('pending')) { stClass = 'diproses'; stIcon = '⏳'; }
                    else if (stLower.includes('revisi')) { stClass = 'revisi'; stIcon = '✏️'; }
                    else if (stLower.includes('tolak') || stLower.includes('ditolak')) { stClass = 'ditolak'; stIcon = '❌'; }

                    var periodeLabel = '';
                    var tahun = String(f.tahun || '').trim();
                    var periode = String(f.periode || '').trim();
                    if (tahun) {
                        periodeLabel = tahun;
                        if (periode && periode !== '-') periodeLabel += ' / ' + periode;
                    } else {
                        periodeLabel = periode && periode !== '-' ? periode : '-';
                    }

                    var lihatBtn = '';
                    if (f.url) {
                        lihatBtn = '<a href="' + admsekolahdash_escapeHtml(f.url) + '" target="_blank" class="admsekolahdash-link-lihat"><i class="fas fa-external-link-alt mr-1"></i>Lihat</a>';
                    } else {
                        lihatBtn = '<span class="text-muted" style="font-size:11px;">-</span>';
                    }

                    rowsHtml += '<tr>'
                        + '<td>' + admsekolahdash_escapeHtml(f.file_name || '-') + '</td>'
                        + '<td>' + admsekolahdash_escapeHtml(periodeLabel) + '</td>'
                        + '<td><span class="admsekolahdash-status-badge ' + stClass + '">' + stIcon + ' ' + admsekolahdash_escapeHtml(f.status || 'Belum Ada') + '</span></td>'
                        + '<td>' + lihatBtn + '</td>'
                        + '</tr>';
                });
            }

            html += '<div class="admsekolahdash-kat-card card" id="admsekolahkatcard_' + idx + '">'
                + '<div class="card-header" onclick="admsekolahdash_toggleCard(' + idx + ')">'
                + '<div class="kat-title"><i class="fas fa-folder mr-1 text-maroon" style="font-size:12px;"></i>' + admsekolahdash_escapeHtml(kat.namaKat || kat.namaKategori || '') + badgeHtml + '</div>'
                + '<i class="fas fa-chevron-down kat-arrow"></i>'
                + '</div>'
                + '<div class="card-body collapse-body" id="admsekolahkatbody_' + idx + '">'
                + '<table class="admsekolahdash-kat-table">'
                + '<thead><tr><th>Nama File</th><th>Periode</th><th>Status</th><th>Aksi</th></tr></thead>'
                + '<tbody>' + rowsHtml + '</tbody>'
                + '</table>'
                + '</div>'
                + '</div>';
        });
    }

    $('#admsekolahdash_unitKartuContainer').html(html);
    $('#admsekolahdash_unitLoadingState').hide();
    $('#admsekolahdash_unitContent').show();
}

function admsekolahdash_toggleCard(idx) {
    var body = $('#admsekolahkatbody_' + idx);
    var card = $('#admsekolahkatcard_' + idx);
    body.slideToggle(180);
    card.toggleClass('collapsed');
}

// ANIMASI & UTILITY
// ================================================================
function admsekolahdash_animateValue(id, end, formatPercent) {
    if (typeof SultanUI !== 'undefined') SultanUI.stopLottery('#' + id);
    var obj = document.getElementById(id);
    if (!obj) return;
    if (obj.dataset.admsekolahdashAnimId) cancelAnimationFrame(parseInt(obj.dataset.admsekolahdashAnimId, 10));
    var start = 0, duration = 1000, startTime = null;
    function step(timestamp) {
        if (!startTime) startTime = timestamp;
        var progress = Math.min((timestamp - startTime) / duration, 1);
        var val = Math.floor(progress * (end - start) + start);
        obj.innerHTML = val.toLocaleString('id-ID') + (formatPercent ? '%' : '');
        if (progress < 1) {
            var animId = window.requestAnimationFrame(step);
            obj.dataset.admsekolahdashAnimId = animId;
        } else {
            obj.dataset.admsekolahdashAnimId = "";
        }
    }
    obj.dataset.admsekolahdashAnimId = window.requestAnimationFrame(step);
}

function admsekolahdash_salinKeWA() {
    var listEl = $('#admsekolahdash_listBelum .hover-sultan:visible');
    var isPermanen = (ADMSEKOLAHDASH_JENIS_PERIODE === "PERMANEN" || ADMSEKOLAHDASH_JENIS_PERIODE === "TMT");
    var fTahun = isPermanen ? "-" : ($('#admsekolahdash_filterTahun').val() === "SEMUA" ? "-" : $('#admsekolahdash_filterTahun').val());
    var fPeriode = ($('#admsekolahdash_filterPeriode').val() === "SEMUA" || isPermanen) ? "-" : $('#admsekolahdash_filterPeriode').val();
    var selNamaKat = $('#admsekolahdash_filterKategori option:selected').text().toUpperCase();

    var fUnit = ADMSEKOLAHDASH_IS_ADMIN ? String($('#admsekolahdash_filterSekolah').val() || "").trim().toUpperCase() : ADMSEKOLAHDASH_USER_NPSN.toUpperCase();
    var listRevisi = ADMSEKOLAHDASH_CACHE_REKAP.filter(function(r) {
        if (!admsekolahdash_rowMatchesUnit(r, fUnit)) return false;
        var rTahun = String(r.tahun || "").trim().toUpperCase();
        if (!isPermanen && fTahun !== "-" && fTahun !== "SEMUA" && rTahun !== fTahun) return false;
        if (fPeriode !== "-" && fPeriode !== "SEMUA" && String(r.periode || "").trim().toUpperCase() !== fPeriode) return false;
        return String(r.status || "").toLowerCase().includes("revisi");
    });

    if (listEl.length === 0 && listRevisi.length === 0) {
        Sultan.notif.info('Tidak ada data belum unggah maupun revisi untuk disalin.');
        return;
    }

    var teks = '*INFORMASI ADMINISTRASI SEKOLAH*\n';
    teks += 'DOKUMEN: ' + selNamaKat + '\nTAHUN: ' + fTahun + '\nPERIODE: ' + fPeriode + '\n=======================\n\n';
    if (listEl.length > 0) {
        teks += '*⚠️ BELUM UNGGAH (' + listEl.length + '):*\n';
        var listBelumNama = [];
        listEl.each(function() { listBelumNama.push($(this).attr('data-unit') || $(this).find('.nama-asn').text().trim()); });
        listBelumNama.sort().forEach(function(nama, idx) { teks += (idx + 1) + '. ' + nama + '\n'; });
        teks += '\n';
    }
    if (listRevisi.length > 0) {
        teks += '*✍️ PERLU REVISI (' + listRevisi.length + '):*\n';
        listRevisi.map(function(r) { return r.unit; }).sort().forEach(function(nama, idx) { teks += (idx + 1) + '. ' + nama + '\n'; });
        teks += '\n';
    }
    teks += '_Mohon segera menindaklanjuti melalui SIKS-Reborn._';

    navigator.clipboard.writeText(teks).then(function() {
        Sultan.notif.sukses('Daftar berhasil disalin ke Clipboard (Siap Paste di WhatsApp).');
    }).catch(function() {
        Sultan.alert('error', 'Gagal Menyalin', 'Browser Anda tidak mendukung Clipboard API.');
    });
}

function admsekolahdash_escapeHtml(text) {
    return text ? String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;") : "";
}
