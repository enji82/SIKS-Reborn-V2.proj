<section class="content">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12">

        <!-- FILTER BAR (dirender oleh SultanUI) -->
        <div id="kombelkelola_filterBarArea"></div>

        <div class="card-sultan w-100 overflow-hidden">
          <div class="card-body p-3 w-100">
            <div id="kombelkelola_loadingState"></div>
            <div id="kombelkelola_tableState" style="display:none;">
              <table id="kombelkelola_tabelUtama"
                     class="table table-hover table-premium table-sultan-compact mb-0 w-100">
                <thead class="thead-sultan-premium text-uppercase font-weight-bold">
                  <tr>
                    <th class="text-left align-middle col-sticky-left" style="width:20%;">
                      <span class="sultan-th-title">NAMA SEKOLAH</span>
                    </th>
                    <th class="text-left align-middle" style="width:18%;">
                      <span class="sultan-th-title">JENIS DOKUMEN</span>
                    </th>
                    <th class="text-center align-middle text-nowrap" style="width:7%;">
                      <span class="sultan-th-title">KELAS</span>
                    </th>
                    <th class="text-center align-middle text-nowrap" style="width:8%;">
                      <span class="sultan-th-title">TAHUN</span>
                    </th>
                    <th class="text-center align-middle text-nowrap" style="width:9%;">
                      <span class="sultan-th-title">DOKUMEN</span>
                    </th>
                    <th class="text-left align-middle text-nowrap" style="width:11%;">
                      <span class="sultan-th-title">STATUS</span>
                    </th>
                    <th class="text-left align-middle text-nowrap" style="width:11%;">
                      <span class="sultan-th-title">AKTIVITAS</span>
                    </th>
                    <th class="text-center align-middle text-nowrap" style="width:16%;">
                      <span class="sultan-th-title">AKSI</span>
                    </th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>

<!-- TEMPLATE MODAL -->
<div id="kombelkelola_templates" style="display:none;">

  <!-- Form Upload (Tambah) -->
  <form id="kombelkelola_formUpload" novalidate>
    <div class="modal-body modal-body-sultan p-4">
      <!-- Target Sekolah & KKG Header -->
      <div class="form-group mb-4 position-relative" id="kombelkelola_header_target_container">
        <div class="row">
          <!-- Pilih Sekolah (Admin) -->
          <div class="col-md-8" id="kombelkelola_pilih_sekolah_container">
            <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
              Pilih Sekolah <span class="text-danger">*</span>
            </label>
            <div class="row">
              <div class="col-md-4">
                <select id="kombelkelola_in_jenjang" class="form-control form-control-sultan border-maroon font-weight-bold text-dark">
                  <option value="">Pilih Jenjang</option>
                  <option value="PAUD">PAUD</option>
                  <option value="SD">SD</option>
                </select>
              </div>
              <div class="col-md-8">
                <select id="kombelkelola_in_sekolah" class="form-control form-control-sultan border-maroon font-weight-bold text-dark" required disabled>
                  <option value="">Pilih Sekolah</option>
                </select>
              </div>
            </div>
          </div>
          <!-- Target KKG / Kelas -->
          <div class="col-md-4" id="kombelkelola_pilih_kkg_container">
            <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
              Kelas / Mapel <span class="text-danger">*</span>
            </label>
            <select id="kombelkelola_in_kkg" class="form-control form-control-sultan border-maroon font-weight-bold text-dark" required>
              <option value="">Pilih Kelas / Mapel</option>
            </select>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2">
        <h6 class="font-weight-bold text-dark m-0">
          <i class="fas fa-layer-group mr-1 text-primary"></i> Daftar Dokumen Baru
        </h6>
        <button type="button" id="kombelkelola_btnAddRow"
                class="btn btn-sm btn-outline-primary font-weight-bold rounded-pill px-3 shadow-sm" disabled>
          <i class="fas fa-plus mr-1"></i> Tambah Dokumen
        </button>
      </div>

      <div id="kombelkelola_uploadContainer" class="mt-3">
        <div class="text-center text-muted p-3" id="kombelkelola_msgPilihSekolah">
          <i class="fas fa-info-circle mr-1"></i> Pilih sekolah terlebih dahulu.
        </div>
      </div>
    </div>
    <div class="modal-footer modal-footer-tambah-edit justify-content-between">
      <button type="button" class="modal-btn-batal" data-dismiss="modal">
        <i class="fas fa-times mr-2"></i>BATAL
      </button>
      <button type="button" id="kombelkelola_btnSimpan" class="modal-btn-simpan" disabled>
        <i class="fas fa-cloud-upload-alt mr-2"></i>UNGGAH
      </button>
    </div>
  </form>

  <!-- Form Perbaiki (Edit) -->
  <form id="kombelkelola_formPerbaiki" novalidate>
    <div class="modal-body modal-body-sultan p-4">
      <input type="hidden" id="kombelkelola_p_rowid">
      <input type="hidden" id="kombelkelola_p_npsn">
      <table class="table table-sm table-borderless text-sm mb-3">
        <tr><td class="font-weight-bold text-muted w-25">Sekolah</td><td class="font-weight-bold text-dark text-uppercase" id="kombelkelola_p_nama">-</td></tr>
        <tr><td class="font-weight-bold text-muted">Kategori</td><td class="font-weight-bold text-primary" id="kombelkelola_p_kategori">-</td></tr>
        <tr><td class="font-weight-bold text-muted">Kelas</td><td class="font-weight-bold text-dark" id="kombelkelola_p_kelas">-</td></tr>
        <tr><td class="font-weight-bold text-muted">Catatan Admin</td><td class="font-weight-bold text-danger bg-white p-2 rounded border border-danger" id="kombelkelola_p_catatan">-</td></tr>
      </table>
      <div class="row mb-3">
        <div class="col-md-6" id="kombelkelola_p_tahun_wrapper">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            Tahun <span class="text-danger">*</span>
          </label>
          <input type="number" id="kombelkelola_p_tahun_input"
                 class="form-control form-control-sultan border-warning" required>
        </div>
        <div class="col-md-6" id="kombelkelola_p_periode_wrapper" style="display:none;">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            <span id="kombelkelola_p_periode_label">Periode</span>
            <span class="text-danger">*</span>
          </label>
          <input type="text" id="kombelkelola_p_periode_input"
                 class="form-control form-control-sultan border-warning">
        </div>
      </div>
      <div class="form-group mb-0 border p-3 bg-white rounded shadow-sm">
        <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
          <i class="fas fa-file-upload text-danger mr-1" id="kombelkelola_p_iconFormat"></i>
          <span id="kombelkelola_p_lblFormat">Dokumen (Maks 2MB)</span>
        </label>
        <div class="small text-muted mb-2 font-italic">
          Biarkan kosong jika tidak ingin mengubah file asli.
        </div>
        <div class="custom-file">
          <input type="file" class="custom-file-input border-warning kombelkelola-file-input"
                 id="kombelkelola_p_file">
          <label class="custom-file-label text-truncate">Pilih file baru...</label>
        </div>
      </div>
    </div>
    <div class="modal-footer modal-footer-tambah-edit justify-content-between">
      <button type="button" class="modal-btn-batal" data-dismiss="modal">
        <i class="fas fa-times mr-2"></i>BATAL
      </button>
      <button type="button" id="kombelkelola_btnSimpanPerbaiki" class="modal-btn-perbarui">
        <i class="fas fa-edit mr-2"></i>PERBARUI
      </button>
    </div>
  </form>

  <!-- Form Verifikasi -->
  <form id="kombelkelola_formVerif" class="d-flex flex-column flex-grow-1 overflow-hidden m-0 p-0" novalidate>
    <div class="px-4 pb-4 flex-grow-1 overflow-auto" style="padding-top:15px!important;">
      <input type="hidden" id="kombelkelola_v_rowid">

      <h6 class="modal-verifikasi-section-title">
        <i class="fas fa-list-alt mr-2"></i>Detail Dokumen
      </h6>

      <div class="sultan-detail-container mb-4">
        <div class="sultan-detail-item">
          <label class="sultan-detail-label">NAMA SEKOLAH</label>
          <div class="sultan-detail-value text-uppercase" id="kombelkelola_v_nama">-</div>
        </div>
        <div class="sultan-detail-item">
          <label class="sultan-detail-label">NPSN</label>
          <div class="sultan-detail-value font-weight-bold" id="kombelkelola_v_npsn">-</div>
        </div>
        <div class="sultan-detail-item">
          <label class="sultan-detail-label">KATEGORI</label>
          <div class="sultan-detail-value text-maroon" id="kombelkelola_v_kategori">-</div>
        </div>
        <div class="sultan-detail-item">
          <label class="sultan-detail-label">KELAS</label>
          <div class="sultan-detail-value font-weight-bold" id="kombelkelola_v_kelas">-</div>
        </div>
        <div class="sultan-detail-item">
          <label class="sultan-detail-label">TAHUN</label>
          <div class="sultan-detail-value font-weight-bold" id="kombelkelola_v_tahun">-</div>
        </div>
        <div class="sultan-detail-item" id="kombelkelola_v_periode_wrapper">
          <label class="sultan-detail-label">PERIODE</label>
          <div class="sultan-detail-value font-weight-bold text-primary" id="kombelkelola_v_periode">-</div>
        </div>
      </div>

      <h6 class="modal-verifikasi-section-title">
        <i class="fas fa-check-circle mr-2"></i>Verifikasi
      </h6>

      <div class="form-group mb-3">
        <label class="modal-verifikasi-form-label">Keputusan Verifikasi <span class="text-danger">*</span></label>
        <select class="modal-verifikasi-select font-weight-bold" id="kombelkelola_v_status" required>
          <option value="">-- Pilih Keputusan --</option>
          <option value="Disetujui">Disetujui</option>
          <option value="Revisi">Revisi</option>
          <option value="Ditolak">Ditolak</option>
        </select>
      </div>

      <div class="form-group mb-3" id="kombelkelola_prevCatatanWrap" style="display:none;">
        <label class="modal-verifikasi-form-label text-muted">
          <i class="fas fa-history mr-1"></i>Keterangan Verifikasi Sebelumnya
        </label>
        <div class="modal-verifikasi-prev-catatan" id="kombelkelola_prevCatatan"></div>
      </div>

      <div class="form-group mb-0">
        <label class="modal-verifikasi-form-label">
          Catatan Admin <span id="kombelkelola_reqCatatan" class="text-danger" style="display:none;">*</span>
        </label>
        <textarea class="modal-verifikasi-textarea" id="kombelkelola_v_catatan" rows="3"
                  placeholder="Wajib diisi jika ditolak / direvisi..."></textarea>
      </div>

      <div class="modal-verifikasi-footer" id="kombelkelola_verifFooter">
        <button type="button" class="modal-btn-batal" data-dismiss="modal">
          <i class="fas fa-times mr-2"></i>BATAL
        </button>
        <button type="submit" id="kombelkelola_btnVerifikasi" class="modal-verifikasi-btn-verifikasi"
                form="kombelkelola_formVerif">
          <i class="fas fa-check-circle mr-2"></i>VERIFIKASI
        </button>
      </div>
    </div>
  </form>
</div>

<script>
/* ================================================================
   KELOLA DOKUMEN KOMUNITAS BELAJAR — JAVASCRIPT
   (Mengikuti pola identik page_adm_sekolah_kelola)
   ================================================================ */

var KOMBELKELOLA_CACHE_DATA = [], KOMBELKELOLA_MASTER_SEKOLAH = [], KOMBELKELOLA_MASTER_KAT = [];
var KOMBELKELOLA_TABEL_INSTANCE = null, KOMBELKELOLA_ROW_COUNT = 0;
var KOMBELKELOLA_USER_AKTIF = "", KOMBELKELOLA_IS_ADMIN = false, KOMBELKELOLA_NPSN_TERKUNCI = "";
var KOMBELKELOLA_SELECTED_SEKOLAH_FILES = [];

// Daftar opsi kelas / KKG
var KOMBELKELOLA_KELAS_OPTS = [
  { value: "Umum",        label: "Umum / Semua KKG" },
  { value: "KKG Kelas 1", label: "KKG Kelas 1" },
  { value: "KKG Kelas 2", label: "KKG Kelas 2" },
  { value: "KKG Kelas 3", label: "KKG Kelas 3" },
  { value: "KKG Kelas 4", label: "KKG Kelas 4" },
  { value: "KKG Kelas 5", label: "KKG Kelas 5" },
  { value: "KKG Kelas 6", label: "KKG Kelas 6" },
  { value: "KKG PJOK",    label: "KKG PJOK" },
  { value: "KKG PAI",     label: "KKG PAI" }
];

$(document).ready(function() {
  $('#kombelkelola_tableState').hide();
  SultanUI.showLoading('#kombelkelola_loadingState');

  try {
    var user = typeof getSesiUser === 'function' ? getSesiUser() : {};
    KOMBELKELOLA_USER_AKTIF = user.nama_lengkap || user.username || "User Web";
    var rStr = String(user.role || "").toLowerCase();
    KOMBELKELOLA_IS_ADMIN = (typeof checkUserRoleIsAdmin === 'function' && checkUserRoleIsAdmin()) || rStr.includes("admin") || rStr.includes("verifikator");
    KOMBELKELOLA_NPSN_TERKUNCI = user.npsn || user.unit || user.username || "";
  } catch(e) { KOMBELKELOLA_NPSN_TERKUNCI = ""; KOMBELKELOLA_IS_ADMIN = false; }

  kombelkelola_renderFilterBar();

  $(document).off('click','#kombelkelola_btnRefresh').on('click','#kombelkelola_btnRefresh', kombelkelola_tarikDataServer);
  $(document).off('click','#kombelkelola_btnTambah').on('click','#kombelkelola_btnTambah', kombelkelola_bukaModalTambah);
  $(document).off('click','#kombelkelola_btnSimpan').on('click','#kombelkelola_btnSimpan', function(){ $('#kombelkelola_formUpload').submit(); });
  $(document).off('click','#kombelkelola_btnSimpanPerbaiki').on('click','#kombelkelola_btnSimpanPerbaiki', function(){ $('#kombelkelola_formPerbaiki').submit(); });
  $(document).off('click','#kombelkelola_btnVerifikasi').on('click','#kombelkelola_btnVerifikasi', function(){ $('#kombelkelola_formVerif').submit(); });

  $(document).off('change','#kombelkelola_filterKelas').on('change','#kombelkelola_filterKelas', function() {
    kombelkelola_updateFilterKategoriOptions();
    kombelkelola_terapkanFilterLokal();
  });

  $(document).off('change','#kombelkelola_filterKategori, #kombelkelola_filterTahun, #kombelkelola_filterStatus').on('change','#kombelkelola_filterKategori, #kombelkelola_filterTahun, #kombelkelola_filterStatus', kombelkelola_terapkanFilterLokal);

  if (KOMBELKELOLA_IS_ADMIN) {
    $(document).off('change','#kombelkelola_filterJenjang').on('change','#kombelkelola_filterJenjang', function() {
      kombelkelola_updateSekolahDropdown(); kombelkelola_terapkanFilterLokal();
    });
    $(document).off('change','#kombelkelola_filterSekolah').on('change','#kombelkelola_filterSekolah', kombelkelola_terapkanFilterLokal);
  }

  $(document).off('change','#kombelkelola_in_jenjang').on('change','#kombelkelola_in_jenjang', function() {
    var jenjang = $(this).val();
    var $sek = $('#kombelkelola_in_sekolah');
    $sek.empty().append('<option value="">Pilih Sekolah</option>');
    if (jenjang) {
      var filtered = KOMBELKELOLA_MASTER_SEKOLAH.filter(function(s) {
        var jjg = String(s.jenjang || "").toUpperCase();
        if (jenjang === "PAUD") return jjg === "TK" || jjg === "KB" || jjg === "SPS" || jjg === "TPA" || jjg.includes("PAUD");
        if (jenjang === "SD") return jjg === "SD" || jjg.includes("SD");
        return jjg === jenjang;
      });
      filtered.forEach(function(s){ $sek.append($('<option>', { value: s.npsn, text: s.nama })); });
      $sek.prop('disabled', false);
    } else { $sek.prop('disabled', true); }
    $('#kombelkelola_uploadContainer').html('<div class="text-center text-muted p-3" id="kombelkelola_msgPilihSekolah"><i class="fas fa-info-circle mr-1"></i> Pilih sekolah terlebih dahulu.</div>');
    $('#kombelkelola_btnAddRow, #kombelkelola_btnSimpan').prop('disabled', true);
  });

  $(document).off('change','#kombelkelola_in_sekolah').on('change','#kombelkelola_in_sekolah', function() {
    var npsn = $(this).val();
    if (npsn) {
      KOMBELKELOLA_SELECTED_SEKOLAH_FILES = KOMBELKELOLA_CACHE_DATA.filter(function(r){ return String(r.npsn).trim() === String(npsn).trim(); });
      $('#kombelkelola_uploadContainer').empty();
      $('#kombelkelola_btnAddRow, #kombelkelola_btnSimpan').prop('disabled', false);
      KOMBELKELOLA_ROW_COUNT = 0;
      kombelkelola_createUploadRow();
    } else {
      $('#kombelkelola_uploadContainer').html('<div class="text-center text-muted p-3" id="kombelkelola_msgPilihSekolah"><i class="fas fa-info-circle mr-1"></i> Pilih sekolah terlebih dahulu.</div>');
      $('#kombelkelola_btnAddRow, #kombelkelola_btnSimpan').prop('disabled', true);
    }
  });

  $(document).off('change','#kombelkelola_in_kkg').on('change','#kombelkelola_in_kkg', function() {
    // Apabila KKG di header diubah, perbarui daftar kategori/nama dokumen di seluruh baris
    $('.kombelkelola-upload-row').each(function() {
      var row = $(this);
      var currentVal = row.find('.kombelkelola-kategori-select').val();
      var selectedKkg = $('#kombelkelola_in_kkg').val() || "Semua KKG";
      var newKatOpts = '<option value="">Pilih Kategori</option>';

      KOMBELKELOLA_MASTER_KAT.forEach(function(k) {
        if (k.isAktif !== false && k.status !== "Nonaktif") {
          var kkgTarget = String(k.kelas || "").trim();
          var matchKkg = (!kkgTarget || kkgTarget === "Semua KKG" || kkgTarget === "Umum" || selectedKkg === "Semua KKG" || kkgTarget.toLowerCase() === selectedKkg.toLowerCase());
          if (matchKkg) {
            newKatOpts += '<option value="'+k.idKat+'">'+k.namaKat+'</option>';
          }
        }
      });

      var katSelect = row.find('.kombelkelola-kategori-select');
      katSelect.html(newKatOpts);
      if (currentVal && katSelect.find('option[value="'+currentVal+'"]').length > 0) {
        katSelect.val(currentVal);
      } else {
        katSelect.val('').trigger('change');
      }
    });
  });

  $(document).off('click','#kombelkelola_btnAddRow').on('click','#kombelkelola_btnAddRow', kombelkelola_createUploadRow);
  $(document).off('click','.kombelkelola-btn-del-row').on('click','.kombelkelola-btn-del-row', function(){
    $(this).closest('.kombelkelola-upload-row').slideUp(200, function(){ $(this).remove(); });
  });

  $(document).off('change','.kombelkelola-kategori-select').on('change','.kombelkelola-kategori-select', function() {
    var val = String($(this).val()||"").trim();
    var katData = KOMBELKELOLA_MASTER_KAT.find(function(k){ return String(k.idKat).trim() === val; });
    var row = $(this).closest('.kombelkelola-upload-row');
    var fileIn = row.find('.kombelkelola-file-input');
    var fText = row.find('.kombelkelola-format-text');
    var fIcon = row.find('.kombelkelola-format-icon');
    var pWrap = row.find('.kombelkelola-periode-wrapper');
    var pLabel = row.find('.kombelkelola-periode-label');
    var pInput = row.find('.kombelkelola-periode-input');

    fileIn.val('').next('.custom-file-label').html('Pilih file...').removeClass('text-success font-weight-bold');

    if (katData) {
      var fmt = String(katData.format).toUpperCase();
      var ukuran = katData.ukuran || "2";
      if (fmt.includes('IMG') || fmt.includes('JPG') || fmt.includes('PNG')) {
        fileIn.attr('accept','image/jpeg,image/png,image/jpg'); fText.text('JPG/PNG (Maks '+ukuran+'MB)'); fIcon.removeClass('fa-file-pdf fa-file-upload fa-file-excel').addClass('fa-file-image');
      } else if (fmt.includes('ALL') || fmt.includes('BEBAS')) {
        fileIn.attr('accept','application/pdf,image/jpeg,image/png,image/jpg'); fText.text('PDF/JPG/PNG (Maks '+ukuran+'MB)'); fIcon.removeClass('fa-file-pdf fa-file-image fa-file-excel').addClass('fa-file-upload');
      } else if (fmt.includes('EXCEL')) {
        fileIn.attr('accept','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel'); fText.text('EXCEL (Maks '+ukuran+'MB)'); fIcon.removeClass('fa-file-image fa-file-upload fa-file-pdf').addClass('fa-file-excel');
      } else {
        fileIn.attr('accept','application/pdf'); fText.text('PDF (Maks '+ukuran+'MB)'); fIcon.removeClass('fa-file-image fa-file-upload fa-file-excel').addClass('fa-file-pdf');
      }
      fileIn.attr('data-max-size', ukuran * 1024 * 1024);

      var jPeriode = String(katData.jenisPeriode).toUpperCase();
      var katWrapEl = row.find('.kombelkelola-kat-wrapper');
      var thnWrapEl = row.find('.kombelkelola-tahun-wrapper');

      var isTapel = jPeriode.includes("TAPEL");
      if (isTapel) {
        thnWrapEl.find('.form-label-sultan').html('Thn Pelajaran <span class="text-danger">*</span>');
        var nowY = new Date().getFullYear();
        var tapelOpts = '<option value="">Pilih Tahun</option>';
        for (var y = nowY + 2; y >= nowY - 4; y--) {
          var tStr = y + "/" + (y + 1);
          tapelOpts += '<option value="' + tStr + '">' + tStr + '</option>';
        }
        row.find('.kombelkelola-tahun-input').replaceWith('<select class="form-control form-control-sultan border-maroon kombelkelola-tahun-input" required>' + tapelOpts + '</select>');
      } else {
        thnWrapEl.find('.form-label-sultan').html('Tahun <span class="text-danger">*</span>');
        var nowY2 = new Date().getFullYear();
        var thnOpts = '<option value="">Pilih Tahun</option>';
        for (var y2 = nowY2 + 2; y2 >= nowY2 - 5; y2--) {
          thnOpts += '<option value="' + y2 + '" ' + (y2 === nowY2 ? 'selected' : '') + '>' + y2 + '</option>';
        }

function kombelkelola_initMasterData() {
  if (!KOMBELKELOLA_IS_ADMIN && !KOMBELKELOLA_NPSN_TERKUNCI) {
    $('#kombelkelola_loadingState').find('.sultan-loading-text').html('<span class="text-danger"><i class="fas fa-ban mb-2"></i><br>Akses ditolak.</span>');
    return;
  }

  google.script.run.withSuccessHandler(function(json) {
    var res = JSON.parse(json);
    if (!res.success) { $('#kombelkelola_loadingState').find('.sultan-loading-text').html('<span class="text-danger"><i class="fas fa-exclamation-triangle mb-2"></i><br>' + kombelkelola_esc(res.message) + '</span>'); return; }

    KOMBELKELOLA_MASTER_KAT = res.kategori || [];
    KOMBELKELOLA_MASTER_SEKOLAH = res.sekolah || [];

    if (!KOMBELKELOLA_IS_ADMIN) {
      var lockVal = String(KOMBELKELOLA_NPSN_TERKUNCI || "").trim().toUpperCase();
      var foundSek = KOMBELKELOLA_MASTER_SEKOLAH.find(function(s){
        return String(s.npsn).trim().toUpperCase() === lockVal || String(s.nama||"").trim().toUpperCase() === lockVal;
      });
      if (foundSek && foundSek.npsn) KOMBELKELOLA_NPSN_TERKUNCI = foundSek.npsn;
    }

    kombelkelola_setupKkgDropdowns();
    kombelkelola_updateFilterKategoriOptions();

    var hs = '<option value="SEMUA">Semua Status</option><option value="diproses">Diproses</option><option value="disetujui">Disetujui</option><option value="revisi">Revisi</option><option value="ditolak">Ditolak</option>';
    $('#kombelkelola_filterStatus').html(hs).prop('disabled', false);

    if (KOMBELKELOLA_IS_ADMIN) {
      kombelkelola_setupJenjangDropdown();
      kombelkelola_updateSekolahDropdown();
    }

    $('#kombelkelola_btnRefresh').prop('disabled', false);
    $('#kombelkelola_btnTambah').prop('disabled', false);
    kombelkelola_tarikDataServer();

  }).withFailureHandler(function(err) {
    $('#kombelkelola_loadingState').find('.sultan-loading-text').html('<span class="text-danger"><i class="fas fa-wifi mb-2"></i><br>'+kombelkelola_esc(err.message)+'</span>');
  }).getKombelMasterData("");
}

function kombelkelola_setupKkgDropdowns() {
  var kkgSet = new Set();
  
  // Tambahkan KKG dari master kategori
  KOMBELKELOLA_MASTER_KAT.forEach(function(k) {
    var rawKkg = String(k.kelas || "").trim();
    if (rawKkg) {
      var arr = rawKkg.split(',');
      arr.forEach(function(item) {
        var trimmed = item.trim();
        if (trimmed && trimmed.toUpperCase() !== "SEMUA KKG" && trimmed.toUpperCase() !== "SEMUA KELAS / MAPEL" && trimmed !== "Umum") {
          kkgSet.add(trimmed);
        }
      });
    }
  });

  // Jika tidak ada di master kategori, gunakan daftar opsi standar
  if (kkgSet.size === 0) {
    KOMBELKELOLA_KELAS_OPTS.forEach(function(opt) {
      if (opt.value !== "Umum") kkgSet.add(opt.value);
    });
  }

  var sortedKkg = Array.from(kkgSet).sort(function(a, b) {
    return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
  });

  // Dropdown filter bar
  var hFilterKkg = '<option value="SEMUA">Semua Kelas / Mapel</option>';
  sortedKkg.forEach(function(kkg) {
    hFilterKkg += '<option value="' + kombelkelola_esc(kkg) + '">' + kombelkelola_esc(kkg) + '</option>';
  });
  $('#kombelkelola_filterKelas').html(hFilterKkg).prop('disabled', false);

  // Dropdown modal upload (tanpa opsi Semua Kelas / Mapel)
  var hModalKkg = '<option value="">Pilih Kelas / Mapel</option>';
  sortedKkg.forEach(function(kkg) {
    hModalKkg += '<option value="' + kombelkelola_esc(kkg) + '">' + kombelkelola_esc(kkg) + '</option>';
  });
  $('#kombelkelola_in_kkg').html(hModalKkg);
}

function kombelkelola_updateFilterKategoriOptions() {
  var selectedKelas = String($('#kombelkelola_filterKelas').val() || "SEMUA").trim();
  var selectKat = $('#kombelkelola_filterKategori');
  var currentKat = selectKat.val();

  var filteredKategori = KOMBELKELOLA_MASTER_KAT.filter(function(k) {
    if (selectedKelas === "SEMUA" || !selectedKelas) return true;
    var rawKelas = String(k.kelas || "").trim();
    if (!rawKelas || rawKelas.toUpperCase() === "SEMUA KKG" || rawKelas.toUpperCase() === "SEMUA KELAS / MAPEL" || rawKelas === "Umum") {
      return true;
    }
    var listArr = rawKelas.split(',').map(function(s) { return s.trim().toUpperCase(); });
    return listArr.indexOf(selectedKelas.toUpperCase()) !== -1;
  });

  var hk = '<option value="SEMUA">Semua Dokumen</option>';
  filteredKategori.forEach(function(k) {
    hk += '<option value="' + k.idKat + '">' + kombelkelola_esc(k.namaKat) + '</option>';
  });

  selectKat.html(hk).prop('disabled', false);

  if (currentKat && (currentKat === "SEMUA" || filteredKategori.some(function(k) { return String(k.idKat) === String(currentKat); }))) {
    selectKat.val(currentKat);
  } else {
    selectKat.val("SEMUA");
  }
}

function kombelkelola_setupJenjangDropdown() {
  var jenjangSet = new Set();
  KOMBELKELOLA_MASTER_SEKOLAH.forEach(function(s){ var j=String(s.jenjang||"").toUpperCase(); if(j) jenjangSet.add(j); });
  var hj = '<option value="SEMUA">Semua Jenjang</option>';
  Array.from(jenjangSet).sort().forEach(function(j){ hj += '<option value="'+j+'">'+j+'</option>'; });
  $('#kombelkelola_filterJenjang').html(hj).prop('disabled', false);
}

function kombelkelola_updateSekolahDropdown() {
  var fJ = String($('#kombelkelola_filterJenjang').val()||"SEMUA").toUpperCase();
  var filtered = fJ === "SEMUA" ? KOMBELKELOLA_MASTER_SEKOLAH : KOMBELKELOLA_MASTER_SEKOLAH.filter(function(s){ return String(s.jenjang||"").toUpperCase() === fJ; });
  var hs = '<option value="SEMUA">Semua Sekolah</option>';
  filtered.sort(function(a,b){return String(a.nama).localeCompare(String(b.nama));}).forEach(function(s){ hs += '<option value="'+s.npsn+'">'+s.nama+'</option>'; });
  $('#kombelkelola_filterSekolah').html(hs).prop('disabled', false);
}

function kombelkelola_tarikDataServer() {
  var btn = $('#kombelkelola_btnRefresh');
  btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin text-maroon"></i>');
  if (!$.fn.DataTable.isDataTable('#kombelkelola_tabelUtama')) {
    $('#kombelkelola_tableState').hide(); SultanUI.showLoading('#kombelkelola_loadingState', "Memuat Data Dokumen Komunitas Belajar...");
  }

  var targetNpsn = KOMBELKELOLA_IS_ADMIN ? "SEMUA" : KOMBELKELOLA_NPSN_TERKUNCI;

  google.script.run.withSuccessHandler(function(json) {
    btn.prop('disabled', false).html('<i class="fas fa-sync-alt text-maroon"></i>');
    var res = JSON.parse(json);
    if (!res.success) { $('#kombelkelola_loadingState').html('<div class="text-center text-danger py-5"><i class="fas fa-exclamation-triangle fa-3x mb-3"></i><br>'+kombelkelola_esc(res.message)+'</div>'); return; }
    KOMBELKELOLA_CACHE_DATA = res.data || [];
    if (!$.fn.DataTable.isDataTable('#kombelkelola_tabelUtama')) kombelkelola_initTable();
    kombelkelola_terapkanFilterLokal();
    SultanUI.hideLoading('#kombelkelola_loadingState');
    $('#kombelkelola_tableState').show();
    if (KOMBELKELOLA_TABEL_INSTANCE) setTimeout(function(){ KOMBELKELOLA_TABEL_INSTANCE.columns.adjust(); }, 150);
  }).withFailureHandler(function(err) {
    btn.prop('disabled', false).html('<i class="fas fa-sync-alt text-maroon"></i>');
    $('#kombelkelola_loadingState').html('<div class="text-center text-danger py-5"><i class="fas fa-wifi fa-3x mb-3"></i><br>Koneksi: '+kombelkelola_esc(err.message)+'</div>');
  }).getKombelData(targetNpsn);
}

function kombelkelola_terapkanFilterLokal() {
  if (!KOMBELKELOLA_TABEL_INSTANCE) return;
  var fKkg = String($('#kombelkelola_filterKelas').val()||"SEMUA").trim().toUpperCase();
  var fKat = String($('#kombelkelola_filterKategori').val()||"SEMUA").trim();
  var fThn = String($('#kombelkelola_filterTahun').val()||"SEMUA").trim().toUpperCase();
  var fSts = String($('#kombelkelola_filterStatus').val()||"SEMUA").trim().toLowerCase();
  var fJ   = KOMBELKELOLA_IS_ADMIN ? String($('#kombelkelola_filterJenjang').val()||"SEMUA").toUpperCase() : "SEMUA";
  var fSek = KOMBELKELOLA_IS_ADMIN ? String($('#kombelkelola_filterSekolah').val()||"SEMUA") : (KOMBELKELOLA_NPSN_TERKUNCI||"SEMUA");

  // Populate dropdown Tahun
  var uniqueTahun = new Set();
  KOMBELKELOLA_CACHE_DATA.forEach(function(d){ var t=String(d.tahun||"").trim(); if(t&&t!=="-") uniqueTahun.add(t); });
  var selThn = $('#kombelkelola_filterTahun'); var curThn = selThn.val();
  selThn.empty().append('<option value="SEMUA">Semua Tahun</option>');
  var sortedT = Array.from(uniqueTahun).sort(function(a,b){return String(b).localeCompare(String(a));});
  sortedT.forEach(function(t){selThn.append($('<option>',{value:t,text:t}));});
  if (curThn && (curThn==="SEMUA"||uniqueTahun.has(curThn))) selThn.val(curThn);
  selThn.prop('disabled', false);

  var hasil = KOMBELKELOLA_CACHE_DATA.filter(function(d) {
    if (fSek !== "SEMUA" && String(d.npsn).trim() !== fSek) return false;
    
    if (fKkg !== "SEMUA") {
      var dKelas = String(d.kelas || d.kkg || "").trim().toUpperCase();
      if (dKelas !== fKkg && dKelas !== "SEMUA KKG" && dKelas !== "UMUM") return false;
    }

    if (fKat !== "SEMUA" && String(d.id_kategori).trim() !== fKat) return false;
    if (fThn !== "SEMUA" && String(d.tahun||"").trim().toUpperCase() !== fThn) return false;
    if (fSts !== "semua" && String(d.status||"").trim().toLowerCase() !== fSts) return false;
    return true;
  });

  kombelkelola_renderTabel(hasil);
}

function kombelkelola_renderTabel(data) {
  var dtArr = [];
  data.forEach(function(d) {
    var id = d.rowId;
    var st = String(d.status || "Diproses").toLowerCase();
    var isDisetujui = st === "disetujui";
    var unitNama = d.nama_sekolah || d.npsn || "-";
    var unitNpsn = d.npsn || "-";

    // 1. Kolom NAMA SEKOLAH
    var uiSekolah = `
      <div class="text-left">
        <div class="sultan-table-primary font-weight-bold" style="color: #800000; font-size: 12.5px; line-height: 1.2;">${kombelkelola_esc(unitNama)}</div>
        <div class="sultan-table-secondary text-muted" style="font-size: 11px; margin-top: 2px;">${kombelkelola_esc(unitNpsn)}</div>
      </div>
    `;

    // 2. Kolom JENIS DOKUMEN
    var teksPeriode = String(d.periode || "").trim();
    if (teksPeriode.match(/^\d{4}-\d{2}-\d{2}$/) && typeof Sultan !== 'undefined' && Sultan.format) {
      teksPeriode = Sultan.format.tanggal(teksPeriode);
    }
    var periodeSub = (teksPeriode && teksPeriode !== "-" && teksPeriode !== "SEMUA")
      ? `<div class="text-muted font-weight-normal" style="font-size: 11px; margin-top: 2px;">${kombelkelola_esc(teksPeriode)}</div>`
      : '';
    var uiJenisDokumen = `
      <div class="text-left">
        <div class="font-weight-bold text-dark" style="font-size: 12px; line-height: 1.2;">
          ${kombelkelola_esc(d.nama_kategori || d.id_kategori || '-')}
        </div>
        ${periodeSub}
      </div>
    `;

    // 3. Kolom KELAS
    var uiKelas = `<span class="badge badge-secondary" style="font-size:11px;">${kombelkelola_esc(d.kelas || "Umum")}</span>`;

    // 4. Kolom TAHUN
    var valTahun = (d.tahun && String(d.tahun).trim() !== "" && String(d.tahun).trim() !== "-")
      ? kombelkelola_esc(String(d.tahun).trim())
      : '-';
    var uiTahun = `<div class="text-center font-weight-bold text-dark" style="font-size: 12px;">${valTahun}</div>`;

    // 5. Kolom DOKUMEN (Tombol LIHAT Standar SultanUI)
    var fn = String(d.file_name || "").toLowerCase();
    var fi = "fa-file-pdf text-danger"; 
    if (fn.endsWith('.jpg') || fn.endsWith('.png') || fn.endsWith('.jpeg')) fi = "fa-file-image text-success";
    if (fn.endsWith('.xlsx') || fn.endsWith('.xls')) fi = "fa-file-excel text-success";
    var btnFile = `<button type="button" class="sultan-btn-pdf kombelkelola-btn-preview" data-url="${kombelkelola_esc(d.url)}" data-toggle="tooltip" title="Lihat Dokumen"><i class="fas ${fi} mr-1"></i> LIHAT</button>`;

    // 6. Kolom STATUS (Badge Status Interaktif SultanUI dengan Tombol Catatan jika ada)
    var badgeStatus = SultanUI.renderBadgeStatus(d.status, d.catatan, {
      unit: unitNama,
      dokumen: 'Dokumen ' + (d.nama_kategori || '') + ' - ' + unitNama,
      verifikator: d.verifikator,
      waktu: d.tgl_verif
    });

    // 7. Kolom AKTIVITAS (Audit Trail Cerdas)
    var auditWaktu = "-";
    var auditUser = "-";
    var auditLabel = "Diunggah";

    if (d.tgl_verif && String(d.tgl_verif).trim() !== "" && String(d.tgl_verif).trim() !== "-") {
      auditLabel = "Verif";
      auditWaktu = d.tgl_verif;
      auditUser = d.verifikator || "-";
    } else if (d.tgl_edit && String(d.tgl_edit).trim() !== "" && String(d.tgl_edit).trim() !== "-") {
      auditLabel = "Diubah";
      auditWaktu = d.tgl_edit;
      auditUser = d.user_edit || "-";
    } else if (d.tgl_upload && String(d.tgl_upload).trim() !== "" && String(d.tgl_upload).trim() !== "-") {
      auditLabel = "Diunggah";
      auditWaktu = d.tgl_upload;
      auditUser = d.uploader || "-";
    }

    var tooltipAudit = kombelkelola_esc(
      `Diunggah: ${d.tgl_upload || '-'}` + (d.uploader ? ` (${d.uploader})` : '') + `\n` +
      `Diubah: ${d.tgl_edit || '-'}` + (d.user_edit ? ` (${d.user_edit})` : '') + `\n` +
      `Verifikasi: ${d.tgl_verif || '-'}` + (d.verifikator ? ` (${d.verifikator})` : '')
    );

    var uiAktivitas = `
      <div class="text-left" data-toggle="tooltip" data-placement="top" title="${tooltipAudit}">
        <div class="font-weight-bold text-dark" style="font-size: 11.5px; line-height: 1.2;">${kombelkelola_esc(auditWaktu)}</div>
        <div class="text-muted text-lowercase" style="font-size: 11px; line-height: 1.2;">
          <span class="font-weight-semibold text-secondary">${auditLabel}:</span> ${kombelkelola_esc(auditUser).toLowerCase()}
        </div>
      </div>
    `;

    // 8. Kolom AKSI (Tombol Bulat Berwarna Presisi SultanUI)
    var btnV = "";
    if (KOMBELKELOLA_IS_ADMIN) {
      btnV = `<button type="button" class="sultan-btn-aksi sultan-btn-aksi-primary kombelkelola-btn-verif" data-id="${id}" data-toggle="tooltip" title="${st.includes('proses') ? 'Verifikasi Dokumen' : 'Edit Verifikasi'}"><i class="fas fa-clipboard-check"></i></button>`;
    }
    var btnP = `<button type="button" class="sultan-btn-aksi sultan-btn-aksi-warning kombelkelola-btn-perbaiki" data-id="${id}" ${isDisetujui ? 'disabled style="opacity:0.4; cursor:not-allowed;" title="Terkunci (Sudah Disetujui)"' : 'data-toggle="tooltip" title="Edit Dokumen"'}><i class="fas fa-pencil-alt"></i></button>`;
    var btnH = `<button type="button" class="sultan-btn-aksi sultan-btn-aksi-maroon kombelkelola-btn-hapus" data-id="${id}" ${isDisetujui ? 'disabled style="opacity:0.4; cursor:not-allowed;" title="Terkunci (Sudah Disetujui)"' : 'data-toggle="tooltip" title="Hapus Dokumen"'}><i class="fas fa-trash-alt"></i></button>`;
    var aksi = `<div class="d-flex flex-nowrap justify-content-center" style="gap:4px;">${btnV}${btnP}${btnH}</div>`;

    dtArr.push([
      uiSekolah,
      uiJenisDokumen,
      uiKelas,
      uiTahun,
      btnFile,
      badgeStatus,
      uiAktivitas,
      aksi
    ]);
  });

  KOMBELKELOLA_TABEL_INSTANCE.clear().rows.add(dtArr).draw(false);
  if (typeof $('[data-toggle="tooltip"]').tooltip === 'function') {
    $('[data-toggle="tooltip"]').tooltip();
  }
}

function kombelkelola_submitBatchUpload(e) {
  e.preventDefault();
  var npsn = KOMBELKELOLA_IS_ADMIN ? $('#kombelkelola_in_sekolah').val() : KOMBELKELOLA_NPSN_TERKUNCI;
  if (!npsn) { Sultan.alert('warning','Perhatian','Pilih sekolah terlebih dahulu.'); return; }

  var selectedKkg = $('#kombelkelola_in_kkg').val();
  if (!selectedKkg) { Sultan.alert('warning','Perhatian','Pilih Kelas / Mapel terlebih dahulu.'); return; }

  var rows = $('.kombelkelola-upload-row');
  if (rows.length === 0) { Sultan.alert('warning','Perhatian','Tambahkan minimal satu dokumen.'); return; }

  var payloads = [];
  var valid = true;
  rows.each(function() {
    var row = $(this);
    var katSel = row.find('.kombelkelola-kategori-select');
    var katData = KOMBELKELOLA_MASTER_KAT.find(function(k){ return k.idKat === katSel.val(); });
    var tahunInput = row.find('.kombelkelola-tahun-input');
    var periodeInput = row.find('.kombelkelola-periode-input');
    var fileInput = row.find('.kombelkelola-file-input')[0];

    if (!katSel.val()) { Sultan.alert('warning','Perhatian','Pilih kategori dokumen untuk setiap baris.'); valid=false; return false; }
    if (!tahunInput.val()) { Sultan.alert('warning','Perhatian','Isi tahun untuk setiap baris.'); valid=false; return false; }
    if (!fileInput || !fileInput.files[0]) { Sultan.alert('warning','Perhatian','Pilih file untuk setiap baris dokumen.'); valid=false; return false; }

    var periodeVal = "-";
    if (row.find('.kombelkelola-periode-wrapper').is(':visible')) {
      if (periodeInput.hasClass('kombelkelola-periode-input') && periodeInput.is('input,select')) {
        periodeVal = periodeInput.val() || "-";
      } else {
        var mulai = row.find('.kombelkelola-periode-mulai').val() || "";
        var akhir = row.find('.kombelkelola-periode-akhir').val() || "";
        periodeVal = mulai && akhir ? mulai + " - " + akhir : "-";
      }
    }

    payloads.push({
      npsn: npsn, idKat: katSel.val(), namaKat: katData ? katData.namaKat : katSel.val(),
      kelas: selectedKkg,
      tahun: tahunInput.val(), periode: periodeVal,
      uploader: KOMBELKELOLA_USER_AKTIF,
      file: fileInput.files[0]
    });
  });
  if (!valid) return;

  var btn = $('#kombelkelola_btnSimpan'); var btnTxt = btn.html();
  btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-2"></i>MENGUPLOAD...');
  Sultan.notif.loading("Mengunggah dokumen...");

  var idx = 0;
  function uploadNext() {
    if (idx >= payloads.length) {
      Sultan.notif.tutup();
      if (typeof Sultan !== 'undefined' && Sultan.modal) Sultan.modal.tutupForm();
      else $('#global_modalForm').modal('hide');
      btn.prop('disabled', false).html(btnTxt);
      Sultan.notif.crud.simpan(false);
      setTimeout(kombelkelola_tarikDataServer, 400);
      return;
    }
    var p = payloads[idx];
    var reader = new FileReader();
    reader.onload = function(evt) {
      var base64 = evt.target.result.split(',')[1];
      google.script.run.withSuccessHandler(function(json) {
        var res = JSON.parse(json);
        if (!res.success) { Sultan.notif.tutup(); btn.prop('disabled',false).html(btnTxt); Sultan.notif.crud.gagal(res.message); return; }
        idx++; uploadNext();
      }).withFailureHandler(function(err) {
        Sultan.notif.tutup(); btn.prop('disabled',false).html(btnTxt); Sultan.notif.crud.gagal(err.message);
      }).uploadKombelDokumen({ npsn:p.npsn, idKat:p.idKat, namaKat:p.namaKat, kelas:p.kelas, tahun:p.tahun, periode:p.periode, uploader:p.uploader }, base64, p.file.name, p.file.type);
    };
    reader.readAsDataURL(p.file);
  }
  uploadNext();
}

    var acc = accMap[fmt] || (fmt.includes('IMG')?accMap.IMG:fmt.includes('ALL')?accMap.ALL:fmt.includes('EXCEL')?accMap.EXCEL:accMap.PDF);

      }
    } else {
      $('#kombelkelola_p_tahun_wrapper label').html('Tahun <span class="text-danger">*</span>');
      for (var yP2 = nowYP + 2; yP2 >= nowYP - 5; yP2--) {
        pThnOpts += '<option value="' + yP2 + '" ' + (String(d.tahun).trim() === String(yP2) ? 'selected' : '') + '>' + yP2 + '</option>';
      }
    }
    $('#kombelkelola_p_tahun_input').replaceWith('<select id="kombelkelola_p_tahun_input" class="form-control form-control-sultan border-warning" required>' + pThnOpts + '</select>');
  }

  var isEdit = true;
  $('#global_modalFormSize').removeClass('modal-xl modal-lg').addClass('modal-lg');
  $('#global_modalFormHeader').removeClass('modal-header-sultan-primary modal-header-sultan-warning modal-header-sultan-danger modal-header-sultan-success modal-header-sultan-info modal-header-sultan-dark modal-header-edit modal-header-tambah-edit modal-header-hapus').addClass('modal-header-sultan-warning');
  $('#global_modalFormTitle').html('<i class="fas fa-edit mr-2"></i>Perbaiki Dokumen');
  $('#global_modalFormBody, #global_modalFormFooter').hide();
  $('#kombelkelola_formPerbaiki').appendTo('#global_modalFormSize .modal-content');
  $('#global_modalForm').off('hidden.bs.modal.kombelkelola').on('hidden.bs.modal.kombelkelola', function() {
    $('#kombelkelola_formPerbaiki').appendTo('#kombelkelola_templates');
    $('#global_modalFormBody, #global_modalFormFooter').show();
  });
  $('#global_modalForm').modal('show');
}

function kombelkelola_submitPerbaiki(e) {
  e.preventDefault();
  var rowId = $('#kombelkelola_p_rowid').val();
  var tahun = $('#kombelkelola_p_tahun_input').val();
  var periode = $('#kombelkelola_p_periode_input').val() || "-";
  var fileEl = $('#kombelkelola_p_file')[0];
  var btn = $('#kombelkelola_btnSimpanPerbaiki'); var btnTxt = btn.html();
  btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-2"></i>MEMPERBARUI...');
  Sultan.notif.loading("Memperbarui dokumen...");

  var doSubmit = function(b64, fname, ftype) {
    google.script.run.withSuccessHandler(function(json) {
      Sultan.notif.tutup(); btn.prop('disabled',false).html(btnTxt);
      var res = JSON.parse(json);
      if (res.success) {
        if (typeof Sultan !== 'undefined' && Sultan.modal) Sultan.modal.tutupForm();
        else $('#global_modalForm').modal('hide');
        Sultan.notif.crud.simpan(true);
        setTimeout(kombelkelola_tarikDataServer, 400);
      } else { Sultan.notif.crud.gagal(res.message); }
    }).withFailureHandler(function(err) {
      Sultan.notif.tutup(); btn.prop('disabled',false).html(btnTxt); Sultan.notif.crud.gagal(err.message);
    }).perbaikiKombelDokumen(rowId, tahun, periode, b64, fname, ftype, KOMBELKELOLA_USER_AKTIF);
  };

  if (fileEl && fileEl.files[0]) {
    var reader = new FileReader();
    reader.onload = function(evt) { doSubmit(evt.target.result.split(',')[1], fileEl.files[0].name, fileEl.files[0].type); };
    reader.readAsDataURL(fileEl.files[0]);
  } else { doSubmit(null, null, null); }
}

function kombelkelola_bukaModalVerif(rowId) {
  if (!KOMBELKELOLA_IS_ADMIN) { Sultan.alert('warning','Perhatian','Akses verifikasi hanya untuk admin.'); return; }

  $('#kombelkelola_v_tahun').text(d.tahun || "-");

    $('#kombelkelola_prevCatatanWrap').hide();

  $('#kombelkelola_reqCatatan').hide();

  if (st.includes('setuju') || st.includes('ok') || st.includes('valid')) {
    $('#kombelkelola_v_status').val('Disetujui');

    $('#kombelkelola_v_status').val('Revisi');

    $('#kombelkelola_v_catatan').prop('required', true);

  });

    $('#global_verifikasiFooterArea').hide();
  });
}

function kombelkelola_submitVerif(e) {
  e.preventDefault();
  var $form = $(this); if (!$form[0].checkValidity()) { $form.addClass('was-validated'); return; }
  var rowId = $('#kombelkelola_v_rowid').val();
  var status = $('#kombelkelola_v_status').val();
  var catatan = $('#kombelkelola_v_catatan').val();
  if ((status === 'Revisi' || status === 'Ditolak') && !catatan.trim()) { Sultan.alert('warning','Perhatian','Catatan wajib diisi untuk keputusan Revisi/Ditolak.'); return; }
  var btn = $('#kombelkelola_btnVerifikasi'); var btnTxt = btn.html();
  btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-2"></i>MEMVERIFIKASI...');
  google.script.run.withSuccessHandler(function(json) {
    btn.prop('disabled', false).html(btnTxt);
    var res = JSON.parse(json);
    if (res.success) {
      $('#global_modalVerifikasi').modal('hide');
      Sultan.notif.crud.simpan(true);
      setTimeout(kombelkelola_tarikDataServer, 400);
    } else { Sultan.notif.crud.gagal(res.message); }
  }).withFailureHandler(function(err) {
    btn.prop('disabled', false).html(btnTxt); Sultan.notif.crud.gagal(err.message);
  }).verifikasiKombelDokumen(rowId, status, catatan);
}

function kombelkelola_bukaModalHapus(rowId) {
  var d = KOMBELKELOLA_CACHE_DATA.find(function(x){ return x.rowId == rowId; });
  if (!d) return;
  if (typeof Sultan !== 'undefined' && Sultan.modal && Sultan.modal.konfirmasiHapus) {
    Sultan.modal.konfirmasiHapus({
      title: 'HAPUS DOKUMEN KOMUNITAS BELAJAR',
      kode: null,
      detail: { 'SEKOLAH': d.nama_sekolah||d.npsn, 'DOKUMEN': d.nama_kategori||d.id_kategori, 'KELAS': d.kelas||'Umum', 'TAHUN': d.tahun||'-' },
      onConfirm: function() {
        Sultan.notif.loading("Menghapus dokumen...");
        google.script.run.withSuccessHandler(function(json) {
          Sultan.notif.tutup(); var res=JSON.parse(json);
          if (res.success) { Sultan.notif.crud.hapus(); kombelkelola_tarikDataServer(); }
          else Sultan.notif.crud.gagal(res.message);
        }).withFailureHandler(function(err){ Sultan.notif.tutup(); Sultan.notif.crud.gagal(err.message); }).hapusKombelDokumen(rowId);
      }
    });
  }
}

function kombelkelola_bukaPreview(url) {
  if (!url || url === "#") { Sultan.notif.info("URL dokumen tidak tersedia."); return; }
  var finalUrl = url;
  var downloadUrl = "";
  var isGoogleDrive = url.indexOf('drive.google.com') > -1;
  var isImage = url.toLowerCase().endsWith('.jpg') || url.toLowerCase().endsWith('.png') || url.toLowerCase().endsWith('.jpeg');
  
  if (isGoogleDrive) {
    var match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (match && match[1]) {
      finalUrl = 'https://drive.google.com/file/d/' + match[1] + '/preview';
      downloadUrl = 'https://drive.google.com/uc?export=download&id=' + match[1];
    }
  } else {
    downloadUrl = url;
  }

  if (typeof Sultan !== 'undefined' && Sultan.modal && Sultan.modal.preview) {
    Sultan.modal.preview({
      url: finalUrl,
      title: 'Pratinjau Dokumen Komunitas Belajar',
      downloadUrl: downloadUrl,
      isImage: isImage
    });
  } else {
    window.open(finalUrl, '_blank');
  }
}

function kombelkelola_lihatCatatan(pesan) {
  Sultan.alert('info', 'Catatan Admin', pesan);
}

function kombelkelola_bukaModal(tipe, judul) {
  var isEdit = tipe === 'edit';
  $('#global_modalFormSize').removeClass('modal-xl modal-lg').addClass('modal-lg');
  $('#global_modalFormHeader').removeClass('modal-header-sultan-primary modal-header-sultan-warning modal-header-sultan-danger modal-header-sultan-success modal-header-sultan-info modal-header-sultan-dark modal-header-edit modal-header-tambah-edit modal-header-hapus').addClass(isEdit ? 'modal-header-sultan-warning' : 'modal-header-tambah-edit');
  $('#global_modalFormTitle').html('<i class="fas fa-'+(isEdit?'edit':'plus')+' mr-2"></i>'+kombelkelola_esc(judul));
  $('#global_modalFormBody, #global_modalFormFooter').hide();
  $('#kombelkelola_formUpload').appendTo('#global_modalFormSize .modal-content');
  $('#global_modalForm').off('hidden.bs.modal.kombelkelola').on('hidden.bs.modal.kombelkelola', function() {
    $('#kombelkelola_formUpload').appendTo('#kombelkelola_templates');
    $('#global_modalFormBody, #global_modalFormFooter').show();
    $('#kombelkelola_pilih_sekolah_container').show();
  });
  $('#global_modalForm').modal('show');
}

function kombelkelola_esc(t) {
  return t ? String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;') : '';
}
</script>
