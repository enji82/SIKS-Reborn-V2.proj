<section class="content sultan-page-transition">
  <div class="container-fluid">

    <!-- ================================================================
         FILTER BAR UTAMA DASHBOARD E-FILE (TERPUSAT SULTAN UI)
         ================================================================ -->
    <div class="sultan-filter-bar-balanced mb-4 sultan-page-transition" id="efiledash_filterBar">
        <div class="filter-controls-group">
            <!-- Segmented Switcher Mode (Unit vs Rekap / Dokumen) -->
            <div class="sultan-segmented-switch">
                <button type="button" class="sultan-segmented-btn" data-mode="unit" id="efiledash_btnModeUnit">
                    <i class="fas fa-building"></i> Unit
                </button>
                <button type="button" class="sultan-segmented-btn active" data-mode="rekap" id="efiledash_btnModeDokumen">
                    <i class="fas fa-file-alt"></i> Rekap
                </button>
            </div>

            <!-- Kontrol Mode REKAP: Kategori Dokumen -->
            <div class="sultan-filter-item" id="efiledash_filterKategoriContainer">
                <select id="efiledash_filterKategori" class="form-control" aria-label="Pilih Kategori E-File">
                    <option value="">- Memuat Kategori... -</option>
                </select>
                <i class="fas fa-chevron-down"></i>
            </div>

            <!-- Kontrol Tahun / Periode -->
            <div class="sultan-filter-item" id="efiledash_filterTahunContainer">
                <select id="efiledash_filterTahun" class="form-control" aria-label="Pilih Tahun/Periode">
                    <option value="SEMUA">- Semua Tahun -</option>
                </select>
                <i class="fas fa-chevron-down"></i>
            </div>

            <!-- Filter Kategori SKP (hanya muncul untuk jenis SKP) -->
            <div class="sultan-filter-item" id="efiledash_filterKategoriSkpContainer" style="display: none;">
                <select id="efiledash_filterKategoriSkp" class="form-control" aria-label="Pilih Kategori SKP">
                    <option value="SEMUA">- Semua Kategori -</option>
                    <option value="Sasaran">Sasaran</option>
                    <option value="Triwulan 1">Triwulan 1</option>
                    <option value="Triwulan 2">Triwulan 2</option>
                    <option value="Triwulan 3">Triwulan 3</option>
                    <option value="Triwulan 4">Triwulan 4</option>
                    <option value="Tahunan">Tahunan</option>
                </select>
                <i class="fas fa-chevron-down"></i>
            </div>

            <!-- Filter Status Kepegawaian SKP (hanya muncul untuk jenis SKP) -->
            <div class="sultan-filter-item" id="efiledash_filterKepegContainer" style="display: none;">
                <select id="efiledash_filterKepeg" class="form-control" aria-label="Pilih Status Kepegawaian">
                    <option value="SEMUA">- Semua Kepegawaian -</option>
                    <option value="PNS">PNS</option>
                    <option value="CPNS">CPNS</option>
                    <option value="PPPK">PPPK</option>
                    <option value="PPPK Paruh Waktu">PPPK Paruh Waktu</option>
                    <option value="Non ASN">Non ASN</option>
                </select>
                <i class="fas fa-chevron-down"></i>
            </div>

            <!-- Kontrol Mode REKAP/UNIT: Unit Kerja (Filter Admin / Multi Unit) -->
            <div class="sultan-filter-item" id="efiledash_filterUnitContainer" style="display: none;">
                <select id="efiledash_filterUnit" class="form-control" aria-label="Pilih Unit Kerja">
                    <option value="SEMUA">- Semua Unit Kerja -</option>
                </select>
                <i class="fas fa-chevron-down"></i>
            </div>

            <!-- Kontrol Mode UNIT: Dropdown Jenjang (Khusus Admin) -->
            <div class="sultan-filter-item d-none" id="efiledash_filterJenjangUnitContainer">
                <select id="efiledash_filterJenjangUnit" class="form-control" aria-label="Pilih Jenjang">
                    <option value="">Pilih Jenjang...</option>
                </select>
                <i class="fas fa-chevron-down"></i>
            </div>

            <!-- Kontrol Mode UNIT: Satuan Pendidikan (Khusus Admin) -->
            <div class="sultan-filter-item d-none" id="efiledash_filterUnitSekolahContainer" style="min-width: 220px; max-width: 340px;">
                <select id="efiledash_filterUnitSekolah" class="form-control" aria-label="Pilih Sekolah">
                    <option value="">Pilih Sekolah...</option>
                </select>
                <i class="fas fa-chevron-down"></i>
            </div>

            <div class="divider-vertical d-none d-md-block mx-1"></div>

            <!-- Tombol Refresh Terpusat Sesuai Tema Sultan Modern -->
            <button type="button" id="efiledash_btnRefresh" class="sultan-btn-refresh" title="Refresh Data">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <!-- Loading State Terpusat (Standar Sultan UI) -->
    <div id="efiledash_loadingState" class="sultan-loading-box sultan-page-transition">
      <div class="sultan-spinner-icon">
        <i class="fas fa-circle-notch fa-spin"></i>
      </div>
      <h6 class="text-muted font-weight-bold sultan-loading-text mb-0" style="letter-spacing: 0.5px; text-transform: uppercase; font-size: 11px;">Memuat Data Dashboard E-File...</h6>
    </div>

    <!-- ================================================================
         MAIN CONTENT DASHBOARD STATE
         ================================================================ -->
    <div id="efiledash_dashboardState" style="display: none;">

      <!-- Row 1: KPI Summary Cards (Modern Sultan Minimal) -->
      <div id="efiledash_metricRow1"></div>

      <!-- Row 2: Status Breakdown Cards (Modern Sultan Minimal) -->
      <div id="efiledash_metricRow2"></div>

      <!-- Row 3: Lists Sudah Unggah / Belum Unggah -->
      <div id="efiledash_listsContainer"></div>

      <!-- Tabel Rekap Per Unit Kerja (Mode Rekap - Khusus Admin / Multi-Unit) -->
      <div class="row mb-4" id="efiledash_containerTabelUnit" style="display: none;">
        <div class="col-12">
          <div class="card-sultan p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="font-weight-bold text-sultan-utama m-0">
                <i class="fas fa-th mr-2"></i>Rekapitulasi Capaian Per Unit Kerja
              </h6>
            </div>
            <div class="table-responsive sultan-scroll">
              <table class="table table-hover sdn-matriks-table text-center mb-0" id="efiledash_tabelRekap">
                <thead>
                  <tr>
                    <th class="align-middle text-left font-weight-bold sdn-matriks-freeze-col">UNIT KERJA</th>
                    <th class="align-middle">PEGAWAI</th>
                    <th class="align-middle">UNGGAH</th>
                    <th class="align-middle">BELUM</th>
                    <th class="align-middle" style="min-width: 120px;">PROGRES</th>
                    <th class="align-middle">STATUS</th>
                  </tr>
                </thead>
                <tbody id="efiledash_bodyTabelRekap">
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabel Rekap Per Kategori Dokumen di Unit Kerja Terpilih (Mode Unit Kerja) -->
      <div class="row mb-4" id="efiledash_containerTabelSekolah" style="display: none;">
        <div class="col-12">
          <div class="card-sultan p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="font-weight-bold text-sultan-utama m-0">
                <i class="fas fa-th mr-2"></i>Rekapitulasi Capaian Dokumen: <span id="efiledash_lblNamaSekolah">-</span>
              </h6>
            </div>
            <div class="table-responsive sultan-scroll">
              <table class="table table-hover sdn-matriks-table text-center mb-0" id="efiledash_tabelRekapSekolah">
                <thead>
                  <tr>
                    <th class="align-middle text-left font-weight-bold sdn-matriks-freeze-col">KATEGORI DOKUMEN</th>
                    <th class="align-middle">PEGAWAI</th>
                    <th class="align-middle">UNGGAH</th>
                    <th class="align-middle">BELUM</th>
                    <th class="align-middle" style="min-width: 120px;">PROGRES</th>
                    <th class="align-middle">STATUS</th>
                  </tr>
                </thead>
                <tbody id="efiledash_bodyTabelRekapSekolah">
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div><!-- /dashboardState -->

  </div>
</section>

<script>
var EFILEDASH_CACHE_REKAP = [];
var EFILEDASH_CACHE_SUDAH = [];
var EFILEDASH_CACHE_BELUM = [];
var EFILEDASH_LOCAL_STORE = {};
var EFILEDASH_KATEGORI_MAP = [];
var EFILEDASH_PENDING_REQ = 0;
var EFILEDASH_IS_ADMIN = false;
var EFILEDASH_USER_NPSN = "";
var EFILEDASH_UNIT_TERKUNCI = "";
var EFILEDASH_USE_NPSN_FILTER = false;
var EFILEDASH_TAHUN_DEFAULTED = false;
var EFILEDASH_SKP_TAHUN_DEFAULTED = false;
var EFILEDASH_JENIS_PERIODE = "TAHUNAN";
var EFILEDASH_MODE = "rekap"; // 'unit' atau 'rekap'

$(document).ready(function() {
    // 1. Inisialisasi Dual Mode Terpusat melalui SultanDashboard Engine
    var dashState = SultanDashboard.initDualMode({
        pageKey: 'efiledash',
        unitViewId: '#efiledash_dashboardState',
        rekapViewId: '#efiledash_dashboardState',
        switchSelector: '.sultan-segmented-btn',
        onInit: function(state) {
            EFILEDASH_IS_ADMIN = state.isAdmin;
            EFILEDASH_USER_NPSN = state.userNpsn;
            EFILEDASH_MODE = state.currentMode;
        },
        onSwitchMode: function(mode, state, isFirstLoad) {
            EFILEDASH_MODE = mode;
            efiledash_setDashboardMode(mode);
        }
    });

    // 2. Render komponen UI Terpusat via SultanUI Engine
    if (typeof SultanUI !== 'undefined') {
        $('#efiledash_metricRow1').html(SultanUI.renderDashboardRow1Minimal('efiledash', { total: 'TARGET SASARAN', sudah: 'SUDAH UNGGAH', belum: 'BELUM UNGGAH', progress: 'CAPAIAN PROGRES' }));
        $('#efiledash_metricRow2').html(SultanUI.renderDashboardRow2Minimal('efiledash'));
        $('#efiledash_listsContainer').html(SultanUI.renderDashboardStatusCards4('efiledash', {
            title: 'DAFTAR PTK SUDAH UNGGAH',
            hasWaButton: true,
            placeholderCari: 'Cari nama PTK...'
        }));

        SultanUI.startLottery('#efiledash_cardTotalSekolah, #efiledash_cardSudah, #efiledash_cardBelum, #efiledash_cardTotalDokumen, #efiledash_cardDiproses, #efiledash_cardDisetujui, #efiledash_cardRevisi, #efiledash_cardDitolak', 3);
        SultanUI.startLottery('#efiledash_cardProgress', 2, '%');
    }

    // 3. Event Listeners
    $(document).off('click', '#efiledash_btnRefresh').on('click', '#efiledash_btnRefresh', function() {
        if (EFILEDASH_MODE === "rekap") {
            var k = $('#efiledash_filterKategori').val();
            if (k !== "" && k != null) efiledash_loadDataKategori(k, true);
        } else {
            var u = $('#efiledash_filterUnit').val();
            if (u !== "SEMUA" && u !== "") efiledash_loadDataSekolahLengkap(u);
        }
    });

    $(document).off('change', '#efiledash_filterKategori').on('change', '#efiledash_filterKategori', function() {
        var k = $(this).val();
        if (k) efiledash_loadDataKategori(k);
    });

    $(document).off('change', '#efiledash_filterTahun, #efiledash_filterUnit, #efiledash_filterKategoriSkp, #efiledash_filterKepeg').on('change', '#efiledash_filterTahun, #efiledash_filterUnit, #efiledash_filterKategoriSkp, #efiledash_filterKepeg', function() {
        if (EFILEDASH_MODE === "rekap") {
            efiledash_terapkanFilterLokal();
        } else {
            var u = $('#efiledash_filterUnit').val();
            if (u !== "SEMUA" && u !== "") {
                efiledash_loadDataSekolahLengkap(u);
            } else {
                $('#efiledash_containerTabelSekolah').hide();
            }
        }
    });

    $(document).off('click', '#efiledash_btnSalinWa').on('click', '#efiledash_btnSalinWa', efiledash_salinKeWA);

    // Filter cari untuk 4 kartu status PTK
    $(document).off('keyup', '#efiledash_inputCariDisetujui').on('keyup', '#efiledash_inputCariDisetujui', function() {
        var val = $(this).val().toLowerCase();
        $('#efiledash_listDisetujui .efiledash-item-disetujui').filter(function() {
            $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
        });
    });
    $(document).off('keyup', '#efiledash_inputCariDiproses').on('keyup', '#efiledash_inputCariDiproses', function() {
        var val = $(this).val().toLowerCase();
        $('#efiledash_listDiproses .efiledash-item-diproses').filter(function() {
            $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
        });
    });
    $(document).off('keyup', '#efiledash_inputCariRevisi').on('keyup', '#efiledash_inputCariRevisi', function() {
        var val = $(this).val().toLowerCase();
        $('#efiledash_listRevisi .efiledash-item-revisi').filter(function() {
            $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
        });
    });
    $(document).off('keyup', '#efiledash_inputCariDitolak').on('keyup', '#efiledash_inputCariDitolak', function() {
        var val = $(this).val().toLowerCase();
        $('#efiledash_listDitolak .efiledash-item-ditolak').filter(function() {
            $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
        });
    });

    // 4. Inisialisasi Akses Data Terpusat
    efiledash_initMasterAccess();
});

function efiledash_initMasterAccess() {
    var targetNpsn = EFILEDASH_IS_ADMIN ? "" : EFILEDASH_USER_NPSN;

    if (!EFILEDASH_IS_ADMIN && !EFILEDASH_USER_NPSN) {
        if (typeof SultanUI !== 'undefined') {
            SultanUI.showLoadingError('#efiledash_loadingState', 'Akses Ditolak: Sesi login pengguna tidak valid.');
        } else {
            $('#efiledash_loadingState').html('<span class="text-danger">Akses Ditolak: Sesi login tidak valid.</span>');
        }
        return;
    }

    google.script.run.withSuccessHandler(function(json) {
        var res = JSON.parse(json);
        if (!res.success) {
            if (typeof SultanUI !== 'undefined') {
                SultanUI.showLoadingError('#efiledash_loadingState', res.message || 'Gagal memuat data master e-file.');
            }
            return;
        }

        EFILEDASH_KATEGORI_MAP = (res.kategori || []).filter(function(k) { return k.sheetRekap; });
        if (EFILEDASH_KATEGORI_MAP.length === 0) {
            if (typeof SultanUI !== 'undefined') {
                SultanUI.showLoadingError('#efiledash_loadingState', 'Belum ada Kategori Dokumen yang berintegrasi ke Dashboard.');
            }
            return;
        }

        if (!EFILEDASH_IS_ADMIN) {
            if (res.myUnit) {
                EFILEDASH_UNIT_TERKUNCI = res.myUnit;
                EFILEDASH_USE_NPSN_FILTER = false;
                $('#efiledash_filterUnitContainer').show();
                $('#efiledash_filterUnit').empty().append($('<option>', { value: EFILEDASH_USER_NPSN, text: EFILEDASH_UNIT_TERKUNCI })).prop('disabled', true);
            } else {
                EFILEDASH_USE_NPSN_FILTER = true;
                EFILEDASH_UNIT_TERKUNCI = "";
                $('#efiledash_filterUnitContainer').show();
                $('#efiledash_filterUnit').empty().append($('<option>', { value: "SEMUA", text: '- Semua Unit Kerja Anda -' })).prop('disabled', false);
            }
        } else {
            $('#efiledash_filterUnitContainer').show();
            var selectUnit = $('#efiledash_filterUnit');
            selectUnit.empty().append('<option value="SEMUA">- Semua Unit Kerja -</option>');
            if (res.listUnit && res.listUnit.length > 0) {
                res.listUnit.forEach(function(uItem) {
                    selectUnit.append($('<option>', { value: uItem.unit, text: uItem.unit }));
                });
            }
            selectUnit.prop('disabled', false);
        }

        // Dropdown tahun default
        var selectTahun = $('#efiledash_filterTahun');
        selectTahun.empty().append('<option value="SEMUA">- Semua Tahun -</option>');
        var currentYear = new Date().getFullYear();
        for (var y = currentYear; y >= currentYear - 4; y--) {
            selectTahun.append('<option value="' + y + '">' + y + '</option>');
        }
        selectTahun.val(currentYear);

        var selectKat = $('#efiledash_filterKategori');
        selectKat.empty();
        EFILEDASH_KATEGORI_MAP.forEach(function(k) {
            selectKat.append($('<option>', { value: k.sheetRekap, text: k.namaKategori }));
        });
        
        efiledash_setDashboardMode(EFILEDASH_MODE);

        if (typeof SultanUI !== 'undefined') {
            SultanUI.hideLoading('#efiledash_loadingState');
        } else {
            $('#efiledash_loadingState').hide();
        }
        $('#efiledash_dashboardState').show();

    }).withFailureHandler(function(err) {
        if (typeof SultanUI !== 'undefined') {
            SultanUI.showLoadingError('#efiledash_loadingState', 'Koneksi Terputus: ' + (err.message || err));
        }
    }).getEfileDashboardInit(targetNpsn);
}

function efiledash_loadDataKategori(idKategori, forceRefresh) {
    if (EFILEDASH_PENDING_REQ > 0) return;
    forceRefresh = !!forceRefresh;

    var mapData = EFILEDASH_KATEGORI_MAP.find(k => k.sheetRekap === idKategori);
    if (!mapData) return;

    // Cache Client-side jika ada dan bukan forceRefresh
    if (!forceRefresh && EFILEDASH_LOCAL_STORE[idKategori]) {
        var cached = EFILEDASH_LOCAL_STORE[idKategori];
        $('#efiledash_lblTableKategori').text(mapData.namaKategori);

        EFILEDASH_JENIS_PERIODE = cached.jenisPeriode || "TAHUNAN";
        EFILEDASH_CACHE_REKAP = cached.rekap || [];
        EFILEDASH_CACHE_SUDAH = cached.sudah || [];
        EFILEDASH_CACHE_BELUM = cached.belum || [];

        EFILEDASH_TAHUN_DEFAULTED = false;
        EFILEDASH_SKP_TAHUN_DEFAULTED = false;
        $('#efiledash_filterKategoriSkp').val('SEMUA');
        $('#efiledash_filterKepeg').val('SEMUA');

        if (EFILEDASH_IS_ADMIN || EFILEDASH_USE_NPSN_FILTER) efiledash_initDropdownUnit();
        efiledash_initDropdownTahun();
        efiledash_terapkanFilterLokal();

        if (typeof SultanUI !== 'undefined') {
            SultanUI.hideLoading('#efiledash_loadingState');
        } else {
            $('#efiledash_loadingState').hide();
        }
        $('#efiledash_dashboardState').show();
        return;
    }

    EFILEDASH_PENDING_REQ = 1;
    var btn = $('#efiledash_btnRefresh');
    btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin text-maroon"></i>');
    $('#efiledash_filterKategori, #efiledash_filterTahun, #efiledash_filterUnit, #efiledash_filterKategoriSkp, #efiledash_filterKepeg').prop('disabled', true);

    $('#efiledash_lblTableKategori').text(mapData.namaKategori);

    $('#efiledash_dashboardState').show();
    if (typeof SultanUI !== 'undefined') {
        SultanUI.startLottery('#efiledash_cardTotalSekolah, #efiledash_cardSudah, #efiledash_cardBelum, #efiledash_cardTotalDokumen, #efiledash_cardDiproses, #efiledash_cardDisetujui, #efiledash_cardRevisi, #efiledash_cardDitolak', 3);
        SultanUI.startLottery('#efiledash_cardProgress', 2, '%');
    }

    google.script.run.withSuccessHandler(function(jsonStr) {
        EFILEDASH_PENDING_REQ = 0;
        btn.prop('disabled', false).html('<i class="fas fa-sync-alt"></i>');
        $('#efiledash_filterKategori, #efiledash_filterTahun, #efiledash_filterKategoriSkp, #efiledash_filterKepeg').prop('disabled', false);
        if (EFILEDASH_IS_ADMIN || EFILEDASH_USE_NPSN_FILTER) $('#efiledash_filterUnit').prop('disabled', false);

        var data = JSON.parse(jsonStr);
        if (!data.success) {
            if (typeof SultanUI !== 'undefined') {
                SultanUI.showLoadingError('#efiledash_loadingState', data.message || 'Gagal mengambil data kategori.');
            }
            return;
        }

        EFILEDASH_LOCAL_STORE[idKategori] = data;

        EFILEDASH_JENIS_PERIODE = data.jenisPeriode || "TAHUNAN";
        EFILEDASH_CACHE_REKAP = data.rekap || [];
        EFILEDASH_CACHE_SUDAH = data.sudah || [];
        EFILEDASH_CACHE_BELUM = data.belum || [];

        EFILEDASH_TAHUN_DEFAULTED = false;
        EFILEDASH_SKP_TAHUN_DEFAULTED = false;
        $('#efiledash_filterKategoriSkp').val('SEMUA');
        $('#efiledash_filterKepeg').val('SEMUA');

        if (EFILEDASH_IS_ADMIN || EFILEDASH_USE_NPSN_FILTER) efiledash_initDropdownUnit();
        efiledash_initDropdownTahun();
        efiledash_terapkanFilterLokal();

        if (typeof SultanUI !== 'undefined') {
            SultanUI.hideLoading('#efiledash_loadingState');
        } else {
            $('#efiledash_loadingState').hide();
        }
        $('#efiledash_dashboardState').show();

    }).withFailureHandler(function(err) {
        EFILEDASH_PENDING_REQ = 0;
        btn.prop('disabled', false).html('<i class="fas fa-sync-alt"></i>');
        $('#efiledash_filterKategori').prop('disabled', false);
        if (typeof SultanUI !== 'undefined') {
            SultanUI.showLoadingError('#efiledash_loadingState', 'Koneksi Terputus: ' + (err.message || err));
        }
    }).getEfileDashboardData(mapData.sheetRekap, mapData.sheetLapor, forceRefresh);
}

function efiledash_initDropdownUnit() {
    var unique = new Set();
    var npsnUser = String(EFILEDASH_USER_NPSN || "").trim().toUpperCase();
    EFILEDASH_CACHE_REKAP.forEach(function(r) {
        var u = String(r.unit || "").trim();
        if (u) {
            if (EFILEDASH_IS_ADMIN) unique.add(u);
            else if (EFILEDASH_USE_NPSN_FILTER && String(r.npsn || "").trim().toUpperCase() === npsnUser) unique.add(u);
        }
    });
    var sorted = Array.from(unique).sort();
    var select = $('#efiledash_filterUnit');
    var curVal = select.val();
    var labelSemua = EFILEDASH_IS_ADMIN ? "- Semua Unit Kerja -" : "- Semua Unit Kerja Anda -";
    select.empty().append('<option value="SEMUA">' + labelSemua + '</option>');
    sorted.forEach(function(u) { select.append('<option value="' + efiledash_esc(u) + '">' + efiledash_esc(u) + '</option>'); });
    if (curVal && unique.has(curVal)) select.val(curVal);
}

function efiledash_initDropdownTahun() {
    var uniqueTahun = new Set();
    
    // SKP: ambil nilai TAHUN dari period key
    if (EFILEDASH_JENIS_PERIODE === "SKP") {
        var validSkpParts = ["Triwulan 1", "Triwulan 2", "Triwulan 3", "Triwulan 4", "Tahunan"];
        EFILEDASH_CACHE_REKAP.concat(EFILEDASH_CACHE_BELUM).forEach(function(r) {
            var thn = String(r.tahun || "").trim();
            var parts = thn.split(" ");
            var year = parseInt(parts[parts.length - 1]);
            var kategori = parts.slice(0, parts.length - 1).join(" ");
            if (year > 2000 && validSkpParts.indexOf(kategori) !== -1) {
                uniqueTahun.add(String(year));
            }
        });
        
        var selectSkp = $('#efiledash_filterTahun');
        var curValSkp = selectSkp.val();
        selectSkp.empty().append('<option value="SEMUA">- Semua Tahun -</option>');
        
        var sortedSkp = Array.from(uniqueTahun).sort(function(a, b) { return parseInt(b) - parseInt(a); });
        sortedSkp.forEach(function(t) { selectSkp.append('<option value="' + efiledash_esc(t) + '">' + efiledash_esc(t) + '</option>'); });
        if (!EFILEDASH_SKP_TAHUN_DEFAULTED && sortedSkp.length > 0) {
            selectSkp.val(sortedSkp[0]);
            EFILEDASH_SKP_TAHUN_DEFAULTED = true;
        } else if (curValSkp && (curValSkp === "SEMUA" || uniqueTahun.has(curValSkp))) {
            selectSkp.val(curValSkp);
        }
        
        $('#efiledash_filterKategoriSkpContainer').show();
        $('#efiledash_filterKepegContainer').show();
        return;
    }
    
    $('#efiledash_filterKategoriSkpContainer').hide();
    $('#efiledash_filterKategoriSkp').val('SEMUA');
    $('#efiledash_filterKepegContainer').hide();
    $('#efiledash_filterKepeg').val('SEMUA');
    
    EFILEDASH_CACHE_REKAP.concat(EFILEDASH_CACHE_BELUM).forEach(function(r) {
        var thn = String(r.tahun || "").trim();
        if (thn && thn !== "-") uniqueTahun.add(thn);
    });
    var select = $('#efiledash_filterTahun');
    var curVal = select.val();
    
    var labelSemua = "- Semua Tahun -";
    if (EFILEDASH_JENIS_PERIODE === "PERMANEN") {
        labelSemua = "- Permanen (Semua Waktu) -";
    } else if (EFILEDASH_JENIS_PERIODE === "SK_KP") {
        labelSemua = "- Semua Pangkat -";
    } else if (EFILEDASH_JENIS_PERIODE === "SK_JF") {
        labelSemua = "- Semua Jenjang -";
    } else if (EFILEDASH_JENIS_PERIODE === "IJAZAH") {
        labelSemua = "- Semua Pendidikan -";
    }
    
    select.empty().append('<option value="SEMUA">' + labelSemua + '</option>');
    
    var sorted = Array.from(uniqueTahun);
    sorted.sort(function(a, b) {
        var yA = 0, yB = 0;
        var pA = a.split(" "), pB = b.split(" ");
        
        if (EFILEDASH_JENIS_PERIODE === "PERIODE") {
            yA = parseInt(pA[1] || pA[0] || 0); yB = parseInt(pB[1] || pB[0] || 0);
            if (yA !== yB) return yB - yA;
            var mapBulan = {"Jan":1, "Feb":2, "Mar":3, "Apr":4, "Mei":5, "Jun":6, "Jul":7, "Agu":8, "Sep":9, "Okt":10, "Nov":11, "Des":12};
            return (mapBulan[pB[0]] || 0) - (mapBulan[pA[0]] || 0);
        } else if (EFILEDASH_JENIS_PERIODE === "TRIWULAN") {
            yA = parseInt(pA[2] || 0); yB = parseInt(pB[2] || 0);
            if (yA !== yB) return yB - yA;
            var mapTw = {"Triwulan 1":1, "Triwulan 2":2, "Triwulan 3":3, "Triwulan 4":4};
            var twAStr = pA[0] + " " + pA[1], twBStr = pB[0] + " " + pB[1];
            return (mapTw[twBStr] || 0) - (mapTw[twAStr] || 0);
        } else if (EFILEDASH_JENIS_PERIODE === "SKP") {
            yA = parseInt(pA[2] || pA[1] || 0); yB = parseInt(pB[2] || pB[1] || 0);
            if (yA !== yB) return yB - yA;
            var mapSkp = {"Triwulan 1":1, "Triwulan 2":2, "Triwulan 3":3, "Triwulan 4":4, "Tahunan":5};
            var skpA = pA[0] === "Tahunan" ? "Tahunan" : (pA[0] + " " + pA[1]);
            var skpB = pB[0] === "Tahunan" ? "Tahunan" : (pB[0] + " " + pB[1]);
            return (mapSkp[skpB] || 0) - (mapSkp[skpA] || 0);
        } else if (EFILEDASH_JENIS_PERIODE === "SK_PPPK") {
            yA = parseInt(pA[2] || 0); yB = parseInt(pB[2] || 0);
            if (yA !== yB) return yB - yA;
            var mapPppk = {"SK Pertama":1, "SK Kedua":2, "SK Ketiga":3, "SK Keempat":4, "SK Kelima":5};
            return (mapPppk[pB[0] + " " + pB[1]] || 0) - (mapPppk[pA[0] + " " + pA[1]] || 0);
        } else if (EFILEDASH_JENIS_PERIODE === "SK_KP") {
            yA = parseInt(pA[1] || 0); yB = parseInt(pB[1] || 0);
            if (yA !== yB) return yB - yA;
            var mapKp = {"II/a":1,"II/b":2,"II/c":3,"II/d":4,"III/a":5,"III/b":6,"III/c":7,"III/d":8,"IV/a":9,"IV/b":10,"IV/c":11,"IV/d":12};
            return (mapKp[pB[0]] || 0) - (mapKp[pA[0]] || 0);
        } else if (EFILEDASH_JENIS_PERIODE === "SK_JF") {
            yA = parseInt(pA[3] || 0); yB = parseInt(pB[3] || 0);
            if (yA !== yB) return yB - yA;
            var mapJf = {"Guru Ahli Pertama":1, "Guru Ahli Muda":2, "Guru Ahli Madya":3};
            var jfA = pA[0] + " " + pA[1] + " " + pA[2];
            var jfB = pB[0] + " " + pB[1] + " " + pB[2];
            return (mapJf[jfB] || 0) - (mapJf[jfA] || 0);
        } else if (EFILEDASH_JENIS_PERIODE === "IJAZAH") {
            yA = parseInt(pA[1] || 0); yB = parseInt(pB[1] || 0);
            if (yA !== yB) return yB - yA;
            var mapEdu = {"SD":1,"SMP":2,"SMA":3,"D2":4,"D3":5,"D4":6,"S1":7,"S2":8,"S3":9};
            return (mapEdu[pB[0]] || 0) - (mapEdu[pA[0]] || 0);
        } else {
            var na = parseInt(a, 10), nb = parseInt(b, 10);
            if (!isNaN(na) && !isNaN(nb)) return nb - na;
            return String(b).localeCompare(String(a));
        }
    });
    
    sorted.forEach(function(t) { select.append('<option value="' + efiledash_esc(t) + '">' + efiledash_esc(t) + '</option>'); });
    
    if (!EFILEDASH_TAHUN_DEFAULTED && sorted.length > 0) {
        var defaultVal = "SEMUA";
        var namaKategoriUpper = String($('#efiledash_filterKategori option:selected').text() || "").toUpperCase();
        var currentYearStr = String(new Date().getFullYear());
        var lastYearStr = String(new Date().getFullYear() - 1);
        
        if (namaKategoriUpper.includes("SKP AWAL") || 
            namaKategoriUpper.includes("KP4") || 
            namaKategoriUpper.includes("KGB") || 
            namaKategoriUpper.includes("MUTASI") || 
            namaKategoriUpper.includes("PLT") || 
            namaKategoriUpper.includes("TUGAS RANGKAP")) {
            
            var yearFound = sorted.find(function(t) { return String(t).includes(currentYearStr); });
            if (yearFound) defaultVal = yearFound;
        } else if (namaKategoriUpper.includes("PAK") || 
                 namaKategoriUpper.includes("BUKTI PENERIMAAN") || 
                 namaKategoriUpper.includes("RECEIPT") || 
                 namaKategoriUpper.includes("BPE")) {
            
            var lastYearFound = sorted.find(function(t) { return String(t).includes(lastYearStr); });
            if (lastYearFound) defaultVal = lastYearFound;
        }
        
        select.val(defaultVal);
        EFILEDASH_TAHUN_DEFAULTED = true;
    } else if (curVal && (curVal === "SEMUA" || uniqueTahun.has(curVal))) {
        select.val(curVal);
    }
}

function efiledash_rowMatchesUnit(r, fUnitAdmin) {
    if (fUnitAdmin === "SEMUA" || fUnitAdmin === "") {
        if (EFILEDASH_USE_NPSN_FILTER && !EFILEDASH_IS_ADMIN) {
            var npsnUser = String(EFILEDASH_USER_NPSN || "").trim().toUpperCase();
            if (String(r.npsn || "").trim().toUpperCase() === npsnUser) return true;
            return false;
        }
        return true;
    }
    return String(r.unit || "").trim().toUpperCase() === fUnitAdmin;
}

function efiledash_getRekapForMetrics(dataRekap, fTahun) {
    if (fTahun === "SEMUA" || fTahun === "") return dataRekap;
    var maxTahun = "";
    
    if (EFILEDASH_JENIS_PERIODE === "PERIODE") {
        var mapBulan = {"Jan":1, "Feb":2, "Mar":3, "Apr":4, "Mei":5, "Jun":6, "Jul":7, "Agu":8, "Sep":9, "Okt":10, "Nov":11, "Des":12};
        var maxYA = 0, maxBA = 0;
        dataRekap.forEach(function(r) {
            var t = String(r.tahun || "").trim(); var parts = t.split(" ");
            var yA = parseInt(parts[1] || parts[0] || 0); var bA = mapBulan[parts[0]] || 0;
            if (yA > maxYA || (yA === maxYA && bA > maxBA)) { maxYA = yA; maxBA = bA; maxTahun = t; }
        });
    } else if (EFILEDASH_JENIS_PERIODE === "TRIWULAN") {
        var mapTw = {"Triwulan 1":1, "Triwulan 2":2, "Triwulan 3":3, "Triwulan 4":4};
        var maxYA = 0, maxTWA = 0;
        dataRekap.forEach(function(r) {
            var t = String(r.tahun || "").trim(); var parts = t.split(" ");
            var yA = parseInt(parts[2] || 0); var twStr = parts[0] + " " + parts[1]; var twVal = mapTw[twStr] || 0;
            if (yA > maxYA || (yA === maxYA && twVal > maxTWA)) { maxYA = yA; maxTWA = twVal; maxTahun = t; }
        });
    } else if (EFILEDASH_JENIS_PERIODE === "SKP") {
        var mapSkp = {"Sasaran":1, "Triwulan 1":2, "Triwulan 2":3, "Triwulan 3":4, "Triwulan 4":5, "Tahunan":6};
        var maxYA = 0, maxSKPA = 0;
        dataRekap.forEach(function(r) {
            var t = String(r.tahun || "").trim(); var parts = t.split(" ");
            var yA = parseInt(parts[2] || parts[1] || 0);
            var skpStr = parts[0] === "Tahunan" || parts[0] === "Sasaran" ? parts[0] : (parts[0] + " " + parts[1]);
            var skpVal = mapSkp[skpStr] || 0;
            if (yA > maxYA || (yA === maxYA && skpVal > maxSKPA)) { maxYA = yA; maxSKPA = skpVal; maxTahun = t; }
        });
    } else if (EFILEDASH_JENIS_PERIODE === "SK_PPPK") {
        var mapPppk = {"SK Pertama":1, "SK Kedua":2, "SK Ketiga":3, "SK Keempat":4, "SK Kelima":5};
        var maxYA = 0, maxPPPA = 0;
        dataRekap.forEach(function(r) {
            var t = String(r.tahun || "").trim(); var parts = t.split(" ");
            var yA = parseInt(parts[2] || 0); var pppkStr = parts[0] + " " + parts[1]; var pppkVal = mapPppk[pppkStr] || 0;
            if (yA > maxYA || (yA === maxYA && pppkVal > maxPPPA)) { maxYA = yA; maxPPPA = pppkVal; maxTahun = t; }
        });
    } else if (EFILEDASH_JENIS_PERIODE === "SK_KP") {
        var mapKp = {"II/a":1,"II/b":2,"II/c":3,"II/d":4,"III/a":5,"III/b":6,"III/c":7,"III/d":8,"IV/a":9,"IV/b":10,"IV/c":11,"IV/d":12};
        var maxYA = 0, maxKPA = 0;
        dataRekap.forEach(function(r) {
            var t = String(r.tahun || "").trim(); var parts = t.split(" ");
            var yA = parseInt(parts[1] || 0); var kpStr = parts[0]; var kpVal = mapKp[kpStr] || 0;
            if (yA > maxYA || (yA === maxYA && kpVal > maxKPA)) { maxYA = yA; maxKPA = kpVal; maxTahun = t; }
        });
    } else if (EFILEDASH_JENIS_PERIODE === "SK_JF") {
        var mapJf = {"Guru Ahli Pertama":1, "Guru Ahli Muda":2, "Guru Ahli Madya":3};
        var maxYA = 0, maxJFA = 0;
        dataRekap.forEach(function(r) {
            var t = String(r.tahun || "").trim(); var parts = t.split(" ");
            var yA = parseInt(parts[3] || 0); var jfStr = parts[0] + " " + parts[1] + " " + parts[2]; var jfVal = mapJf[jfStr] || 0;
            if (yA > maxYA || (yA === maxYA && jfVal > maxJFA)) { maxYA = yA; maxJFA = jfVal; maxTahun = t; }
        });
    } else if (EFILEDASH_JENIS_PERIODE === "IJAZAH") {
        var mapEdu = {"SD":1,"SMP":2,"SMA":3,"D2":4,"D3":5,"D4":6,"S1":7,"S2":8,"S3":9};
        var maxYA = 0, maxEduA = 0;
        dataRekap.forEach(function(r) {
            var t = String(r.tahun || "").trim(); var parts = t.split(" ");
            var yA = parseInt(parts[1] || 0); var eduStr = parts[0]; var eduVal = mapEdu[eduStr] || 0;
            if (yA > maxYA || (yA === maxYA && eduVal > maxEduA)) { maxYA = yA; maxEduA = eduVal; maxTahun = t; }
        });
    } else {
        var maxNum = -Infinity;
        dataRekap.forEach(function(r) {
            var t = String(r.tahun || "").trim(); var n = parseInt(t, 10);
            if (!isNaN(n)) { if (n > maxNum) { maxNum = n; maxTahun = t; } }
            else if (t && (!maxTahun || t.localeCompare(maxTahun) > 0)) { maxTahun = t; }
        });
    }
    if (!maxTahun) return dataRekap;
    return dataRekap.filter(function(r) { return String(r.tahun || "").trim() === maxTahun; });
}

function efiledash_terapkanFilterLokal() {
    var fUnit = String($('#efiledash_filterUnit').val() || "SEMUA").trim().toUpperCase();
    var fTahun = String($('#efiledash_filterTahun').val() || "").trim();
    var fTahunUp = fTahun.toUpperCase();

    var resolvedTahun = fTahunUp;
    
    // SKP: filter kombinasi Tahun + Kategori SKP
    if (EFILEDASH_JENIS_PERIODE === "SKP") {
        var fKatSkp = String($('#efiledash_filterKategoriSkp').val() || "SEMUA").trim();
        var fKepeg = String($('#efiledash_filterKepeg').val() || "SEMUA").trim().toUpperCase();
        var validSkpParts = ["Sasaran", "Triwulan 1", "Triwulan 2", "Triwulan 3", "Triwulan 4", "Tahunan"];
        
        var resolvedTahunSkp = fTahunUp;
        
        function passFiltSkp(r) {
            if (!efiledash_rowMatchesUnit(r, fUnit)) return false;
            var thn = String(r.tahun || "").trim();
            var parts = thn.split(" ");
            var year = String(parseInt(parts[parts.length - 1]) || 0);
            var kategori = parts[0] === "Tahunan" || parts[0] === "Sasaran" ? parts[0] : parts.slice(0, parts.length - 1).join(" ");
            if (validSkpParts.indexOf(kategori) === -1) return false;
            
            if (resolvedTahunSkp !== "SEMUA" && resolvedTahunSkp !== "" && year !== resolvedTahunSkp) return false;
            if (fKatSkp !== "SEMUA" && fKatSkp !== "" && kategori !== fKatSkp) return false;
            if (fKepeg !== "SEMUA" && fKepeg !== "") {
                var rKepeg = String(r.statusPeg || "").trim().toUpperCase();
                if (rKepeg !== fKepeg) return false;
            }
            return true;
        }
        
        var filterRekap = EFILEDASH_CACHE_REKAP.filter(passFiltSkp);
        var filterSudah = EFILEDASH_CACHE_SUDAH.filter(passFiltSkp);
        var filterBelum = EFILEDASH_CACHE_BELUM.filter(passFiltSkp);
        
        if (EFILEDASH_IS_ADMIN) { $('#efiledash_filterUnitContainer').show(); } else { $('#efiledash_filterUnitContainer').hide(); }
        $('#efiledash_filterTahunContainer').show();
        
        efiledash_renderDashboard(filterRekap, filterSudah, filterBelum, resolvedTahunSkp);
        return;
    }
    
    function passFilt(r) {
        if (!efiledash_rowMatchesUnit(r, fUnit)) return false;
        if (resolvedTahun !== "SEMUA" && resolvedTahun !== "" && String(r.tahun || "").trim().toUpperCase() !== resolvedTahun) return false;
        return true;
    }

    var filterRekap = EFILEDASH_CACHE_REKAP.filter(passFilt);
    var filterSudah = EFILEDASH_CACHE_SUDAH.filter(passFilt);
    var filterBelum = EFILEDASH_CACHE_BELUM.filter(passFilt);

    if (EFILEDASH_IS_ADMIN) {
        $('#efiledash_filterUnitContainer').show();
    } else {
        $('#efiledash_filterUnitContainer').hide();
    }

    if (EFILEDASH_JENIS_PERIODE === "PERMANEN") {
        $('#efiledash_filterTahunContainer').hide();
    } else {
        $('#efiledash_filterTahunContainer').show();
    }

    efiledash_renderDashboard(filterRekap, filterSudah, filterBelum, resolvedTahun);
}

function efiledash_renderDashboard(dataRekap, dataSudah, dataBelum, fTahun) {
    if (fTahun === "SEMUA") {
        var mapPtkSudah = {};
        var mapPtkBelum = {};
        
        dataSudah.forEach(function(s) {
            var key = String(s.nip || s.nama).trim().toUpperCase();
            if (!mapPtkSudah[key]) {
                mapPtkSudah[key] = {
                    nama: s.nama,
                    nip: s.nip,
                    unit: s.unit,
                    tahun: "Semua Periode",
                    npsn: s.npsn,
                    status: s.status || "Diproses"
                };
            }
        });
        
        dataBelum.forEach(function(b) {
            var key = String(b.nip || b.nama).trim().toUpperCase();
            if (!mapPtkSudah[key] && !mapPtkBelum[key]) {
                mapPtkBelum[key] = {
                    nama: b.nama,
                    nip: b.nip,
                    unit: b.unit,
                    tahun: "Semua Periode",
                    npsn: b.npsn
                };
            }
        });
        
        dataSudah = Object.values(mapPtkSudah);
        dataBelum = Object.values(mapPtkBelum);
    }

    var rekapMetrics = efiledash_getRekapForMetrics(dataRekap, fTahun);
    
    if (EFILEDASH_IS_ADMIN) {
        $('#efiledash_containerTabelUnit').show();
        var mapUnit = {};
        
        dataSudah.forEach(function(s) {
            var uni = s.unit || "Lainnya";
            if (!mapUnit[uni]) { mapUnit[uni] = { jml: 0, sudah: 0, belum: 0 }; }
            mapUnit[uni].sudah++;
            mapUnit[uni].jml++;
        });
        dataBelum.forEach(function(b) {
            var uni = b.unit || "Lainnya";
            if (!mapUnit[uni]) { mapUnit[uni] = { jml: 0, sudah: 0, belum: 0 }; }
            mapUnit[uni].belum++;
            mapUnit[uni].jml++;
        });

        if ($.fn.DataTable.isDataTable('#efiledash_tabelRekap')) {
            $('#efiledash_tabelRekap').DataTable().destroy();
        }

        var tbodyHtml = '';
        var listSortedUnit = Object.keys(mapUnit).map(function(uni) {
            var jmlPtk = mapUnit[uni].jml;
            var unggah = mapUnit[uni].sudah;
            var belum = mapUnit[uni].belum;
            var capaian = jmlPtk > 0 ? Math.round((unggah / jmlPtk) * 100) : 0;
            return { uni: uni, jml: jmlPtk, sudah: unggah, belum: belum, capaian: capaian };
        }).sort(function(a, b) {
            return a.capaian - b.capaian;
        });

        listSortedUnit.forEach(function(item) {
            var uni = item.uni;
            var jmlPtk = item.jml;
            var unggah = item.sudah;
            var belum = item.belum;
            var capaian = item.capaian;
            
            var dispJml = jmlPtk === 0 ? "-" : jmlPtk;
            var dispUnggah = unggah === 0 ? "-" : unggah;
            var dispBelum = belum === 0 ? "-" : belum;
            
            var bgProgress = capaian >= 80 ? 'bg-success' : (capaian >= 50 ? 'bg-warning' : 'bg-danger');
            var uiCapaian = '<div class="d-flex align-items-center justify-content-center" style="font-size: 13px;">' +
                '<span class="mr-2 font-weight-bold" style="min-width: 38px; text-align: right;">' + capaian + '%</span>' +
                '<div class="progress shadow-xs" style="width: 60px; height: 7px; border-radius: 4px; background-color: rgba(0,0,0,0.06);">' +
                '<div class="progress-bar ' + bgProgress + '" role="progressbar" style="width: ' + capaian + '%; border-radius: 4px;"></div>' +
                '</div></div>';
            
            var statusBadge = '';
            if (capaian > 95) {
                statusBadge = '<span class="sultan-badge sultan-badge-success"><i class="fas fa-check-double mr-1"></i>Sangat Baik</span>';
            } else if (capaian >= 85) {
                statusBadge = '<span class="sultan-badge sultan-badge-info"><i class="fas fa-check mr-1"></i>Baik</span>';
            } else if (capaian >= 75) {
                statusBadge = '<span class="sultan-badge sultan-badge-warning"><i class="fas fa-exclamation mr-1"></i>Cukup</span>';
            } else {
                statusBadge = '<span class="sultan-badge sultan-badge-danger"><i class="fas fa-exclamation-triangle mr-1"></i>Perlu Perhatian</span>';
            }
            
            tbodyHtml += '<tr>' +
                '<td>' + (typeof SultanUI !== 'undefined' && SultanUI.renderUnitSekolah ? SultanUI.renderUnitSekolah(uni, '') : '<b>' + efiledash_esc(uni) + '</b>') + '</td>' +
                '<td class="text-center font-weight-bold align-middle">' + dispJml + '</td>' +
                '<td class="text-center text-success font-weight-bold align-middle">' + dispUnggah + '</td>' +
                '<td class="text-center text-danger font-weight-bold align-middle">' + dispBelum + '</td>' +
                '<td class="align-middle">' + uiCapaian + '</td>' +
                '<td class="text-center align-middle">' + statusBadge + '</td>' +
                '</tr>';
        });

        if (tbodyHtml === '') { tbodyHtml = '<tr><td colspan="6" class="text-center text-muted">Tidak ada data untuk filter saat ini.</td></tr>'; }
        $('#efiledash_bodyTabelRekap').html(tbodyHtml);
    } else {
        $('#efiledash_containerTabelUnit').hide();
    }

    var totAsn = 0, totSudah = 0, totBelum = 0;
    var totDiproses = 0, totDisetujui = 0, totRevisi = 0, totDitolak = 0;

    totSudah = dataSudah.length;
    totBelum = dataBelum.length;
    totAsn = totSudah + totBelum;
    dataSudah.forEach(function(s) {
        var st = String(s.status || "").toLowerCase();
        if (st.includes("setuju") || st.includes("ok") || st.includes("valid")) totDisetujui++;
        else if (st.includes("proses") || st.includes("pending") || st.includes("menunggu")) totDiproses++;
        else if (st.includes("revisi")) totRevisi++;
        else if (st.includes("tolak") || st.includes("ditolak")) totDitolak++;
        else totDiproses++;
    });

    efiledash_animateValue('efiledash_cardTotalSekolah', totAsn);
    efiledash_animateValue('efiledash_cardSudah', totSudah);
    efiledash_animateValue('efiledash_cardBelum', totBelum);

    var pct = totAsn > 0 ? Math.round((totSudah / totAsn) * 100) : 0;
    efiledash_animateValue('efiledash_cardProgress', pct, true);

    efiledash_animateValue('efiledash_cardTotalDokumen', totSudah);
    efiledash_animateValue('efiledash_cardDiproses', totDiproses);
    efiledash_animateValue('efiledash_cardDisetujui', totDisetujui);
    efiledash_animateValue('efiledash_cardRevisi', totRevisi);
    efiledash_animateValue('efiledash_cardDitolak', totDitolak);

    // Categorize dataSudah into 4 status lists
    var listDisetujui = [], listDiproses = [], listRevisi = [], listDitolak = [];
    dataSudah.forEach(function(s) {
        var st = String(s.status || "").toLowerCase();
        if (st.indexOf("setuju") > -1 || st.indexOf("ok") > -1 || st.indexOf("valid") > -1) {
            listDisetujui.push(s);
        } else if (st.indexOf("revisi") > -1) {
            listRevisi.push(s);
        } else if (st.indexOf("tolak") > -1 || st.indexOf("ditolak") > -1) {
            listDitolak.push(s);
        } else {
            listDiproses.push(s);
        }
    });

    // Update count badges on 4 status cards headers
    $('#efiledash_countDisetujui').text(listDisetujui.length);
    $('#efiledash_countDiproses').text(listDiproses.length);
    $('#efiledash_countRevisi').text(listRevisi.length);
    $('#efiledash_countDitolak').text(listDitolak.length);

    // Function to render items with ONLY PTK Name (no NIP, unit, or document name)
    function renderNameOnlyList(list, itemClass, emptyLabel) {
        if (!list || list.length === 0) {
            return typeof SultanUI !== 'undefined' && SultanUI.renderListEmptyInfo
                ? SultanUI.renderListEmptyInfo(emptyLabel)
                : '<li class="list-group-item bg-transparent text-center text-muted py-4 border-0" style="font-size: 11px;">' +
                  '<i class="fas fa-info-circle mb-1.5 d-block" style="font-size: 1.25rem; opacity: 0.4;"></i>' +
                  '<span>' + efiledash_esc(emptyLabel) + '</span></li>';
        }
        var html = '';
        list.forEach(function(item, idx) {
            var delay = Math.min(idx * 25, 300);
            html += '<li class="list-group-item bg-transparent py-2 px-3 font-weight-bold dashlapbul-list-item d-flex align-items-center animate__animated animate__fadeIn ' + itemClass + '" style="font-size:12px; line-height:1.4; animation-delay:' + delay + 'ms;">' +
                '<span class="badge dashlapbul-badge-idx mr-2" style="width:25px; min-width:25px; flex-shrink:0;">' + (idx + 1) + '</span>' +
                '<span class="school-name flex-grow-1 text-truncate" style="word-break: break-word;">' + efiledash_esc(item.nama) + '</span>' +
                '</li>';
        });
        return html;
    }

    $('#efiledash_listDisetujui').html(renderNameOnlyList(listDisetujui, 'efiledash-item-disetujui', 'Tidak ada PTK disetujui'));
    $('#efiledash_listDiproses').html(renderNameOnlyList(listDiproses, 'efiledash-item-diproses', 'Tidak ada PTK diproses'));
    $('#efiledash_listRevisi').html(renderNameOnlyList(listRevisi, 'efiledash-item-revisi', 'Tidak ada PTK revisi'));
    $('#efiledash_listDitolak').html(renderNameOnlyList(listDitolak, 'efiledash-item-ditolak', 'Tidak ada PTK ditolak'));

    $('#efiledash_inputCariDisetujui, #efiledash_inputCariDiproses, #efiledash_inputCariRevisi, #efiledash_inputCariDitolak').val('');
}

function efiledash_animateValue(id, end, formatPercent) {
    if (typeof SultanUI !== 'undefined') {
        SultanUI.stopLottery('#' + id);
    }
    var obj = document.getElementById(id);
    if (!obj) return;
    if (obj.dataset.efileDashAnimId) cancelAnimationFrame(parseInt(obj.dataset.efileDashAnimId, 10));
    var startTime = null;
    function step(timestamp) {
        if (!startTime) startTime = timestamp;
        var progress = Math.min((timestamp - startTime) / 1000, 1);
        var val = Math.floor(progress * end);
        obj.innerHTML = val.toLocaleString('id-ID') + (formatPercent ? '%' : '');
        if (progress < 1) { obj.dataset.efileDashAnimId = window.requestAnimationFrame(step); } else { obj.dataset.efileDashAnimId = ""; }
    }
    obj.dataset.efileDashAnimId = window.requestAnimationFrame(step);
}

// Visibilitas UI sesuai Mode Terpilih (Dokumen/Rekap vs Unit Kerja)
function efiledash_setDashboardMode(mode) {
    EFILEDASH_MODE = mode;
    
    if (mode === "rekap" || mode === "DOKUMEN") {
        // Mode REKAP / DOKUMEN
        $('#efiledash_filterKategoriContainer').show();
        $('#efiledash_filterTahunContainer').show();
        
        if (EFILEDASH_IS_ADMIN) {
            $('#efiledash_filterUnitContainer').show();
            $('#efiledash_containerTabelUnit').show();
        } else {
            $('#efiledash_filterUnitContainer').hide();
            $('#efiledash_containerTabelUnit').hide();
        }
        
        $('#efiledash_containerTabelSekolah').hide();
        $('#efiledash_listsContainer').show();
        
        var selectedKat = $('#efiledash_filterKategori').val();
        if (selectedKat) {
            efiledash_loadDataKategori(selectedKat);
        }
    } else {
        // Mode UNIT KERJA
        $('#efiledash_filterKategoriContainer').hide();
        $('#efiledash_filterKategoriSkpContainer').hide();
        $('#efiledash_filterKepegContainer').hide();
        $('#efiledash_filterUnitContainer').show();
        $('#efiledash_containerTabelUnit').hide();
        
        var selectUnit = $('#efiledash_filterUnit');
        var curUnit = selectUnit.val() || "SEMUA";
        efiledash_loadDataSekolahLengkap(curUnit);
    }
}

function efiledash_loadDataSekolahLengkap(unitKey) {
    if (EFILEDASH_PENDING_REQ > 0) return;
    
    var fTahun = $('#efiledash_filterTahun').val() || "SEMUA";
    var labelNamaSekolah = (unitKey === "SEMUA" || !unitKey) ? "Semua Unit Kerja" : unitKey;
    
    if (typeof SultanUI !== 'undefined') {
        SultanUI.startLottery('#efiledash_cardTotalSekolah, #efiledash_cardSudah, #efiledash_cardBelum, #efiledash_cardTotalDokumen, #efiledash_cardDiproses, #efiledash_cardDisetujui, #efiledash_cardRevisi, #efiledash_cardDitolak', 3);
        SultanUI.startLottery('#efiledash_cardProgress', 2, '%');
    }

    EFILEDASH_PENDING_REQ = 1;
    var btn = $('#efiledash_btnRefresh');
    btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i>');
    $('#efiledash_filterTahun, #efiledash_filterUnit').prop('disabled', true);
    
    google.script.run.withSuccessHandler(function(jsonStr) {
        EFILEDASH_PENDING_REQ = 0;
        btn.prop('disabled', false).html('<i class="fas fa-sync-alt"></i>');
        $('#efiledash_filterTahun, #efiledash_filterUnit').prop('disabled', false);
        
        var res = JSON.parse(jsonStr);
        if (!res.success) {
            if (typeof Sultan !== 'undefined') {
                Sultan.alert('error', 'Gagal Memuat', res.message || 'Terjadi kesalahan sistem.');
            }
            return;
        }
        
        efiledash_renderTabelSekolahLengkapData(res.rekap, labelNamaSekolah);
        
    }).withFailureHandler(function(err) {
        EFILEDASH_PENDING_REQ = 0;
        btn.prop('disabled', false).html('<i class="fas fa-sync-alt"></i>');
        $('#efiledash_filterTahun, #efiledash_filterUnit').prop('disabled', false);
        if (typeof Sultan !== 'undefined') {
            Sultan.alert('error', 'Koneksi Terputus', err.message || err);
        }
    }).getEfileDashboardUnitLengkap(unitKey, fTahun);
}

function efiledash_renderTabelSekolahLengkapData(rekapData, namaSekolah) {
    $('#efiledash_lblNamaSekolah').text(namaSekolah);

    var tbodyHtml = '';
    var totalJml = 0, totalSudah = 0, totalBelum = 0;
    var totalDiproses = 0, totalDisetujui = 0, totalRevisi = 0, totalDitolak = 0;
    var tableHasData = false;

    if (!rekapData || rekapData.length === 0) {
        tbodyHtml = '<tr><td colspan="6" class="text-center text-muted py-4"><i class="fas fa-folder-open fa-2x mb-2 d-block opacity-50"></i>Tidak ada data kategori yang terdaftar atau aktif.</td></tr>';
    } else {
        rekapData.forEach(function(d) {
            var jml = parseInt(d.jml) || 0;
            if (jml === 0) return;
            
            tableHasData = true;
            
            var sudah = parseInt(d.sudah) || 0;
            var belum = Math.max(0, jml - sudah);
            var capaian = jml > 0 ? Math.round((sudah / jml) * 100) : 0;

            totalJml += jml;
            totalSudah += sudah;
            totalBelum += belum;
            totalDiproses += parseInt(d.diproses) || 0;
            totalDisetujui += parseInt(d.disetujui) || 0;
            totalRevisi += parseInt(d.revisi) || 0;
            totalDitolak += parseInt(d.ditolak) || 0;

            var bgProgress = capaian >= 80 ? 'bg-success' : (capaian >= 50 ? 'bg-warning' : 'bg-danger');
            var uiCapaian = '<div class="d-flex align-items-center justify-content-center" style="font-size: 13px;">' +
                '<span class="mr-2 font-weight-bold" style="min-width: 38px; text-align: right;">' + capaian + '%</span>' +
                '<div class="progress shadow-xs" style="width: 60px; height: 7px; border-radius: 4px; background-color: rgba(0,0,0,0.06);">' +
                '<div class="progress-bar ' + bgProgress + '" role="progressbar" style="width: ' + capaian + '%; border-radius: 4px;"></div>' +
                '</div></div>';

            var statusBadge = '';
            if (capaian > 95) { statusBadge = '<span class="sultan-badge sultan-badge-success"><i class="fas fa-check-double mr-1"></i>Sangat Baik</span>'; }
            else if (capaian >= 85) { statusBadge = '<span class="sultan-badge sultan-badge-info"><i class="fas fa-check mr-1"></i>Baik</span>'; }
            else if (capaian >= 75) { statusBadge = '<span class="sultan-badge sultan-badge-warning"><i class="fas fa-exclamation mr-1"></i>Cukup</span>'; }
            else { statusBadge = '<span class="sultan-badge sultan-badge-danger"><i class="fas fa-exclamation-triangle mr-1"></i>Perlu Perhatian</span>'; }

            tbodyHtml += '<tr>' +
                '<td><b class="sultan-table-primary">' + efiledash_esc(d.kategori) + '</b></td>' +
                '<td class="text-center font-weight-bold align-middle">' + (jml === 0 ? '-' : jml) + '</td>' +
                '<td class="text-center text-success font-weight-bold align-middle">' + (sudah === 0 ? '-' : sudah) + '</td>' +
                '<td class="text-center text-danger font-weight-bold align-middle">' + (belum === 0 ? '-' : belum) + '</td>' +
                '<td class="align-middle">' + uiCapaian + '</td>' +
                '<td class="text-center align-middle">' + statusBadge + '</td>' +
                '</tr>';
        });

        if (!tableHasData) {
            tbodyHtml = '<tr><td colspan="6" class="text-center text-muted py-4"><i class="fas fa-folder-open fa-2x mb-2 d-block opacity-50"></i>Tidak ada dokumen yang diwajibkan untuk unit kerja ini.</td></tr>';
        } else {
            var totalCapaian = totalJml > 0 ? Math.round((totalSudah / totalJml) * 100) : 0;
            var bgTot = totalCapaian >= 80 ? 'bg-success' : (totalCapaian >= 50 ? 'bg-warning' : 'bg-danger');
            tbodyHtml += '<tr class="font-weight-bold" style="background-color: rgba(0,64,133,0.08);">' +
                '<td><i class="fas fa-sigma mr-1"></i>TOTAL KESELURUHAN</td>' +
                '<td class="text-center">' + (totalJml === 0 ? '-' : totalJml) + '</td>' +
                '<td class="text-center text-success">' + (totalSudah === 0 ? '-' : totalSudah) + '</td>' +
                '<td class="text-center text-danger">' + (totalBelum === 0 ? '-' : totalBelum) + '</td>' +
                '<td><div class="d-flex align-items-center justify-content-center" style="font-size:13px;"><span class="mr-2 font-weight-bold">' + totalCapaian + '%</span>' +
                '<div class="progress" style="width:60px;height:8px;border-radius:4px;"><div class="progress-bar ' + bgTot + '" style="width:' + totalCapaian + '%"></div></div></div></td>' +
                '<td class="text-center"><span class="badge badge-secondary"><i class="fas fa-layer-group mr-1"></i>Total Kategori</span></td>' +
                '</tr>';
        }
    }

    var metricCapaian = totalJml > 0 ? Math.round((totalSudah / totalJml) * 100) : 0;

    efiledash_animateValue('efiledash_cardTotalSekolah', totalJml);
    efiledash_animateValue('efiledash_cardSudah', totalSudah);
    efiledash_animateValue('efiledash_cardBelum', totalBelum);
    efiledash_animateValue('efiledash_cardProgress', metricCapaian, true);
    efiledash_animateValue('efiledash_cardTotalDokumen', totalSudah);
    efiledash_animateValue('efiledash_cardDiproses', totalDiproses);
    efiledash_animateValue('efiledash_cardDisetujui', totalDisetujui);
    efiledash_animateValue('efiledash_cardRevisi', totalRevisi);
    efiledash_animateValue('efiledash_cardDitolak', totalDitolak);

    if ($.fn.DataTable.isDataTable('#efiledash_tabelRekapSekolah')) {
        $('#efiledash_tabelRekapSekolah').DataTable().destroy();
    }

    $('#efiledash_bodyTabelRekapSekolah').html(tbodyHtml);

    if (rekapData && rekapData.length > 0) {
        $('#efiledash_tabelRekapSekolah').DataTable({
            destroy: true,
            pageLength: 20,
            lengthMenu: [[10, 20, 50, -1], [10, 20, 50, "Semua"]],
            language: { url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/id.json" },
            order: [] 
        });
    }

    $('#efiledash_listsContainer').hide();
    $('#efiledash_containerTabelSekolah').show();
}

function efiledash_salinKeWA() {
    var selNamaKat = $('#efiledash_filterKategori option:selected').text();
    var selTahun = $('#efiledash_filterTahun').val() === "SEMUA" ? "Semua Tahun" : $('#efiledash_filterTahun').val();

    var listDisetujui = $('#efiledash_listDisetujui .efiledash-item-disetujui:visible');
    var listDiproses = $('#efiledash_listDiproses .efiledash-item-diproses:visible');
    var listRevisi = $('#efiledash_listRevisi .efiledash-item-revisi:visible');
    var listDitolak = $('#efiledash_listDitolak .efiledash-item-ditolak:visible');

    var totalItems = listDisetujui.length + listDiproses.length + listRevisi.length + listDitolak.length;

    if (totalItems === 0) { 
        if (typeof Sultan !== 'undefined' && Sultan.notif) {
            Sultan.notif.info('Tidak ada data PTK yang sudah unggah untuk disalin.');
        } else {
            alert('Tidak ada data PTK yang sudah unggah untuk disalin.');
        }
        return; 
    }

    var teks = "🚨 *DAFTAR PTK SUDAH UNGGAH E-FILE* 🚨\n";
    teks += "Kategori: " + selNamaKat + "\n";
    teks += "Tahun: " + selTahun + "\n";
    teks += "Total PTK Unggah: " + totalItems + " Orang\n\n";

    if (listDisetujui.length > 0) {
        teks += "✅ *DISETUJUI (" + listDisetujui.length + ")*:\n";
        var no = 1;
        listDisetujui.each(function() {
            teks += no++ + ". " + $(this).find('.nama-asn').text().trim() + "\n";
        });
        teks += "\n";
    }

    if (listDiproses.length > 0) {
        teks += "⏳ *DIPROSES (" + listDiproses.length + ")*:\n";
        var no = 1;
        listDiproses.each(function() {
            teks += no++ + ". " + $(this).find('.nama-asn').text().trim() + "\n";
        });
        teks += "\n";
    }

    if (listRevisi.length > 0) {
        teks += "⚠️ *REVISI (" + listRevisi.length + ")*:\n";
        var no = 1;
        listRevisi.each(function() {
            teks += no++ + ". " + $(this).find('.nama-asn').text().trim() + "\n";
        });
        teks += "\n";
    }

    if (listDitolak.length > 0) {
        teks += "❌ *DITOLAK (" + listDitolak.length + ")*:\n";
        var no = 1;
        listDitolak.each(function() {
            teks += no++ + ". " + $(this).find('.nama-asn').text().trim() + "\n";
        });
        teks += "\n";
    }

    teks += "Mohon ditindaklanjuti. Terima kasih. 🙏";

    navigator.clipboard.writeText(teks).then(function() {
        if (typeof Sultan !== 'undefined' && Sultan.notif) {
            Sultan.notif.sukses('Daftar berhasil disalin ke Clipboard (Siap Paste di WhatsApp).');
        } else {
            alert('Daftar berhasil disalin ke Clipboard!');
        }
    }).catch(function() {
        if (typeof Sultan !== 'undefined') {
            Sultan.alert('error','Gagal Menyalin','Browser Anda tidak mendukung Clipboard API.');
        } else {
            alert('Gagal menyalin teks.');
        }
    });
}

function efiledash_esc(text) {
    return text ? String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;") : "";
}
</script>
