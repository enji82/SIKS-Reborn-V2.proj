<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

<style>
  .sultan-alert {
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid transparent;
      display: flex;
      align-items: flex-start;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
  }
  .alert-soft-danger  { background-color: rgba(220,53,69,0.07)!important; border-color: rgba(220,53,69,0.15)!important; color:#c62828!important; }
  .alert-soft-warning { background-color: rgba(255,193,7,0.08)!important; border-color: rgba(255,193,7,0.18)!important; color:#e65100!important; }
  .alert-soft-info    { background-color: rgba(23,162,184,0.08)!important; border-color: rgba(23,162,184,0.18)!important; color:#00838f!important; }
  .alert-soft-success { background-color: rgba(40,167,69,0.07)!important; border-color: rgba(40,167,69,0.15)!important; color:#2e7d32!important; }
  .dark-mode .alert-soft-danger  { background-color:rgba(239,83,80,0.1)!important; border-color:rgba(239,83,80,0.22)!important; color:#ef5350!important; }
  .dark-mode .alert-soft-warning { background-color:rgba(255,202,40,0.09)!important; border-color:rgba(255,202,40,0.22)!important; color:#ffd54f!important; }
  .dark-mode .alert-soft-info    { background-color:rgba(79,195,247,0.1)!important; border-color:rgba(79,195,247,0.22)!important; color:#4fc3f7!important; }
  .dark-mode .alert-soft-success { background-color:rgba(102,187,106,0.1)!important; border-color:rgba(102,187,106,0.22)!important; color:#81c784!important; }
  .paud-tab-content { padding: 20px 0; }
  .paud-jenjang-badge { font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: 700; letter-spacing: 0.5px; }
</style>

<section class="content sultan-page-transition">
  <div class="container-fluid">

    <!-- Loading State -->
    <div id="paudPageLoading" class="text-center py-5">
      <i class="fas fa-spinner fa-spin fa-2x text-muted mb-3"></i>
      <p class="text-muted">Memuat data Dashboard PAUD...</p>
    </div>

    <!-- Main Content -->
    <div id="wrapperPAUD" style="display:none;">

      <!-- Header Section -->
      <div class="d-flex align-items-center mb-4">
        <div class="bg-success mr-3 shadow-sm" style="width:6px;height:28px;border-radius:3px;"></div>
        <div>
          <h5 class="font-weight-bold mb-0 text-uppercase" style="letter-spacing:1px;">Rekapitulasi PAUD</h5>
          <small class="text-muted">Data Pendidik &amp; Tenaga Kependidikan Pendidikan Anak Usia Dini</small>
        </div>
      </div>

      <!-- Tabs Jenjang PAUD -->
      <div class="card-sultan overflow-hidden mb-4">
        <div class="card-header card-header-sultan-adaptive p-0">
          <ul class="nav nav-tabs sultan-card-tabs border-0" id="paudTabs">
            <li class="nav-item">
              <a class="nav-link active px-4 py-3 font-weight-bold uppercase" style="font-size:0.8rem;letter-spacing:1px;" href="#tab_tk" data-toggle="tab">
                <i class="fas fa-child mr-2"></i>TK
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link px-4 py-3 font-weight-bold uppercase" style="font-size:0.8rem;letter-spacing:1px;" href="#tab_kb" data-toggle="tab">
                <i class="fas fa-baby mr-2"></i>KB
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link px-4 py-3 font-weight-bold uppercase" style="font-size:0.8rem;letter-spacing:1px;" href="#tab_sps" data-toggle="tab">
                <i class="fas fa-users mr-2"></i>SPS/TPA
              </a>
            </li>
          </ul>
        </div>
        <div class="card-body p-4">
          <div class="tab-content">
            <!-- Tab TK -->
            <div class="tab-pane active paud-tab-content" id="tab_tk">
              <div class="row" id="row_tk">
                <div class="col-12 text-center p-3 text-muted"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat data...</div>
              </div>
            </div>
            <!-- Tab KB -->
            <div class="tab-pane paud-tab-content" id="tab_kb">
              <div class="row" id="row_kb">
                <div class="col-12 text-center p-3 text-muted"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat data...</div>
              </div>
            </div>
            <!-- Tab SPS/TPA -->
            <div class="tab-pane paud-tab-content" id="tab_sps">
              <div class="row" id="row_sps">
                <div class="col-12 text-center p-3 text-muted"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat data...</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Ringkasan Total PAUD -->
      <div class="card-sultan p-4 mb-4">
        <h6 class="font-weight-bold text-sultan-utama mb-3 text-uppercase">
          <i class="fas fa-chart-bar mr-2"></i>Ringkasan Total Seluruh Jenjang PAUD
        </h6>
        <div class="row" id="paudTotalRow">
          <div class="col-12 text-center text-muted py-3">
            <i class="fas fa-spinner fa-spin mr-2"></i>Menghitung total...
          </div>
        </div>
      </div>

      <!-- Analisis & Insight PAUD -->
      <div class="card-sultan p-4 mb-4">
        <h6 class="font-weight-bold text-sultan-utama mb-3 text-uppercase">
          <i class="fas fa-lightbulb mr-2"></i>Analisis &amp; Insight PAUD
        </h6>
        <div id="paudInsightAlerts">
          <div class="text-muted text-center py-3"><i class="fas fa-spinner fa-spin mr-2"></i>Menganalisis data...</div>
        </div>
      </div>

    </div><!-- /wrapperPAUD -->
  </div>
</section>

<script>
// ======================================================================
// DASHBOARD PAUD — ISOLASI VARIABEL
// ======================================================================
var DASHP_IS_ADMIN  = false;
var DASHP_USER_NPSN = "";
var PAUD_STATS_GLOBAL = null;

$(document).ready(function() {
  try {
    var user = getSesiUser() || {};
    DASHP_IS_ADMIN  = (user.role || "").toLowerCase().includes("admin");
    DASHP_USER_NPSN = user.npsn || user.username || "";
  } catch(e) { DASHP_IS_ADMIN = false; DASHP_USER_NPSN = ""; }

  paudGatekeeper();
});

function paudGatekeeper() {
  if (DASHP_IS_ADMIN) {
    $('#paudPageLoading').hide();
    $('#wrapperPAUD').fadeIn();
    google.script.run.withSuccessHandler(function(res) { paudCalculate(res, true); }).getDataKeadaanGTKPAUD();
  } else {
    if (!DASHP_USER_NPSN) {
      $('#paudPageLoading').hide();
      Sultan.alert('error', 'Akses Ditolak', 'NPSN tidak ditemukan pada sesi login Anda.');
      return;
    }
    google.script.run.withSuccessHandler(function(res) {
      $('#paudPageLoading').hide();
      $('#wrapperPAUD').fadeIn();
      if (!res || !Array.isArray(res)) res = [];
      var myData = res.filter(function(r) {
        return String(r && r[1] || "").trim().toUpperCase() === String(DASHP_USER_NPSN).trim().toUpperCase();
      });
      if (myData.length > 0) {
        paudCalculate(myData, false);
      } else {
        ['row_tk','row_kb','row_sps'].forEach(function(id){
          $('#'+id).html('<div class="col-12 text-center text-muted py-4">Data tidak relevan dengan jenjang sekolah Anda.</div>');
        });
        $('#paudTotalRow').html('<div class="col-12 text-center text-muted py-3">Tidak ada data PAUD untuk sekolah Anda.</div>');
        $('#paudInsightAlerts').html('<div class="sultan-alert alert-soft-info"><i class="fas fa-info-circle fa-lg mr-3 mt-1"></i><div><span class="font-weight-bold d-block">Tidak Ada Data</span>Data PAUD tidak ditemukan untuk sekolah Anda.</div></div>');
      }
    }).getDataKeadaanGTKPAUD();
  }
}

function paudCalculate(data, isAdmin) {
  var stats = {
    tk:  { id:'tk',  name:'TK',      jml:0, pns:0, gty:0, pty:0, gtt:0, ptt:0 },
    kb:  { id:'kb',  name:'KB',      jml:0, pns:0, gty:0, pty:0, gtt:0, ptt:0 },
    sps: { id:'sps', name:'SPS/TPA', jml:0, pns:0, gty:0, pty:0, gtt:0, ptt:0 }
  };

  if (data && data.length > 0) {
    data.forEach(function(row) {
      var jenjang = String(row[2] || "").toUpperCase().trim();
      var target = null;
      if (jenjang.includes("TK"))                          target = stats.tk;
      else if (jenjang.includes("KB"))                     target = stats.kb;
      else if (jenjang.includes("SPS")||jenjang.includes("TPA")) target = stats.sps;
      if (target) {
        target.jml++;
        target.gty += parseInt(row[22])||0;
        target.pns += parseInt(row[23])||0;
        target.gtt += parseInt(row[24])||0;
        target.pty += parseInt(row[25])||0;
        target.ptt += parseInt(row[26])||0;
      }
    });
  }

  if (!isAdmin) {
    if (stats.tk.jml  > 0) stats.tk.jml  = 1;
    if (stats.kb.jml  > 0) stats.kb.jml  = 1;
    if (stats.sps.jml > 0) stats.sps.jml = 1;
  }

  PAUD_STATS_GLOBAL = stats;
  paudRenderBox('row_tk',  stats.tk,  isAdmin);
  paudRenderBox('row_kb',  stats.kb,  isAdmin);
  paudRenderBox('row_sps', stats.sps, isAdmin);
  paudRenderTotal(stats, isAdmin);
  paudRenderInsight(stats, isAdmin);
}

function paudRenderBox(containerId, obj, isAdmin) {
  if (obj.jml === 0 && !isAdmin) {
    $('#' + containerId).html('<div class="col-12 text-center text-muted py-4"><i class="fas fa-info-circle mr-2"></i>Data tidak relevan dengan jenjang sekolah Anda.</div>');
    return;
  }
  var total = obj.pns + obj.gty + obj.pty + obj.gtt + obj.ptt;
  var html = `
    <div class="col-lg-2 col-md-4 col-6 mb-4">
      <div class="sultan-metric-card metric-maroon">
        <div class="inner"><h3>${obj.jml}</h3><p>Jumlah Lembaga</p></div>
        <div class="icon"><i class="fas fa-building"></i></div>
      </div>
    </div>
    <div class="col-lg-2 col-md-4 col-6 mb-4">
      <div class="sultan-metric-card metric-dark">
        <div class="inner"><h3>${obj.pns}</h3><p>Jumlah PNS</p></div>
        <div class="icon"><i class="fas fa-id-card"></i></div>
      </div>
    </div>
    <div class="col-lg-2 col-md-4 col-6 mb-4">
      <div class="sultan-metric-card metric-success">
        <div class="inner"><h3>${obj.gty}</h3><p>Jumlah GTY</p></div>
        <div class="icon"><i class="fas fa-chalkboard-teacher"></i></div>
      </div>
    </div>
    <div class="col-lg-2 col-md-4 col-6 mb-4">
      <div class="sultan-metric-card metric-info">
        <div class="inner"><h3>${obj.pty}</h3><p>Jumlah PTY</p></div>
        <div class="icon"><i class="fas fa-user-cog"></i></div>
      </div>
    </div>
    <div class="col-lg-2 col-md-4 col-6 mb-4">
      <div class="sultan-metric-card metric-dark">
        <div class="inner"><h3>${obj.gtt}</h3><p>Jumlah GTT</p></div>
        <div class="icon"><i class="fas fa-users"></i></div>
      </div>
    </div>
    <div class="col-lg-2 col-md-4 col-6 mb-4">
      <div class="sultan-metric-card metric-dark">
        <div class="inner"><h3>${obj.ptt}</h3><p>Jumlah PTT</p></div>
        <div class="icon"><i class="fas fa-user-clock"></i></div>
      </div>
    </div>`;

  if (isAdmin && total > 0) {
    html += `
    <div class="col-12 mt-2">
      <div class="card-sultan p-3">
        <div class="table-responsive">
          <table class="table table-sm table-borderless mb-0" style="font-size:13px;">
            <tbody>
              <tr>
                <td class="text-muted font-weight-bold" style="width:180px;">Total PTK ${obj.name}</td>
                <td><strong class="text-sultan-utama">${total} orang</strong></td>
                <td class="text-muted">dari <strong>${obj.jml}</strong> lembaga</td>
                <td class="text-right text-muted">Rata-rata: <strong>${obj.jml > 0 ? (total/obj.jml).toFixed(1) : '0'} PTK/lembaga</strong></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
  }

  $('#' + containerId).html(html);
}

function paudRenderTotal(stats, isAdmin) {
  var totalLembaga = stats.tk.jml  + stats.kb.jml  + stats.sps.jml;
  var totalPNS     = stats.tk.pns  + stats.kb.pns  + stats.sps.pns;
  var totalGTY     = stats.tk.gty  + stats.kb.gty  + stats.sps.gty;
  var totalPTY     = stats.tk.pty  + stats.kb.pty  + stats.sps.pty;
  var totalGTT     = stats.tk.gtt  + stats.kb.gtt  + stats.sps.gtt;
  var totalPTT     = stats.tk.ptt  + stats.kb.ptt  + stats.sps.ptt;
  var totalPTK     = totalPNS + totalGTY + totalPTY + totalGTT + totalPTT;

  var html = `
    <div class="col-lg col-md-4 col-6 mb-3">
      <div class="card-sultan p-3 text-center" style="border-top:3px solid #800000;">
        <small class="text-muted font-weight-bold text-uppercase d-block" style="font-size:10px;letter-spacing:0.5px;">Total Lembaga</small>
        <h3 class="font-weight-bold mb-0 text-maroon">${totalLembaga}</h3>
      </div>
    </div>
    <div class="col-lg col-md-4 col-6 mb-3">
      <div class="card-sultan p-3 text-center" style="border-top:3px solid #333;">
        <small class="text-muted font-weight-bold text-uppercase d-block" style="font-size:10px;letter-spacing:0.5px;">PNS</small>
        <h3 class="font-weight-bold mb-0">${totalPNS}</h3>
      </div>
    </div>
    <div class="col-lg col-md-4 col-6 mb-3">
      <div class="card-sultan p-3 text-center" style="border-top:3px solid #2e7d32;">
        <small class="text-muted font-weight-bold text-uppercase d-block" style="font-size:10px;letter-spacing:0.5px;">GTY</small>
        <h3 class="font-weight-bold mb-0 text-success">${totalGTY}</h3>
      </div>
    </div>
    <div class="col-lg col-md-4 col-6 mb-3">
      <div class="card-sultan p-3 text-center" style="border-top:3px solid #17a2b8;">
        <small class="text-muted font-weight-bold text-uppercase d-block" style="font-size:10px;letter-spacing:0.5px;">PTY</small>
        <h3 class="font-weight-bold mb-0 text-info">${totalPTY}</h3>
      </div>
    </div>
    <div class="col-lg col-md-4 col-6 mb-3">
      <div class="card-sultan p-3 text-center" style="border-top:3px solid #ffc107;">
        <small class="text-muted font-weight-bold text-uppercase d-block" style="font-size:10px;letter-spacing:0.5px;">GTT</small>
        <h3 class="font-weight-bold mb-0 text-warning">${totalGTT}</h3>
      </div>
    </div>
    <div class="col-lg col-md-4 col-6 mb-3">
      <div class="card-sultan p-3 text-center" style="border-top:3px solid #6c757d;">
        <small class="text-muted font-weight-bold text-uppercase d-block" style="font-size:10px;letter-spacing:0.5px;">PTT</small>
        <h3 class="font-weight-bold mb-0 text-secondary">${totalPTT}</h3>
      </div>
    </div>
    <div class="col-lg col-md-4 col-6 mb-3">
      <div class="card-sultan p-3 text-center" style="border-top:3px solid #28a745;background:rgba(40,167,69,0.05);">
        <small class="text-success font-weight-bold text-uppercase d-block" style="font-size:10px;letter-spacing:0.5px;">Total PTK</small>
        <h3 class="font-weight-bold mb-0 text-success">${totalPTK}</h3>
      </div>
    </div>`;
  $('#paudTotalRow').html(html);
}

function paudRenderInsight(stats, isAdmin) {
  var totalPTK = (stats.tk.pns + stats.tk.gty + stats.tk.pty + stats.tk.gtt + stats.tk.ptt) +
                 (stats.kb.pns + stats.kb.gty + stats.kb.pty + stats.kb.gtt + stats.kb.ptt) +
                 (stats.sps.pns + stats.sps.gty + stats.sps.pty + stats.sps.gtt + stats.sps.ptt);
  var totalLembaga = stats.tk.jml + stats.kb.jml + stats.sps.jml;
  var html = "";

  if (totalLembaga === 0) {
    html = '<div class="sultan-alert alert-soft-warning"><i class="fas fa-exclamation-triangle fa-lg mr-3 mt-1"></i><div><span class="font-weight-bold d-block">Data Kosong</span>Belum ada data PAUD yang terdaftar.</div></div>';
    $('#paudInsightAlerts').html(html);
    return;
  }

  // Insight jenjang terbanyak
  var jenjangTerbanyak = 'TK';
  var maxJml = stats.tk.jml;
  if (stats.kb.jml > maxJml) { maxJml = stats.kb.jml; jenjangTerbanyak = 'KB'; }
  if (stats.sps.jml > maxJml) { maxJml = stats.sps.jml; jenjangTerbanyak = 'SPS/TPA'; }
  html += `<div class="sultan-alert alert-soft-info"><i class="fas fa-info-circle fa-lg mr-3 mt-1"></i><div><span class="font-weight-bold d-block" style="font-size:13px;">Distribusi Lembaga PAUD</span>Jenjang <strong>${jenjangTerbanyak}</strong> memiliki lembaga terbanyak (${maxJml} lembaga) dari total <strong>${totalLembaga} lembaga PAUD</strong>.</div></div>`;

  // Rasio GTY+PNS (tetap) vs GTT (honorer)
  var totalTetap = (stats.tk.pns+stats.tk.gty+stats.kb.pns+stats.kb.gty+stats.sps.pns+stats.sps.gty);
  var totalHonorer = (stats.tk.gtt+stats.kb.gtt+stats.sps.gtt);
  var totalGuru = totalTetap + totalHonorer;
  if (totalGuru > 0) {
    var tetapRatio = (totalTetap / totalGuru) * 100;
    if (tetapRatio >= 60) {
      html += `<div class="sultan-alert alert-soft-success"><i class="fas fa-check-circle fa-lg mr-3 mt-1"></i><div><span class="font-weight-bold d-block" style="font-size:13px;">Stabilitas Tenaga Pendidik</span><strong>${tetapRatio.toFixed(1)}%</strong> pendidik berstatus tetap (PNS/GTY). Kondisi kepegawaian stabil.</div></div>`;
    } else {
      html += `<div class="sultan-alert alert-soft-warning"><i class="fas fa-exclamation-circle fa-lg mr-3 mt-1"></i><div><span class="font-weight-bold d-block" style="font-size:13px;">Dominasi Pendidik Honorer</span>Pendidik tetap hanya <strong>${tetapRatio.toFixed(1)}%</strong>. Perlu perhatian terhadap stabilitas tenaga pendidik PAUD.</div></div>`;
    }
  }

  // Rata-rata PTK per lembaga
  var avgPTK = totalLembaga > 0 ? (totalPTK / totalLembaga).toFixed(1) : '0';
  html += `<div class="sultan-alert alert-soft-info"><i class="fas fa-users fa-lg mr-3 mt-1"></i><div><span class="font-weight-bold d-block" style="font-size:13px;">Kepadatan Tenaga Pendidik</span>Rata-rata <strong>${avgPTK} PTK</strong> per lembaga PAUD. Total keseluruhan: <strong>${totalPTK} PTK</strong>.</div></div>`;

  $('#paudInsightAlerts').html(html);
}
</script>
