                      <th class="text-center align-middle" style="width: 8%;"><span class="sultan-th-title">UKURAN MAX</span></th>
                      <th class="text-center align-middle" style="width: 12%;"><span class="sultan-th-title">JENIS PERIODE</span></th>
                      <th class="text-left align-middle" style="width: 16%; min-width: 160px;"><span class="sultan-th-title">KETERANGAN</span></th>

<!-- TEMPLATE MODAL FORM -->
<div id="kemitraanmaster_templates" style="display:none;">
  <form id="kemitraanmaster_formSimpan" novalidate>
    <div class="modal-body modal-body-sultan p-4">
      <input type="hidden" id="kemitraanmaster_f_rowid">
      
      <div class="row mb-3">
        <div class="col-md-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">ID Kategori <span class="text-danger">*</span></label>
          <input type="text" id="kemitraanmaster_f_id" class="form-control form-control-sultan border-maroon font-weight-bold text-dark text-uppercase" placeholder="KMIT-01, KMIT-02..." maxlength="20" required>
          <small class="text-muted font-italic">Kode unik kategori.</small>
        </div>
        <div class="col-md-6">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">Nama Dokumen <span class="text-danger">*</span></label>
          <input type="text" id="kemitraanmaster_f_nama" class="form-control form-control-sultan border-maroon font-weight-bold text-dark" placeholder="Nama lengkap naskah / dokumen kemitraan..." maxlength="120" required>
        </div>
        <div class="col-md-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">Sasaran Jenjang <span class="text-danger">*</span></label>
          <select id="kemitraanmaster_f_jenjang" class="form-control form-control-sultan font-weight-bold" required>

            <option value="PDF" selected>PDF</option>
            <option value="IMG">JPG / PNG (Gambar)</option>
            <option value="EXCEL">EXCEL</option>
            <option value="ALL">PDF / Gambar (Bebas)</option>

        </div>
        <div class="col-md-4">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">Ukuran Max (MB)</label>

        </div>
        <div class="col-md-4">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">Jenis Periode</label>

            <option value="TAHUNAN_KALENDER" selected>Tahunan (Tahun Kalender)</option>

            <option value="TMT">Dengan TMT</option>
            <option value="SEMESTER_TAPEL">Semester (Tahun Pelajaran)</option>
            <option value="SEMESTER_KALENDER">Semester (Tahun Kalender)</option>

        <textarea id="kemitraanmaster_f_keterangan" class="form-control form-control-sultan" rows="2" maxlength="300" placeholder="Penjelasan singkat atau petunjuk pengunggahan dokumen kemitraan..."></textarea>

      <div class="row mb-2">

              <input type="radio" id="kemitraanmaster_f_aktif_ya" name="kemitraanmaster_f_aktif" class="custom-control-input" value="true" checked>
              <label class="custom-control-label text-success font-weight-bold" for="kemitraanmaster_f_aktif_ya">Aktif</label>
            </div>
            <div class="custom-control custom-radio">
              <input type="radio" id="kemitraanmaster_f_aktif_tidak" name="kemitraanmaster_f_aktif" class="custom-control-input" value="false">

    <div class="modal-footer modal-footer-tambah-edit justify-content-between">

        <i class="fas fa-times mr-2"></i>BATAL
      </button>

        <i class="fas fa-save mr-2"></i>SIMPAN

</div>

<script>
var KEMITRAANMASTER_CACHE_DATA = [];
var KEMITRAANMASTER_TABEL_INSTANCE = null;
var KEMITRAANMASTER_IS_ADMIN = false;

$(document).ready(function() {
  try {
    var user = typeof getSesiUser === 'function' ? getSesiUser() : {};
    var rStr = String(user.role || "").toLowerCase();
    KEMITRAANMASTER_IS_ADMIN = (typeof checkUserRoleIsAdmin === 'function' && checkUserRoleIsAdmin())
      || rStr.includes("admin") || rStr.includes("verifikator");
  } catch(e) { KEMITRAANMASTER_IS_ADMIN = false; }

  if (!KEMITRAANMASTER_IS_ADMIN) {
    $('#kemitraanmaster_loadingState').hide();
    $('#kemitraanmaster_aksesDitolak').show();
    $('#kemitraanmaster_mainContent').show();
    return;
  }
  $('#kemitraanmaster_mainContent').show();

  // Render Filter Bar Terpusat SultanUI
  kemitraanmaster_renderFilterBar();

  $(document).off('click.kmitkat', '#kemitraanmaster_btnRefresh').on('click.kmitkat', '#kemitraanmaster_btnRefresh', kemitraanmaster_tarikData);
  $(document).off('click.kmitkat', '#kemitraanmaster_btnTambah').on('click.kmitkat', '#kemitraanmaster_btnTambah', kemitraanmaster_bukaModalTambah);
  $(document).off('click.kmitkat', '#kemitraanmaster_btnSimpan').on('click.kmitkat', '#kemitraanmaster_btnSimpan', function() { $('#kemitraanmaster_formSimpan').submit(); });
  $(document).off('submit.kmitkat', '#kemitraanmaster_formSimpan').on('submit.kmitkat', '#kemitraanmaster_formSimpan', kemitraanmaster_submitSimpan);
  $(document).off('change.kmitkat', '#kemitraanmaster_filterJenjang, #kemitraanmaster_filterAktif, #kemitraanmaster_filterPeriode').on('change.kmitkat', '#kemitraanmaster_filterJenjang, #kemitraanmaster_filterAktif, #kemitraanmaster_filterPeriode', kemitraanmaster_terapkanFilter);
  $(document).off('click.kmitkat', '.kemitraanmaster-btn-edit').on('click.kmitkat', '.kemitraanmaster-btn-edit', function() { kemitraanmaster_bukaModalEdit($(this).attr('data-id')); });
  $(document).off('click.kmitkat', '.kemitraanmaster-btn-hapus').on('click.kmitkat', '.kemitraanmaster-btn-hapus', function() { kemitraanmaster_hapusKat($(this).attr('data-id')); });

  kemitraanmaster_tarikData();
});

function kemitraanmaster_renderFilterBar() {
  var filtersConfig = [
    { id: 'kemitraanmaster_filterJenjang', placeholder: 'Semua Jenjang', disabled: false },
    { id: 'kemitraanmaster_filterAktif', placeholder: 'Semua Status', disabled: false },
    { id: 'kemitraanmaster_filterPeriode', placeholder: 'Semua Jenis Periode', disabled: false }
  ];

  var extraButtons = `
    <div class="divider-vertical d-none d-md-block mx-2"></div>
    <button type="button" id="kemitraanmaster_btnRefresh" class="sultan-btn-refresh" title="Segarkan Data">
      <i class="fas fa-sync-alt"></i>
    </button>
    <div class="ml-auto d-none d-md-block"></div>
    <button type="button" id="kemitraanmaster_btnTambah" class="sultan-btn-tambah">
      <i class="fas fa-plus"></i> TAMBAH
    </button>
  `;

  if (typeof SultanUI !== 'undefined') {
    $('#kemitraanmaster_filterBarArea').html(SultanUI.renderFilterBar(filtersConfig, extraButtons));
  }

  $('#kemitraanmaster_filterJenjang').html(`
    <option value="SEMUA" selected>Semua Jenjang</option>
  `);

  $('#kemitraanmaster_filterAktif').html(`
    <option value="SEMUA" selected>Semua Status</option>
    <option value="AKTIF">Aktif</option>
    <option value="NONAKTIF">Nonaktif</option>
  `);

  $('#kemitraanmaster_filterPeriode').html(`
    <option value="SEMUA" selected>Semua Jenis Periode</option>
    <option value="TAHUNAN_KALENDER">Tahunan (Kalender)</option>
    <option value="TAHUNAN_TAPEL">Tahunan (Tapel)</option>
    <option value="SEMESTER_TAPEL">Semester (Tapel)</option>
    <option value="SEMESTER_KALENDER">Semester (Kalender)</option>
    <option value="TRIWULAN">Triwulan</option>
    <option value="BULANAN">Bulanan</option>
    <option value="PERMANEN">Permanen</option>
    <option value="TMT">Dengan TMT</option>
    <option value="PERIODE">Per Periode</option>
  `);
}

function kemitraanmaster_populateFilterJenjang() {
  var $select = $('#kemitraanmaster_filterJenjang');
  var curVal = String($select.val() || "SEMUA").trim().toUpperCase();

  var setJenjang = new Set();
  (KEMITRAANMASTER_CACHE_DATA || []).forEach(function(d) {
    var j = kemitraanmaster_formatJenjang(d.jenjang);
    if (j && j.toUpperCase() !== "SEMUA") {
      setJenjang.add(j);
    }
  });

  var listJenjang = Array.from(setJenjang).sort();

  var optionsHtml = '<option value="SEMUA">Semua Jenjang</option>';
  listJenjang.forEach(function(j) {
    optionsHtml += '<option value="' + kemitraanmaster_esc(j.toUpperCase()) + '">' + kemitraanmaster_esc(j) + '</option>';
  });

  $select.html(optionsHtml);
  if ($select.find('option[value="' + curVal + '"]').length > 0) {
    $select.val(curVal);
  } else {
    $select.val("SEMUA");
  }
}

function kemitraanmaster_tarikData() {
  var btn = $('#kemitraanmaster_btnRefresh');
  btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin text-maroon"></i>');
  
  if (!$.fn.DataTable.isDataTable('#kemitraanmaster_tabel')) {
    $('#kemitraanmaster_tableState').hide();
    SultanUI.showLoading('#kemitraanmaster_loadingState', "Memuat Master Kategori Kemitraan...");
  }
  
  google.script.run.withSuccessHandler(function(json) {
    btn.prop('disabled', false).html('<i class="fas fa-sync-alt text-maroon"></i>');
    var res = typeof json === 'string' ? JSON.parse(json) : json;
    if (!res.success) {
      $('#kemitraanmaster_loadingState').html('<div class="text-center text-danger py-5"><i class="fas fa-exclamation-triangle fa-3x mb-3"></i><br>' + kemitraanmaster_esc(res.message) + '</div>');
      return;
    }
    KEMITRAANMASTER_CACHE_DATA = res.kategori || [];
    kemitraanmaster_populateFilterJenjang();
    if (!$.fn.DataTable.isDataTable('#kemitraanmaster_tabel')) { kemitraanmaster_initTable(); }
    kemitraanmaster_terapkanFilter();
    SultanUI.hideLoading('#kemitraanmaster_loadingState');
    $('#kemitraanmaster_tableState').show();
    if (KEMITRAANMASTER_TABEL_INSTANCE) setTimeout(function() { KEMITRAANMASTER_TABEL_INSTANCE.columns.adjust(); }, 150);
  }).withFailureHandler(function(err) {
    btn.prop('disabled', false).html('<i class="fas fa-sync-alt text-maroon"></i>');
    $('#kemitraanmaster_loadingState').html('<div class="text-center text-danger py-5"><i class="fas fa-wifi fa-3x mb-3"></i><br>Koneksi: ' + kemitraanmaster_esc(err.message) + '</div>');
  }).getKemitraanMasterData("SEMUA");
}

function kemitraanmaster_initTable() {
  KEMITRAANMASTER_TABEL_INSTANCE = SultanTable.init('#kemitraanmaster_tabel', {
    "destroy": true, 
    "ordering": false, 
    "pageLength": 25, 
    "autoWidth": false,
    "dom": "<'row mb-2'<'col-sm-12 col-md-6'l><'col-sm-12 col-md-6'f>>" +
           "<'row'<'col-sm-12'<'table-responsive sultan-scroll'tr>>>" +
           "<'row mt-2'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>",
    "columnDefs": [
      { "targets": 0, "width": "8%", "className": "col-sticky-left text-center align-middle font-weight-bold text-nowrap" },
      { "targets": 1, "width": "24%", "className": "text-left align-middle text-wrap" },
      { "targets": [2, 3, 4, 5], "width": "9%", "className": "text-center align-middle text-nowrap" },
      { "targets": 6, "width": "16%", "className": "text-left align-middle text-wrap" },
      { "targets": 7, "width": "7%", "className": "text-center align-middle text-nowrap" },
      { "targets": 8, "width": "7%", "className": "text-center align-middle text-nowrap" }
    ],
    "language": { "emptyTable": "Belum ada kategori dokumen kemitraan yang sesuai filter." }
  });
}

function kemitraanmaster_terapkanFilter() {
  if (!KEMITRAANMASTER_TABEL_INSTANCE) return;
  var fJenjang = String($('#kemitraanmaster_filterJenjang').val() || "SEMUA").trim().toUpperCase();
  var fAktif = String($('#kemitraanmaster_filterAktif').val() || "SEMUA").trim().toUpperCase();
  var fPeriode = String($('#kemitraanmaster_filterPeriode').val() || "SEMUA").trim().toUpperCase();

  var hasil = KEMITRAANMASTER_CACHE_DATA.filter(function(d) {
    if (fJenjang !== "SEMUA" && fJenjang !== "") {
      var dJ = kemitraanmaster_formatJenjang(d.jenjang).toUpperCase();
      if (dJ !== fJenjang) return false;
    }
    if (fAktif !== "SEMUA" && fAktif !== "") {
      var isAktif = (d.status === "Aktif" || d.isAktif === true || String(d.status).toUpperCase() === "AKTIF");
      if (fAktif === "AKTIF" && !isAktif) return false;
      if (fAktif === "NONAKTIF" && isAktif) return false;
    }
    if (fPeriode !== "SEMUA" && fPeriode !== "") {
      var jp = String(d.jenisPeriode || "").trim().toUpperCase();
      if (jp !== fPeriode && !jp.includes(fPeriode)) return false;
    }
    return true;
  });

  kemitraanmaster_renderTabel(hasil);
}

function kemitraanmaster_renderTabel(data) {
  var dtArr = [];
  data.forEach(function(d) {
    var isAktif = (d.status === "Aktif" || d.isAktif === true || String(d.status).toUpperCase() === "AKTIF");
    var btnEdit = '<button type="button" class="sultan-btn-aksi sultan-btn-aksi-warning kemitraanmaster-btn-edit" data-id="' + kemitraanmaster_esc(d.idKat) + '" title="Edit Kategori"><i class="fas fa-edit"></i></button>';
    var btnHapus = '<button type="button" class="sultan-btn-aksi sultan-btn-aksi-danger kemitraanmaster-btn-hapus" data-id="' + kemitraanmaster_esc(d.idKat) + '" title="Hapus Kategori"><i class="fas fa-trash-alt"></i></button>';
    var aksi = '<div class="d-flex flex-nowrap justify-content-center" style="gap:4px;">' + btnEdit + btnHapus + '</div>';

    var badgeAktif = isAktif
      ? '<span class="badge badge-sultan-disetujui"><i class="fas fa-check-circle mr-1"></i>Aktif</span>'
      : '<span class="badge badge-secondary"><i class="fas fa-pause-circle mr-1"></i>Nonaktif</span>';

    var txtJenjang = '<span class="font-weight-bold">' + kemitraanmaster_formatJenjang(d.jenjang) + '</span>';
    var txtPeriode = '<span>' + kemitraanmaster_formatPeriode(d.jenisPeriode) + '</span>';
    var badgeFmt = kemitraanmaster_buildBadgeFormat(d.format);
    var ket = d.keterangan ? '<span class="text-muted font-italic" style="font-size:12px;">' + kemitraanmaster_esc(d.keterangan) + '</span>' : '<span class="text-muted font-italic">—</span>';
    var ukuran = d.ukuran ? kemitraanmaster_esc(d.ukuran) + ' MB' : '2 MB';

    dtArr.push([
      '<span class="badge badge-secondary font-weight-bold" style="font-size:11.5px; padding: 4px 8px;">' + kemitraanmaster_esc(d.idKat) + '</span>',
      '<div class="font-weight-bold text-wrap" style="font-size:13px;">' + kemitraanmaster_esc(d.namaKat) + '</div>',
      txtJenjang,
      badgeFmt,
      ukuran,
      txtPeriode,
      ket,
      badgeAktif,
      aksi
    ]);
  });
  KEMITRAANMASTER_TABEL_INSTANCE.clear().rows.add(dtArr).draw(false);
}

function kemitraanmaster_formatJenjang(j) {
  var val = String(j || "SEMUA").toUpperCase().trim();
  if (val === "SD") return "SD";
  if (val === "PAUD") return "PAUD";
  return "Semua";
}

function kemitraanmaster_buildBadgeFormat(fmt) {
  var f = String(fmt || "PDF").toUpperCase();
  if (f.includes("IMG") || f.includes("JPG") || f.includes("PNG")) {
    return '<span class="badge-fmt-display badge-fmt-img"><i class="fas fa-image mr-1"></i>JPG/PNG</span>';
  } else if (f.includes("EXCEL") || f.includes("XLS")) {
    return '<span class="badge-fmt-display badge-fmt-excel"><i class="fas fa-file-excel mr-1"></i>EXCEL</span>';
  } else if (f.includes("ALL") || f.includes("BEBAS")) {
    return '<span class="badge-fmt-display badge-fmt-all"><i class="fas fa-file-upload mr-1"></i>BEBAS</span>';
  } else {
    return '<span class="badge-fmt-display badge-fmt-pdf"><i class="fas fa-file-pdf mr-1"></i>PDF</span>';
  }
}

function kemitraanmaster_formatPeriode(p) {
  var val = String(p || "TAHUNAN_KALENDER").toUpperCase();
  if (val.includes("PERMANEN")) return "Permanen";
  if (val.includes("TMT")) return "Dengan TMT";
  if (val.includes("TAHUNAN_KALENDER") || (val.includes("TAHUNAN") && val.includes("KALENDER"))) return "Tahunan (Kalender)";
  if (val.includes("SEMESTER_TAPEL") || (val.includes("SEMESTER") && val.includes("PELAJARAN"))) return "Semester (Tapel)";
  if (val.includes("SEMESTER_KALENDER") || (val.includes("SEMESTER") && (val.includes("KALENDER") || val.includes("MASEHI")))) return "Semester (Kalender)";
  if (val.includes("TRIWULAN")) return "Triwulan";
  if (val.includes("BULANAN")) return "Bulanan";
  if (val.includes("PERIODE")) return "Per Periode";
  if (val.includes("TAHUNAN")) return "Tahunan (Tapel)";
  return val || "Tahunan (Kalender)";
}

function kemitraanmaster_bukaModalTambah() {
  var $form = $('#kemitraanmaster_formSimpan');
  $form[0].reset(); 
  $form.removeClass('was-validated');
  $('#kemitraanmaster_f_rowid').val('');
  $('#kemitraanmaster_f_id').prop('readonly', false).val('');
  $('#kemitraanmaster_f_jenjang').val('SEMUA');
  $('#kemitraanmaster_f_ukuran').val('2');
  $('#kemitraanmaster_f_format').val('PDF');
  $('#kemitraanmaster_f_periode').val('TAHUNAN_KALENDER');
  $('input[name="kemitraanmaster_f_aktif"][value="true"]').prop('checked', true);
  $('#kemitraanmaster_f_dashboard').prop('checked', true);
  kemitraanmaster_bukaModal('tambah', 'Tambah Kategori Dokumen Kemitraan');
}

function kemitraanmaster_bukaModalEdit(idKat) {
  var d = KEMITRAANMASTER_CACHE_DATA.find(function(x) { return x.idKat === idKat; });
  if (!d) return;
  var $form = $('#kemitraanmaster_formSimpan');
  $form[0].reset(); 
  $form.removeClass('was-validated');

  $('#kemitraanmaster_f_rowid').val(idKat);
  $('#kemitraanmaster_f_id').prop('readonly', true).val(d.idKat);
  $('#kemitraanmaster_f_nama').val(d.namaKat);
  $('#kemitraanmaster_f_jenjang').val(d.jenjang || 'SEMUA');
  $('#kemitraanmaster_f_format').val(d.format || 'PDF');
  $('#kemitraanmaster_f_ukuran').val(d.ukuran || '2');
  $('#kemitraanmaster_f_periode').val(d.jenisPeriode || 'TAHUNAN_KALENDER');
  $('#kemitraanmaster_f_keterangan').val(d.keterangan || '');
  
  var isAktif = (d.status === "Aktif" || d.isAktif === true || String(d.status).toUpperCase() === "AKTIF");
  $('input[name="kemitraanmaster_f_aktif"][value="' + (isAktif ? 'true' : 'false') + '"]').prop('checked', true);
  $('#kemitraanmaster_f_dashboard').prop('checked', String(d.integrasiDashboard || "TRUE").toUpperCase() !== "FALSE");
  
  kemitraanmaster_bukaModal('edit', 'Edit Kategori: ' + d.namaKat);
}

function kemitraanmaster_bukaModal(tipe, judul) {
  var isEdit = tipe === 'edit';
  $('#global_modalFormSize').removeClass('modal-xl modal-lg').addClass('modal-lg');
  $('#global_modalFormHeader').removeClass('modal-header-sultan-primary modal-header-sultan-warning modal-header-sultan-danger modal-header-sultan-success modal-header-sultan-info modal-header-sultan-dark modal-header-edit modal-header-tambah-edit modal-header-hapus').addClass(isEdit ? 'modal-header-sultan-warning' : 'modal-header-tambah-edit');
  $('#global_modalFormTitle').html('<i class="fas fa-' + (isEdit ? 'edit' : 'plus') + ' mr-2"></i>' + kemitraanmaster_esc(judul));
  $('#global_modalFormBody, #global_modalFormFooter').hide();
  $('#kemitraanmaster_formSimpan').appendTo('#global_modalFormSize .modal-content');
  $('#global_modalForm').off('hidden.bs.modal.kemitraanmaster').on('hidden.bs.modal.kemitraanmaster', function() {
    $('#kemitraanmaster_formSimpan').appendTo('#kemitraanmaster_templates');
    $('#global_modalFormBody, #global_modalFormFooter').show();
  });
  $('#global_modalForm').modal('show');
  if (!isEdit) setTimeout(function() { $('#kemitraanmaster_f_id').focus(); }, 150);
}

function kemitraanmaster_submitSimpan(e) {
  e.preventDefault();
  var $form = $(this);
  if (!$form[0].checkValidity()) { $form.addClass('was-validated'); return; }

  var payload = {
    idKat:              $('#kemitraanmaster_f_id').val().trim(),
    namaKat:            $('#kemitraanmaster_f_nama').val().trim(),
    jenjang:            $('#kemitraanmaster_f_jenjang').val(),
    format:             $('#kemitraanmaster_f_format').val(),
    ukuran:             $('#kemitraanmaster_f_ukuran').val(),
    jenisPeriode:       $('#kemitraanmaster_f_periode').val(),
    keterangan:         $('#kemitraanmaster_f_keterangan').val().trim(),
    status:             $('input[name="kemitraanmaster_f_aktif"]:checked').val() === 'true' ? 'Aktif' : 'Nonaktif',
    integrasi:          $('#kemitraanmaster_f_dashboard').is(':checked') ? 'TRUE' : 'FALSE'
  };

  if (!payload.idKat || !payload.namaKat) {
    if (typeof Sultan !== 'undefined' && Sultan.alert) {
      Sultan.alert('warning', 'Perhatian', 'ID Kategori dan Nama Dokumen wajib diisi.');
    }
    return;
  }
  
  var btn = $('#kemitraanmaster_btnSimpan'); 
  var txt = btn.html();
  btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-2"></i>MENYIMPAN...');
  
  google.script.run.withSuccessHandler(function(json) {
    btn.prop('disabled', false).html(txt);
    var res = typeof json === 'string' ? JSON.parse(json) : json;
    if (res.success) {
      if (typeof Sultan !== 'undefined' && Sultan.modal) Sultan.modal.tutupForm();
      else $('#global_modalForm').modal('hide');

      setTimeout(function() { 
        if (typeof Sultan !== 'undefined' && Sultan.notif) Sultan.notif.crud.simpan($('#kemitraanmaster_f_rowid').val() !== '');
        kemitraanmaster_tarikData(); 
      }, 400);
    } else { 
      if (typeof Sultan !== 'undefined' && Sultan.notif) Sultan.notif.crud.gagal(res.message);
    }
  }).withFailureHandler(function(err) {
    btn.prop('disabled', false).html(txt);
    if (typeof Sultan !== 'undefined' && Sultan.notif) Sultan.notif.crud.gagal(err.message);
  }).simpanKemitraanMaster(payload);
}

function kemitraanmaster_hapusKat(idKat) {
  var d = KEMITRAANMASTER_CACHE_DATA.find(function(x) { return x.idKat === idKat; });
  if (!d) return;

  if (typeof Sultan !== 'undefined' && Sultan.modal && Sultan.modal.konfirmasiHapus) {
    Sultan.modal.konfirmasiHapus({
      title: 'HAPUS KATEGORI KEMITRAAN & KERJA SAMA',
      kode: null,
      detail: { 'ID KATEGORI': d.idKat || '-', 'NAMA DOKUMEN': d.namaKat || '-' },
      onConfirm: function() {
        Sultan.notif.loading("Menghapus kategori dokumen...");
        google.script.run.withSuccessHandler(function(json) {
          Sultan.notif.tutup();
          var res = typeof json === 'string' ? JSON.parse(json) : json;
          if (res.success) {
            Sultan.notif.crud.hapus();
            kemitraanmaster_tarikData();
          } else {
            Sultan.notif.crud.gagal(res.message);
          }
        }).withFailureHandler(function(err) {
          Sultan.notif.tutup();
          Sultan.notif.crud.gagal(err.message);
        }).hapusKemitraanMaster(idKat);
      }
    });
  } else {
    if (!confirm("Apakah Anda yakin ingin menghapus kategori dokumen " + d.namaKat + "?")) return;
    google.script.run.withSuccessHandler(function(json) {
      var res = typeof json === 'string' ? JSON.parse(json) : json;
      if (res.success) {
        if (typeof Sultan !== 'undefined' && Sultan.notif) Sultan.notif.crud.sukses("Kategori dihapus.");
        kemitraanmaster_tarikData();
      } else {
        alert("Gagal: " + res.message);
      }
    }).hapusKemitraanMaster(idKat);
  }
}

function kemitraanmaster_esc(str) {
  if (!str) return "";
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
