</section>

<!-- TEMPLATE MODAL -->
<div id="kemitraanmaster_templates" style="display:none;">

  <!-- Modal Tambah/Edit Master Kategori Kemitraan -->
  <form id="kemitraanmaster_formInputUtama" novalidate>
    <div class="modal-body modal-body-sultan p-4">
      <input type="hidden" id="kemitraanmaster_modeEdit">
      <input type="hidden" id="kemitraanmaster_originalId">

      <div class="row">
        <!-- ID Dokumen -->
        <div class="col-md-4 mb-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            ID Dokumen <span class="text-danger">*</span>
          </label>
          <input type="text" id="kemitraanmaster_in_id" class="form-control form-control-sultan border-maroon font-weight-bold text-uppercase"
                 placeholder="Contoh: KMIT-MOU-01" required maxlength="30"
                 title="ID unik, tanpa spasi, huruf kapital">
          <small class="text-muted">Kode unik dokumen (tanpa spasi)</small>
        </div>
        <!-- Nama Dokumen -->
        <div class="col-md-8 mb-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            Nama Dokumen <span class="text-danger">*</span>
          </label>
          <input type="text" id="kemitraanmaster_in_nama" class="form-control form-control-sultan border-maroon"
                 placeholder="Nama Lengkap Dokumen / Naskah Kerja Sama" required maxlength="120">
        </div>
      </div>

      <div class="row">
        <!-- Jenjang -->
        <div class="col-md-4 mb-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            Jenjang <span class="text-danger">*</span>
          </label>
          <select id="kemitraanmaster_in_jenjang" class="form-control form-control-sultan border-maroon" required>
            <option value="">- Pilih Jenjang -</option>
            <option value="SEMUA" selected>Semua Jenjang</option>
            <option value="PAUD">PAUD</option>
            <option value="SD">SD</option>
          </select>
        </div>
        <!-- Jenis Periode -->
        <div class="col-md-4 mb-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            Jenis Periode <span class="text-danger">*</span>
          </label>
          <select id="kemitraanmaster_in_jenis_periode" class="form-control form-control-sultan border-maroon" required>
            <option value="">- Pilih Jenis -</option>
            <option value="TAHUNAN_KALENDER" selected>Tahunan (Kalender)</option>
            <option value="TAHUNAN_TAPEL">Tahunan (Tahun Pelajaran)</option>
            <option value="SEMESTER_TAPEL">Semesteran (Tapel)</option>
            <option value="SEMESTER_KALENDER">Semesteran (Kalender)</option>
            <option value="TRIWULAN">Triwulanan</option>
            <option value="PERIODE">Bulanan/Rentang Periode</option>
            <option value="TMT">TMT (Berlaku Mulai Tanggal)</option>
            <option value="PERMANEN">Permanen (1 Kali)</option>
          </select>
        </div>
        <!-- Format File -->
        <div class="col-md-4 mb-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            Format File <span class="text-danger">*</span>
          </label>
          <select id="kemitraanmaster_in_format" class="form-control form-control-sultan border-maroon" required>
            <option value="">- Pilih Format -</option>
            <option value="PDF" selected>PDF</option>
            <option value="IMG">Gambar (JPG/PNG)</option>
            <option value="ALL">PDF / Gambar</option>
            <option value="EXCEL">Excel</option>
          </select>
        </div>
      </div>

      <div class="row">
        <!-- Ukuran Maksimal -->
        <div class="col-md-4 mb-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            Ukuran Maksimal (MB) <span class="text-danger">*</span>
          </label>
          <select id="kemitraanmaster_in_ukuran" class="form-control form-control-sultan border-maroon" required>
            <option value="1">1 MB</option>
            <option value="2" selected>2 MB</option>
            <option value="5">5 MB</option>
            <option value="10">10 MB</option>
            <option value="25">25 MB</option>
            <option value="50">50 MB</option>
          </select>
        </div>
        <!-- Status Aktif -->
        <div class="col-md-4 mb-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            Status Aktif <span class="text-danger">*</span>
          </label>
          <select id="kemitraanmaster_in_status" class="form-control form-control-sultan border-maroon" required>
            <option value="Aktif" selected>Aktif</option>
            <option value="Nonaktif">Nonaktif</option>
          </select>
        </div>
        <!-- Integrasi Dashboard -->
        <div class="col-md-4 mb-3">
          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            Integrasi Dashboard <span class="text-danger">*</span>
          </label>
          <select id="kemitraanmaster_in_integrasi" class="form-control form-control-sultan border-maroon" required>
            <option value="TRUE" selected>Ya (Tampilkan)</option>

      <div class="row">

          <label class="form-label-sultan small font-weight-bold text-muted text-uppercase">
            Keterangan

          <textarea id="kemitraanmaster_in_keterangan" class="form-control form-control-sultan border-maroon"
                    rows="2" placeholder="Penjelasan singkat atau petunjuk dokumen kemitraan..." maxlength="500"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer modal-footer-tambah-edit justify-content-between">
      <button type="button" class="modal-btn-batal" data-dismiss="modal">
        <i class="fas fa-times mr-2"></i>BATAL
      </button>

<script>
var KEMITRAANMASTER_CACHE_DATA = [];
var KEMITRAANMASTER_TABEL_INSTANCE = null;
var KEMITRAANMASTER_IS_ADMIN = false;

$(document).ready(function() {
  try {
    var user = typeof getSesiUser === 'function' ? getSesiUser() : {};
    var rStr = String(user.role || '').toLowerCase();
    KEMITRAANMASTER_IS_ADMIN = (typeof checkUserRoleIsAdmin === 'function' && checkUserRoleIsAdmin()) || rStr.includes('admin') || rStr.includes('verifikator');

    if (!KEMITRAANMASTER_IS_ADMIN) {
      $('#kemitraanmaster_aksesDitolak').show();
      $('#kemitraanmaster_mainContent').hide();
      return;
    }

    $('#kemitraanmaster_aksesDitolak').hide();
    $('#kemitraanmaster_mainContent').show();

    kemitraanmaster_renderFilterBar();
    kemitraanmaster_muatData();
  } catch(err) {
    console.error("Inisialisasi Master Kemitraan gagal:", err);
  }
});

function kemitraanmaster_renderFilterBar() {
  var filtersConfig = [
    { id: 'kemitraanmaster_selJenjang', placeholder: 'Semua Jenjang', disabled: false },
    { id: 'kemitraanmaster_selStatus', placeholder: 'Semua Status', disabled: false }
  ];

  var extraButtons = `
    <div class="divider-vertical d-none d-md-block mx-2"></div>
    <button type="button" id="kemitraanmaster_btnRefresh" class="sultan-btn-refresh" title="Segarkan Data">
      <i class="fas fa-sync-alt"></i>
    </button>
    <div class="ml-auto d-none d-md-block"></div>
    <button type="button" id="kemitraanmaster_btnTambah" class="sultan-btn-tambah">
      <i class="fas fa-plus"></i> TAMBAH KATEGORI
    </button>
  `;

  if (typeof SultanUI !== 'undefined') {
    $('#kemitraanmaster_filterBarArea').html(SultanUI.renderFilterBar(filtersConfig, extraButtons));
  }

  $('#kemitraanmaster_selJenjang').html(`
    <option value="SEMUA" selected>Semua Jenjang</option>
    <option value="PAUD">PAUD</option>
    <option value="SD">SD</option>
  `);

  $('#kemitraanmaster_selStatus').html(`
    <option value="SEMUA" selected>Semua Status</option>
    <option value="Aktif">Aktif</option>
    <option value="Nonaktif">Nonaktif</option>
  `);

  $(document).off('click.kmitmaster', '#kemitraanmaster_btnRefresh').on('click.kmitmaster', '#kemitraanmaster_btnRefresh', kemitraanmaster_muatData);
  $(document).off('click.kmitmaster', '#kemitraanmaster_btnTambah').on('click.kmitmaster', '#kemitraanmaster_btnTambah', kemitraanmaster_bukaModalTambah);
  $(document).off('change.kmitmaster', '#kemitraanmaster_selJenjang, #kemitraanmaster_selStatus').on('change.kmitmaster', '#kemitraanmaster_selJenjang, #kemitraanmaster_selStatus', kemitraanmaster_terapkanFilter);
}

function kemitraanmaster_bukaModalTambah() {
  $('#kemitraanmaster_modeEdit').val('false');
  $('#kemitraanmaster_originalId').val('');
  $('#kemitraanmaster_in_id').val('').prop('readonly', false).focus();
  $('#kemitraanmaster_in_nama').val('');
  $('#kemitraanmaster_in_jenjang').val('SEMUA');
  $('#kemitraanmaster_in_jenis_periode').val('TAHUNAN_KALENDER');
  $('#kemitraanmaster_in_format').val('PDF');
  $('#kemitraanmaster_in_ukuran').val('2');
  $('#kemitraanmaster_in_status').val('Aktif');
  $('#kemitraanmaster_in_integrasi').val('TRUE');
  $('#kemitraanmaster_in_keterangan').val('');

  var formHtml = $('#kemitraanmaster_formInputUtama');
  if (typeof showSultanModal === 'function') {
    showSultanModal({
      title: "TAMBAH MASTER KATEGORI KEMITRAAN & KERJA SAMA",
      icon: "fas fa-handshake text-warning",
      content: formHtml,
      width: "modal-lg font-sultan-main"
    });
  }

  $('#kemitraanmaster_btnSimpan').off('click').on('click', function() {
    kemitraanmaster_prosesSimpan();
  });
}

function kemitraanmaster_bukaModalEdit(idKat) {
  var item = KEMITRAANMASTER_CACHE_DATA.find(function(x) { return x.idKat === idKat; });
  if (!item) return;

  $('#kemitraanmaster_modeEdit').val('true');
  $('#kemitraanmaster_originalId').val(item.idKat);
  $('#kemitraanmaster_in_id').val(item.idKat).prop('readonly', true);
  $('#kemitraanmaster_in_nama').val(item.namaKat);
  $('#kemitraanmaster_in_jenjang').val(item.jenjang || 'SEMUA');
  $('#kemitraanmaster_in_jenis_periode').val(item.jenisPeriode || 'TAHUNAN_KALENDER');
  $('#kemitraanmaster_in_format').val(item.format || 'PDF');
  $('#kemitraanmaster_in_ukuran').val(item.ukuran || '2');
  $('#kemitraanmaster_in_status').val(item.isAktif ? 'Aktif' : 'Nonaktif');
  $('#kemitraanmaster_in_integrasi').val(item.integrasiDashboard || 'TRUE');
  $('#kemitraanmaster_in_keterangan').val(item.keterangan || '');

  var formHtml = $('#kemitraanmaster_formInputUtama');
  if (typeof showSultanModal === 'function') {
    showSultanModal({
      title: "EDIT MASTER KATEGORI: " + item.idKat,
      icon: "fas fa-edit text-warning",
      content: formHtml,
      width: "modal-lg font-sultan-main"
    });
  }

  $('#kemitraanmaster_btnSimpan').off('click').on('click', function() {
    kemitraanmaster_prosesSimpan();
  });
}

function kemitraanmaster_prosesSimpan() {
  var isEdit = $('#kemitraanmaster_modeEdit').val() === 'true';
  var idKat = $('#kemitraanmaster_in_id').val().trim().toUpperCase();
  var namaKat = $('#kemitraanmaster_in_nama').val().trim();
  var jenjang = $('#kemitraanmaster_in_jenjang').val();
  var jenisPeriode = $('#kemitraanmaster_in_jenis_periode').val();
  var format = $('#kemitraanmaster_in_format').val();
  var ukuran = $('#kemitraanmaster_in_ukuran').val();
  var status = $('#kemitraanmaster_in_status').val();
  var integrasi = $('#kemitraanmaster_in_integrasi').val();
  var keterangan = $('#kemitraanmaster_in_keterangan').val().trim();

  if (!idKat || !namaKat || !jenjang || !jenisPeriode || !format || !ukuran || !status || !integrasi) {
    if (typeof Swal !== 'undefined') {
      Swal.fire('Perhatian', 'Mohon lengkapi semua kolom yang wajib diisi (*).', 'warning');
    } else {
      alert('Mohon lengkapi semua kolom yang wajib diisi (*).');
    }
    return;
  }

  var payload = {
    idKat: idKat,
    namaKat: namaKat,
    jenjang: jenjang,
    jenisPeriode: jenisPeriode,
    format: format,
    ukuran: ukuran,
    status: status,
    integrasi: integrasi,
    keterangan: keterangan
  };

  if (typeof showSultanLoading === 'function') {
    showSultanLoading(isEdit ? "Memperbarui Master Kategori..." : "Menyimpan Master Kategori...");
  }

  google.script.run
    .withSuccessHandler(function(resRaw) {
      if (typeof closeSultanLoading === 'function') closeSultanLoading();
      try {
        var res = typeof resRaw === 'string' ? JSON.parse(resRaw) : resRaw;
        if (res.success) {
          if (typeof closeSultanModal === 'function') closeSultanModal();
          if (typeof Swal !== 'undefined') {
            Swal.fire({ icon: 'success', title: 'Berhasil', text: res.message, timer: 1500, showConfirmButton: false });
          }
          kemitraanmaster_muatData();
        } else {
          if (typeof Swal !== 'undefined') Swal.fire('Gagal', res.message, 'error');
          else alert('Gagal: ' + res.message);
        }
      } catch(e) {
        if (typeof Swal !== 'undefined') Swal.fire('Error', 'Gagal memproses respons server.', 'error');
      }
    })
    .withFailureHandler(function(err) {
      if (typeof closeSultanLoading === 'function') closeSultanLoading();
      if (typeof Swal !== 'undefined') Swal.fire('Error', err.message || 'Koneksi gagal', 'error');
    })
    .simpanKemitraanMaster(payload);
}

function kemitraanmaster_hapusData(idKat, namaKat) {
  if (typeof Swal !== 'undefined') {
    Swal.fire({
      title: 'Hapus Master Kategori?',
      html: 'Anda yakin ingin menghapus kategori <b>' + idKat + ' - ' + namaKat + '</b>?',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#3085d6',
      confirmButtonText: 'Ya, Hapus!',
      cancelButtonText: 'Batal'
    }).then(function(result) {
      if (result.isConfirmed) {
        kemitraanmaster_eksekusiHapus(idKat);
      }
    });
  } else {
    if (confirm('Hapus kategori ' + idKat + '?')) {
      kemitraanmaster_eksekusiHapus(idKat);
    }
  }
}

function kemitraanmaster_eksekusiHapus(idKat) {
  if (typeof showSultanLoading === 'function') showSultanLoading("Menghapus Master Kategori...");

  google.script.run
    .withSuccessHandler(function(resRaw) {
      if (typeof closeSultanLoading === 'function') closeSultanLoading();
      try {
        var res = typeof resRaw === 'string' ? JSON.parse(resRaw) : resRaw;
        if (res.success) {
          if (typeof Swal !== 'undefined') {
            Swal.fire({ icon: 'success', title: 'Terhapus', text: res.message, timer: 1500, showConfirmButton: false });
          }
          kemitraanmaster_muatData();
        } else {
          if (typeof Swal !== 'undefined') Swal.fire('Gagal', res.message, 'error');
        }
      } catch(e) {
        if (typeof Swal !== 'undefined') Swal.fire('Error', 'Gagal memproses respons server.', 'error');
      }
    })
    .withFailureHandler(function(err) {
      if (typeof closeSultanLoading === 'function') closeSultanLoading();
      if (typeof Swal !== 'undefined') Swal.fire('Error', err.message || 'Koneksi gagal', 'error');
    })
    .hapusKemitraanMaster(idKat);
}

function kemitraanmaster_muatData() {
  $('#kemitraanmaster_loadingState').html(
    '<div class="text-center py-5"><i class="fas fa-circle-notch fa-spin fa-2x text-maroon mb-2"></i><div class="small font-weight-bold text-muted">Memuat Master Kategori Kemitraan...</div></div>'
  ).show();
  $('#kemitraanmaster_tableState').hide();

  google.script.run
    .withSuccessHandler(function(resRaw) {
      try {
        var res = typeof resRaw === 'string' ? JSON.parse(resRaw) : resRaw;
        if (res.success) {
          KEMITRAANMASTER_CACHE_DATA = res.kategori || [];
          kemitraanmaster_renderTabel(KEMITRAANMASTER_CACHE_DATA);
        } else {
          $('#kemitraanmaster_loadingState').html('<div class="alert alert-danger m-3">' + res.message + '</div>');
        }
      } catch(e) {
        $('#kemitraanmaster_loadingState').html('<div class="alert alert-danger m-3">Gagal membaca data dari server.</div>');
      }
    })
    .withFailureHandler(function(err) {
      $('#kemitraanmaster_loadingState').html('<div class="alert alert-danger m-3">Koneksi ke server gagal: ' + err.message + '</div>');
    })
    .getKemitraanMasterData();
}

function kemitraanmaster_renderTabel(data) {
  var tbody = $('#kemitraanmaster_tabelUtama tbody');
  tbody.empty();

  if (!data || data.length === 0) {
    tbody.append(
      '<tr><td colspan="10" class="text-center py-4 text-muted"><i class="fas fa-folder-open mr-2"></i>Belum ada data master kategori Kemitraan.</td></tr>'
    );
    $('#kemitraanmaster_loadingState').hide();
    $('#kemitraanmaster_tableState').show();
    return;
  }

  data.forEach(function(item) {
    var badgeFmtClass = 'badge-fmt-pdf';
    var fmtText = item.format || 'PDF';
    if (fmtText === 'IMG') badgeFmtClass = 'badge-fmt-img';
    else if (fmtText === 'EXCEL') badgeFmtClass = 'badge-fmt-excel';
    else if (fmtText === 'ALL') badgeFmtClass = 'badge-fmt-all';

    var statusBadge = item.isAktif ?
      '<span class="badge badge-success px-2 py-1">Aktif</span>' :
      '<span class="badge badge-secondary px-2 py-1">Nonaktif</span>';

    var dashboardBadge = (String(item.integrasiDashboard).toUpperCase() !== 'FALSE') ?
      '<span class="badge badge-info px-2 py-1">Ya</span>' :
      '<span class="badge badge-light border px-2 py-1">Tidak</span>';

    var tr = $('<tr></tr>');
    tr.append('<td class="col-sticky-left font-weight-bold text-maroon text-left align-middle">' + escapeHtml(item.idKat) + '</td>');
    tr.append('<td class="font-weight-bold text-dark text-left align-middle">' + escapeHtml(item.namaKat) + '</td>');
    tr.append('<td class="text-center align-middle"><span class="badge badge-soft-primary px-2 py-1">' + escapeHtml(item.jenjang || 'SEMUA') + '</span></td>');
    tr.append('<td class="text-center align-middle small font-weight-bold text-muted">' + escapeHtml(item.jenisPeriode || 'TAHUNAN_KALENDER') + '</td>');
    tr.append('<td class="text-center align-middle"><span class="badge-fmt-display ' + badgeFmtClass + '">' + escapeHtml(fmtText) + '</span></td>');
    tr.append('<td class="text-center align-middle small font-weight-bold">' + escapeHtml(item.ukuran || '2') + ' MB</td>');
    tr.append('<td class="text-center align-middle">' + statusBadge + '</td>');
    tr.append('<td class="text-left align-middle small text-muted text-truncate" style="max-width:180px;" title="' + escapeHtml(item.keterangan || '') + '">' + escapeHtml(item.keterangan || '-') + '</td>');
    tr.append('<td class="text-center align-middle">' + dashboardBadge + '</td>');

    var btnEdit = '<button type="button" class="btn btn-xs btn-outline-warning mr-1 font-weight-bold" onclick="kemitraanmaster_bukaModalEdit(\'' + item.idKat + '\')"><i class="fas fa-edit mr-1"></i>Edit</button>';
    var btnHapus = '<button type="button" class="btn btn-xs btn-outline-danger font-weight-bold" onclick="kemitraanmaster_hapusData(\'' + item.idKat + '\', \'' + escapeHtml(item.namaKat).replace(/'/g, "\\'") + '\')"><i class="fas fa-trash mr-1"></i>Hapus</button>';

    tr.append('<td class="text-center align-middle">' + btnEdit + btnHapus + '</td>');
    tbody.append(tr);
  });

  $('#kemitraanmaster_loadingState').hide();
  $('#kemitraanmaster_tableState').show();
}

function kemitraanmaster_terapkanFilter() {
  var keyword = ($('#kemitraanmaster_inCari').val() || '').toLowerCase().trim();
  var selJenjang = $('#kemitraanmaster_selJenjang').val() || 'SEMUA';
  var selStatus = $('#kemitraanmaster_selStatus').val() || 'SEMUA';

  var filtered = KEMITRAANMASTER_CACHE_DATA.filter(function(item) {
    var matchSearch = !keyword ||
      item.idKat.toLowerCase().indexOf(keyword) !== -1 ||
      item.namaKat.toLowerCase().indexOf(keyword) !== -1 ||
      (item.keterangan && item.keterangan.toLowerCase().indexOf(keyword) !== -1);

    var matchJenjang = (selJenjang === 'SEMUA') || (item.jenjang === selJenjang);
    var matchStatus = (selStatus === 'SEMUA') ||
      (selStatus === 'Aktif' && item.isAktif) ||
      (selStatus === 'Nonaktif' && !item.isAktif);

    return matchSearch && matchJenjang && matchStatus;
  });

  kemitraanmaster_renderTabel(filtered);
}

function escapeHtml(text) {
  if (!text) return '';
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
</script>
